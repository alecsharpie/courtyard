    g.lineTo(px + pw * 0.72, sy + 3); g.lineTo(px - pw * 0.72, sy + 3);
    g.closePath(); g.fill();
    g.fillStyle = rim; g.fillRect(px - pw, sy - ph, pw * 2, 2);
    g.fillStyle = silh;
    for (let k = 0; k < 9; k++){
      const a2 = -Math.PI / 2 + (k / 8 - 0.5) * 2.5;
      const r2 = u * (1.4 + hash(k, px | 0) * 1.5) * s;
      const lx = px + Math.cos(a2) * r2, ly = sy - ph + Math.sin(a2) * r2 * 0.85;
      g.beginPath(); g.ellipse(lx, ly, u * 0.42 * s, u * 0.3 * s, a2, 0, 7); g.fill();
    }
  }
  const cx2 = W * 0.5, cw = u * 0.62;
  g.fillStyle = silh;
  g.beginPath();
  g.moveTo(cx2 - cw, sy - u * 0.72); g.lineTo(cx2 + cw, sy - u * 0.72);
  g.lineTo(cx2 + cw * 0.7, sy + 2); g.lineTo(cx2 - cw * 0.7, sy + 2);
  g.closePath(); g.fill();
  g.strokeStyle = silh; g.lineWidth = Math.max(1.6, u * 0.16);
  g.beginPath(); g.arc(cx2 + cw * 1.3, sy - u * 0.4, u * 0.36, -1.4, 1.4); g.stroke();
  g.fillStyle = rim; g.fillRect(cx2 - cw, sy - u * 0.72, cw * 2, 1.6);
}

function drawScene(t, dt){

      const p1 = project(lx, 64.8, 4.6), p2 = project(lx, 78.6, 3.4);
      const midx = (p1[0] + p2[0]) / 2, midy = Math.max(p1[1], p2[1]) + 14;
      ctx.strokeStyle = 'rgba(70,62,52,.75)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.quadraticCurveTo(midx, midy, p2[0], p2[1]); ctx.stroke();
      for (let k = 0; k < 5; k++){
        // Each garment's own moment to be unpegged, in a fixed per-day order, plus a
        // ~1.6 s fade so the last of it goes soft rather than blinking out.
        // Both ends of the 0.16..0.82 band are load-bearing:
        //   TOP — rain can start once cover passes 0.66, which is weatherComing() 0.91,
        //   and the predicate then steps to a flat 1. Anything still pegged up in
        //   0.82..1 would come down in that one frame, the exact all-at-once vanish this
        //   is here to remove. The line is always empty before the first drop can land.
        //   BOTTOM — must be >= the 0.14 fade width, or the lowest-hashed garment starts
        //   its fade before takenIn even leaves 0 and hangs at 71% alpha in perfect
        //   weather. It did, for four gate runs, until a probe printed 9.49 of 10.
        const gone = clamp((0.16 + hash(k + seed, day + 7) * 0.66 - takenIn) / 0.14, 0, 1);
        if (gone <= 0) continue;
        const tt = 0.14 + k * 0.18;
        const gx2 = lerp(lerp(p1[0], midx, tt), lerp(midx, p2[0], tt), tt);
        const gy2 = lerp(lerp(p1[1], midy, tt), lerp(midy, p2[1], tt), tt);
        const swg = Math.sin(windT * 2.2 + k * 1.7 + seed) * (isWindy() ? 5 : 1.8);
        const hv2 = hash(k + seed, day);
        const w2 = cellW * (0.5 + hv2 * 0.45), h2 = cellH * (1.5 + hv2 * 1.6);
        ctx.save();
        ctx.globalAlpha = gone;
        ctx.translate(gx2, gy2);
        ctx.rotate(swg * 0.045);
        ctx.fillStyle = 'rgba(60,52,44,.7)';                      // the peg
        ctx.fillRect(-1, -2, 2, 3.5);
        ctx.fillStyle = wcols[(hv2 * wcols.length) | 0];
        if (hv2 > 0.55){                                          // a shirt, sleeves and all
          ctx.beginPath();
          ctx.moveTo(-w2 * 0.34, 0); ctx.lineTo(w2 * 0.34, 0);
          ctx.lineTo(w2 * 0.5, h2 * 0.3); ctx.lineTo(w2 * 0.3, h2 * 0.34);
          ctx.lineTo(w2 * 0.3, h2); ctx.lineTo(-w2 * 0.3, h2);
          ctx.lineTo(-w2 * 0.3, h2 * 0.34); ctx.lineTo(-w2 * 0.5, h2 * 0.3);
          ctx.closePath(); ctx.fill();
        } else {                                                  // a sheet, sagging a little
          ctx.beginPath();
          ctx.moveTo(-w2 * 0.42, 0); ctx.lineTo(w2 * 0.42, 0);
          ctx.lineTo(w2 * 0.46, h2 * 1.1);
          ctx.quadraticCurveTo(0, h2 * 0.9, -w2 * 0.46, h2 * 1.1);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.14)';
        ctx.fillRect(-w2 * 0.3, 0, w2 * 0.22, h2 * 0.9);
        ctx.restore();
      }
    }
  }

  // live clock hands
  {
    const [ccx, ccy] = project((CT.x0 + CT.x1) / 2, CT.yF, 10.2);
    const rr = cellW * 0.92;
    const hA = (hour % 12) / 12 * Math.PI * 2 - Math.PI / 2;
    const mA = (hour % 1) * Math.PI * 2 - Math.PI / 2;
    ctx.strokeStyle = '#3a3227'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(hA) * rr * 0.5, ccy + Math.sin(hA) * rr * 0.5); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(mA) * rr * 0.78, ccy + Math.sin(mA) * rr * 0.78); ctx.stroke();
  }

  drawSmoke(t);
  applyLight(t);
  drawBalloon(t);                 // the balloon rides above every ground light

  if (raining){
    ctx.strokeStyle='rgba(200,215,235,.45)'; ctx.lineWidth=1;
    ctx.beginPath();
    for (const r of raindrops){ ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-2.4,r.y+11); }
    ctx.stroke();
  }
}
function drawSmoke(t){
  // fires get lit on chilly mornings, damp afternoons and after dark
  const cold = clamp(1 - Math.abs(hour - 7) / 3.5, 0, 1) + (raining ? 0.7 : 0) +
               clamp((hour - 18.5) / 2, 0, 1) * 0.8;
  if (cold <= 0.05 || RM) return;
  const drift = isWindy() ? 2.6 : 1;
  for (let k = 0; k < CHIMNEYS.length; k++){
    const [cx, cy] = CHIMNEYS[k];
    if (hash(cx, cy + day * 7) > clamp(cold, 0, 1) * 0.75) continue;
    const z0 = (roofZ(cx, cy) + roofZ(cx + 1, cy + 1)) / 2 + 2.4;
    for (let p = 0; p < 6; p++){
      const ph = ((t * 0.28 + p * 0.166 + hash(cx, p) * 0.4) % 1);
      const rise = ph * 5.2, spread = 0.25 + ph * 1.5;
      const wob = Math.sin(t * 0.9 + p + cx) * 0.35 * ph;
      const [sx, sy] = project(cx + 0.5 + wob + ph * 1.4 * drift, cy + 0.72 - ph * 0.5, z0 + rise);
      ctx.fillStyle = 'rgba(226,224,218,' + (0.30 * (1 - ph) * clamp(cold, 0, 1)) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, cellW * spread * 0.45, 0, 7); ctx.fill();
    }
  }
}
function drawPlant(it, t){
  const i = it.i, s = SPECIES[bSp[i]-1], st = bSt[i];
  const hv = hash(it.x*3, it.gy*7);
  const px = it.x + 0.25 + hv*0.5, py = it.gy + 0.3 + hash(it.x,it.gy*3)*0.4;
  const hgt = s.h * (st/3) * (0.8 + hv*0.4);
  const swx = RM ? 0 : Math.sin(windT*1.8 + px*0.7) * 0.1 * hgt;
  const [bx, by] = project(px, py, 0);
  const [tx2, ty2] = project(px + swx, py, hgt);
  ctx.strokeStyle = st===1 ? '#7da065' : '#4c7440';
  ctx.lineWidth = st===1 ? 1 : 1.6;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx2, ty2); ctx.stroke();
  if (st >= 2){
    ctx.fillStyle = '#4c7440';
    ctx.beginPath(); ctx.ellipse(bx, by - cellH*hgt*0.35, cellW*0.28*(st/3), cellH*0.3*(st/3), 0, 0, 7); ctx.fill();
  }
  if (st === 3){
    if (s.style === 'dot'){
      ctx.fillStyle = hv > 0.5 ? s.col : s.col2;
      ctx.beginPath(); ctx.arc(tx2, ty2, cellW*0.17, 0, 7); ctx.fill();
      if (hv > 0.6){ ctx.beginPath(); ctx.arc(tx2 + cellW*0.24, ty2 + 2, cellW*0.12, 0, 7); ctx.fill(); }
    } else if (s.style === 'spike'){
      ctx.strokeStyle = s.col; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(tx2, ty2 + cellH*0.5); ctx.lineTo(tx2, ty2 - cellH*0.4); ctx.stroke();
      ctx.fillStyle = s.col2; ctx.beginPath(); ctx.arc(tx2, ty2 - cellH*0.35, 1.6, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.ellipse(tx2, ty2, cellW*0.3, cellH*0.42, 0, 0, 7); ctx.fill();
      ctx.fillStyle = s.col2;
      ctx.beginPath(); ctx.arc(tx2 - cellW*0.12, ty2 - 2, 1.8, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx2 + cellW*0.14, ty2 + 1, 1.5, 0, 7); ctx.fill();
    }
  }
}
function drawTree(it, t){
  const [bx, by] = project(CX, CY + 0.5, 0);
  const {sway, treeR, treeH} = it;
  const tw = cellW * (0.5 + maturity()*0.35);
  const [tx2, ty2] = project(CX + sway*0.5, CY + 0.5, treeH*0.55);
  ctx.fillStyle = '#5d4433';
  ctx.beginPath();
  ctx.moveTo(bx - tw, by); ctx.quadraticCurveTo(bx - tw*0.5, (by+ty2)/2, tx2 - tw*0.55, ty2);
  ctx.lineTo(tx2 + tw*0.55, ty2); ctx.quadraticCurveTo(bx + tw*0.5, (by+ty2)/2, bx + tw, by);
  ctx.closePath(); ctx.fill();
  const blobs = [[0,0,1],[-0.55,-0.15,0.72],[0.55,-0.1,0.75],[-0.25,-0.45,0.6],[0.3,-0.4,0.62],[0,0.28,0.7]];
  const cols = ['#4c7a3e','#5c8a4a','#547f42','#679552','#5c8a4a','#456f38'];
  for (let k=0;k<blobs.length;k++){
    const [ox, oy, s] = blobs[k];
    const [cx2, cy2] = project(CX + ox*treeR + sway*(1+oy), CY + 0.5 + ox*0.2, treeH + oy*treeR*0.9);
    const rr = treeR * s * cellW * 0.55;
    ctx.fillStyle = cols[k];
    ctx.beginPath(); ctx.ellipse(cx2, cy2, rr, rr*0.78, 0, 0, 7); ctx.fill();
  }
  if (daylight > 0.2){
    ctx.fillStyle = 'rgba(190,220,140,' + 0.18*daylight + ')';
    const [hx, hy] = project(CX - treeR*0.3 + sway, CY, treeH + treeR*0.5);
    ctx.beginPath(); ctx.ellipse(hx, hy, treeR*cellW*0.34, treeR*cellH*0.4, 0, 0, 7); ctx.fill();
  }
}
function drawLaneTree(it){
  const px = it.px + 0.5, py = it.py || 66.9;
  const m = maturity();
  const r = (1.3 + m * 1.3) * (it.fruit ? 0.85 : 1), h = (3.2 + m * 1.4) * (it.fruit ? 0.8 : 1);
  const [bx, by] = project(px, py, 0);
  if (it.pit){
    // a proper stone tree pit, so the plaza trees stand in the paving instead of on it
    ctx.fillStyle = '#6b5a44';
    ctx.beginPath(); ctx.ellipse(bx, by, cellW * 0.95, cellH * 0.95, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(150,142,124,.9)'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
    ctx.beginPath(); ctx.ellipse(bx, by, cellW * 0.95, cellH * 0.95, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(40,34,26,.35)'; ctx.lineWidth = 1;
    for (let k = -2; k <= 2; k++){
      ctx.beginPath();
      ctx.moveTo(bx + k * cellW * 0.34, by - cellH * 0.88); ctx.lineTo(bx + k * cellW * 0.34, by + cellH * 0.88);
      ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(25,32,18,' + 0.22 * daylight + ')';
  const shx = -SUN[0] / SUN[2] * h * cellW * 0.55;
  ctx.beginPath(); ctx.ellipse(bx + shx, by - h * cellH * 0.28, r * cellW * 0.8, r * cellH * 0.55, 0, 0, 7); ctx.fill();
  // trunk with a root flare, tapering as it rises
  const [tx2, ty2] = project(px, py, h * 0.52);
  const tw = cellW * 0.16;
  ctx.fillStyle = '#5d4433';
  ctx.beginPath();
  ctx.moveTo(bx - tw * 1.9, by); ctx.quadraticCurveTo(bx - tw * 0.8, (by + ty2) / 2, tx2 - tw * 0.6, ty2);
  ctx.lineTo(tx2 + tw * 0.6, ty2); ctx.quadraticCurveTo(bx + tw * 0.8, (by + ty2) / 2, bx + tw * 1.9, by);
  ctx.closePath(); ctx.fill();
  const swx = RM ? 0 : Math.sin(windT * 1.4 + px) * 0.12;
  const cols = it.fruit ? ['#5f8a48', '#6e9a52', '#547f42'] : ['#54804a', '#618f52', '#4a7440'];
  const blobs = [[0, 0, 1], [-0.5, -0.3, 0.7], [0.5, -0.25, 0.72], [0, 0.45, 0.62]];
  for (let k = 0; k < blobs.length; k++){
    const [ox, oz, s] = blobs[k];
    const [cx2, cy2] = project(px + ox * r + swx, py, h + oz * r * 0.8);
    ctx.fillStyle = cols[k % 3];
    ctx.beginPath(); ctx.ellipse(cx2, cy2, r * s * cellW * 0.5, r * s * cellW * 0.4, 0, 0, 7); ctx.fill();
  }
  if (daylight > 0.2){                                  // a sunlit crown
    const [hx, hy] = project(px - r * 0.35 + swx, py, h + r * 0.45);
    ctx.fillStyle = 'rgba(198,224,150,' + 0.2 * daylight + ')';
    ctx.beginPath(); ctx.ellipse(hx, hy, r * cellW * 0.3, r * cellH * 0.34, 0, 0, 7); ctx.fill();
  }
  if (it.fruit && day >= 3){                            // apples on the orchard trees
    ctx.fillStyle = '#c2483a';
    for (let k = 0; k < 5; k++){
      const [fx, fy] = project(px + (hash(k, px | 0) - 0.5) * r * 1.5 + swx, py, h + (hash(px | 0, k) - 0.4) * r * 0.9);
      ctx.beginPath(); ctx.arc(fx, fy, Math.max(1.2, cellW * 0.11), 0, 7); ctx.fill();
    }
  }
}
function drawBandstand(it, t){
  const {x, y} = BANDSTAND, R0 = 2.3;
  const [bx, by] = project(x, y, 0);
  // shadow, then a stepped stone base
  ctx.fillStyle = 'rgba(24,32,18,' + 0.22 * daylight + ')';
  ctx.beginPath(); ctx.ellipse(bx - SUN[0] / SUN[2] * cellW * 1.4, by - cellH * 0.6, cellW * R0 * 1.15, cellH * R0 * 0.85, 0, 0, 7); ctx.fill();
  for (const [rr, zz, col] of [[R0 * 1.16, 0.16, '#9a9184'], [R0 * 1.05, 0.34, '#aaa294'], [R0 * 0.96, 0.5, '#b6ad9d']]){
    const [px2, py2] = project(x, y, zz);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(px2, py2, cellW * rr, cellH * rr * 0.72, 0, 0, 7); ctx.fill();
  }
  // eight posts
  const posts = [];
  for (let k = 0; k < 8; k++){
    const th = k / 8 * Math.PI * 2 + 0.39;
    const wx = x + Math.cos(th) * R0 * 0.85, wy = y + Math.sin(th) * R0 * 0.62;
    posts.push([wx, wy, project(wx, wy, 0.5), project(wx, wy, 2.6)]);
  }
  posts.sort((p, q) => p[1] - q[1]);
  ctx.strokeStyle = '#7d6a4e'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
  for (const p of posts){ ctx.beginPath(); ctx.moveTo(p[2][0], p[2][1]); ctx.lineTo(p[3][0], p[3][1]); ctx.stroke(); }
  // ogee roof and a finial
  const [rx, ry] = project(x, y, 2.6);
  const [ax2, ay2] = project(x, y, 4.5);
  ctx.fillStyle = mix('#3f4a4e', '#6f7f84', 0.3 + 0.5 * daylight);
  ctx.beginPath();
  ctx.moveTo(rx - cellW * R0 * 1.1, ry);
  ctx.quadraticCurveTo(rx - cellW * R0 * 0.5, ay2 + cellH * 0.6, ax2, ay2);
  ctx.quadraticCurveTo(rx + cellW * R0 * 0.5, ay2 + cellH * 0.6, rx + cellW * R0 * 1.1, ry);
  ctx.quadraticCurveTo(rx, ry + cellH * R0 * 0.85, rx - cellW * R0 * 1.1, ry);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(216,224,230,.25)'; ctx.lineWidth = 1;
  for (let k = -2; k <= 2; k++){
    ctx.beginPath(); ctx.moveTo(ax2, ay2);
    ctx.quadraticCurveTo(rx + k * cellW * 0.55, (ay2 + ry) / 2, rx + k * cellW * R0 * 0.5, ry + Math.abs(k) * cellH * 0.5);
    ctx.stroke();
  }
  ctx.strokeStyle = '#c9b98a'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(ax2, ay2); ctx.lineTo(ax2, ay2 - cellH * 1.5); ctx.stroke();
  ctx.fillStyle = '#c9b98a';
  ctx.beginPath(); ctx.arc(ax2, ay2 - cellH * 1.7, Math.max(1.5, cellW * 0.14), 0, 7); ctx.fill();
}
function drawJetty(){

let boat = null, boatUnder = false;
function updateBoat(dt){
  if (!boat && day >= 1 && R() < dt * 0.012){
    boat = {x:116.5 + R() * 5, y:-7, ph:R() * 9};
  }
  if (boat){
    boat.y += dt * 1.05; boat.ph += dt * 2.6;
    if (!boatUnder && boat.y > 62 && boat.y < 66){
      boatUnder = true;
      if (R() < 0.7) announce('A rowboat slips under the bridge and out the other side.');
    }
    if (boat.y > 93){ boat = null; boatUnder = false; }
  }
}

function drawMarketStall(it){
  const s = it.s, p = it.p;
  const [x, y] = project(s.x, s.y + 1, 0);
  const w = cellW * 2.5;
  /* The raise, in order. Every stage starts at zero size, so nothing ever arrives
   * finished: the trader fades up crouched over the pitch, the trestle unfolds up
   * to its full board, the frame rises, the canvas rolls out from the left pole,
   * and only then do the goods come out. Every term is a clamp on the same p, so
   * running p backwards packs the stall down in the reverse order. */
  const arrive = clamp(p / 0.10, 0, 1);
  const table  = clamp((p - 0.08) / 0.26, 0, 1);
  const pole   = clamp((p - 0.34) / 0.24, 0, 1);
  const can    = clamp((p - 0.56) / 0.24, 0, 1);
  ctx.fillStyle = 'rgba(20,20,15,' + (0.25 * clamp(p / 0.55, 0, 1)).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(x, y, w * 0.6, cellH * 0.7, 0, 0, 7); ctx.fill();
  if (table > 0){                                  // the board comes up on its legs
    const tw = w * (0.44 + 0.56 * table), th = cellH * table;
    ctx.fillStyle = '#6a4f36';
    ctx.fillRect(x - tw/2, y - cellH * 0.4 - th, tw, th);
  }
  for (let k = 0; k < 6; k++){                     // goods, laid out one at a time
    const g = clamp((p - 0.80 - k * 0.03) / 0.05, 0, 1);
    if (g <= 0) continue;
    ctx.fillStyle = ['#c9903a', '#a83c32', '#7f9a5d', '#e0b95a', '#8a5f3f', '#c96f8e'][(hash(s.x, k) * 6) | 0];
    ctx.beginPath();
    ctx.arc(x - w/2 + 3 + (k % 3) * (w/3) + hash(k, s.x) * 4, y - cellH * 1.5 - (k > 2 ? 3 : 0), 1.8 * g, 0, 7);
    ctx.fill();
  }
  const c1 = project(s.x - 1.25, s.y - 0.2, 2.5 * pole), c2 = project(s.x + 1.25, s.y - 0.2, 2.5 * pole);
  const f1 = project(s.x - 1.25, s.y + 1.7, 2.1 * pole), f2 = project(s.x + 1.25, s.y + 1.7, 2.1 * pole);
  if (pole > 0){
    ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 2;
    for (const [gp, cp] of [[project(s.x-1.25, s.y-0.2, 0), c1], [project(s.x+1.25, s.y-0.2, 0), c2],
                            [project(s.x-1.25, s.y+1.7, 0), f1], [project(s.x+1.25, s.y+1.7, 0), f2]]){
      ctx.beginPath(); ctx.moveTo(gp[0], gp[1]); ctx.lineTo(cp[0], cp[1]); ctx.stroke();
    }
  }
  if (can > 0){
    // unrolled from the left pole toward the right one. The stripes are anchored in
    // screen x, so they stand still and get revealed rather than sliding with the edge.
    const roll = (A, B) => [A[0] + (B[0] - A[0]) * can, A[1] + (B[1] - A[1]) * can];
    const cnv = [c1, roll(c1, c2), roll(f1, f2), f1];
    ctx.fillStyle = s.c1; poly(ctx, cnv); ctx.fill();
    ctx.save(); poly(ctx, cnv); ctx.clip();
    ctx.fillStyle = s.c2;
    for (let k = -6; k < 7; k += 2) ctx.fillRect(x + k * 7, Math.min(c1[1], f1[1]) - 4, 7, 36);
    ctx.restore();
    ctx.strokeStyle = 'rgba(40,30,20,.4)'; ctx.lineWidth = 1; poly(ctx, cnv); ctx.stroke();
  }
  // the trader: crouched over the pitch while it goes up, on their feet behind it once
  // the canvas is out. Both the fade and the walk round the trestle take ~0.2 s.
  const st = clamp((p - 0.50) / 0.16, 0, 1);
  ctx.save(); ctx.globalAlpha = arrive;
  drawPerson({a:{x:s.x - 1.1 + 0.5 * st, y:s.y + 0.9 + 0.2 * st, state:st > 0.5 ? 'stand' : 'kneel',
    phase:0,
    shirt:['#5d7a4a', '#3d5a80', '#8a4a3a'][(hash(s.x, 9) * 3) | 0], pants:'#3a3a44',
    skin:SKIN[(hash(s.x, 4) * SKIN.length) | 0]}});
  ctx.restore();
}

  const w3 = project(x0 + 1.1, yF, 1.3), w4 = project(x0 + 0.42, yF, 1.3);

  ctx.strokeStyle = 'rgba(226,216,190,.6)'; ctx.stroke();
  // roof: south slope, then the sliver of the north slope showing over the ridge
  const s1 = project(x0 - 0.22, yF + 0.22, eave - 0.1), s2 = project(x1 + 0.22, yF + 0.22, eave - 0.1);

  ctx.beginPath(); ctx.moveTo(s4[0], s4[1]); ctx.lineTo(s3[0], s3[1]); ctx.stroke();

function drawPerson(it, t){
  const a = it.a;
  const scale = a.small ? 0.72 : 1;
  const chatting = a.greet > 0;
  const walking = a.state === 'walk' && !chatting;   // stood talking, not frozen mid-stride
  const bob = walking ? Math.abs(Math.sin(a.phase)) * 1.6 : 0;
  const [x, y] = project(a.x, a.y, 0);
  const hgt = (a.state==='sit'? 8 : a.state==='kneel'? 7 : a.state==='lie'? 3 : 12) * scale * (cellH/8);
  ctx.fillStyle = 'rgba(20,25,15,.28)';
  ctx.beginPath(); ctx.ellipse(x, y, 4.5*scale + (a.state==='lie'?4:0), 2*scale, 0, 0, 7); ctx.fill();
  ctx.save();
  ctx.translate(x, y - bob);
  if (a.state === 'lie'){ ctx.rotate(-1.35); ctx.translate(0, -3); }
  const bw = 4.6 * scale * (cellW/13);
  if (a.cycle){
    // wheels + lowered rider
    ctx.strokeStyle = '#2e2a26'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(-bw, 0, 4.2*scale, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(bw, 0, 4.2*scale, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#6b5b45';
    ctx.beginPath(); ctx.moveTo(-bw, 0); ctx.lineTo(0, -hgt*0.4); ctx.lineTo(bw, 0); ctx.stroke();
  }
  ctx.fillStyle = a.pants;
  if (walking && !a.cycle){
    const k = Math.sin(a.phase) * 2.6 * scale;
    ctx.fillRect(-bw*0.7 - k*0.4, -hgt*0.45, bw*0.62, hgt*0.48);
    ctx.fillRect(bw*0.08 + k*0.4, -hgt*0.45, bw*0.62, hgt*0.48);
  } else {
    ctx.fillRect(-bw*0.7, -hgt*0.42, bw*1.4, hgt*0.44);
  }
  ctx.fillStyle = a.shirt;
  ctx.beginPath();
  ctx.moveTo(-bw, -hgt*0.4);
  ctx.quadraticCurveTo(-bw, -hgt*0.95, 0, -hgt*0.97);
  ctx.quadraticCurveTo(bw, -hgt*0.95, bw, -hgt*0.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = a.skin;
  const up = a.listen > 0 ? 1 : 0;               // listening to the bell: head tipped back
  // mid-conversation: head turned toward the other one, and nodding along
  const nod = chatting ? Math.sin(a.greet * 4.4) : 0;
  const turn = chatting ? (a.faceL ? -1 : 1) * (1.5 + nod * 0.5) : 0;
  ctx.beginPath(); ctx.arc(up * (a.faceL ? 1.2 : -1.2) + turn,
    -hgt*1.05 - 2.2*scale - up*1.2 + Math.abs(nod) * 0.7, 2.9*scale*(cellW/13), 0, 7); ctx.fill();
  if (a.broom){
    ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(bw, -hgt*0.7); ctx.lineTo(bw + 7, 1); ctx.stroke();
    ctx.strokeStyle = '#b0a488'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bw + 6, 0); ctx.lineTo(bw + 9, 3); ctx.stroke();
  }
  if (a.kind === 'busker' && a.state === 'stand'){
    ctx.fillStyle = '#8a6a42';
    ctx.beginPath(); ctx.ellipse(bw*0.7, -hgt*0.6, 3.4*scale, 2.4*scale, 0.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(bw*0.7, -hgt*0.66); ctx.lineTo(bw*1.6, -hgt*0.95); ctx.stroke();
  }
  if (a.cup && a.state === 'sit'){
    ctx.fillStyle = '#efe9dc';
    ctx.fillRect(bw * 0.7, -hgt * 0.72, 2.6 * scale, 2.2 * scale);
  }
  if (a.crop){              // walking back out of the allotments with the picking
    const c = SPECIES[a.crop - 1], bx = bw * 0.55, by = -hgt * 0.44;
    ctx.fillStyle = c.col2;
    ctx.beginPath(); ctx.ellipse(bx + 2.4*scale, by - 1.4*scale, 2.5*scale, 1.5*scale, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#8a6a42';
    ctx.beginPath();
    ctx.moveTo(bx, by - 1.6*scale); ctx.lineTo(bx + 4.9*scale, by - 1.6*scale);
    ctx.lineTo(bx + 4.1*scale, by + 2.2*scale); ctx.lineTo(bx + 0.8*scale, by + 2.2*scale);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b5b45'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx + 2.4*scale, by - 1.6*scale); ctx.lineTo(bw * 0.7, -hgt*0.78); ctx.stroke();
  }
  if (a.umbrella){          // true only across the approach and the shower itself
    ctx.fillStyle = a.shirt;
    ctx.beginPath(); ctx.arc(0, -hgt*1.3 - 4, 7*scale, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#443'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -hgt*1.3 - 4); ctx.lineTo(0, -hgt*0.6); ctx.stroke();
  }
  ctx.restore();
}

/* ============ lighting ============ */
function applyLight(t){
  const dusk = clamp(1 - Math.abs(hour - 19) / 1.8, 0, 1) + clamp(1 - Math.abs(hour - 6.4) / 1.6, 0, 1);
  if (dusk > 0){
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = 'rgba(255,140,70,' + (0.55 * dusk) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (nightF > 0.02){
    ctx.globalCompositeOperation = 'multiply';
    const a = 0.8 * nightF;
    ctx.fillStyle = 'rgba(' + (44 - 16*nightF|0) + ',' + (56 - 12*nightF|0) + ',' + (112) + ',' + a + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    for (const L of LAMPS.concat(LANE_LAMPS)){
      const [x, y] = project(L[0], L[1], 2.6);
      const g = ctx.createRadialGradient(x, y, 1, x, y, cellW * 2.4);
      g.addColorStop(0, 'rgba(255,196,104,' + 0.42 * nightF + ')');
      g.addColorStop(0.45, 'rgba(255,190,100,' + 0.13 * nightF + ')');
      g.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, cellW * 2.4, 0, 7); ctx.fill();
      // and the pool it throws on the ground below
      const [px, py] = project(L[0], L[1] + 0.6, 0);
      const gp = ctx.createRadialGradient(px, py, 1, px, py, cellW * 3);
      gp.addColorStop(0, 'rgba(255,190,110,' + 0.20 * nightF + ')');
      gp.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = gp;
      ctx.save(); ctx.translate(px, py); ctx.scale(1, 0.5); ctx.translate(-px, -py);
      ctx.beginPath(); ctx.arc(px, py, cellW * 3, 0, 7); ctx.fill();
      ctx.restore();
    }
    // every lit window casts a little halo onto the night
    for (const [wx, wy] of LIT){
      const g = ctx.createRadialGradient(wx, wy, 0, wx, wy, cellW * 0.9);
      g.addColorStop(0, 'rgba(255,205,130,' + 0.26 * nightF + ')');
      g.addColorStop(1, 'rgba(255,205,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(wx, wy, cellW * 0.9, 0, 7); ctx.fill();
    }
    // the clock face stays lit
    {
      const [ccx, ccy] = project((CT.x0 + CT.x1) / 2, CT.yF, 10.2);
      const g = ctx.createRadialGradient(ccx, ccy, 1, ccx, ccy, cellW * 2.2);
      g.addColorStop(0, 'rgba(255,230,170,' + 0.5 * nightF + ')');
      g.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ccx, ccy, cellW * 2.2, 0, 7); ctx.fill();
    }
    // warm spill from our shopfronts, pooled on the footway
    for (const ax of [10, 26, 47, 70, 87, 134]){
      const [x, y] = project(ax, LN_WALK_S - 1.3, 0);
      const g = ctx.createRadialGradient(x, y, 2, x, y, cellW * 3.4);
      g.addColorStop(0, 'rgba(255,190,120,' + 0.16*nightF + ')');
      g.addColorStop(1, 'rgba(255,190,120,0)');
      ctx.fillStyle = g;
      ctx.save();
      ctx.translate(x, y); ctx.scale(1, 0.55); ctx.translate(-x, -y);
      ctx.beginPath(); ctx.arc(x, y, cellW * 3.4, 0, 7); ctx.fill();
      ctx.restore();
    }
    for (const f of fireflies){
      const glow = 0.3 + 0.7 * Math.abs(Math.sin(f.ph));
      const [x, y] = project(f.x, f.y, f.z);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 5);
      g.addColorStop(0, 'rgba(220,255,140,' + 0.9*glow*nightF + ')');
      g.addColorStop(1, 'rgba(220,255,140,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (raining){
    ctx.fillStyle = 'rgba(90,105,125,.16)';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============ interaction ============ */
cv.addEventListener('click', ev => {
  const r = cv.getBoundingClientRect();
  const [wx, wy] = unproject(ev.clientX - r.left, ev.clientY - r.top);
  const x = Math.floor(wx), y = Math.floor(wy);
  if (x < 0 || y < 0 || x >= GW || y >= WH) return;
  const j = y * GW + x;
  if (grid[j] === BED || grid[j] === CBED){
    let n = 0;
    const sp = SPECIES.indexOf(pick(speciesFor(x, y))) + 1;
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
      const k = (y+dy)*GW + (x+dx);
      if (k>=0 && k<GW*WH && (grid[k]===BED||grid[k]===CBED) && !bSp[k] && R()<0.7){ bSp[k]=sp; bSt[k]=1; bAge[k]=0; n++; }
    }
    if (n){ announce('You scatter a handful of ' + SPECIES[sp-1].name + ' seeds from the window.'); groundDirty = true; }
  } else if (grid[j] === GRASS){
    daisy[j] = 2; groundDirty = true;
    announce('You flick a daisy seed down onto the lawn.');
  } else if (grid[j] === WATER){
    if (x >= RIVER_X0){
      announce('You drop a pebble into the river; the rings are gone in a moment.');
    } else if (x >= PLAZA_X0){
      announce('A coin plinks into the fountain. You make a wish.');
    } else {
      announce('You toss crumbs into the pond. The ducks arrive like a small navy.');
      for (const d of ducks){ d.tx = x + 0.5; d.ty = y + 0.5; d.t = 4; }
    }
  } else if (grid[j] === SIDE || grid[j] === ROAD){
    announce('You scatter crumbs onto the lane. Small eyes take notice.');
    if (birds.length < 4 && daylight > 0.2){
      for (let k = 0; k < 3; k++) birds.push({x:x+(R()-0.5)*3, y:clamp(y+(R()-0.5)*2, LN_WALK_N, LN_WALK_S-1), z:9, state:'land', hop:0, t:6+R()*6,
        col:pick(['#7d8089','#6e6a60','#33302c'])});
    }
  }
});
document.getElementById('pause').addEventListener('click', e => {
  paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause';
});
document.getElementById('speed').addEventListener('click', e => {
  speed = speed === 1 ? 3 : speed === 3 ? 8 : 1;
  e.target.textContent = speed + '×';
});

/* ============ opening state ============ */
(function seed(){
  let planted = 0, guard = 0;
  while (planted < 8 && guard++ < 4000){
    const x = R() * GW | 0, y = 3 + (R() * (LN_WALK_S - 3) | 0);
    const j = y*GW+x;
    if ((grid[j]===BED || grid[j]===CBED) && !bSp[j]){
      bSp[j] = 1 + (R()*4|0); bSt[j] = 1 + (R()*2|0); planted++;
    }
  }
  for (let y = 50; y < 58; y++) for (let x = 30; x < 35; x++){
    const j = y*GW+x; if (grid[j]===GRASS) wear[j] = 0.25*R();
  }
})();

/* ============ main loop ============ */
let last = 0, caAcc = 0, spawnAcc = 0, statAcc = 0, lightBucket = -1;
let lastStruck = -1, marketAnnounced = -1, marketClosed = -1, windAnnounced = -1, bellUntil = -1, bellSeen = -1;
const HOUR_WORDS = ['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
function strikeClock(){
  const hInt = Math.floor(hour);
  if (lastStruck === -1){ lastStruck = hInt; return; }
  if (hInt !== lastStruck){
    lastStruck = hInt;
    if (hInt % 3 === 0){
      announce('The clock over the lane strikes ' + HOUR_WORDS[hInt % 12] + '.');
      bellUntil = simT + 2.2;
    } else if ((hInt === 9 || hInt === 18) && day >= 2){
      announce('The church bell answers from across the river, half a beat behind.');
      bellUntil = simT + 2.6;
    }
  }
}
/* strikeClock() decides WHEN the bell rings and writes bellUntil; nothing else may
 * re-derive that. This reads it on the rising edge and lets the town answer for the
 * couple of seconds it is ringing: pigeons off the belfry, and a few walkers who
 * stop mid-stride with their heads back. */
function bellStartle(){
  // off the parapet and into open air in FRONT of the tower — spawned on the belfry
  // louvre itself they are grey-on-near-black and read as dust, not as pigeons
  const cx = (CHURCH.tx0 + CHURCH.tx1) / 2, cy = CHURCH.ty1 + 0.3;
  // Only what is actually roosting goes up. The clock strikes every third hour —
  // every ~7 s at this compression — so a fixed-size flock would be permanently
  // airborne and stop reading as an answer to anything. belfryRoost refills at
  // ~0.35/s in updateWildlife, so the first strike flushes the tower and the next
  // few put up the two or three that have made it back.
  const n = Math.min(Math.floor(belfryRoost), 4 + Math.round(R() * 3));
  belfryRoost -= n;
  for (let k = 0; k < n; k++){
    // dark, not pigeon-pale: the whole flight is spent against open sky, so the
    // birds read by contrast with it
    birds.push({x:cx, y:cy, z:12.6 + R()*1.4, state:'wheel', hop:0, t:0.9 + R()*0.5, sz:1.5,
      cx, cy, r:0.5 + R()*0.6, ph:R()*Math.PI*2, sp:1.9 + R()*1.3, ph2:R()*9,
      col:pick(['#3a3733','#4e4a44','#5a5650','#6e6a60'])});
  }
  for (const a of agents) if (a.state === 'walk' && R() < 0.45) a.listen = 1 + R()*1.1;
}
/* One simulation step. Split out of frame() so `__warp()` can advance the town
 * with a FIXED dt and no drawing — that is what makes a seeded run reproducible:
 * state becomes a pure function of (seed, warped seconds) instead of depending on
 * how many rAF frames the machine happened to deliver. */
function simStep(sdt, dt){
  simT += sdt;
  updateClock();
  strikeClock();
  if (bellUntil > simT && bellUntil !== bellSeen){ bellSeen = bellUntil; bellStartle(); }
  if (marketUp() && marketAnnounced !== day){          // now fires on the first trestle
    marketAnnounced = day;
    announce('Market morning — trestles out, and the canvas rolls open along the lane.');
  }
  // fired at the FIRST stall coming down, not the last: it points at the pack-down
  // rather than reporting it afterwards, and 17.00 keeps clear of the six o'clock strike.
  if (isMarketDay() && hour >= 17 && marketClosed !== day){
    marketClosed = day;
    announce('Five o’clock; the canvas comes down and the lane is left to the sparrows.');
  }
  if (isWindy() && windAnnounced !== day && hour > 7 && hour < 9){
    windAnnounced = day;
    announce('A brisk wind combs the block; everything that can flutter, does.');
  }
  wet = Math.max(0, wet - sdt);
  stepClouds(sdt);
  // sun moves, cover thickens: relight the static layer now and then. Cover rides
  // the same bucket rather than its own, so it costs no extra rebuilds.
  const lb = Math.floor(hour * 4) * 8 + Math.round(cloudCover() * 6);
  if (lb !== lightBucket){ lightBucket = lb; groundDirty = true; }

  caAcc += sdt;
  while (caAcc > 0.35){ caAcc -= 0.35; caTick(); }

  const courtyardCount = agents.filter(a => !a.street).length;
  const eastCount = agents.filter(a => a.east).length;
  const laneCount = agents.length - courtyardCount - eastCount;
  const capacity = 2 + Math.round(maturity() * 12 * (0.25 + 0.75 * daylight));
  const laneCap = 1 + Math.round(maturity() * 8 * (0.2 + 0.8 * daylight));
  // the far side arrives on its own budget, so it no longer loses to the lane
  const eastCap = 1 + Math.round(maturity() * 6 * daylight);
  const rate = (0.05 + maturity() * 0.42) * (0.12 + daylight) * (raining ? 0.25 : 1);
  const laneRate = (0.08 + maturity() * 0.5) * (0.15 + daylight) * (raining ? 0.3 : 1) * (marketActive() ? 1.7 : 1);
  const eastRate = (0.15 + maturity() * 0.6) * (0.1 + daylight) * (raining ? 0.25 : 1);
  // the allotments arrive on the crop's budget, not the lane's: 0.42 of the lane's
  // roll chain put one gardener in every 5-15 days against 17 plots, which is why
  // the block sat permanently full. Ripeness is the rate.
  const allotRate = (0.01 + 0.16 * ripePlots() / 17) * (raining ? 0.2 : 1);
  spawnAcc += sdt;
  if (spawnAcc > 1){ spawnAcc = 0;
    if (courtyardCount < capacity && R() < rate) spawnAgent();
    if (laneCount < laneCap && R() < laneRate) spawnLaneAgent();
    if (eastOpen() && eastCount < eastCap && R() < eastRate) spawnEastAgent();
    if (daylight > 0.3 && day >= 1 && allotCount() < 3 && R() < allotRate) spawnAllotAgent();
    if (agents.length === 0 && day === 0 && simT > 6 && !window._first){ window._first = true; spawnAgent();
      announce('The first neighbour wanders in through the archway.'); }
  }
  for (let i = agents.length - 1; i >= 0; i--){
    stepAgent(agents[i], sdt);
    if (agents[i].done){
      const a = agents[i];
      if (a.table) a.table.taken = 0;
      if (a.tableRef) a.tableRef.taken = 0;
      agents.splice(i, 1);
    }
  }
  greetAcc += sdt;
  while (greetAcc > GREET_DT){ greetAcc -= GREET_DT; greetPass(); }
  updateSweeper();
  updateWildlife(sdt);
  updateDucks(sdt);
  updateSwans(sdt);
  updateBalloon(sdt);
  updateBoat(sdt);

  statAcc += dt;
  if (statAcc > 0.5){ statAcc = 0; refreshStats();
    tickerTimer -= 0.5; if (tickerTimer < 0) tickerEl.classList.add('fade');
  }
  ambientAcc += sdt;
  if (ambientAcc > 20 && tickerTimer < -8){
    ambientAcc = 0;
    if (R() < 0.6) announce(ambientLine());
  }
}
function frame(ts){
  requestAnimationFrame(frame);
  const now = ts / 1000;
  let dt = Math.min(now - last, 0.1); last = now;
  if (paused) dt = 0;
  simStep(dt * speed, dt);
  drawScene(now, dt * speed);
}

/* ============ test hooks (grow-courtyard) ============
 * Not used by the diorama itself. These are the seam the autonomous loop measures
 * the town through — see .claude/skills/grow-courtyard/census.mjs.
 *
 *   ?seed=N        deterministic world (above)
 *   ?t=<seconds>   start the clock at a given sim time
 *   ?fast          run at 8x
 *   __warp(secs)   advance the sim synchronously, fixed dt, no drawing
 *   __census()     structured count of everything the town contains
 *
 * __census() is the loop's REGRESSION GUARD, not a score. Add a field when a new
 * system would otherwise move nothing here; do not add one per feature. */
window.__warp = function(secs, step){
  step = step || 1 / 30;
  const n = Math.max(0, Math.round(secs / step));
  for (let i = 0; i < n; i++) simStep(step, step);
  return { simT, day, hour };
};
window.__setTime = function(t){ simT = t; updateClock(); return { simT, day, hour }; };

/* Every moving thing, with a stable identity — the seam the motion gate reads.
 * A screenshot cannot see a teleport, a pop-in or a thing that flickers between
 * two positions; a position series can. Ids are stamped lazily here so the
 * simulation itself carries no extra bookkeeping. */
let __eid = 0;
window.__entities = function(){
  const out = [];
  const take = (arr, kind) => { for (const e of arr){ if (e.__id === undefined) e.__id = ++__eid;
    out.push({ id: kind + e.__id, kind, x: e.x, y: e.y, z: e.z === undefined ? 0 : e.z }); } };
  take(agents.filter(a => a.kind !== 'sweeper'), 'walker');
  take(agents.filter(a => a.kind === 'sweeper'), 'sweeper');
  take(ducks, 'duck'); take(swans, 'swan');
  take(butterflies, 'butterfly'); take(fireflies, 'firefly');
  take(birds, 'bird'); take(leaves, 'leaf');
  if (balloon) take([balloon], 'balloon');
  if (boat) take([boat], 'boat');
  return out;
};
window.__census = function(){
  const tiles = {}, TN = ['WALL','PATH','GRASS','BED','CBED','TRUNK','SIDE','ROAD','VOID','WATER','TUNNEL','SLOT'];
  for (let i = 0; i < GW * WH; i++){ const n = TN[grid[i]] || ('T' + grid[i]); tiles[n] = (tiles[n] || 0) + 1; }

  /* planting CA: how much of the beds is actually growing, and how far along */
  let planted = 0, blooming = 0, daisies = 0, worn = 0, matureTrees = 0;
  const bySpecies = {};
  for (let i = 0; i < GW * WH; i++){
    if (bSp[i]){ planted++;
      const nm = SPECIES[bSp[i] - 1] ? SPECIES[bSp[i] - 1].name || ('sp' + bSp[i]) : ('sp' + bSp[i]);
      bySpecies[nm] = (bySpecies[nm] || 0) + 1;
      if (bSt[i] === 3) blooming++;
    }
    if (daisy[i]) daisies++;
    if (wear[i] > 0.5) worn++;
    if (grid[i] === TRUNK) matureTrees++;
  }

  /* living things, by where they are — the growth signal for draw-only work,
   * which leaves every terrain number flat */
  const life = {
    people: agents.length,
    inCourtyard: agents.filter(a => !a.street).length,
    onStreet: agents.filter(a => a.street).length,
    // a subset of onStreet, not a new axis: the same where-are-they split, extended
    // to the half of the world that never had a counter.
    inEast: agents.filter(a => a.east).length,
    ducks: ducks.length, swans: swans.length, birds: birds.length,
    butterflies: butterflies.length, fireflies: fireflies.length,
    leaves: leaves.length, raindrops: raindrops.length,
  };
  const structure = {
    /* NB: no LIT.length here. It is a per-frame draw accumulator (reset at the top
     * of each scene), so its value depends on where in the draw pass you sample —
     * it made the census non-reproducible. Census fields must be town state, not
     * render state. */
    chimneys: CHIMNEYS.length,
    ringNodes: RING.length, edgeBeds: EDGE_BEDS.length,
    benches: BENCH_SPOTS.length + LANE_BENCHES.length + QUAY_BENCHES.length + FAR_BENCHES.length,
    cafeTables: CAFE_TABLES.length, marketStalls: MARKET_STALLS.length,
    treePits: TREE_PITS.length, orchard: ORCHARD.length, plazaPits: PLAZA_PITS.length,
  };
  return {
    world: { GW, WH, cells: GW * WH },
    clock: { simT: +simT.toFixed(3), day, hour: +hour.toFixed(3),
             marketDay: isMarketDay(), windy: isWindy(), raining: !!raining,
             cloud: +cloudCover().toFixed(3),
             maturity: +maturity().toFixed(4), richness: +richness().toFixed(4) },
    tiles, life, structure,
    /* `harvested` is the one thing bySpecies cannot show: a veg count falling is
       equally dieback, so without it nothing distinguishes a picked plot from a
       rotted one, and a regression that silently killed harvesting would read clean */
    planting: { planted, blooming, daisies, matureTrees, worn, harvested, species: SPECIES.length, bySpecies },
    /* headline aggregates — what the census gate watches for collapse */
    scalars: {
      developed: (tiles.WALL || 0) + (tiles.PATH || 0) + (tiles.ROAD || 0) + (tiles.SIDE || 0),
      green: (tiles.GRASS || 0) + (tiles.BED || 0) + (tiles.CBED || 0) + (tiles.TRUNK || 0),
      water: tiles.WATER || 0,
      passages: (tiles.TUNNEL || 0) + (tiles.SLOT || 0),
      people: agents.length, planted, blooming,
      creatures: life.ducks + life.swans + life.birds + life.butterflies + life.fireflies,
      structures: Object.values(structure).reduce((a, b) => a + b, 0),
      tileKinds: Object.keys(tiles).length,
      speciesKinds: SPECIES.length,
    },
  };
};

resize();
refreshStats();
requestAnimationFrame(frame);
</script>
