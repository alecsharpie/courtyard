function drawScene(t, dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (groundDirty && !viewEasing()){ drawGround(); groundDirty = false; wearDirty = false; wearAcc = 0; }
  ctx.clearRect(0, 0, W, H);
  drawSky(ctx);
  // the cache is painted in ONE view and composited in the current one: an exact
  // scale+translate while the camera eases, the identity (0, 0, W, H) at rest
  { const k = viewS / gview.s;
    ctx.drawImage(gcv, originX - k * (gview.ox + gview.pad), topPad - k * gview.tp,
                  gcv.width / DPR * k, gcv.height / DPR * k); }
  // LIT is a per-FRAME accumulator. It used to be reset only on a ground rebuild, so
  // the south band's live windows stacked into it ~13 a frame for a quarter-hour and
  // the glow pass drew hundreds of halos on top of each other.
  LIT.length = 0; LIT_PANES.length = 0; BOAT_LAMP = null;
  drawLitPanes();

  // wet sheen on the streets after rain
  if (wetness > 0){
    const al = 0.16 * wetness;
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = 'rgba(190,210,228,' + al * 3 + ')';
    const l1 = project(0, LN_WALK_N, 0), l2 = project(GW, LN_WALK_N, 0), l3 = project(GW, LN_WALK_S, 0), l4 = project(0, LN_WALK_S, 0);
    poly(ctx, [l1, l2, l3, l4]); ctx.fill();
    const c1 = project(XS_W0, 0, 0), c2 = project(XS_E1, 0, 0), c3 = project(XS_E1, LN_WALK_N, 0), c4 = project(XS_W0, LN_WALK_N, 0);
    poly(ctx, [c1, c2, c3, c4]); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    for (let k = 0; k < 8; k++){
      const px2 = hash(k, 31) * GW, py2 = LN_ROAD0 + hash(k, 37) * (LN_ROAD1 - LN_ROAD0);
      const [sx, sy] = project(px2, py2, 0);
      ctx.fillStyle = 'rgba(225,235,245,' + al * (0.5 + 0.5 * Math.sin(t + k)) + ')';
      ctx.beginPath(); ctx.ellipse(sx, sy, 5 + hash(k, 3) * 6, 2, 0, 0, 7); ctx.fill();
    }
  }

  windT += dt * (RM ? 0.15 : 0.6) * (1 + 1.4 * windF());
  const sway = RM ? 0 : (Math.sin(windT) * 0.14 + Math.sin(windT*2.7)*0.05) * (1 + 0.7 * windF());
  const m = maturity();
  const treeR = 4.0 + m * 4.6, treeH = 6 + m * 3.8;
  const sunX = lerp(1.6, -1.6, clamp((hour - 6) / 14, 0, 1)) * daylight;

  if (daylight > 0.05){
    const sp = shSpread();
    ctx.fillStyle = 'rgba(30,42,22,' + (0.22*daylight) * shadowF() + ')';
    const [tsx, tsy] = project(CX + sunX*1.6*shOffset(), CY + 1.2, 0);
    ctx.beginPath(); ctx.ellipse(tsx, tsy, treeR*cellW*0.95*sp, treeR*cellH*0.8*sp, 0, 0, 7); ctx.fill();
  }

  for (const a of agents) if (a.blanket && a.state==='sit'){
    const [bx, by] = project(a.x, a.y + 0.4, 0);
    ctx.fillStyle = '#b0483c';
    ctx.save(); ctx.translate(bx, by); ctx.scale(1, 0.62); ctx.rotate(0.1);
    ctx.fillRect(-cellW*1.6, -cellW*1.2, cellW*3.2, cellW*2.4);
    ctx.strokeStyle = 'rgba(255,240,220,.55)'; ctx.lineWidth=1.5;
    ctx.strokeRect(-cellW*1.25, -cellW*0.85, cellW*2.5, cellW*1.7);
    ctx.restore();
  }

  const items = [];
  crowns.length = 0;                    // refilled by the tree draws below, in paint order
  for (let y=3;y<LN_WALK_S;y++) for (let x=0;x<GW;x++){
    const i=y*GW+x;
    if (bSp[i] && (grid[i]===BED || grid[i]===CBED)) items.push({y:y+0.5, f:drawPlant, x, gy:y, i});
  }
  for (const b of BENCH_SPOTS) items.push({y:b.y+0.2, f:drawBench, b});
  for (const b of LANE_BENCHES) items.push({y:b.y+0.2, f:drawBench, b});
  for (const L of LAMPS) items.push({y:L[1], f:drawLamp, L});
  for (const L of LANE_LAMPS) items.push({y:L[1], f:drawLamp, L});
  // tname is what the naming calls this tree; the four groups are the only kinds there are
  for (const px of TREE_PITS) items.push({y:66.9, f:drawLaneTree, px, pit:1, tname:'a street tree'});
  for (const [ppx, ppy] of PLAZA_PITS) items.push({y:ppy + 0.4, f:drawLaneTree, px:ppx - 0.5, py:ppy + 0.4, pit:1, tname:'a plaza tree'});
  for (const [ox, oy] of ORCHARD) items.push({y:oy + 0.4, f:drawLaneTree, px:ox - 0.5, py:oy + 0.4, fruit:1, tname:'an orchard tree'});
  items.push({y:WILLOW.y + 0.4, f:drawWillow, tname:'the willow on the eyot'});
  for (const b of PLAZA_BENCHES) items.push({y:b.y + 0.2, f:drawBench, b});
  for (const b of QUAY_BENCHES) items.push({y:b.y + 0.2, f:drawBench, b});
  for (const b of FAR_BENCHES) items.push({y:b.y + 0.2, f:drawBench, b});
  items.push({y:FOUNTAIN.y + 1.2, f:drawFountain});
  items.push({y:BANDSTAND.y + 1.6, f:drawBandstand});
  items.push({y:JETTY.y + 1.6, f:drawJetty});
  items.push({y:MILL_WHEEL.y - MILL_WHEEL.r - 0.2, f:drawMillShadow});
  items.push({y:MILL_WHEEL.y + 0.3, f:drawMillWheel});
  // the footbridge is two items: the span and its upstream rail sort BEFORE anyone on
  // it, the downstream rail, piers and shadow AFTER — and the boat, while it is under,
  // is drawn by the span itself so the deck lands on top of the rower
  items.push({y:DECK_Y0 - 0.1, f:drawDeckSpan});
  items.push({y:DECK_Y1 + 0.6, f:drawDeckFront});
  // the cart is two items round the walkers' row: bed, far wheel and the horse's back before,
  // the near wheel, near board and near legs after (#73's rule)
  if (cart){ items.push({y:Math.min(cart.y, cart.y + cart.hy * CART_LEN) - 0.9, f:drawCartBody});
             items.push({y:Math.max(cart.y, cart.y + cart.hy * 2.3) + 0.6, f:drawCartFront}); }
  for (const s of swans) items.push({y:s.y + 0.3, f:drawSwan, s});
  if (boat && (boat.y < 64.5 || boat.y > 79) && !boatUnderDeck()) items.push({y:boat.y + 0.6, f:drawBoat});
  for (const tb of CAFE_TABLES) items.push({y:tb.y + 0.45, f:drawCafeTable, tb});
  if (kioskOpen()) items.push({y:KIOSK.y + 0.8, f:drawKiosk});
  for (let i = 0; i < MARKET_STALLS.length; i++){
    const p = marketRaise(i);                    // 0 well before opening and well after close
    if (p > 0) items.push({y:MARKET_STALLS[i].y + 0.8, f:drawMarketStall, s:MARKET_STALLS[i], p, sh:mkShelfFor(i)});
  }
  const cellAt = (x, y) => grid[clamp(y|0, 0, WH-1) * GW + clamp(x|0, 0, GW-1)];
  for (const a of agents){
    if (cellAt(a.x, a.y) !== TUNNEL)               // inside an archway: hidden under the roof
      items.push({y:a.y + (a.state==='lie'?0.01:0.5), f:drawPerson, a});
    if (a.dog && cellAt(a.dog.x, a.dog.y) !== TUNNEL) items.push({y:a.dog.y+0.4, f:drawDog, d:a.dog});
  }
  for (const b of birds) items.push({y:b.y+0.4, f:drawBird, b});
  for (const d of ducks) items.push({y:d.y+0.3, f:drawDuck, d});
  if (catA) items.push({y:catA.y+0.3, f:drawCat});
  items.push({y:65.1, f:drawSouthBand});
  // between the wall it is cut in (65.1) and the arch beside it (65.3), so the fronts
  // are under it and anyone standing on the footway is in front of it
  items.push({y:65.12, f:drawTapDoor});
  for (const A of ARCHES) items.push({y: A.yF === 3 ? 3.06 : 65.3, f:drawArch, A});
  items.push({y:6.6, f:drawShed});
  items.push({y:CY+0.6, f:drawTree, sway, treeR, treeH, tname:'the linden'});
  items.push({y:SUNDIAL.y + 0.9, f:drawSundial});
  items.sort((p,q)=>p.y-q.y);
  for (const it of items) it.f(it, t);

  drawRiverFlow(t);
  drawMist(t);

  // water sparkle (warm by day, cold moon-glints by night) and rain rings on the pond
  if (rainFall < 1){
    const glow = Math.max(daylight, nightF * 0.5) * (1 - rainFall);
    for (let k = 0; k < 7; k++){
      const gx2 = POND.x + (hash(k, 7) - 0.5) * POND.rx * 1.5;
      const gy2 = POND.y + (hash(k, 13) - 0.5) * POND.ry * 1.5;
      const al = Math.max(0, Math.sin(t * (nightF > 0.5 ? 0.9 : 1.8) + k * 2.1)) * 0.4 * glow;
      if (al < 0.05) continue;
      const [sx, sy] = project(gx2, gy2, 0);
      ctx.strokeStyle = nightF > 0.5
        ? 'rgba(200,220,255,' + al + ')'
        : 'rgba(240,248,240,' + al + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx - 2.5, sy); ctx.lineTo(sx + 2.5, sy); ctx.stroke();
    }
  }
  if (rainFall > 0){
    for (let k = 0; k < 4; k++){
      const ph2 = (t * 1.1 + k * 0.31) % 1;
      const [sx, sy] = project(POND.x + (hash(k, 3) - 0.5) * POND.rx * 1.4,
                               POND.y + (hash(k, 5) - 0.5) * POND.ry * 1.4, 0);
      ctx.strokeStyle = 'rgba(220,232,235,' + (0.35 * (1 - ph2) * rainFall) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(sx, sy, ph2 * 7, ph2 * 3.2, 0, 0, 7); ctx.stroke();
    }
  }
  for (const l of leaves){
    const [sx,sy]=project(l.x,l.y,l.z);
    ctx.fillStyle=l.col; ctx.save(); ctx.translate(sx,sy); ctx.rotate(l.ph);
    ctx.fillRect(-2,-1.2,4,2.4); ctx.restore();
  }
  for (const b of butterflies){
    const [sx,sy]=project(b.x,b.y,b.z);
    const flap = Math.abs(Math.sin(b.ph));
    ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.ellipse(sx-2.2*flap, sy, 2.6*flap, 1.8, -0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx+2.2*flap, sy, 2.6*flap, 1.8, 0.4, 0, 7); ctx.fill();
  }

  // Washing lines over the lane. The rope stays strung all day; it is the GARMENTS that
  // come in, one at a time and each on its own short fade, as the front builds and again
  // at dusk — so the line empties over ~9 s instead of vanishing between two frames.
  // The dusk ramp is local arithmetic on daylight, not a rival predicate: the one
  // predicate for "about to rain" is weatherComing(), and this reads it.
  if (day >= 3 && hash(day, 55) < 0.6 && daylight > 0.06){
    const takenIn = Math.max(weatherComing(), clamp((0.34 - daylight) / 0.19, 0, 1));
    const wcols = ['#c9d5e2', '#b04a3c', '#e8dfc8', '#5d7a8a', '#c2913a', '#e8c0cc'];
    for (const [lx, seed] of [[15, 1], [87, 2]]){
      const p1 = project(lx, 64.8, 4.6), p2 = project(lx, 78.6, 3.4);
      const midx = (p1[0] + p2[0]) / 2, midy = Math.max(p1[1], p2[1]) + 14;
      ctx.strokeStyle = 'rgba(70,62,52,.75)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.quadraticCurveTo(midx, midy, p2[0], p2[1]); ctx.stroke();
      for (let k = 0; k < 5; k++){
        // Each garment's own moment to be unpegged, in a fixed per-day order, plus a
        // ~1.6 s fade so the last of it goes soft rather than blinking out.
        // Both ends of the 0.16..0.82 band are load-bearing:
        //   TOP — rain can start once cover passes 0.66, which is weatherComing() 0.91,
        //   and the predicate then steps to a flat 1. Anything still pegged up in
        //   0.82..1 would come down in that one frame, the exact all-at-once vanish this
        //   is here to remove. The line is always empty before the first drop can land.
        //   BOTTOM — must be >= the 0.14 fade width, or the lowest-hashed garment starts
        //   its fade before takenIn even leaves 0 and hangs at 71% alpha in perfect
        //   weather. It did, for four gate runs, until a probe printed 9.49 of 10.
        const gone = clamp((0.16 + hash(k + seed, day + 7) * 0.66 - takenIn) / 0.14, 0, 1);
        if (gone <= 0) continue;
        const tt = 0.14 + k * 0.18;
        const gx2 = lerp(lerp(p1[0], midx, tt), lerp(midx, p2[0], tt), tt);
        const gy2 = lerp(lerp(p1[1], midy, tt), lerp(midy, p2[1], tt), tt);
        const swg = Math.sin(windT * 2.2 + k * 1.7 + seed) * (1.8 + 3.2 * windF());
        const hv2 = hash(k + seed, day);
        const w2 = cellW * (0.5 + hv2 * 0.45), h2 = cellH * (1.5 + hv2 * 1.6);
        ctx.save();
        ctx.globalAlpha = gone;
        ctx.translate(gx2, gy2);
        ctx.rotate(swg * 0.045);
        ctx.fillStyle = 'rgba(60,52,44,.7)';                      // the peg
        ctx.fillRect(-1, -2, 2, 3.5);
        ctx.fillStyle = wcols[(hv2 * wcols.length) | 0];
        if (hv2 > 0.55){                                          // a shirt, sleeves and all
          ctx.beginPath();
          ctx.moveTo(-w2 * 0.34, 0); ctx.lineTo(w2 * 0.34, 0);
          ctx.lineTo(w2 * 0.5, h2 * 0.3); ctx.lineTo(w2 * 0.3, h2 * 0.34);
          ctx.lineTo(w2 * 0.3, h2); ctx.lineTo(-w2 * 0.3, h2);
          ctx.lineTo(-w2 * 0.3, h2 * 0.34); ctx.lineTo(-w2 * 0.5, h2 * 0.3);
          ctx.closePath(); ctx.fill();
        } else {                                                  // a sheet, sagging a little
          ctx.beginPath();
          ctx.moveTo(-w2 * 0.42, 0); ctx.lineTo(w2 * 0.42, 0);
          ctx.lineTo(w2 * 0.46, h2 * 1.1);
          ctx.quadraticCurveTo(0, h2 * 0.9, -w2 * 0.46, h2 * 1.1);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.14)';
        ctx.fillRect(-w2 * 0.3, 0, w2 * 0.22, h2 * 0.9);
        ctx.restore();
      }
    }
  }

  // live clock hands
  {
    const [ccx, ccy] = project((CT.x0 + CT.x1) / 2, CT.yF, 10.2);
    const rr = cellW * 0.92;
    const hA = (hour % 12) / 12 * Math.PI * 2 - Math.PI / 2;
    const mA = (hour % 1) * Math.PI * 2 - Math.PI / 2;
    ctx.strokeStyle = '#3a3227'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(hA) * rr * 0.5, ccy + Math.sin(hA) * rr * 0.5); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(mA) * rr * 0.78, ccy + Math.sin(mA) * rr * 0.78); ctx.stroke();
  }
  drawVanes();                    // live, like the hands: the towers are cached, the wind is not

  drawSmoke(t);
  applyLight(t);
  drawBalloon(t);                 // the balloon rides above every ground light
  drawFollowMark(t);

  if (raining){
    const sf = snowF();
    ctx.strokeStyle='rgba(200,215,235,.45)'; ctx.lineWidth=1;
    ctx.beginPath();
    const sl = 2.4 * windDir();   // #76: the drawn streak leans the way the drop moves
    for (const r of raindrops){ if (r.f < sf) continue; ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-sl,r.y+11); }
    ctx.stroke();
    if (sf > 0){
      ctx.fillStyle='rgba(240,244,248,.85)'; ctx.beginPath();
      for (const r of raindrops){ if (r.f >= sf) continue; ctx.moveTo(r.x+1.7,r.y); ctx.arc(r.x,r.y,1.7,0,7); }
      ctx.fill();
    }
  }
}
function drawSmoke(t){
  // fires get lit on chilly mornings, damp afternoons and after dark
  const cold = clamp(1 - Math.abs(hour - 7) / 3.5, 0, 1) + rainFall * 0.7 +
               clamp((hour - 18.5) / 2, 0, 1) * 0.8;
  if (cold <= 0.05 || RM) return;
  const drift = (1 + 1.6 * windF()) * windDir();   // calm: exactly 1; a full east wind: -2.6
  for (let k = 0; k < CHIMNEYS.length; k++){
    const [cx, cy] = CHIMNEYS[k];
    if (hash(cx, cy + day * 7) > clamp(cold, 0, 1) * 0.75) continue;
    const z0 = (roofZ(cx, cy) + roofZ(cx + 1, cy + 1)) / 2 + 2.4;
    for (let p = 0; p < 6; p++){
      const ph = ((t * 0.28 + p * 0.166 + hash(cx, p) * 0.4) % 1);
      const rise = ph * 5.2, spread = 0.25 + ph * 1.5;
      const wob = Math.sin(t * 0.9 + p + cx) * 0.35 * ph;
      const [sx, sy] = project(cx + 0.5 + wob + ph * 1.4 * drift, cy + 0.72 - ph * 0.5, z0 + rise);
      ctx.fillStyle = 'rgba(226,224,218,' + (0.30 * (1 - ph) * clamp(cold, 0, 1)) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, cellW * spread * 0.45, 0, 7); ctx.fill();
    }
  }
}
function drawPlant(it, t){
  const i = it.i, s = SPECIES[bSp[i]-1], st = bSt[i];
  const hv = hash(it.x*3, it.gy*7);
  const px = it.x + 0.25 + hv*0.5, py = it.gy + 0.3 + hash(it.x,it.gy*3)*0.4;
  const hgt = s.h * (st/3) * (0.8 + hv*0.4);
  const swx = RM ? 0 : Math.sin(windT*1.8 + px*0.7) * 0.1 * hgt;
  const [bx, by] = project(px, py, 0);
  const [tx2, ty2] = project(px + swx, py, hgt);
  ctx.strokeStyle = st===1 ? '#7da065' : '#4c7440';
  ctx.lineWidth = st===1 ? 1 : 1.6;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx2, ty2); ctx.stroke();
  if (st >= 2){
    ctx.fillStyle = '#4c7440';
    ctx.beginPath(); ctx.ellipse(bx, by - cellH*hgt*0.35, cellW*0.28*(st/3), cellH*0.3*(st/3), 0, 0, 7); ctx.fill();
  }
  if (st === 3){
    if (s.style === 'dot'){
      ctx.fillStyle = hv > 0.5 ? s.col : s.col2;
      ctx.beginPath(); ctx.arc(tx2, ty2, cellW*0.17, 0, 7); ctx.fill();
      if (hv > 0.6){ ctx.beginPath(); ctx.arc(tx2 + cellW*0.24, ty2 + 2, cellW*0.12, 0, 7); ctx.fill(); }
    } else if (s.style === 'spike'){
      ctx.strokeStyle = s.col; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(tx2, ty2 + cellH*0.5); ctx.lineTo(tx2, ty2 - cellH*0.4); ctx.stroke();
      ctx.fillStyle = s.col2; ctx.beginPath(); ctx.arc(tx2, ty2 - cellH*0.35, 1.6, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.ellipse(tx2, ty2, cellW*0.3, cellH*0.42, 0, 0, 7); ctx.fill();
      ctx.fillStyle = s.col2;
      ctx.beginPath(); ctx.arc(tx2 - cellW*0.12, ty2 - 2, 1.8, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx2 + cellW*0.14, ty2 + 1, 1.5, 0, 7); ctx.fill();
    }
  }
}
/* A bare tree has to read as a CROWN, not as an asterisk. The first cut drew each bough
 * as one uniform stroke from a single point and the winter linden looked like a spider.
 * So: a tapered quad with a slight curve, forking two twigs at 62% of its length, which
 * gives the silhouette a thick-to-thin gradient and a ragged edge. Deterministic — no
 * R() — so a bare tree is the same bare tree on every frame. Caller sets fill/stroke. */
function drawBoughs(x0, y0, tips, w){
  for (const [x1, y1] of tips){
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L * w, ny = dx / L * w;
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    ctx.beginPath();
    ctx.moveTo(x0 + nx, y0 + ny);
    ctx.quadraticCurveTo(mx + nx * 0.45, my + ny * 0.45, x1, y1);
    ctx.quadraticCurveTo(mx - nx * 0.45, my - ny * 0.45, x0 - nx, y0 - ny);
    ctx.closePath(); ctx.fill();
    const fx = x0 + dx * 0.62, fy = y0 + dy * 0.62;
    ctx.lineWidth = Math.max(0.7, w * 0.62); ctx.lineCap = 'round';
    for (const a of [0.6, -0.6]){
      const c = Math.cos(a), s = Math.sin(a);
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.lineTo(fx + (dx * c - dy * s) * 0.36, fy + (dx * s + dy * c) * 0.36);
      ctx.stroke();
    }
  }
}
function drawTree(it, t){
  const [bx, by] = project(CX, CY + 0.5, 0);
  const {sway, treeR, treeH} = it;
  const tw = cellW * (0.5 + maturity()*0.35);
  const [tx2, ty2] = project(CX + sway*0.5, CY + 0.5, treeH*0.55);
  ctx.fillStyle = '#5d4433';
  ctx.beginPath();
  ctx.moveTo(bx - tw, by); ctx.quadraticCurveTo(bx - tw*0.5, (by+ty2)/2, tx2 - tw*0.55, ty2);
  ctx.lineTo(tx2 + tw*0.55, ty2); ctx.quadraticCurveTo(bx + tw*0.5, (by+ty2)/2, bx + tw, by);
  ctx.closePath(); ctx.fill();
  const blobs = [[0,0,1],[-0.55,-0.15,0.72],[0.55,-0.1,0.75],[-0.25,-0.45,0.6],[0.3,-0.4,0.62],[0,0.28,0.7]];
  const cols = [[76,122,62],[92,138,74],[84,127,66],[103,149,82],[92,138,74],[69,111,56]];
  // The crown the naming points at: the blobs' own centre, swayed with them, and roughly
  // the extent they reach at full leaf (|ox| 0.55 + the widest blob's own radius ≈ 0.95).
  // Deliberately the FULL-LEAF envelope and not the shrinking blob — a bare winter linden
  // is still a linden you can point at — and deliberately a little inside it, because

const WILLOW_H = 3.1, WILLOW_R = 1.55, WILLOW_LEAN = -0.55, WILLOW_FRONDS = 22;
function drawWillow(it){

    if (pk <= 0) continue;

    ctx.fillStyle = 'rgba(205,228,160,' + 0.18 * daylight * out + ')';
    ctx.beginPath(); ctx.ellipse(hx, hy, r * cellW * 0.3 * out, r * cellH * 0.26 * out, 0, 0, 7); ctx.fill();

    ctx.strokeStyle = 'rgba(40,34,26,.35)'; ctx.lineWidth = 1;

  const shx = -SUN[0] / SUN[2] * h * cellW * 0.55 * shOff;

  const LTH = [0, 0.24, 0.30, 0.50];

    ctx.save();

    ctx.fillStyle = '#573f2f'; ctx.strokeStyle = '#573f2f';

    ctx.fillStyle = 'rgba(198,224,150,' + 0.2 * daylight * out + ')';

        ctx.beginPath(); ctx.arc(fx, fy, Math.max(1.2, cellW * 0.11) * fr, 0, 7); ctx.fill();
      }
    }
  }
}
/* The players stepping up, one at a time, on the same 0..1 the set comes down on.
 * Handed straight to drawPerson(), so a musician is the same figure as a passer-by —
 * the only differences are the platform under them (a.z) and what is in their hands. */
function drawBandPlayers(f, t){
  for (const p of BAND_PLAYERS){
    const a = clamp((f - p.cue) / BAND_FADE, 0, 1);
    if (a <= 0) continue;
    p.x = p.px + (RM ? 0 : Math.sin(t * 2.1 + p.cue * 9) * 0.06);   // playing, not posing
    ctx.save(); ctx.globalAlpha = a; drawPerson({a:p}, t); ctx.restore();
  }

/* Bunting between the front posts — last thing up, so first thing down. */
function drawBandFlags(f, posts){
  const a = clamp((f - BAND_FLAGS) / BAND_FADE, 0, 1);
  if (a <= 0) return;
  const front = posts.filter(p => p[1] >= BANDSTAND.y).sort((p, q) => p[2][0] - q[2][0]);
  ctx.save(); ctx.globalAlpha = a;
  for (let k = 0; k + 1 < front.length; k++){
    const t0 = front[k][3], t1 = front[k + 1][3];
    /* A shallow swag, hard up under the eave. The first cut sagged a whole cell and
       hung straight across the players' chests — there is only about half a cell of
       headroom between a standing figure on the platform and the post tops, so the
       line has to live in what is left of it. */
    const x0 = t0[0], y0 = t0[1] + cellH * 0.05, x1 = t1[0], y1 = t1[1] + cellH * 0.05;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + cellH * 0.45;
    ctx.strokeStyle = 'rgba(201,185,138,.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    for (let j = 1; j <= 2; j++){                   // two a span: at 1x three of the old 3 px flags were a smear
      const u = j / 3, v = 1 - u;
      const fx = v * v * x0 + 2 * v * u * cx + u * u * x1;
      const fy = v * v * y0 + 2 * v * u * cy + u * u * y1;
      const w = Math.max(2.5, cellW * 0.3);           // >= 5 px wide at 1x (HEAD: 3.2)

      // and most of its own width in a gale (same clock as the washing, no R())

function drawBandstand(it, t){

  const bSp = shSpread();
  ctx.fillStyle = 'rgba(24,32,18,' + 0.22 * daylight * shadowF() + ')';
  ctx.beginPath(); ctx.ellipse(bx - SUN[0] / SUN[2] * cellW * 1.4 * shOffset(), by - cellH * 0.6, cellW * R0 * 1.15 * bSp, cellH * R0 * 0.85 * bSp, 0, 0, 7); ctx.fill();
  for (const [rr, zz, col] of [[R0 * 1.16, 0.16, '#9a9184'], [R0 * 1.05, 0.34, '#aaa294'], [R0 * 0.96, 0.5, '#b6ad9d']]){
    const [px2, py2] = project(x, y, zz);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(px2, py2, cellW * rr, cellH * rr * 0.72, 0, 0, 7); ctx.fill();
  }

  const posts = [];
  for (let k = 0; k < 8; k++){
    const th = k / 8 * Math.PI * 2 + 0.39;
    const wx = x + Math.cos(th) * R0 * 0.85, wy = y + Math.sin(th) * R0 * 0.62;

     players are INSIDE this structure — pushed out to the list they would land either
     wholly in front of the near posts (standing on the grass) or wholly behind the far
     ones (standing outside the back). The stand's own centre line is the sort key. */
  const post = p => { ctx.beginPath(); ctx.moveTo(p[2][0], p[2][1]); ctx.lineTo(p[3][0], p[3][1]); ctx.stroke(); };
  ctx.strokeStyle = '#7d6a4e'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
  for (const p of posts) if (p[1] < y) post(p);
  const bf = bandF();
  if (bf > 0) drawBandPlayers(bf, t);
  ctx.strokeStyle = '#7d6a4e'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
  for (const p of posts) if (p[1] >= y) post(p);
  if (bf > 0) drawBandFlags(bf, posts);

  const [rx, ry] = project(x, y, 2.6);
  const [ax2, ay2] = project(x, y, 4.5);

  ctx.moveTo(rx - cellW * R0 * 1.1, ry);
  ctx.quadraticCurveTo(rx - cellW * R0 * 0.5, ay2 + cellH * 0.6, ax2, ay2);
  ctx.quadraticCurveTo(rx + cellW * R0 * 0.5, ay2 + cellH * 0.6, rx + cellW * R0 * 1.1, ry);
  ctx.quadraticCurveTo(rx, ry + cellH * R0 * 0.85, rx - cellW * R0 * 1.1, ry);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(216,224,230,.25)'; ctx.lineWidth = 1;
  for (let k = -2; k <= 2; k++){
    ctx.beginPath(); ctx.moveTo(ax2, ay2);
    ctx.quadraticCurveTo(rx + k * cellW * 0.55, (ay2 + ry) / 2, rx + k * cellW * R0 * 0.5, ry + Math.abs(k) * cellH * 0.5);
    ctx.stroke();
  }
  ctx.strokeStyle = '#c9b98a'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(ax2, ay2); ctx.lineTo(ax2, ay2 - cellH * 1.5); ctx.stroke();
  ctx.fillStyle = '#c9b98a';

      const nx = ax2 + (k - 1) * cellW * 0.7 + Math.sin(u * 4.5 + k * 2.1) * cellW * 0.45;
      const ny = ay2 - cellH * (1.9 + u * 3.6);
      ctx.fillStyle = '#e8e0c8';
      ctx.beginPath(); ctx.ellipse(nx, ny, r2, r2 * 0.78, -0.4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(nx + r2 * 0.85, ny); ctx.lineTo(nx + r2 * 0.85, ny - r2 * 3.2); ctx.stroke();
    }
    ctx.restore();
  }
}
/* ---- the mill wheel: live geometry in the x-z plane facing the viewer, its foot in

function millWheelAt(p){
  const [cx, cy] = wheelPt(0, 0), [ex] = wheelPt(0, MILL_WHEEL.r), [, ty] = wheelPt(Math.PI / 2, MILL_WHEEL.r);

}
function millWheelName(){

function drawSwan(it){
  const s = it.s;

  const up = s.state === 'upend' ? s.hold : 0, pr = s.state === 'preen' ? s.hold : 0;
  ctx.strokeStyle = 'rgba(232,242,240,.32)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y + 2 * sc, 6 * sc, -0.7, 0.7); ctx.stroke();

    ctx.beginPath(); ctx.ellipse(x, y + 0.5 * sc, (5 + 2 * up) * sc, (2 + up) * sc, 0, 0, 7); ctx.stroke();

    ctx.lineTo(x - 2.4 * sc, y - (3.5 + 1.8 * up) * sc);

    ctx.strokeStyle = '#f2f0e8'; ctx.lineWidth = Math.max(1.4, 1.5 * sc);
    ctx.beginPath();
    ctx.moveTo(x + 2.5 * sc, y - 3.4 * sc - bob);
    // preen: the neck folds back over the wing, the bill down on the flank
    const hx = x + (4.6 - 5.4 * pr) * sc, hy = y - (9 - 5.2 * pr) * sc - bob;
    ctx.quadraticCurveTo(x + (6 - 1.5 * pr) * sc, y - (6 + 1.5 * pr) * sc - bob, hx, hy);
    ctx.stroke();

  ctx.strokeStyle = 'rgba(60,56,50,.5)'; ctx.lineWidth = 1;

  ctx.fillStyle = '#9a9184';

/* ============ the river's flow ============ *
 * Drifting streaks that vanish under the bridge — the water's only motion, and until

 * drawn, and how far its colour leans from the anchor. Winter is a lot of long fast

 * draw — this is hash() and the clock, so the seeded world is untouched by it. */
/* The mist's veil (#88): LIVE, never in the ground cache (it changes every frame), drawn
 * after the items and the streaks so the towpath walkers, the swans and the willow are
 * IN it, and before applyLight so the night multiply stays the last thing to touch a
 * colour. Two passes into one low-res offscreen: a horizontal gradient carries the weight
 * out from the water (mistAt's shape, built at the polygon's mid row — the pinch moves
 * the banks under 2 cells over the run), then a `destination-out` fade takes the far end
 * off so the church tower and the clock tower stand out of it at the top of the frame.

function drawMist(t){

  const c = cparse(mistCol()), rgb = c[0] + ',' + c[1] + ',' + c[2];
  const breathe = RM ? 0 : Math.sin(t * 0.21) * 0.8;                     // the bank breathes a cell in and out
  const x0 = RIVER_X0 - MIST_REACH - breathe, x1 = RIVER_X1 + MIST_REACH + breathe;
  const yTop = 0, yLane = LN_WALK_N;
  const L = project(x0, yLane, 0)[0], Rr = project(x1, yTop, 0)[0], T = project(0, yTop, 0)[1], B = project(0, yLane, 0)[1];
  const w = Math.ceil((Rr - L) * MIST_RES * DPR) + 2, h = Math.ceil((B - T) * MIST_RES * DPR) + 2;
  if (mcv.width !== w || mcv.height !== h){ mcv.width = w; mcv.height = h; }
  mtx.setTransform(MIST_RES * DPR, 0, 0, MIST_RES * DPR, -L * MIST_RES * DPR + 1, -T * MIST_RES * DPR + 1);
  mtx.globalCompositeOperation = 'source-over';

    const ym = (ya + yb) / 2, a = MIST_A * mf * lit * k;
    const g = mtx.createLinearGradient(project(x0, ym, 0)[0], 0, project(x1, ym, 0)[0], 0);
    const f0 = (RIVER_X0 - x0) / (x1 - x0), f1 = (RIVER_X1 - x0) / (x1 - x0);
    g.addColorStop(0, 'rgba(' + rgb + ',0)'); g.addColorStop(f0, 'rgba(' + rgb + ',' + a.toFixed(3) + ')');
    g.addColorStop(f1, 'rgba(' + rgb + ',' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
    mtx.fillStyle = g;
    poly(mtx, [project(x0, ya, 0), project(x1, ya, 0), project(x1, yb, 0), project(x0, yb, 0)]); mtx.fill();
  };

  // thing lying on the water and not a tint. hash() and the clock only; still under RM
  { const a = MIST_A * mf * lit * 0.55, drift = RM ? 0 : t * 0.16;
    for (let k = 0; k < 6; k++){
      const wy = 6 + ((hash(k, 151) * 56 + drift * (0.6 + hash(k, 153) * 0.8)) % 56);
      const wx = RIVER_X0 - 2 + hash(k, 157) * (RIVER_X1 - RIVER_X0 + 6);
      const [sx, sy] = project(wx, wy, 0), rx = cellW * (5 + hash(k, 159) * 5), ry = cellH * (1.4 + hash(k, 161) * 1.2);
      const g = mtx.createRadialGradient(sx, sy, 0, sx, sy, rx);
      g.addColorStop(0, 'rgba(' + rgb + ',' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
      mtx.fillStyle = g;
      mtx.save(); mtx.translate(sx, sy); mtx.scale(1, ry / rx); mtx.translate(-sx, -sy);
      mtx.beginPath(); mtx.arc(sx, sy, rx, 0, 7); mtx.fill(); mtx.restore();
    } }

  // tower's foot is row 8, its top stands at row -3.5 in screen depth)
  const gv = mtx.createLinearGradient(0, project(0, 1.5, 0)[1], 0, project(0, 13, 0)[1]);
  gv.addColorStop(0, 'rgba(0,0,0,1)'); gv.addColorStop(1, 'rgba(0,0,0,0)');

/* ---- the sundial ------------------------------------------------------------------
 * The town runs on the sun (sunVec(), sunArc) and nothing in the courtyard read the hour
 * until now. A low stone plinth on the inner lawn south of the linden — one DIAL cell, so
 * a companion never stands on it, and the ground cache paints lawn under it — with a gnomon
 * whose shadow is cast EVERY FRAME from the same vector every roof shadow takes: west at
 * sunrise, north at noon, east by evening; long at a winter noon, short at a summer one;
 * and it fades, widens and pulls in under a grey lid at exactly shadowF()/shSpread()/
 * shOffset(), like the eight shadows before it. Never in the cache: it moves as the sun
 * does. No R(). The clock over the lane keeps SOLAR_NOON at 12.75, so the dial reads
 * three quarters of an hour behind it — the courtyard's older, slower clock. */

function dialThrow(h){                // where a point h above the dial's foot lands on the ground, in cells

}
function sundialName(){

  if (shadowF() < 0.5) return 'the sundial, no shadow to read under this sky';

function drawSundial(){

  const bob = Math.abs(Math.sin(d.phase)) * 1;
  ctx.fillStyle = 'rgba(20,25,15,.25)';
  ctx.beginPath(); ctx.ellipse(x, y, 4, 1.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = d.col;
  ctx.beginPath(); ctx.ellipse(x, y - 3.5 - bob, 4.4, 2.6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4, y - 5 - bob, 2.1, 0, 7); ctx.fill();
  ctx.strokeStyle = d.col; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(x - 4, y - 4.5 - bob); ctx.lineTo(x - 6.5, y - 7 - bob); ctx.stroke();
}
function drawBird(it){
  const b = it.b;
  const [x, y] = project(b.x, b.y, b.z);
  ctx.fillStyle = b.col;
  if (b.state === 'hop' || (b.state === 'land' && b.z < 1)){
    ctx.beginPath(); ctx.ellipse(x, y - 2, 2.6, 1.8, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 2, y - 3.6, 1.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#c9903a'; ctx.fillRect(x + 3, y - 3.8, 1.6, 0.8);
  } else {
    const f = Math.sin(b.ph2 != null ? b.ph2 : b.z * 3), s = b.sz || 1;
    ctx.beginPath(); ctx.moveTo(x - 4*s, y - 2 - f*2*s); ctx.quadraticCurveTo(x, y, x + 4*s, y - 2 - f*2*s);
    ctx.quadraticCurveTo(x, y + 1, x - 4*s, y - 2 - f*2*s); ctx.fill();
  }
}
function drawCat(){
  const [x, y] = project(catA.x, catA.y, 0);
  ctx.fillStyle = '#26221e';
  ctx.beginPath(); ctx.ellipse(x, y - 2.5, 3.6, 2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 3, y - 4.4, 1.5, 0, 7); ctx.fill();
  poly(ctx, [[x + 2.2, y - 5.4], [x + 2.9, y - 7], [x + 3.5, y - 5.5]]); ctx.fill();
  poly(ctx, [[x + 3.1, y - 5.4], [x + 3.8, y - 6.8], [x + 4.3, y - 5.4]]); ctx.fill();
  ctx.strokeStyle = '#26221e'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - 3.4, y - 2.5); ctx.quadraticCurveTo(x - 6, y - 5.5, x - 4.5, y - 7); ctx.stroke();
}

/* ============ lighting ============ */
function applyLight(t){
  const dusk = clamp(1 - Math.abs(hour - 19) / 1.8, 0, 1) + clamp(1 - Math.abs(hour - 6.4) / 1.6, 0, 1);
  if (dusk > 0){
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = 'rgba(255,140,70,' + (0.55 * dusk) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (nightF > 0.02){
    ctx.globalCompositeOperation = 'multiply';
    const a = 0.8 * nightF;
    ctx.fillStyle = 'rgba(' + (44 - 16*nightF|0) + ',' + (56 - 12*nightF|0) + ',' + (112) + ',' + a + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    for (const L of LAMPS.concat(LANE_LAMPS)){
      const [x, y] = project(L[0], L[1], 2.6);
      const hr = cellW * 2.4 * (1 + 0.7 * mistAt(L[0]));           // a halo widens in the mist (#88); exactly 2.4 out of it
      const g = ctx.createRadialGradient(x, y, 1, x, y, hr);
      g.addColorStop(0, 'rgba(255,196,104,' + 0.42 * nightF + ')');
      g.addColorStop(0.45, 'rgba(255,190,100,' + 0.13 * nightF + ')');
      g.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, hr, 0, 7); ctx.fill();
      // and the pool it throws on the ground below
      const [px, py] = project(L[0], L[1] + 0.6, 0);
      const gp = ctx.createRadialGradient(px, py, 1, px, py, cellW * 3);
      gp.addColorStop(0, 'rgba(255,190,110,' + 0.20 * nightF + ')');
      gp.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = gp;
      ctx.save(); ctx.translate(px, py); ctx.scale(1, 0.5); ctx.translate(-px, -py);
      ctx.beginPath(); ctx.arc(px, py, cellW * 3, 0, 7); ctx.fill();
      ctx.restore();
    }
    drawRiverLights(simT);
    drawWetLights();
    // the warmth back into the glass: the multiply above turned every lit pane the
    // same grey as the wall (R - B was -5 at midnight); a screen fill of the pane's own
    // quad restores it, and lights whoever stands in front of it, which is right
    {
      const al = 0.7 * nightF;
      ctx.fillStyle = 'rgba(255,190,90,' + al.toFixed(3) + ')';
      for (const q of LIT_PANES){ poly(ctx, q); ctx.fill(); }
    }
    // the rose window, live: the lit glass over the cached unlit disc, the night multiply
    // put back on it (so at full night it is what the cached copy was), then the same
    // screen as the panes — one ramp (roseLit) for glass and glow, no step at cache time
    {
      const k = roseLit();
      if (k > 0){
        const mx = (CHURCH.nx0 + CHURCH.nx1) / 2, [rx, ry] = project(mx, CHURCH.ny1, 5.4), rr = cellW * 0.74;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(255,206,140,' + (0.9 * k).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(240,234,218,' + (0.7 * k).toFixed(3) + ')'; ctx.lineWidth = 1;   // the mullions, over the glass
        for (let j = 0; j < 6; j++){
          const th = j / 6 * Math.PI, cx = Math.cos(th) * rr, cy = Math.sin(th) * rr;
          ctx.beginPath(); ctx.moveTo(rx - cx, ry - cy); ctx.lineTo(rx + cx, ry + cy); ctx.stroke();
        }
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = 'rgba(' + (44 - 16*nightF|0) + ',' + (56 - 12*nightF|0) + ',112,' + (0.8 * nightF * k).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 7); ctx.fill();
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = 'rgba(255,180,110,' + (0.7 * nightF * k).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 7); ctx.fill();
        LIT.push([rx, ry]);
      }
    }
    if (BOAT_LAMP){
      // the lantern's warmth back over the multiply, and a halo a little brighter and
      // tighter than a window's: a flame in the open, not a pane
      const lf = boatLampF(), [bx, by] = BOAT_LAMP;
      ctx.fillStyle = 'rgba(255,214,140,' + (0.8 * lf).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(bx, by, cellW * 0.18, 0, 7); ctx.fill();
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, cellW * 1.1);
      g.addColorStop(0, 'rgba(255,205,130,' + (0.38 * lf).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,205,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, cellW * 1.1, 0, 7); ctx.fill();
    }
    // every lit window casts a little halo onto the night
    for (const [wx, wy] of LIT){
      const g = ctx.createRadialGradient(wx, wy, 0, wx, wy, cellW * 0.9);
      g.addColorStop(0, 'rgba(255,205,130,' + 0.26 * nightF + ')');
      g.addColorStop(1, 'rgba(255,205,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(wx, wy, cellW * 0.9, 0, 7); ctx.fill();
    }
    // the clock face stays lit
    {
      const [ccx, ccy] = project((CT.x0 + CT.x1) / 2, CT.yF, 10.2);
      const g = ctx.createRadialGradient(ccx, ccy, 1, ccx, ccy, cellW * 2.2);
      g.addColorStop(0, 'rgba(255,230,170,' + 0.5 * nightF + ')');
      g.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ccx, ccy, cellW * 2.2, 0, 7); ctx.fill();
    }
    // warm spill from our shopfronts, pooled on the footway
    for (const ax of [10, 26, 47, 70, 87, 134]){
      const [x, y] = project(ax, LN_WALK_S - 1.3, 0);
      const g = ctx.createRadialGradient(x, y, 2, x, y, cellW * 3.4);
      g.addColorStop(0, 'rgba(255,190,120,' + 0.16*nightF + ')');
      g.addColorStop(1, 'rgba(255,190,120,0)');
      ctx.fillStyle = g;
      ctx.save();
      ctx.translate(x, y); ctx.scale(1, 0.55); ctx.translate(-x, -y);
      ctx.beginPath(); ctx.arc(x, y, cellW * 3.4, 0, 7); ctx.fill();
      ctx.restore();
    }
    // and the one door on the north side that is still open. Up here with the lamps
    // rather than in drawTapDoor(), because a halo belongs OVER the people under it.
    // and the one door on the north side that is still open. Two radii, not one: the
    // wide one is the halo, and the tight one puts the warmth BACK into the opening,
    // which the multiply above has otherwise turned the same slate blue as the wall.
    if (tapF() > 0){
      const tf = tapF();
      const [x, y] = project(TAP_DOOR + 0.5, TAP_FACE, 1.05);
      for (const [r, al] of [[3.1, 0.30], [1.0, 0.60]]){
        const g = ctx.createRadialGradient(x, y, 1, x, y, cellW * r);
        g.addColorStop(0, 'rgba(255,192,108,' + (al * tf * nightF) + ')');
        g.addColorStop(1, 'rgba(255,192,108,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, cellW * r, 0, 7); ctx.fill();
      }
    }
    for (const f of fireflies){
      const glow = 0.3 + 0.7 * Math.abs(Math.sin(f.ph));
      const [x, y] = project(f.x, f.y, f.z);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 5);
      g.addColorStop(0, 'rgba(220,255,140,' + 0.9*glow*nightF + ')');
      g.addColorStop(1, 'rgba(220,255,140,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (rainFall > 0){
    const sf = snowF();   // a snow sky is paler than a rain sky
    ctx.fillStyle = 'rgba(' + (lerp(90,150,sf)|0) + ',' + (lerp(105,158,sf)|0) + ',' + (lerp(125,170,sf)|0) + ',' + (0.16 * rainFall) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============ interaction ============ */
/* Seven kinds of cell answer a touch, and for most of this town's life nothing on
 * screen said so. The two hints below are the whole of the advertisement, and both
 * are meant to be missable: the cursor, which costs no pixels and only speaks while
 * a hand is already on the picture, and ONE line on the ticker, once, ever.
 *
 * ONE predicate decides which cells answer. The cursor reads it on every mouse move
 * and the click handler guards on it, so the hint can never promise a response the
 * click does not give, or stay silent over one it does.
 *
 * PATH was the hole in it. PATH is not a lesser surface — it is the courtyard's own
 * paving and the whole of the plaza, 2,626 cells against SIDE and ROAD's 2,903 — so
 * leaving it out made the two places the eye goes to FIRST, the roundel round the
 * fountain and the court itself, the two places that would not answer. SLOT stays
 * out on purpose: it is drawn like paving but it is a cut THROUGH a building seen
 * edge-on, 52 cells of doorway, and nobody scatters crumbs in a doorway. */
function answersTouch(x, y){
  if (x < 0 || y < 0 || x >= GW || y >= WH) return false;
  const g = grid[y * GW + x];
  return g === BED || g === CBED || g === GRASS || g === WATER ||
         g === SIDE || g === ROAD || g === PATH;
}
/* SIDE, ROAD and PATH are the paving of the WHOLE town — the courtyard's flags,
 * the lane, the cross street, the plaza and its mouth, the quay, the bridge deck,
 * the towpath on the far bank — so the branch that answers a click on paving has
 * to know WHICH paving. ONE table: each place carries the line it answers with AND
 * the box its crumbs' birds may land in, so the words and the birds can never
 * disagree about where you pointed.
 *
 * The spread is per place because the shapes differ: the lane and the bridge run
 * east-west and are wide, the quay and the towpath are two- and three-cell strips
 * running north-south. The LONGER of the two is the axis the scatter staggers
 * along, and it is never under 3 cells, because three birds inside 3 cells is
 * where they stop reading as three (see crumbSpot).
 *
 * The plaza is TWO boxes and one line, not one box: the square and the mouth it
 * opens onto the lane are the same place to a visitor, but the four rows between
 * them are the terrace's end wall, and a single bounding box over both would land
 * birds on a roof. A place is one set of WORDS; a box is one piece of GROUND.
 *
 * `keep` is the fountain, the only thing standing in the MIDDLE of a place rather
 * than at its edge: the basin is the one obstacle a scatter can be centred beside
 * and still straddle, and a bird that comes down in it sorts behind the basin and
 * reads as a bird swallowed by the stonework. It moves the CENTRE clear — never
 * the individual birds, which is the clamp that collapses a stagger into a heap.
 *
 * It is a RECTANGLE, not a radius, because the thing being avoided is whole CELLS
 * of water and the shove has to clear the corners: a circle wide enough to cover
 * them on the diagonal is ~2.9 cells of shove on the axes, where the rectangle's
 * minimum-translation push is 0.5. */
const PLAZA_WORDS = 'You scatter crumbs onto the plaza. Pigeons are on them before you straighten up.';
/* The basin as the grid actually CUT it, not as the ellipse describes it. Recomputing
 * buildGrid()'s own test here gets the boundary row wrong: (28.5-30)*1.2 evaluates to
 * 1.7999999999999998, so the row that reads as the rim of the basin is water, and a
 * footprint derived a second time is a footprint that disagrees with itself. */
function waterBox(x0, x1, y0, y1){
  let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++)
    if (grid[y * GW + x] === WATER){
      a = Math.min(a, x); b = Math.max(b, x + 1); c = Math.min(c, y); d = Math.max(d, y + 1);
    }
  return {x0:a, x1:b, y0:c, y1:d};
}
/* `what` is the same place as a NOUN, for the naming: the words a click answers with and
 * the words a pointer is told it is over come out of one entry, so the two can no more
 * disagree about where you are than the words and the birds can. */
const PAVING = {
  court:   {x0:3,        x1:61,       y0:3,         y1:61,        sx:3,   sy:2,
            what:'the courtyard flags',
            line:'You scatter crumbs on the courtyard flags. Sparrows come down off the wall.'},
  lane:    {x0:0,        x1:GW,       y0:LN_WALK_N, y1:LN_WALK_S, sx:3,   sy:2,
            what:'the lane',
            line:'You scatter crumbs onto the lane. Small eyes take notice.'},
  bridge:  {x0:RIVER_X0, x1:RIVER_X1, y0:LN_WALK_N, y1:LN_WALK_S, sx:3,   sy:2,
            what:'the bridge deck',
            line:'You scatter crumbs on the bridge. Birds drop in off the parapet.'},
  cross:   {x0:XS_W0,    x1:XS_E1,    y0:0,         y1:LN_WALK_N, sx:2.2, sy:3,
            what:'the cross street',
            line:'You scatter crumbs along the cross street. Small eyes take notice from the kerb.'},
  plaza:   {x0:PLAZA_X0, x1:PLAZA_X1, y0:3,         y1:61,        sx:3,   sy:2,
            keep:waterBox(PLAZA_X0, PLAZA_X1, 3, 61),
            what:'the plaza', line:PLAZA_WORDS},
  mouth:   {x0:102,      x1:108,      y0:61,        y1:LN_WALK_N, sx:3,   sy:2,
            what:'the plaza mouth', line:PLAZA_WORDS},
  quay:    {x0:QUAY_X0,  x1:RIVER_X0, y0:0,         y1:LN_WALK_N, sx:1.2, sy:4,
            what:'the quay',
            line:'You scatter crumbs along the quay, a step from the water. Small eyes take notice.'},
  towpath: {x0:TOW_X0,   x1:FAR_X0,   y0:3,         y1:LN_WALK_N, sx:1.8, sy:4,
            what:'the towpath',
            line:'You scatter crumbs on the towpath. Birds come over the water for it.'},
};
/* The three waters, the same way round: this town has one pond, one fountain and one
 * river, and they are separated by nothing but x. The click branch used to carry these
 * three lines inline and the naming would have needed the same three-way test a second
 * time — so they are a table, first match wins, west to east. */
const WATERS = [
  {x0:RIVER_X0, what:'the river',
   line:'You drop a pebble into the river; the rings are gone in a moment.'},
  {x0:PLAZA_X0, what:'the fountain',
   line:'A coin plinks into the fountain. You make a wish.'},
  {x0:0,        what:'the pond', ducks:1,
   line:'You toss crumbs into the pond. The ducks arrive like a small navy.'},
];
function waterAt(x){ return WATERS.find(w => x >= w.x0); }
/* Called only on a cell answersTouch() has already called SIDE, ROAD or PATH; every
 * such cell falls in exactly one of these boxes. PATH is only ever the courtyard or
 * the plaza square, and the two are separated by half the world. Below that, south
 * of LN_WALK_N the paving is the lane, all the way across, except where it is
 * carried over the river. */
function pavingAt(x, y){
  if (grid[y * GW + x] === PATH) return x >= PLAZA_X0 ? PAVING.plaza : PAVING.court;
  if (y >= LN_WALK_N) return (x >= RIVER_X0 && x < RIVER_X1) ? PAVING.bridge : PAVING.lane;
  if (x >= TOW_X0)   return PAVING.towpath;
  if (x >= QUAY_X0)  return PAVING.quay;
  if (x >= PLAZA_X0) return PAVING.mouth;
  return PAVING.cross;
}
/* Where the k-th of three birds comes down on a handful of crumbs. Sampling all
 * three independently in one small box lands two of them on top of each other
 * about half the time, and under ~0.9 cells apart they draw as one shape — so
 * they are STAGGERED at fixed thirds of the long axis and only jittered within a
 * twelfth of it, which floors the gap at s/3. The scatter is fitted into the
 * place by moving its CENTRE, never by clamping each bird: clamping them one at
 * a time is exactly what collapses the stagger back into a heap at the far end
 * of a two-cell quay. */
function fitIn(c, lo, hi, span){
  const a = lo + span / 2 + 0.4, b = hi - span / 2 - 0.4;
  return a > b ? (lo + hi) / 2 : clamp(c, a, b);
}
function crumbSpot(p, x, y, k){
  const along = p.sy > p.sx;                        // a north-south strip runs down itself
  const s = along ? p.sy : p.sx, w = along ? p.sx : p.sy;
  let cx = fitIn(x + 0.5, p.x0, p.x1, along ? w : s);
  let cy = fitIn(y + 0.5, p.y0, p.y1, along ? s : w);
  if (p.keep){
    /* the forbidden GROUND, grown by the scatter's own reach — s/2 + s/12 along
     * the stagger, w/2 across it — so the whole spread clears it, not just the
     * centre. Grown from sx/sy rather than typed: widen the spread and the shove
     * widens with it. Then the shortest push out of the box that is left. */
    const rx = (along ? w / 2 : s * 7 / 12) + 0.02, ry = (along ? s * 7 / 12 : w / 2) + 0.02;
    const l = p.keep.x0 - rx, r = p.keep.x1 + rx, u = p.keep.y0 - ry, d = p.keep.y1 + ry;
    if (cx > l && cx < r && cy > u && cy < d){
      const m = Math.min(cx - l, r - cx, cy - u, d - cy);
      if (m === cx - l) cx = l; else if (m === r - cx) cx = r;
      else if (m === cy - u) cy = u; else cy = d;
    }
  }
  const u = (k - 1) * s / 2 + (R() - 0.5) * s / 6;  // -s/2, 0, +s/2, each ±s/12
  const v = (R() - 0.5) * w;
  return along ? [cx + v, cy + u] : [cx + u, cy + v];
}
/* Screen point → cell, in two halves, because the naming needs the SCREEN point too:
 * a tree's crown is nowhere near the cell its trunk stands in. One rect read per event. */
function evPx(ev){
  const r = cv.getBoundingClientRect();
  return [ev.clientX - r.left, ev.clientY - r.top];
}
function cellOf(p){
  const [wx, wy] = unproject(p[0], p[1]);
  return [Math.floor(wx), Math.floor(wy)];
}
function cellAt(ev){ return cellOf(evPx(ev)); }
/* Only the transitions touch the DOM: mousemove fires at pointer rate, and setting
 * cv.style.cursor on every one of them is a style write per event for no change. The
 * naming is the same economy one step further — the event only RECORDS the pointer, and
 * updateNaming reads it once a frame. */
let hoverLive = false, hoverPx = null;
cv.addEventListener('mousemove', ev => {
  hoverPx = evPx(ev);
  const [x, y] = cellOf(hoverPx);
  const live = answersTouch(x, y);
  if (live !== hoverLive){ hoverLive = live; cv.style.cursor = live ? 'pointer' : 'default'; }
});
cv.addEventListener('mouseleave', () => {
  hoverLive = false; hoverPx = null; cv.style.cursor = 'default';
});

cv.addEventListener('click', ev => {
  const [x, y] = cellAt(ev);
  /* A tap on a PERSON follows them (see the following, below) and does nothing else:
   * following reads, it never writes, so no crumbs land under the feet of whoever was
   * tapped. A tap anywhere else releases whoever was being followed first, then goes
   * on to do what it always did. */
  { livingAt(evPx(ev)); const who = livingHit;
    if (who){ touched = true; followPerson(who === followed ? null : who); return; }
    if (followed) followPerson(null); }
  if (!answersTouch(x, y)) return;
  touched = true;              // they found it themselves; the invitation stands down
  const j = y * GW + x;
  if (grid[j] === BED || grid[j] === CBED){
    let n = 0;
    const sp = SPECIES.indexOf(pick(speciesFor(x, y))) + 1;
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
      const k = (y+dy)*GW + (x+dx);
      if (k>=0 && k<GW*WH && (grid[k]===BED||grid[k]===CBED) && !bSp[k] && R()<0.7){ bSp[k]=sp; bSt[k]=1; bAge[k]=0; n++; }
    }
    if (n){ announce('You scatter a handful of ' + SPECIES[sp-1].name + ' seeds from the window.'); groundDirty = true; }
  } else if (grid[j] === GRASS){
    daisy[j] = 2; groundDirty = true;
    announce('You flick a daisy seed down onto the lawn.');
  } else if (grid[j] === WATER){
    const w = waterAt(x);
    announce(w.line);
    if (w.ducks) for (const d of ducks){ d.tx = x + 0.5; d.ty = y + 0.5; d.t = 4; }
  } else if (grid[j] === SIDE || grid[j] === ROAD || grid[j] === PATH){
    const p = pavingAt(x, y);
    announce(p.line);
    if (birds.length < 4 && daylight > 0.2){
      for (let k = 0; k < 3; k++){
        const [bx, by] = crumbSpot(p, x, y, k);

      const answered = (hInt === 9 || hInt === 18) && day >= 2;
      announce('The clock over the lane strikes ' + HOUR_WORDS[hInt % 12] + '.',

 * tops out at 8x. Every seasonal term in this file is written for a viewer who would
 * have to sit at this window for twenty-four minutes to see it. So the season's NAME
 * in the sill is also the control: click it and the town runs on to the next quarter.

 * It is a FAST-FORWARD, not a jump. Nothing here writes seasonPhase, cloud, bSt, or a
 * walker's position — it only hands simStep() more seconds per frame, sub-stepped so
 * no single step is longer than SKIP_SUB. That is the whole safety argument, and it
 * is why six hysteretic systems can be crossed at once without a pop: every rate cap
 * in this town is per SIM second (cover at 0.02/s, the CA's 0.35 s tick, the spawn
 * accumulator's 1 s roll, a boat's trip, a garment's threshold), so a sub-stepped
 * advance is indistinguishable from having waited. What is compressed is REAL time.
 * Sub-stepping is not cosmetic either: spawnAcc resets to 0 when it fires, so one
 * enormous step would silently drop six days of arrivals.
 *
 * Three consequences worth stating:
 *   · It lands on a WHOLE number of sim days, the nearest to a quarter-turn, so the
 *     hour you left at is the hour you arrive at — winter at noon, not winter at
 *     midnight. From the anchor those days are 7+6+7+6 = 26 = SEASON_LEN exactly, so
 *     four clicks return the town to the identical phase AND the identical hour.
 *   · The rate is a flat-topped trapezoid with smoothstep shoulders, advanced off the
 *     EXACT integral of that profile — so the span delivered is right whatever frame
 *     rate the machine gives, and both ends have zero slope, so the lapse eases out of
 *     the ordinary clock and back into it instead of cutting. Flat-topped rather than
 *     a cosine bump because the peak rate is how fast day and night alternate on
 *     screen, and 1/(1-s) of the mean is a great deal kinder than 2x.
 *   · Under prefers-reduced-motion a time-lapse of six sunrises is precisely the thing
 *     being asked for less of, so RM gets the honest cut: a veil, the same sub-stepped
 *     advance delivered behind it, the veil away.
 * `speed` is never touched, and no click reaches a driven page, so nothing leaks:
 * ?fast, __warp, the census and every gate see exactly the town they saw before. */
const SKIP_SUB = 0.25;      // sim seconds — the longest step the lapse is allowed to take
const SKIP_RATE = 1.0;      // sim DAYS per real second, mean across the lapse. This is
                            // also how fast day alternates with night on screen, so the
                            // peak of the profile (1/(1-s) of it) is the number that has
                            // to stay well under the 3 Hz photosensitive flash threshold.
const SKIP_SHOULDER = 0.2;  // the fraction of it spent easing in, and again easing out

function skipEase(u){
  const s = SKIP_SHOULDER, P = 1 / (1 - s);
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  if (u < s){ const v = u / s; return P * s * (v*v*v - v*v*v*v / 2); }
  if (u > 1 - s){ const v = (1 - u) / s; return 1 - P * s * (v*v*v - v*v*v*v / 2); }
  return P * (s * 0.5 + (u - s));

function skipDays(){

 * it reaches an hour past sundown — the door is open, the lamps are lit, the homers

 * runs, and 0 when one is not. The lapse owns the clock for its few seconds: the base
 * is 1x whatever the speed button says, and Pause does not apply, because a deliberate
 * act is not the town running on its own. That ownership is also what makes the span
 * exact — the first version left `dt * speed` riding on top of the profile and every
 * lapse overshot by its own duration, which is small (0.095 of a day) and compounds
 * into a year that no longer closes. */

  // are exact integrals, so the total delivered is skipSpan to the last decimal
  // however many frames the machine happens to give us.
  const out = (u1 - u0) * skipSecs + (skipSpan - skipSecs) * (skipEase(u1) - skipEase(u0));
  if (u1 >= 1){ skipSpan = 0; skipAt = 0; skipLanded = true; }
  return out;

/* The town says where it has got to, once, after the last stepped frame — announce()
 * is deaf for the duration of a lapse, or six sim days of clock strikes, markets and
 * wind would arrive as a stack of stale news the moment it ended. */
function land(){

function frame(ts){

  if (paused) dt = 0;

  const extra = stepSkip(rdt);

  // gate and no ?fast page can tell this feature exists. Only a lapse sub-steps.
  if (lapse) simSub(sdt, rdt); else simStep(sdt, dt);

/* ============ test hooks (grow-courtyard) ============

window.__follow = function(){

  return { id: followed ? 'walker' + followed.__id : null, line: namingEl.textContent, want: followLine(performance.now() / 1000),
           mark: p ? { x: p[0], y: p[1] + cellH * 0.12, rx: cellW * 0.6, ry: cellH * 0.3 } : null, ended: followEnd };
};
window.__setTime = function(t){ simT = t; updateClock(); return { simT, day, hour }; };
// the camera: go to quarter n (0 = wide), step the ease by real seconds, read it back
window.__where = function(n, secs){ if (n !== undefined) whereGo(n); if (secs) stepView(secs);
  return { n: whereN, s: viewS, cellW, originX, topPad, easing: viewEasing(), gview: { ...gview } }; };

/* Every moving thing, with a stable identity — the seam the motion gate reads.
 * A screenshot cannot see a teleport, a pop-in or a thing that flickers between
 * two positions; a position series can. Ids are stamped lazily here so the
 * simulation itself carries no extra bookkeeping. */
let __eid = 0;
window.__entities = function(){
  const out = [];
  const take = (arr, kind, extra) => { for (const e of arr){ if (e.__id === undefined) e.__id = ++__eid;
    const o = { id: kind + e.__id, kind, x: e.x, y: e.y, z: e.z === undefined ? 0 : e.z };
    if (extra) extra(o, e);
    out.push(o); } };
  // people carry what they are doing as well as where they are: `act` is the state
  // machine's own label and `watch` is set while they are following the boat, so a
  // probe can measure behaviour without a bespoke hook per feature
  take(agents.filter(a => a.kind !== 'sweeper'), 'walker',
       (o, a) => { o.act = a.state; o.role = a.kind; o.watch = a.watch > 0 ? 1 : 0;
                   if (a.tap){ o.tap = 1; if (a.caller) o.caller = 1; }
                   if (a.home) o.home = 1;
                   if (a.homer) o.homer = 1;
                   if (a.dusk) o.dusk = 1;
                   if (a.stay) o.stay = 1;
                   if (a.fromBand) o.fromBand = 1;
                   if (a === followed) o.followed = 1;
                   if (a.with) o.with = 'walker' + a.with.__id;
                   if (a.pairLead) o.lead = 1;
                   if (a.dig) o.dig = 1;
                   // the audience on the green. A probe has to tell a listener from a
                   // passer-by, and a listener standing AT its claimed place from one
                   // that drifted off it — which is the exact inverse of cue c49's bug.
                   if (a.band){ o.band = 1;
                     o.slotD = +Math.hypot(a.x - a.slot.x, a.y - a.slot.y).toFixed(2); } });
  take(agents.filter(a => a.kind === 'sweeper'), 'sweeper',
       (o, a) => { o.act = a.state; if (a.tap){ o.tap = 1; if (a.caller) o.caller = 1; } });
  take(ducks, 'duck'); take(swans, 'swan', (o, s) => { o.act = s.state; });
  take(butterflies, 'butterfly'); take(fireflies, 'firefly');
  take(birds, 'bird'); take(leaves, 'leaf');
  if (balloon) take([balloon], 'balloon');
  if (boat) take([boat], 'boat');
  if (cart) take([cart], 'cart', (o, c) => { o.act = c.state; o.at = c.at; o.load = c.load; o.sacks = c.sacks ? 1 : 0; o.hx = +c.hx.toFixed(2); o.hy = +c.hy.toFixed(2); });

   * canvas pixels, so motion.mjs must exempt this kind from the world-bounds test or
   * every drop reads as out of bounds. Until #21 the gate could only watch the shower
   * as a count, which cannot see a drop that stops falling or drifts to NaN. Drops are

   * legitimate jump — which is exactly the shape the gate already expects of rain. */
  take(raindrops, 'raindrop');

window.__census = function(){
  const tiles = {}, TN = ['WALL','PATH','GRASS','BED','CBED','TRUNK','SIDE','ROAD','VOID','WATER','TUNNEL','SLOT','DECK','DIAL','EYOT'];
  for (let i = 0; i < GW * WH; i++){ const n = TN[grid[i]] || ('T' + grid[i]); tiles[n] = (tiles[n] || 0) + 1; }

  /* planting CA: how much of the beds is actually growing, and how far along */
  let planted = 0, blooming = 0, daisies = 0, worn = 0, matureTrees = 0;
  const bySpecies = {};
  for (let i = 0; i < GW * WH; i++){
    if (bSp[i]){ planted++;
      const nm = SPECIES[bSp[i] - 1] ? SPECIES[bSp[i] - 1].name || ('sp' + bSp[i]) : ('sp' + bSp[i]);
      bySpecies[nm] = (bySpecies[nm] || 0) + 1;
      if (bSt[i] === 3) blooming++;
    }
    if (daisy[i]) daisies++;
    if (wear[i] > 0.5) worn++;
    if (grid[i] === TRUNK) matureTrees++;
  }

  /* living things, by where they are — the growth signal for draw-only work,
   * which leaves every terrain number flat */
  const life = {
    people: agents.length,
    inCourtyard: agents.filter(a => !a.street).length,
    onStreet: agents.filter(a => a.street).length,
    // a subset of onStreet, not a new axis: the same where-are-they split, extended
    // to the half of the world that never had a counter.
    inEast: agents.filter(a => a.east).length,
    ducks: ducks.length, swans: swans.length, birds: birds.length,
    butterflies: butterflies.length, fireflies: fireflies.length,
    leaves: leaves.length, raindrops: raindrops.length,
  };
  const structure = {
    /* NB: no LIT.length here. It is a per-frame draw accumulator (reset at the top
     * of each scene), so its value depends on where in the draw pass you sample —
     * it made the census non-reproducible. Census fields must be town state, not
     * render state. */
    chimneys: CHIMNEYS.length,
    ringNodes: RING.length, edgeBeds: EDGE_BEDS.length,
    benches: BENCH_SPOTS.length + LANE_BENCHES.length + QUAY_BENCHES.length + FAR_BENCHES.length,
    cafeTables: CAFE_TABLES.length, marketStalls: MARKET_STALLS.length,
    treePits: TREE_PITS.length, orchard: ORCHARD.length, plazaPits: PLAZA_PITS.length,
  };
  return {
    world: { GW, WH, cells: GW * WH },
    clock: { simT: +simT.toFixed(3), day, hour: +hour.toFixed(3),
             marketDay: isMarketDay(), windy: windyDay(), raining: !!raining,
             cloud: +cloudCover().toFixed(3), snow: +snowCover.toFixed(3), season: +season().toFixed(4),
             maturity: +maturity().toFixed(4), richness: +richness().toFixed(4) },
    tiles, life, structure,
    /* `harvested` is the one thing bySpecies cannot show: a veg count falling is
       equally dieback, so without it nothing distinguishes a picked plot from a
       rotted one, and a regression that silently killed harvesting would read clean */
    /* `produce` is the other end of that same pipe: units standing in the store
       between one market and the next. It is town state, not render state — a pure
       function of what has been picked and what the last market carried away — and
       nothing else the census reports moves when the harvest→market link breaks. */
    planting: { planted, blooming, daisies, matureTrees, worn, harvested,
                produce: +produce.reduce((a, b) => a + b, 0).toFixed(1),
                species: SPECIES.length, bySpecies },
    /* headline aggregates — what the census gate watches for collapse */
    scalars: {
      developed: (tiles.WALL || 0) + (tiles.PATH || 0) + (tiles.ROAD || 0) + (tiles.SIDE || 0),
      green: (tiles.GRASS || 0) + (tiles.BED || 0) + (tiles.CBED || 0) + (tiles.TRUNK || 0),
      water: tiles.WATER || 0,
      passages: (tiles.TUNNEL || 0) + (tiles.SLOT || 0),
      people: agents.length, planted, blooming,
      creatures: life.ducks + life.swans + life.birds + life.butterflies + life.fireflies,
      structures: Object.values(structure).reduce((a, b) => a + b, 0),
      tileKinds: Object.keys(tiles).length,
      speciesKinds: SPECIES.length,
    },
  };
};

resize();
refreshStats();
requestAnimationFrame(frame);
</script>
