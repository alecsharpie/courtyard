<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Courtyard</title>
<style>
  :root{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  @media (prefers-color-scheme: light){
    :root{ --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
      --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
      --glass-shine:rgba(255,255,255,.10); }
  }
  :root[data-theme="dark"]{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  :root[data-theme="light"]{
    --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
    --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
    --glass-shine:rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:radial-gradient(120% 100% at 50% 0%, var(--room2), var(--room) 70%);
    color:var(--ink); font-family:system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #room{ display:flex; flex-direction:column; width:min(100vw, 1280px); height:100vh; padding:clamp(8px,2vh,22px) clamp(8px,2vw,26px); }
  #frame{
    position:relative; flex:1; min-height:0;
    border:10px solid var(--frame);
    border-top-color:var(--frame-hi);
    border-radius:6px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.55), 0 18px 50px rgba(0,0,0,.35);
    background:#0d1410; overflow:hidden;
  }
  /* The default cursor is the ARROW, not a crosshair: the canvas swaps it for a
     pointer over exactly the cells the click handler will answer, and a crosshair
     everywhere would spend that contrast before it is used. See answersTouch(). */
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:default; }
  #glass{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(115deg, transparent 44%, var(--glass-shine) 48%, transparent 52%),
      radial-gradient(140% 120% at 50% 45%, transparent 66%, rgba(0,0,0,.38) 100%);
  }
  #sill{
    flex:none; display:flex; align-items:baseline; gap:18px;
    padding:12px 6px 4px; font-size:13px; color:var(--ink-dim);
  }
  /* flex:none on every nowrap item. They are all white-space:nowrap, so a flex box
     that shrinks below its text does not clip or ellipsis it — it SPILLS, silently,
     over its neighbour. #ticker (flex:1, min-width:0) is the only item allowed to
     take up the slack, because it is the only one with text-overflow. */
  #plate{ font-family:"Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    flex:none; display:flex; align-items:baseline; gap:18px;
    font-size:17px; color:var(--ink); letter-spacing:.02em; white-space:nowrap; }
  #plate small{ display:block; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim); font-family:system-ui,sans-serif; margin-top:1px;}
  /* The season is prose, so it is set in the plate's serif and not the clock's sans:
     the sill reads title · season · clock · ticker · counts, coarse to fine, and the
     two serif items are the two that SPEAK (one fixed, one changing) while the two
     tabular ones are the two that COUNT. min-width holds the longest name so the
     clock beside it never slides when the year turns.
     It lives INSIDE #plate rather than beside it so the narrow breakpoint can drop it
     onto the caption line without reparenting — see the media query.
     And it is a BUTTON, because the year is 26 sim days — 24 real minutes at 1x —
     and the one thing in the sill that names the season is also the most obvious
     place to ask for another one. See beginSkip(). It carries a chevron at all
     times rather than only on hover: a phone has no hover, and this is the one
     control in the row that does not already look like a control.
     ...and it is UNDERLINED, because the chevron alone was carrying the whole
     affordance: half-opacity punctuation at the end of a serif word, in a row of
     serif words. An underline is the one mark that says "press this" inside running
     prose without turning the label into a chip and fighting the plate's
     typography. The rule stops at the WORD — ::after is an inline-block, and
     text-decoration does not propagate into one — so the chevron stays a chevron
     instead of becoming a tail on the line. The padding is the hit area (a 14px
     label is a 17px target); the equal negative margin gives every pixel of it
     back to the layout, so the sill is the same height it was. */
  #season{ flex:none; font-size:14px; font-family:inherit;
    color:var(--ink); letter-spacing:.02em; white-space:nowrap; min-width:10.5ch;
    background:transparent; border:0; padding:5px 0; margin:-5px 0; text-align:left;
    cursor:pointer; transition:color .25s;
    text-decoration:underline; text-decoration-color:var(--ink-dim);
    text-decoration-thickness:1px; text-underline-offset:3px; }
  #season::after{ content:'\2009\203A'; display:inline-block; opacity:.6; }
  #season:hover{ text-decoration-color:var(--accent); }
  #season:hover, #season:hover::after{ color:var(--accent); opacity:1; }
  #season:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  #season[disabled]{ cursor:default; opacity:.55; }
  /* WHERE the eye is. At 390px the whole town is a strip and a person is two pixels,
     so this is the one control that lets a phone look at ONE quarter: press it and the
     camera eases onto the courtyard, the street, the plaza, the far bank, then back to
     the wide view. It names the place it is showing, in the plate's serif like the
     season (a place is prose), with the same underline and chevron. See whereGo().
     It sits beside the clock in the row, and under it on a phone (see the media query). */
  #clockcol{ display:contents; }
  #where{ flex:none; font-size:14px; font-family:inherit;
    color:var(--ink); letter-spacing:.02em; white-space:nowrap; min-width:9ch;
    background:transparent; border:0; padding:5px 0; margin:-5px 0; text-align:left;
    cursor:pointer; transition:color .25s;
    text-decoration:underline; text-decoration-color:var(--ink-dim);
    text-decoration-thickness:1px; text-underline-offset:3px; }
  #where::after{ content:'\2009\203A'; display:inline-block; opacity:.6; }
  #where:hover{ text-decoration-color:var(--accent); }
  #where:hover, #where:hover::after{ color:var(--accent); opacity:1; }
  #where:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  /* The reduced-motion path's honest cut: a lapse of six sunrises in six seconds is
     precisely the thing prefers-reduced-motion is asking not to be shown, so under it
     the same advance is delivered behind this instead. It is the only thing in the
     frame allowed over the glass. */
  #veil{ position:absolute; inset:0; pointer-events:none; background:var(--room);
    opacity:0; transition:opacity .38s ease; }
  #veil.on{ opacity:1; }
  /* The clock is the season's idea one scale DOWN. The season button reaches the next
     quarter; nobody arriving at noon would find the night on their own (dusk is ~35 real
     seconds off, and the only fast-forward skipped a quarter-year), so the hour is a
     button too and reaches this evening — then the next dawn. Same underline, same
     chevron, same hit-area trick; but it keeps the clock's sans and tabular figures,
     because it is still the thing in the row that COUNTS. 13ch holds the longest label
     plus the chevron so nothing beside it slides when the hour turns. */
  #daytime{ flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:13ch;
    font:inherit; color:var(--ink); background:transparent; border:0; padding:5px 0; margin:-5px 0;
    text-align:left; cursor:pointer; transition:color .25s;
    text-decoration:underline; text-decoration-color:var(--ink-dim);
    text-decoration-thickness:1px; text-underline-offset:3px; }
  #daytime::after{ content:'\2009\203A'; display:inline-block; opacity:.6; }
  #daytime:hover{ text-decoration-color:var(--accent); }
  #daytime:hover, #daytime:hover::after{ color:var(--accent); opacity:1; }
  #daytime:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  #daytime[disabled]{ cursor:default; opacity:.55; }
  #ticker{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:"Iowan Old Style", Palatino, Georgia, serif; font-style:italic; font-size:14px;
    color:var(--ink); opacity:.9; transition:opacity .6s; }
  #ticker.fade{ opacity:.35; }
  /* The naming — what the pointer is on — borrows the TICKER's box rather than adding
     a seventh item to a row that was already tight at 641px (see #stats yielding
     below 860). Same slot, same serif, but UPRIGHT and with no full stop: the ticker
     is prose the town says, this is a label for a thing, and the sill's other two
     labels (title, season) are upright too. It never covers a line that has not been
     read — see updateNaming. */
  #naming{ display:none; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-family:"Iowan Old Style", Palatino, Georgia, serif;
    font-size:14px; color:var(--ink); letter-spacing:.01em; }
  #sill.naming #ticker{ display:none; }
  #sill.naming #naming{ display:block; }
  #stats{ flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #ctrl{ flex:none; display:flex; gap:6px; }
  #ctrl button{
    font:inherit; font-size:12px; color:var(--ink); background:transparent;
    border:1px solid var(--ink-dim); border-radius:4px; padding:2px 9px; cursor:pointer;
  }
  #ctrl button:hover{ border-color:var(--accent); color:var(--accent); }
  #ctrl button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  /* The season is a sixth item in a fixed-width row, and the row was already tight in
     the 640-860 band: on HEAD the ticker was down to 71px of box at 641px, ellipsised
     to nothing. So the COUNTS yield first. They are the most expendable thing here —
     people and blooms and ducks are all visible in the picture above, whereas which
     season it is was the one fact the sill could not tell you. Net effect in this band
     is a season gained and a ticker that reads BETTER than it did (126px at 641,
     253px at 768, against HEAD's 71 and 193). */
  @media (max-width:860px){
    #stats{ display:none; }
    /* In this band the ticker's box is down to 136 px at 641, and the label is the one
       item here that is answering a hand. So the CLOCK yields to it as well, for as long
       as the pointer is on something — the hour is legible in the picture (the sun is in
       it), and it comes back the moment the pointer leaves. */
    #sill.naming #daytime{ display:none; }
  }
  @media (max-width:640px){
    #ticker,#stats{ display:none; }
    /* The narrow row has ~32px of slack and the season wants ~80, so it comes OUT of
       the row and onto the plate's second line — the caption slot, which on a phone
       was empty anyway ("a cellular block" has always been hidden here). Costs zero
       horizontal width, and the label ends up in its truest form: a title with the
       season set under it. Which season it is outranks a subtitle on a 390px screen. */
    #plate{ display:block; }
    #title{ display:block; }
    #plate small{ display:none; }
    /* In the caption slot it was also the LEAST pressable thing in the sill: 10px
       of dim uppercase, set exactly like the subtitle it displaced. So here it takes
       the full ink (a caption is grey; a control is not), keeps the underline, and
       spreads its hit area over the whole width of the line and down into the sill's
       bottom padding — a 12px cap-line becomes a ~29px target with no cursor to help
       it. Padding and margin cancel to the +1px this line always contributed, so the
       plate is the same height and the picture above it does not resize. */
    #season{ display:block; min-width:0;
      padding:7px 0 10px; margin:-6px 0 -10px;
      font-size:10px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink); font-family:system-ui,sans-serif; text-underline-offset:4px; }
    /* The where control goes UNDER the clock, the way the season went under the title:
       the row has no width for a fourth item (plate 115 + clock 106 + controls 93 of
       374, and "Early summer" takes the plate to 166) but the clock's column is one
       line in a row that is already two lines tall. Same caption form as the season —
       title/season, clock/where — and the same padding trick, so the sill is no taller. */
    #clockcol{ display:block; flex:none; }
    #where{ display:block; min-width:0;
      padding:7px 0 10px; margin:-6px 0 -10px;
      font-size:10px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink); font-family:system-ui,sans-serif; text-underline-offset:4px; }
    /* A narrow sill has no room for the ticker, so a phone has neither a cursor
       nor a text surface — the two hints that the picture answers a touch. The
       one-time invitation therefore BORROWS the sill for its few seconds: the
       plate and the clock step aside, then come back. Nothing else is allowed
       through this door — see inviteHold. */
    #sill.inviting #ticker{ display:block; }
    #sill.inviting #plate, #sill.inviting #daytime{ display:none; }
    /* One offer points OUT of the sill, at the picture; the other points INTO it, at
       the season. The second cannot hide the thing it is naming while it speaks, so
       it keeps the plate and drops the TITLE instead — the season and the sentence
       about it, side by side, is the whole message, and the title is the one line
       here a first-time viewer has already read. */
    #sill.inviting.at-season #plate{ display:block; }
    #sill.inviting.at-season #title{ display:none; }
    /* ...and the evening offer keeps the CLOCK it is naming, the same way. */
    #sill.inviting.at-clock #daytime{ display:block; }
    /* ...and the where offer keeps the WHERE control, alone on the plate. */
    #sill.inviting #where{ display:none; }
    #sill.inviting.at-where #clockcol{ display:block; }
    #sill.inviting.at-where #where{ display:block; }
    #sill.naming #where{ display:none; }
    /* A phone has no cursor to follow, so the name arrives on the TAP that also acts
       and borrows the sill the same way, for a few real seconds. #naming is already
       display:block under .naming above — the ticker's hiding rule does not reach it —
       so all it needs here is the width.
       And here it WRAPS rather than ellipsising: 251 px is not enough for the longest
       label the beds can produce, the plate it stands in for is two lines high anyway,
       so two lines cost the sill nothing — and on a phone this is a caption, which is
       the one form that is allowed to run onto a second line. */
    #sill.naming #plate, #sill.naming #daytime{ display:none; }
    #sill.naming #naming{ white-space:normal; }
  }
</style>

<div id="room">
  <div id="frame">
    <canvas id="cv" aria-label="A courtyard and the lane beside it, seen from an upstairs window"></canvas>
    <div id="glass"></div>
    <div id="veil"></div>
  </div>
  <div id="sill">
    <div id="plate"><span id="title">The Courtyard<small>a cellular block</small></span><button id="season" type="button"
      title="Run on to the next season" aria-label="Run on to the next season">Spring</button></div>
    <div id="clockcol"><button id="daytime" type="button" title="Run on to this evening"
      aria-label="Run on to this evening">Day 1 &middot; Dawn</button><button id="where" type="button"
      title="Look closer at one quarter" aria-label="Look closer at one quarter">Wide</button></div>
    <div id="ticker">The courtyard is quiet. Not much here yet.</div>
    <div id="naming"></div>
    <div id="stats">0 people &middot; 0 blooms</div>
    <div id="ctrl">
      <button id="pause" aria-label="Pause simulation">Pause</button>
      <button id="speed" aria-label="Simulation speed">1&times;</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ setup ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
// canvas 2d `filter` is missing on older Safari; feature-detect once, degrade quietly
const CAN_BLUR = (() => { try { ctx.filter = 'blur(2px)'; const ok = ctx.filter !== 'none'; ctx.filter = 'none'; return ok; }
                          catch (e){ return false; } })();
const N = 64;                  // courtyard block is the left 64 columns
const GW = 138;                // full world width: courtyard, cross street, allotments, plaza, river, far bank
const WH = 88;                 // full world height incl. the lane below
const WALL = 0, PATH = 1, GRASS = 2, BED = 3, CBED = 4, TRUNK = 5, SIDE = 6, ROAD = 7, VOID = 8, WATER = 9,
      TUNNEL = 10,             // roofed passage under a building — seen through an arch
      SLOT = 11,               // open passage cut through a block — seen from above
      DECK = 12,               // the footbridge: river cells carried over by a timber span — water
                               // to the ground cache, paving to a walker, drawn live in two halves
      DIAL = 13,               // the sundial's plinth: one cell of the inner lawn nobody stands on —
                               // lawn to the ground cache, not ground to a companion, drawn live
      EYOT = 14,               // the island in the river (#87): turf with a shingle rim, land to
                               // the census and the swans, nobody's waypoint; a willow stands on it
      GLASS = 15;              // the glasshouse floor (#116): a ROOFED floor, so it takes the shape
                               // TUNNEL already has — its own fill in the ground cache and an early
                               // `continue`, so no snow, no litter and no moss ever reach it. Never a
                               // volume: buildVolumes() reads WALL/TUNNEL and must not roof this one,
                               // because the whole point of the tile is that you see through it
/* the eyot: ONE ellipse, evaluated once in buildGrid() — everything else (the swans' third
 * bank, the ducks' nest, the streaks that part round it) reads the tile back off the grid.
 * Sited in the river's east half, clear of the boat's channel (x 116.5–121.5, hull ±0.5) by
 * half a cell, south of the jetty (y 35) and north of the lane bridge (64). */
const EYOT_AT = {x:124.3, y:46, rx:1.75, ry:5.0};
function eyotAt(x, y){ const dx = (x + .5 - EYOT_AT.x) / EYOT_AT.rx, dy = (y + .5 - EYOT_AT.y) / EYOT_AT.ry; return dx * dx + dy * dy < 1; }
function onEyot(x, y){ const gx = x | 0, gy = y | 0; return gx >= 0 && gy >= 0 && gx < GW && gy < WH && grid[gy * GW + gx] === EYOT; }
/* push a point on the water off the island, along the ray from the eyot's centre, until it
 * is `m` clear of the tile — a swan or a duck never sits on the turf by accident */
function offEyot(x, y, m){
  if (!onEyot(x, y)) return [x, y];
  let dx = x - EYOT_AT.x, dy = (y - EYOT_AT.y) * EYOT_AT.rx / EYOT_AT.ry, L = Math.hypot(dx, dy) || 0.01;
  dx /= L; dy /= L;
  for (let k = 0; k < 60 && onEyot(x, y); k++){ x += dx * 0.1; y += dy * 0.1 * EYOT_AT.ry / EYOT_AT.rx; }
  return [x + dx * m, y + dy * m * EYOT_AT.ry / EYOT_AT.rx];
}
/* the nearest point of the eyot's shore from (x, y): step toward the centre until the tile
 * is under foot; the step before that is the shore. [sx, sy, dist] */
function eyotShore(x, y){
  let dx = EYOT_AT.x - x, dy = EYOT_AT.y - y; const L = Math.hypot(dx, dy) || 0.01; dx /= L; dy /= L;
  let px = x, py = y;
  for (let k = 0; k < 120; k++){ const nx = px + dx * 0.1, ny = py + dy * 0.1; if (onEyot(nx, ny)) break; px = nx; py = ny; }
  return [px, py, Math.hypot(px - x, py - y)];
}
const WILLOW = {x:124.15, y:47.6};        // its foot on the island's south-west turf, over the channel side
const POND = {x:90, y:49.5, rx:4.2, ry:3.1};
const CX = 32, CY = 32.5;
const SUNDIAL = {x:32, y:35, h:0.85};   // the cell, and the gnomon's tip above the grass (a person is ~1.3)
const WALL_H = 5.6;
/* the lane */
const LN_WALK_N = 65, LN_ROAD0 = 68, LN_ROAD1 = 76, LN_WALK_S = 79; // row boundaries
const LANE_N_Y = 66.4, LANE_S_Y = 77.3;   // walking lines
/* the bridge's upstream parapet: its height, and the line people lean on it from.
 * It stood at 1.5 — a full head taller than anybody crossing — so a person on the
 * bridge read as standing at a wall. At 1.0 it is chest-high and a leaner's head
 * comes up level with the coping, which is the whole difference between standing
 * on a bridge and looking over one. */
const PARAPET_Z = 1.0, PARAPET_Y = LN_WALK_N + 0.45;
const KIOSK = {x:40.5, y:66.2};
/* the cross street (a T off the lane, running north along the courtyard's east side) */
const XS_W0 = 66, XS_R0 = 68, XS_R1 = 74, XS_E1 = 76;   // west footway, road, east footway
const XS_WALK_W = 67, XS_WALK_E = 74.9;                 // walking lines
/* the allotment gardens east of the cross street */
const ALT_X0 = 78, ALT_GATE = 86.5;
function inAllotment(x, y){ return x >= ALT_X0 && x < 96 && y >= 3 && y < 61; }
/* ---- the glasshouse (#116) ------------------------------------------------------
 * Fifteen tile kinds and eleven species since commit 1: every quarter built since #31 is
 * brick, paving, grass, water and bed, and the one axis nobody had moved was what the map
 * is made OF. GLASS is the sixteenth kind and the first surface in the town you can see
 * THROUGH — a low span standing OVER two of the allotment's own plots.
 *
 * Over, not beside. The beds inside stay BED on the same 5x7 lattice plotOrigin(),
 * ripePlots(), fallowPlots() and pickPlot() already walk, so the harvest, the fallow, the
 * winter dig, the cart and the store find the span with no line changed anywhere: the
 * block's own people work it because to every one of those readers it is simply two more
 * plots. What the roof BUYS is the ceiling — bedCap() steps down on the open plots as
 * bloomCap() falls, and under the span it does not, so the one tender crop stays at stage 3
 * through a winter the plots around it spend stalled at 1.
 *
 * Sited clear of everything that already moves through here: the POND (y 46.4 south, and
 * the ducks' furthest waddle is y 45.1), the bonfire heap at (84, 19.5), and ALT_GATE's
 * route, which runs x 86.5 from y 62 up to y 58 and never enters these rows. */
const GH = {x0:84, x1:93, y0:34, y1:39};        // inclusive cell bounds: 10 x 6, of which the 12 cells
                                                // of plots (85,36) and (90,36) stay BED
const GH_RIDGE_Y = 37;                          // (y0 + y1 + 1) / 2 — the ridge runs the long way, over both bed rows
const GH_EAVE = 0.95, GH_RIDGE = 1.75;          // LOW. The tallest SPECIES is h 1.15, so nothing inside touches the glass
function inGlass(x, y){ const gx = x | 0, gy = y | 0; return gx >= GH.x0 && gx <= GH.x1 && gy >= GH.y0 && gy <= GH.y1; }
/* the river quarter: plaza, quay, river and the lane bridge */
const DIV_X0 = 96, PLAZA_X0 = 99, PLAZA_X1 = 112, QUAY_X0 = 112, RIVER_X0 = 114;
const FOUNTAIN = {x:105.5, y:30};
const PLAZA_PITS = [[100.5, 15], [108.5, 15], [100.5, 45], [108.5, 45]];
const PLAZA_BENCHES = [{x:102, y:34.2}, {x:107.6, y:23.8}];
const QUAY_BENCHES = [{x:112.1, y:18}, {x:112.1, y:46}];
/* the far bank across the river: towpath, church green, bandstand */
const RIVER_X1 = 127, TOW_X0 = 127, FAR_X0 = 130, PARK_GATE = 134;
const CHURCH = {tx0:131, tx1:134, ty0:4, ty1:8, nx0:131, nx1:136, ny0:8, ny1:17};

    const i = y * GW + x;
    const crossRoad = x >= XS_R0 && x < XS_R1;
    const crossSide = (x >= XS_W0 && x < XS_R0) || (x >= XS_R1 && x < XS_E1);
    if (y < 64){
      if (x < 64){
        const inX = x >= 3 && x < 61, inY = y >= 3 && y < 61;
        if (!(inX && inY)){
          // north and south gateways are roofed (you look through an arch);
          // the east and west passages are open cuts, seen down into from up here
          if (Math.abs(x + .5 - 32.5) < 2.3 && !inY) grid[i] = TUNNEL;
          else if (Math.abs(y + .5 - 32.5) < 2.3 && !inX) grid[i] = SLOT;
          else grid[i] = WALL;
          continue;
        }
        const dx = x + .5 - CX, dy = y + .5 - CY;
        const r = Math.hypot(dx, dy), th = Math.atan2(dy, dx);
        if (r < 1.15){ grid[i] = TRUNK; continue; }
        if (r < gR(th)){
          if (r > bedIn(th) && r < bedOut(th) && !bedGap(th)) grid[i] = CBED;
          else if (x === SUNDIAL.x && y === SUNDIAL.y) grid[i] = DIAL;
          else grid[i] = GRASS;
          continue;
        }
        const dWall = Math.min(x - 3, 60 - x, y - 3, 60 - y);
        const depth = 1.6 + 1.4 * hash(x >> 2, y >> 2);
        if (dWall < depth && !nearEntrance(x, y)) grid[i] = BED;
        else grid[i] = PATH;
      } else if (x < XS_W0){
        // building sliver between courtyard wall and cross street; the east passage cuts through
        grid[i] = Math.abs(y + .5 - 32.5) < 2.3 ? SLOT : WALL;
      } else if (x < XS_E1){
        grid[i] = crossRoad ? ROAD : SIDE;
      } else if (x < ALT_X0){
        grid[i] = (y >= 3 && y < 61) ? GRASS : WALL;   // verge with the allotment fence
      } else if (x >= DIV_X0){
        if (x < PLAZA_X0){                             // the terrace between allotments and plaza
          grid[i] = Math.abs(y + .5 - ALLEY_Y) < 1.9 ? SLOT : WALL;   // an alley cuts through it
        }
        else if (x < PLAZA_X1){
          if (y < 3) grid[i] = WALL;
          else if (y < 61){
            grid[i] = PATH;
            const fd = Math.hypot(x + .5 - FOUNTAIN.x, (y + .5 - FOUNTAIN.y) * 1.2);
            if (fd < 1.8) grid[i] = WATER;
            if (((x >= 100 && x <= 101) || (x >= 109 && x <= 110)) &&
                ((y >= 8 && y <= 9) || (y >= 50 && y <= 51))) grid[i] = BED;
          } else {
            grid[i] = (x >= 102 && x < 108) ? SIDE : WALL;   // open mouth onto the lane
          }
        }
        else if (x < RIVER_X0){ grid[i] = SIDE; }      // the quay runs the full height
        else if (x < RIVER_X1){ grid[i] = (y >= DECK_Y0 && y < DECK_Y1) ? DECK : eyotAt(x, y) ? EYOT : WATER; }   // the river, the footbridge over it, the eyot in it
        else if (x < FAR_X0){ grid[i] = y < 3 ? WALL : SIDE; }         // the towpath on the far bank
        else if (y < 3) grid[i] = WALL;                                // the church green
        else if (y >= 61) grid[i] = Math.abs(x + .5 - PARK_GATE) < 1.75 ? TUNNEL : WALL;
        else grid[i] = (churchAt(x, y) || millAt(x, y)) ? WALL : GRASS;
      } else {
        if (y < 3 || y >= 61){
          grid[i] = (y >= 61 && Math.abs(x - ALT_GATE) < 1.8) ? TUNNEL : WALL;
        } else {
          grid[i] = GRASS;
          const pdx = (x + .5 - POND.x) / POND.rx, pdy = (y + .5 - POND.y) / POND.ry;
          if (pdx * pdx + pdy * pdy < 1){ grid[i] = WATER; continue; }
          // allotment plots in tidy rows (clear of the pond corner)
          const px = (x - 80) % 5, py2 = (y - 8) % 7;
          if (x >= 80 && x <= 93 && y >= 8 && y <= 56 && px < 3 && py2 < 2 &&
              !(x >= 84 && y >= 42)) grid[i] = BED;
          // the span goes over two of those plots: the beds under it are left BED, so every
          // reader that walks the lattice keeps finding them; only the aisle turns to GLASS
          if (inGlass(x, y) && grid[i] !== BED) grid[i] = GLASS;
        }
      }
    } else if (y === 64){
      if (crossRoad) grid[i] = ROAD;
      else if (crossSide) grid[i] = SIDE;
      else if (x >= 102 && x < 108) grid[i] = SIDE;          // plaza mouth
      else if (x >= QUAY_X0 && x < RIVER_X0) grid[i] = SIDE; // quay
      else if (x < RIVER_X0) grid[i] = (Math.abs(x + .5 - 32.5) < 2.3 || Math.abs(x - ALT_GATE) < 1.8) ? TUNNEL : WALL;
      else if (x < RIVER_X1) grid[i] = WATER;
      else if (x < FAR_X0) grid[i] = SIDE;                   // steps down to the towpath
      else grid[i] = Math.abs(x + .5 - PARK_GATE) < 1.75 ? TUNNEL : WALL;
    } else if (y < LN_ROAD0){
      grid[i] = crossRoad ? ROAD : SIDE;
      if (y === 66 && TREE_PITS.indexOf(x) >= 0) grid[i] = BED;
      if (y === 65 && ((x >= 17 && x <= 19) || (x >= 44 && x <= 46) || (x >= 84 && x <= 86))) grid[i] = BED;
    } else if (y < LN_ROAD1){
      grid[i] = ROAD;
    } else if (y < LN_WALK_S){
      grid[i] = SIDE;
      if (y === 78 && ((x >= 8 && x <= 9) || (x >= 55 && x <= 56) || (x >= 88 && x <= 89))) grid[i] = BED;
    } else {
      // below the lane: our own building, with the river slipping between its two halves
      grid[i] = (x >= QUAY_X0 && x < RIVER_X1) ? WATER : wellAt(x, y) ? VOID : WALL;
    }
  }
  for (const b of BENCH_SPOTS){
    for (let y = b.y - 1; y <= b.y + 1; y++) for (let x = b.x - 1; x <= b.x + 1; x++)
      if (grid[y * GW + x] === BED) grid[y * GW + x] = PATH;
  }
}
buildGrid();

/* ============ building volumes ============

   * At eave 0 the whole volume stays inside its own nine rows: 0 at the parapet, 2.11
   * at the ridge, 0 again at the world's south edge. */

  if (churchAt(x, y)) return 7.8;
  if (millAt(x, y)) return 4.7;                        // the mill house, squat under its wheel
  if (x >= DIV_X0 && x < PLAZA_X0) return 6.6;         // the tall terrace
  if (x >= 64 && x < 66) return 6.3;                   // the sliver the clock tower stands on

function solidAt(x, y){                            // strict: the world genuinely ends at its edges

  // V-notch in the roof at either margin of the wide frame.

    for (const [ox, oy] of C) if (solidAt(vx + ox, vy + oy)){ e += eaveAt(vx + ox, vy + oy); n++; }
    vZ[i] = n ? e / n : 0;
    vD[i] = n === 4 ? BIG : 0;

  for (let vy = 0; vy < VH; vy++) for (let vx = 0; vx < VW; vx++){
    const i = vy * VW + vx; if (!vD[i]) continue;
    let d = vD[i];
    if (vx > 0) d = Math.min(d, vD[i-1] + 1);
    if (vy > 0) d = Math.min(d, vD[i-VW] + 1);
    if (vx > 0 && vy > 0) d = Math.min(d, vD[i-VW-1] + 1.41);

    if (vy < VH-1) d = Math.min(d, vD[i+VW] + 1);
    if (vx < VW-1 && vy < VH-1) d = Math.min(d, vD[i+VW+1] + 1.41);
    if (vx > 0 && vy < VH-1) d = Math.min(d, vD[i+VW-1] + 1.41);

const CHIMNEYS = [];                       // filled as the roofs are drawn; smoke rises from them

const DAY_LEN = 55;
let simT = DAY_LEN * 0.04;
let speed = 1, paused = false;

/* ---- the year ----

 * in this town is spent by real minute 15 and there was no later act. season() is
 * the third slow world scalar, alongside cloudCover() and isWindy(), and the first
 * CYCLIC one: a 0..1 phase over SEASON_LEN days that turns and comes back. At 55 s
 * a day a full year is ~24 real minutes, so someone who stays past the growth ramps
 * still gets midsummer, autumn and deep winter arriving.
 *
 * Phase 0 is midwinter. The clock STARTS at 0.25 — spring, rising — which is also
 * the phase at which warmth is exactly 0.5, and every seasoned term below is written
 * so that warmth 0.5 reduces it to the literal constant it replaced. So day 0 is the
 * town as it was before the year existed, and the season is a departure from that in
 * both directions rather than a new baseline.
 *
 * Rate-capped by construction rather than by a chaser: the phase advances at exactly
 * 1/(SEASON_LEN*DAY_LEN) = 7.0e-4 per sim second and cannot do anything else, so no

let seasonPhase = SEASON_START, warmth = 0.5;
function season(){ return seasonPhase; }
/* Reader one: the length of the day. Sunrise and sunset walk apart and back together

 * with the year for nothing. The PEAK stays 1.0 on purpose: duration is the seasonal
 * lever on how many people are about, never midday brightness, so deep winter still

/* DAWN IS ONE EVENT (#112). nightF used to be a pure function of `daylight`, and
 * `daylight` is a SINE over the whole day: it is 0 AT sunrise and climbs slowly, so
 * nightF was a flat 1.00 at first light and only reached 0 at sunUp + 0.216*dayHours —
 * 2.5 h into a winter morning, 3.8 h into a summer one. The town was painted as night
 * through an hour of real daylight (measured on the year: nightF 0.72 at sunUp+0.8,
 * 0.58 at +1.2), and everything that reads the light as a proxy for the HOUR inherited
 * it — the last lamps, the roof cat, the fireflies, the walk home. #109 re-keyed one
 * clause of windowLit onto sunUp; this keys the CURVE.

 * full day arrives DAWN_RUN - DAWN_LEAD after it, on a smoothstep so the night multiply
 * has no corner at either end. The EVENING half is untouched — it is the same
 * `1 - 1.6*daylight` it always was — and Math.min() makes that structural: the dawn side
 * can never paint MORE night than the old curve did, only less.

 * the night's clock and the sun's hour is not a constant. DAWN_K is where the ramp
 * crosses nightF 0.3 — smoothstep inverted at 0.7 — so this curve and nightAt()'s dawn

  const gf = mossGrowF(), df = mossDieF();

function stepMossRegion(x0, x1, y0, y1, own, gf, df){

    const i = y * GW + x;

    const v = moss[i];
    const nb = (mossNb(i - 1, own) + mossNb(i + 1, own)

    const rate = 0.45 + 0.55 * hash(x, y + 313);             // this joint's own speed, forever
    const nv = v + MOSS_GROW * gf * rate * (0.35 + 1.10 * nb)

/* The bandstand has stood on the far bank since before the loop and nothing has ever
 * happened in it. Nor does anything east of the bridge GATHER: every crowd this town
 * has is transient — people passing through, or claiming one seat each.
 *
 * A concert is three things and only the last is new to the file. The DAY is a
 * seasonal draw: `hash(day, 617)` against `bandChance()`, so it costs no `R()` and
 * cannot reshuffle the seeded world for a feature most days do not have. The BAND is
 * `marketRaise()`'s pattern — one 0..1 progress with N clamps hung off it, so the
 * players take their places one at a time on the way up and pack away in reverse on
 * the way down for free. The AUDIENCE is people, and people here arrive by WALKING:
 * the park gate is ~21 cells from the green, which is eleven seconds, which is five
 * sim hours. That one number sets every other one — a concert shorter than the walk
 * to it plays to an empty green — so this runs a long summer afternoon and the
 * audience gathers through the whole of the set-up rather than after it.

 * The band plays through rain: it is standing under a roof, which is what a bandstand
 * is for. The green empties anyway, because every stander in this town already reads
 * the sky (skyLifts). */
const BAND_UP = 2.6, BAND_LEN = 6.6, BAND_DOWN = 2.2;   // hours: setting up, playing, packing away
const BAND_SEASON = 0.86;                    // how often high summer puts something on at all

 * measured rather than guessed: a first cut ended the set at 19.2, the strike ramp ran
 * to 21.4, and eastOpen() — daylight below 0.16, which is sunDown minus 0.05*dayHours

 * simply vanished. The set now has to be over, and the slowest listener off their
 * feet (leaveAt bottoms out at 0.35 of the strike), a clear hour before the light
 * goes. Walking home in the dusk is fine and already brisk; STANDING in it is not.
 *
 * The ceiling is what binds in high summer and the sun is what binds at the shoulder.
 * Both leave the raise past 7.5, which is the margin on the 6.00 rollover that
 * `day`-derived predicates like isBandDay() fall through. */

function bandEnd(){ return Math.min(sunDown - BAND_DUSK, 17.4); }
function bandStart(){ return bandEnd() - BAND_LEN; }

/* The market opens two and a half hours after sunrise and packs away three before
 * sunset — but a pure offset hands midwinter a six-hour market, and a market that
 * short is a different feature, so the span has a FLOOR and the close is pushed back
 * to meet it. No ceiling: high summer runs 7.10–18.50, and 11.4h of 17.5h daylight is
 * the same 60-odd percent of the day the market has always taken. ONE definition of
 * each end, because three things read them — the predicate, marketRaise(), and the
 * pack-away line in simStep().
 *
 * MK_EARLIEST is the one place the sun does not get the last word, and it is the sim
 * day's fault, not the market's: `hour` runs 6.00 -> 6.00 and `day` rolls with it, so
 * anything before 6.00 belongs to the PREVIOUS day's tail where isMarketDay() is false.
 * The stalls need the hour before opening to go up (marketOpen() - 1.10), so a midsummer
 * 6.50 opening would raise them at 5.40, get 0 from isMarketDay(), and then land three
 * near-finished stalls in one frame at the rollover — the exact pop marketRaise() exists
 * to prevent. 7.20 is the earliest opening whose raise still starts inside its own day,
 * with a tenth of an hour of margin on the rollover. */
const MK_OPEN_OFF = 2.5, MK_CLOSE_OFF = 3, MK_MIN_SPAN = 7, MK_EARLIEST = 7.2;

function marketActive(){ return isMarketDay() && hour >= marketOpen() && hour < marketClose(); }
const MARKET_STALLS = [
  {x:45, y:76.3, c1:'#a83c32', c2:'#e8ddc4'},
  {x:50.5, y:76.1, c1:'#3d5a80', c2:'#e8ddc4'},
  {x:56, y:76.4, c1:'#b08030', c2:'#e2d6b8'},

/* Market day has a beginning and an end. marketActive() still owns the hours the
 * market is OPEN — laneRate and the browser roll read it and must not move. What is
 * new is that a stall is no longer a boolean: marketRaise(i) is a 0..1 progress,
 * staggered per stall, so the three go up one at a time over the hour before opening
 * and come down over the hour after closing, instead of three finished stalls landing
 * between two frames. A day is 55 s, so an hour is 2.3 s and the whole setup gets
 * ~2.2 s — about as long as a thing can last here and still read as an event.
 * Pack-down is this same function running backwards, so it undoes the raise in
 * reverse order for free: goods away, canvas rolled up, frame down, trestle folded. */
const MK_RAISE = 0.62, MK_STAGGER = 0.24;     // hours: one stall, and between stalls
function marketRaise(i){
  if (!isMarketDay() || !mkTrades(i)) return 0;   // no stock, no trader: the pitch stays empty all day
  const up = marketOpen() - MK_RAISE - MK_STAGGER * (MARKET_STALLS.length - 1 - i);
  if (hour < up) return 0;
  if (hour < up + MK_RAISE) return (hour - up) / MK_RAISE;
  const dn = marketClose() + MK_STAGGER * i;
  if (hour < dn) return 1;
  if (hour < dn + MK_RAISE) return 1 - (hour - dn) / MK_RAISE;
  return 0;
}
// the whole span, first trestle to last pole away — for the ticker, not for the draw.
// Any stall may sit the day out now (mkTrades), so this asks all three rather than
// assuming the first up and the last down are the two ends of the span.
function marketUp(){ return MARKET_STALLS.some((_, i) => marketRaise(i) > 0); }

/* ============ what the plots send to the stalls ============ */
/* The allotments have run a full year since #25 — ripening, picked, fallow, re-sown at
 * a rate that IS ripePlots() — and the basket the gardener carried out of the block
 * (a.crop) went nowhere. It comes here. `produce` is the standing store of vegetables
 * lifted since the last market: harvestPlot() pays in, the market takes what it can
 * carry and the rest spoils. Nothing else writes it. So a February market is thin
 * because February's plots were thin, and it is cabbage-heavy because the brassica is
 * the one thing that stands the cold (SPECIES.hardy, #25) — not because a constant
 * somewhere says February.
 *
 * The day's stock is LATCHED once, at the first trestle, and held for the whole market.
 * The store keeps moving while the market is open — a gardener can pick at noon — and a
 * stall reading it live would gain and lose goods in front of you, or worse pack away
 * mid-morning when the count fell back through a threshold. One latch, one market.
 *
 * The latch hour is marketRaise()'s own earliest, minus a tenth: any earlier and it is
 * the PREVIOUS sim day (hour rolls at 6.00) where isMarketDay() is false. That is the
 * same rollover MK_EARLIEST is defending, and MK_EARLIEST is what keeps this clear of
 * it in midsummer. It is a floor, not a window — a page that jumps straight into a
 * market afternoon latches on its first step rather than finding an unstocked day. */
const produce = new Array(SPECIES.length).fill(0);
const MK_GOODS = 6;                                  // pitches that fit on one board
const MK_CAP = MARKET_STALLS.length * MK_GOODS;      // what the whole market can carry
/* Units the day's stock must reach before a second and a third trader think it worth
 * setting up. Stall 0 needs nothing: a market that fails to appear is a hole in the
 * lane rather than a thin market, and the browsers' spawn band would have nowhere to
 * stand — but it can stand behind an empty board, which is its own kind of February.
 * The two numbers are read off probes/market-year.mjs over 120 markets: the second
 * stall sits at the lower quartile of the year's stock (4.75) and the third a shade
 * under the median (21). Measured, that is one stall on 24% of markets, three on 58%,
 * and the middle state on the rest — the cold quarters and the growing ones. */
const MK_NEED = [0, 4, 13];
const MK_KEEP = 0.5;          // share of the surplus the market could not carry that keeps
const MK_R = {8:1.5, 9:2.2, 10:1.4, 11:2.4};         // carrots, cabbages, beans, pumpkins

let mkDay = -1, mkTotal = 0, mkTop = 0, mkShelf = [], mkBoards = [EMPTY, EMPTY, EMPTY];
const mkUnits = new Array(SPECIES.length).fill(0);
function stockMarket(){
  if (!isMarketDay() || mkDay === day) return;
  if (hour < marketOpen() - MK_FIRST - 0.05) return;
  mkDay = day; mkTotal = 0; mkTop = 0; mkShelf = [];
  for (let s = 0; s < produce.length; s++){
    mkUnits[s] = produce[s]; mkTotal += produce[s];
    if (mkUnits[s] > mkUnits[mkTop]) mkTop = s;
  }
  /* The shelf is the day's stock as a list of species, laid out in species order so
     that consecutive pitches are the same vegetable — a stall then takes a contiguous
     slice and reads as a stall that sells one or two things, rather than three
     identical rainbows.
     What the market cannot carry is not thrown away: half of the surplus KEEPS to the
     next market, in the proportions it was grown in. That is a store, and a store is
     what makes an autumn glut arrive late — which is the one thing that softens cue
     c50, the stepped bloomCap() cliff the allotments fall off at the shoulder. A
     market four days behind the block is a market whose worst week is not the block's
     worst week. It cannot rescue deep winter, and should not: by the third market of
     the cold the boards genuinely are bare, and the ticker says so. */
  // a pitch is a whole vegetable, so the shelf is whole even though the store is not
  const sold = Math.min(Math.round(mkTotal), MK_CAP);
  const keep = mkTotal > MK_CAP ? MK_KEEP * (1 - MK_CAP / mkTotal) : 0;
  for (let s = 0; s < produce.length; s++) produce[s] = mkUnits[s] * keep;
  if (sold > 0){
    for (let s = 0; s < mkUnits.length; s++){

      for (let k = 0; k < n; k++) mkShelf.push(s + 1);

  const n = mkOpenCount(), per = n ? Math.min(MK_GOODS, Math.round(mkShelf.length / n)) : 0;
  mkBoards = MARKET_STALLS.map(() => EMPTY);

    if (!mkTrades(i)) continue;
    mkBoards[i] = mkShelf.slice(off, off + per); off += per;

function mkTrades(i){ return mkDay === day && mkTotal >= MK_NEED[i]; }
function mkOpenCount(){ let n = 0; for (let i = 0; i < MARKET_STALLS.length; i++) if (mkTrades(i)) n++; return n; }

function mkGoods(i){ return mkShelfFor(i).length; }

/* ============ ticker ============ */
const tickerEl = document.getElementById('ticker');
let tickerTimer = 0, ambientAcc = 0;
/* The town has exactly ONE text surface and it stays one line. announce() used to
 * assign textContent outright, so two events in the same frame showed only the
 * second — the bell answering the clock could never be read, and any pair of
 * coincident lines silently lost one. So: a shallow ordered queue. A line is
 * guaranteed TICK_DWELL seconds of its own before the next may take the surface.
 * The queue is deliberately shallow and self-expiring — a ticker that backs up
 * reports news that has stopped being true, so anything that cannot be shown while
 * it is still current is DROPPED, oldest first, never shown late.
 * These are REAL seconds, not sim seconds: it is a reading speed, not a clock. */
const TICK_DWELL = 2.5, TICK_LIFE = 9, TICK_STALE = 6, TICK_QMAX = 2;
const tickerQ = [];
let tickerAge = TICK_LIFE;   // real seconds the line on screen has been up
/* Nearly every line is a remark and 2.5 s is a fair read of one. A line that asks
 * the viewer to DO something needs longer than one that only asks to be read, so a
 * line may buy its own dwell — the only caller that does is the invitation. */
let lineDwell = TICK_DWELL;
/* When the line went up, on the REAL clock. tickerAge is bucketed off the sim's dt, so
 * it stops dead on a paused page — press Pause and the line on screen never finishes
 * being read. The ticker can live with that (nothing new arrives either), but the
 * naming cannot: it waits for a line to be read before taking the box, and waiting on
 * a stopped clock is waiting forever. Reading is a real-time act, so it is timed on the
 * real clock, exactly as TICK_DWELL is documented to be. */
let lineAt = -99;
function showLine(e){
  lineDwell = e.dwell || TICK_DWELL;
  lineAt = performance.now() / 1000;             // the same epoch as frame()'s `now`
  tickerEl.textContent = e.txt;
  tickerEl.classList.remove('fade');
  tickerTimer = TICK_LIFE;
  // The ticker is ticked from the half-second stat bucket, so a line that goes up
  // mid-bucket would be credited with the whole of it and could be swapped out
  // after 2.0 s instead of 2.5 s. Starting the age at minus the elapsed part of
  // the bucket makes tickerAge equal real seconds on screen, exactly.
  tickerAge = -statAcc;
  // A follow-on is an ANSWER to the line now on screen, so it is enqueued at the
  // moment that line is DISPLAYED, never when it was announced. That is what stops
  // the bell answering a strike nobody read: if the strike is dropped as stale, its
  // answer is dropped with it, because it was never queued. And an answer outranks
  // whatever news arrived in the meantime — it goes to the front.
  if (e.then){
    tickerQ.unshift({ txt: e.then, age: 0 });
    while (tickerQ.length > TICK_QMAX) tickerQ.pop();
  }
}
/* Is the surface anybody's to take right now? One definition: announce() routes on
 * it, and the invitation waits on it rather than queueing behind the news. */
function tickerFree(){ return tickerTimer < 0 || tickerAge >= lineDwell; }
function announce(txt, then, dwell){
  // Deaf through a season skip. Six sim days go past in six real ones, and every
  // strike, market and wind line in them would either flood the surface or land on it
  // as stale news after the lapse ended. The lapse says one thing, on arrival: land().
  if (skipping()) return;
  if (tickerFree()){ showLine({ txt, then, dwell }); return; }
  if (txt === tickerEl.textContent) return;
  if (tickerQ.some(q => q.txt === txt)) return;
  tickerQ.push({ txt, then, age: 0 });
  while (tickerQ.length > TICK_QMAX) tickerQ.shift();   // stale goes, not the news
}
// half a real second of ticker time — called from the same bucket as refreshStats

  tickerAge += 0.5;
  tickerTimer -= 0.5;
  if (tickerTimer < 0) tickerEl.classList.add('fade');
  for (let i = tickerQ.length - 1; i >= 0; i--){
    tickerQ[i].age += 0.5;
    if (tickerQ[i].age > TICK_STALE) tickerQ.splice(i, 1);
  }
  if (tickerQ.length && tickerFree()) showLine(tickerQ.shift());
}

    'Someone brings the washing in early, just in case.',

  if (cloudCover() > 0.42) return pick(['Cloud comes over the rooftops from the west.',
    'The sun keeps going in and out.']);

    'A window box gets watered from a first-floor window.',

 * is the same shower's 0..1 intensity, and it is what everything *drawn* reads, so
 * the shower can thin out over its last seconds instead of being switched off in a

 * being an ending and becomes drizzle. */
const RAIN_TAIL = 2.2;

function neighborsMature(x, y){
  let n = 0, sp = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    if (!dx && !dy) continue;
    const xx = x + dx, yy = y + dy;
    if (xx < 0 || yy < 0 || xx >= GW || yy >= WH) continue;
    const j = yy * GW + xx;
    if ((grid[j] === BED || grid[j] === CBED) && bSt[j] === 3){ n++; sp = bSp[j]; }
  }
  return [n, sp];
}
/* The allotment is laid out by buildGrid as 3x2 beds on a 5x7 lattice. That plot is
   the unit a gardener picks and the unit that comes back, so the whole cycle —
   harvest, fallow, sowing — is addressed by plot rather than by cell. A row that
   empties and refills one cell at a time is a speckle; a plot reads as a row. */

  const availG = SPECIES.filter(s => s.minDay <= day && s.glass);   // the span's own rows: what only a roof can keep

        // the beds over rather than freezing them half-grown. Whatever keeps the full
        // ceiling through the cold is grain-matched to what the region is ADDRESSED by:

        // fine where the unit is a cell), and in the allotments a whole PLOT under a
        // hardy crop, because there the unit ripePlots() reads is the plot. Measured,

        // with no colour in it at all reads as dead rather than as wintering.
        bAge[i] += 0.35;

      // pavedAt() says so, and that now includes the plaza's PATH — gated on ROAD||SIDE
      // the roundel's lines would have accrued forever and never faded. Identical on
      // HEAD's cells: BED/CBED is taken above and nothing else can carry a value.
      paveWear[i] -= paveWear[i] * Math.min(1, PW_DECAY * boost);   // rain scours it out faster, as it does the wear on the grass

    if (a.round && a.wp[a.i - 1][1] === ROUND_STEP_Y){ roundDeliver(a); return; }   // the morning round at a step (#98)
    // the ONE place a leaver is asked home: on the lane, after dark, as the last leg
    // (the walk off the frame) begins — every route out of the town passes this point.
    if (a.i >= a.wp.length){
      // a companion at its place: caught up (the leader walks on, and it is re-asked next
      // step), or at the leader's side while they sit or stand
      if (a.with){ if (a.run){ endKidRun(a); return; }   // run done: re-targeted to the parent's side next step
        if (a.with.state !== 'walk'){ kidSettle(a); a.state = a.with.state; a.cup = !!a.with.cup; a.resume = true; } return; }
      if (a.home){ arriveHome(a); a.done = true; return; }   // at the door: in they go
      if (a.kind === 'gardener' && a.tendBed){ gardenerKneel(a); return; }
      if (a.kind === 'napper' && a.napAt){ a.state='lie'; a.timer=16+R()*14; a.napAt=null;
        if (R()<0.6) announce(inLindenShade(a.x, a.y) ? 'Asleep in the shade of the linden within minutes.'
                              : shadowF() > 0.5 ? 'Asleep out in the sun within minutes.' : 'Asleep under the tree within minutes.'); return; }
      /* A courtyard seat can be refused now, which is why c11 stayed open for 24
       * iterations: these two kinds are STAYING, so they arrive with an empty
       * waypoint list and refusing used to mean `a.done` where they stood. routeToExit()
       * gives them the walk back out that a street agent always had.
       * The duration is drawn either way — a refusal must not add or drop an R() call,
       * or a dry census cell would churn for a wet-weather feature it never sees. */
      if (a.kind === 'picnic' && a.picnicAt){
        const dur = 20 + R() * 14;
        a.picnicAt = null;
        // a pair arrives together and shares one blanket, so the sky is judged ONCE for
        // both: whoever reaches the grass first decides, and if your half is already
        // down you join them whatever the cloud is doing. (They share `a.wary` too — the
        // partner is a copy — so the release lifts them in the same frame.)
        if (seatRefused(a) && !(a.mate && a.mate.state === 'sit')){ routeToExit(a); return; }
        a.state='sit'; a.timer=dur; a.blanket=a.lead;
        if (a.lead) announce(a.shaded ? 'A blanket unfurls in the shade of the linden — picnic hour.' : 'A blanket unfurls on the grass — picnic hour.');
        return;
      }
      if (a.kind === 'sitter' && a.benchAt){
        const dur = 12 + R() * 16;

      }
      if (a.tend && !a.lit){                       // at the heap (#93): light it, or find the weather turned and go home again
        a.lit = true;
        a.wp.push([79, 20], [XS_WALK_E, 20], [XS_WALK_E, -2.5]);   // the way out, walked when it dies
        if (bonfireWeather() && !skyLifts(a)){        // and not under a front that would have them leave in the same frame
          bon.on = true; bon.lit = simT;
          a.state = 'stand'; a.timer = 1e9; a.resume = true; a.faceL = true;

        a.planted = false; a.rows = (a.rows || 0) + 1;   // each kneel is its own row
        // they came a long way for one plot: most work a second or third before leaving
        if (a.rows < 3 && R() < 0.55){

          const more = a.dig ? fallowPlots() : null;
          if (!more || more.length){
            const next = more ? pick(more) : pickPlot();
            a.plot = next; a.tendPlot = true;
            a.wp.push([next[0] - 0.6, next[1] + 0.5]);
            return;
          }
        }
        const exitVia = R() < 0.5;
        if (exitVia) a.wp.push([ALT_GATE, 58], [ALT_GATE, 62], [ALT_GATE, LANE_N_Y], [laneEdge(), LANE_N_Y]);
        else { const gy = pick([20, 45]); a.wp.push([79, gy], [XS_WALK_E, gy], [XS_WALK_E, -2.5]); }

      }

    }
    // street agents: perform their one stop when they actually reach it
    if (a.stop && !a.stopped && Math.hypot(a.x - a.stop.x, a.y - a.stop.y) < 0.6){
      a.stopped = true;

      // at the rail becomes the crossing (#96) — deterministic, no draw
      if (a.jetty && puntFits(a)){ puntClaim(a); return; }
      // and nobody new sits down under a sky that is already going, or on a seat the
      // last shower left wet. Refused at SIT_REFUSE, released at 0.55+ above, so the gap
      // guarantees no one sits and stands right up. (ONE predicate — seatRefused().)
      if (a.stop.act === 'sit' && seatRefused(a)){
        if (a.table){ a.table.taken = 0; a.table = null; }
        return;                                    // walk on past the empty chair
      }
      a.state = a.stop.act; a.timer = a.stop.dur; a.resume = true;
      // an hour on the post at least, then away in time to be off the frame by EVE_GONE (#101)
      if (a.dusk && a.eveOut !== undefined) a.eveLeave = Math.max(hourEve() + EVE_STAND, EVE_GONE - a.eveOut);

  }
  const mv = Math.min(sp * dt, d);
  if (cart && !a.loader && cartShove(a, dt)) return;   // shoved aside: the step is the shove, not the walk
  // a companion never closes under PAIR_MIN on the leader (the two would draw as one):
  // when the leader turns and the place beside them is THROUGH them, step away instead
  // (the leader keeps walking, so a hold is still walked through)
  if (a.with){ const L = a.with, nx = a.x + dx / d * mv, ny = a.y + dy / d * mv;
    if (Math.hypot(nx - L.x, ny - L.y) < PAIR_MIN){
      let ax = a.x - L.x, ay = a.y - L.y, ad = Math.hypot(ax, ay);
      if (ad < 1e-6){ ax = -a.hy * a.side; ay = a.hx * a.side; ad = 1; }
      a.x += ax / ad * mv; a.y += ay / ad * mv; a.phase += mv * 2.2; stepDog(a, sp, dt); return; } }
  a.x += dx / d * mv; a.y += dy / d * mv;

  if (gx>=0 && gy>=0 && gx<GW && gy<WH){
    const j = gy*GW+gx;
    // #122: feet on STONE. The chain below is exclusive and wear[] stops at GRASS, so
    // until now every sett in the town had forgotten everyone who ever crossed it. This
    // is the same idea on the paving, and it is what decides where the water stands
    // once the shower stops — so it is a statement, not another branch of the chain.
    if (pavedAt(gx, gy)) paveWear[j] = Math.min(1, paveWear[j] + (a.small ? 0.6 : 1) * PW_GAIN * dt);
    if (grid[j]===GRASS){
      wear[j] = Math.min(1, wear[j] + (a.small?0.05:0.09) * dt * 6);
      if (daisy[j] && wear[j]>0.25){ daisy[j]=0; }
      if (snowCover > 0) trod[j] = Math.min(1, trod[j] + (a.small?0.2:0.35) * dt * 6);   // feet cut a lying cover
      if (litter[j]) litter[j] = Math.max(0, litter[j] - Math.ceil(dt * (a.small ? 60 : 120)));   // and scuff the leaves (~2 s standing clears a cell)
      if (R()<dt*2) wearDirty = true;                        // pending: the tick throttles the repaint
    } else if (moss[j] > 0 && mossIn(gx, gy)){
      // #103: the plaza's other half of wear[] — feet scuff the joints they cross, so
      // the roundel's rings, the mouth and the bench approaches stay clean. Bucketed:
      // the repaint is asked for only when a drawn level can have changed
      // #114: and the quay's walked column, which is what keeps it off the rail line
      const wasB = moss[j] * MOSS_BUCKET | 0;
      moss[j] = Math.max(0, moss[j] - (a.small ? 0.6 : 1) * MOSS_SCUFF * dt);
      if ((moss[j] * MOSS_BUCKET | 0) !== wasB) wearDirty = true;
      // the quay is SIDE, so this branch now shadows #72's footway sweep. Do that here
      // too rather than let a mossy cell quietly stop clearing its leaves in October.
      if (litter[j] && grid[j] === SIDE) scuffLitter(j, a, dt);
    } else if (a.broom && snowCover > 0 && trod[j] < 1){
      trod[j] = 1; wearDirty = true;                          // the sweeper clears the strip he walks
    } else if (a.broom && litter[j]){
      litter[j] = 0; wearDirty = true;                        // and sweeps the leaves off the paving
    } else if (litter[j] && (grid[j] === ROAD || grid[j] === SIDE)){
      scuffLitter(j, a, dt);
    }
  }
  stepDog(a, sp, dt);
}
/* #72: the street clears itself. A heap on the road or the footway is cut by the
 * traffic that uses it — faster than the lawn's scuff, and a wheel scatters what a foot
 * only treads (a cyclist crosses a cell in ~0.17 s and takes a whole leaf with him).
 * The courtyard's PATH is left to the broom, so its sums do not move. No R(): the
 * repaint is asked for on a drawn-bucket change, the way landLeaf() asks.
 * Factored out at #114 because the quay's moss branch now sits in front of it. */
function scuffLitter(j, a, dt){
  const was = litter[j];
  litter[j] = Math.max(0, was - Math.ceil(dt * (a.cycle ? 480 : a.small ? 90 : 180)));
  if ((litter[j] / LITTER_BUCKET | 0) !== (was / LITTER_BUCKET | 0)) wearDirty = true;
}
/* the dog trails its human. Called from the walk path AND from every beat the human
 * spends standing still, so a stopped owner never leaves a frozen dog beside them. */
function stepDog(a, sp, dt){
  if (!a.dog) return;
  const g = a.dog, ddx = a.x - g.x + Math.sin(a.phase*0.7)*1.2, ddy = a.y - g.y + 0.6;
  const dd = Math.hypot(ddx, ddy);
  if (dd > 1.2){ g.x += ddx/dd * Math.min(sp*1.3*dt, dd); g.y += ddy/dd * Math.min(sp*1.3*dt, dd); }
  g.phase += dt * 9;
}

/* ============ a passing word ============ */
/* Until now every agent moved as though alone in the town — no proximity test
 * existed anywhere, which is why the wide shot read as traffic rather than as
 * neighbours. This is the whole of their social life: on a coarse tick, two people
 * who happen to pass close may stop and talk for a few seconds. A pass over a short
 * list, axis-rejected before any hypot, and both parties then sit out a cooldown so
 * the same pair cannot chatter their way down the lane. */
/* GREET_MIN matters as much as GREET_R: a pair that stops at half a cell renders as
 * one blob, so they only pair at a distance you can read as two people. */
const GREET_DT = 0.5, GREET_R = 1.6, GREET_MIN = 0.9, GREET_P = 0.17;
let greetAcc = 0;
function chatty(a){
  return a.state === 'walk' && !a.small && !(a.listen > 0) && !(a.greet > 0) && !(a.chatCool > 0)
      && a.kind !== 'sweeper' && a.kind !== 'picnic' && !a.homer && !a.dusk && !a.with && !a.round;   // a companion is already with somebody   // the sweeper is working; picnic pairs arrive together; a homer is priced to a door (c90), and EVERY evening walk is priced — to a post before the light goes, and off the frame before EVE_GONE (#89, #101: a gate arrival stood talking for 2.79 h and lost its post)
}
function greetPass(){
  const free = [];
  for (const a of agents){
    if (a.chatCool > 0) a.chatCool = Math.max(0, a.chatCool - GREET_DT);
    if (chatty(a)) free.push(a);
  }
  for (let i = 0; i < free.length; i++){
    const a = free[i];
    if (a.greet > 0) continue;
    for (let j = i + 1; j < free.length; j++){
      const b = free[j];
      if (b.greet > 0) continue;
      const dx = b.x - a.x; if (dx > GREET_R || dx < -GREET_R) continue;    // cheap reject, no hypot
      const dy = b.y - a.y; if (dy > GREET_R || dy < -GREET_R) continue;
      const q = dx*dx + dy*dy;
      if (q > GREET_R*GREET_R || q < GREET_MIN*GREET_MIN) continue;
      if (R() > GREET_P) continue;
      const t = (2.2 + R() * 2.8) * (raining ? 0.45 : 1);   // nobody lingers in the wet
      a.greet = b.greet = t;
      a.faceL = dx < 0; b.faceL = !a.faceL;
      a.chatCool = b.chatCool = t + 16 + R() * 10;
      if (R() < 0.12) announce(pick([
        'Two neighbours stop mid-path and fall into talk.',
        'A conversation breaks out on the lane and the walk waits for it.',
        'Someone stops someone else; hands go into pockets.',
      ]));
      break;
    }
  }
}

/* ============ lane agents ============ */
function allotCount(){ return agents.filter(g => g.kind === 'allot' && !g.tend).length; }   // the bonfire's holder is not a picker (#93)
function pickPlot(){
  const plots = [];
  for (let py = 8; py <= 56; py++) for (let px = 80; px <= 93; px++)
    if (grid[py * GW + px] === BED && R() < 0.05) plots.push([px, py]);
  return plots.length ? pick(plots) : [84, 22];
}
/* the walk in — through the lane gate or down the cross street — and the plot they
   kneel at. Shared by the passer-by who detours in and by the holder the ripe rows
   pull out of the town, so both arrive by a real gate onto a real bed cell. */
function sendToPlot(a){
  a.kind = 'allot';
  const gateY = pick([20, 45]);
  const fallow = digWeather() ? fallowPlots() : [];
  const plot = fallow.length ? pick(fallow) : pickPlot();
  a.dig = fallow.length > 0;                  // the winter job: turn it, don't pick it
  a.x = XS_WALK_E; a.y = -2.5;
  if (R() < 0.5){ a.x = laneEdge(); a.y = LANE_N_Y; a.wp.push([ALT_GATE, LANE_N_Y], [ALT_GATE, 62], [ALT_GATE, 58]); }
  else { a.wp.push([XS_WALK_E, gateY], [79, gateY]); }
  a.wp.push([plot[0] - 0.6, plot[1] + 0.5]);
  a.tendPlot = true; a.plot = plot;         // the plot they kneel at is the plot they pick
  if (R() < 0.4) announce(pick(['Someone hoes a fresh row in the allotments.',
    'The smell of turned earth drifts over the fence.']));
}
/* Plots standing ready. This is what sets the gardener arrival rate: the crop calls
   its own picker, so harvest is self-regulating — a bare block draws nobody, a ripe
   one draws two a day, and the allotments cannot drift to a static full block. */
function ripePlots(){
  let n = 0;
  for (let oy = 8; oy <= 50; oy += 7) for (let ox = 80; ox <= 90; ox += 5){
    let bed = 0, mt = 0;
    for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
      const i = y * GW + x;
      if (grid[i] !== BED) continue;
      bed++; if (bSt[i] === 3) mt++;
    }
    if (bed && mt >= bed - 1) n++;          // ready when all but one cell is up
  }
  return n;
}
/* The block's WINTER. ripePlots() is 0 for a quarter of the year, so the 0.01 floor sent
   nobody for ~six sim days and the plots sat bare under snow with nothing happening in
   them. On a mild, dry winter day a holder comes in to turn a fallow plot over instead —
   the same source, priced on the same roll, an additive term that is exactly 0 outside
   digWeather() so the summer rate is untouched. What gets turned is not a bare plot —
   measured, the winter block has NO bare plots (a picked row is re-sown within a day and
   stalls at stage 1 under the cap) — it is a plot under a non-hardy crop that cannot
   ripen: the dead row goes under, and turned[] holds the plot dark and unsown until the
   warmth comes back, so the spring sowing is the thing that clears it. */
const DIG_WARMTH = 0.28, DIG_SNOW = 0.3, DIG_RATE = 0.06;   // ~1.7 a winter day at one roll per sim second
function digWeather(){ return warmth < DIG_WARMTH && !raining && snowCover < DIG_SNOW; }
function fallowPlots(){                       // stalled or bare, not hardy, not ripe, not yet turned — by the lattice ripePlots() walks
  const out = [];
  for (let oy = 8; oy <= 50; oy += 7) for (let ox = 80; ox <= 90; ox += 5){
    let bed = 0, ok = true;
    for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
      const i = y * GW + x;
      if (grid[i] !== BED) continue;
      bed++; if (bSt[i] === 3 || (!bSp[i] && bAge[i] > 0) || turned[i]) ok = false;   // bAge is the fallow clock only on an EMPTY cell
    }
    if (bed && ok && !plotStands(ox, oy)) out.push([ox, oy]);
  }
  return out;
}
function turnPlot(a){
  const [ox, oy] = plotOrigin(a.plot[0], a.plot[1]);
  let n = 0;
  for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
    const i = y * GW + x;
    if (grid[i] === BED && bSt[i] < 3){ bSp[i] = 0; bSt[i] = 0; bAge[i] = 0; turned[i] = 1; n++; }
  }
  if (n){ groundDirty = true;
    if (R() < 0.5) announce(pick(['A fork goes into the cold ground; the plot comes up dark.',
      'Someone turns a plot over for the winter, a row at a time.'])); }
  return n;
}
function spawnAllotAgent(){
  const a = {
    kind:'allot', street:true, x:0, y:0,
    wp:[], i:0, speed:1.5 + R() * 0.6, state:'walk', timer:0,
    shirt:pick(SHIRT), pants:pick(PANTS), skin:pick(SKIN), phase:R() * 9, wary:R(),
  };
  sendToPlot(a);
  agents.push(a);
}
/* The block's AUTUMN (#93). The year had a harvest, a fallow and a dig, and autumn was
 * the one quarter with nothing of its own on screen: leaves fell and lay, and nothing
 * burned. On a dry, calm autumn day a holder comes in early and lights a heap on ONE bare
 * cell — the gap between the first two plot columns, five cells in from the row-20 gate,
 * clear of the fence, the lattice and the pond — feeds it with a fork, and goes when it
 * dies. Two rate-capped scalars: bon.fire is the flame (kindles over BON_RISE_H, burns

 * BON_EMBER_H, the glow you see from the lane after dark). Rain or snow arriving sends
 * both to 0 in BON_RAIN_H. The day is a hash(day, k), so it is the same calendar in every

const BONFIRE = {x:84.0, y:19.5};
const BON_K = 0.8, BON_SALT = 285;                           // hash share of shed days offered one — 5–6 of the 7 in every year of 12 (histogram); the weather then takes ~2/3 (wind 1.0 on a third of autumn mornings; snow lies by day 18)
const BON_RISE_H = 1.0, BON_BURN_H = 3.5, BON_FALL_H = 1.2, BON_EMBER_H = 4.0, BON_RAIN_H = 0.25;
const BON_PUFFS = 18, BON_THICK = 0.62, BON_EMB_THICK = 0.12;   // the column's mass (#104): nine puffs at 0.34 read as dots at 1x
const bon = {fire:0, ember:0, on:false, lit:-1, day:-1, holder:null};
function bonfireDay(){ return leafShed() > 0.1 && hash(day, BON_SALT) < BON_K; }   // the SHED, days 12–18: leafFallF() > 0.3 is also every spring day
function bonfireWeather(){ return !raining && wetF() < 0.4 && windF() < 0.5 && snowCover <= 0; }
function bonfireHour(){ return sunUp + 0.3 + hash(day, 518) * 1.2; }   // set out early: the walk in is most of a working day
function bonfireDue(){ return bon.day !== day && !bon.on && bon.fire === 0 && hour >= bonfireHour() && hour < bonfireHour() + 2 && bonfireDay() && bonfireWeather(); }
function bonfireAlight(){ return bon.on || bon.fire > 0 || bon.ember > 0; }
function bonfireName(){ return bon.fire > 0.3 ? 'the bonfire, smoking' : bon.ember > 0.05 ? 'the bonfire, down to embers' : 'a heap on the allotments, waiting for a match'; }
function stepBonfire(dt){

  const tgt = bon.on ? 1 : 0;
  if (tgt > bon.fire) bon.fire = Math.min(1, bon.fire + h / BON_RISE_H);
  else if (tgt < bon.fire){ const r = h / (wet ? BON_RAIN_H : BON_FALL_H); bon.fire = bon.fire <= r ? 0 : bon.fire - r; }
  const etgt = bon.fire > 0.05 ? 1 : 0;
  if (etgt > bon.ember) bon.ember = Math.min(1, bon.ember + h / 0.5);

}
function spawnBonfireHolder(){                                 // sendToPlot's cross-street entry, by the row-20 gate, to the heap's east side
  const a = {
    kind:'allot', street:true, tend:true, fork:true, x:XS_WALK_E, y:-2.5,
    wp:[[XS_WALK_E, 20], [79, 20], [BONFIRE.x + 1.4, BONFIRE.y + 0.8]], i:0, speed:1.5 + R() * 0.6, state:'walk', timer:0,
    shirt:pick(SHIRT), pants:pick(PANTS), skin:pick(SKIN), phase:R() * 9, wary:0.75 + R() * 0.25,   // hardy: nine hours' walk is not left at the first overcast (skyLifts)
  };
  bon.day = day; bon.holder = a;
  agents.push(a);
}
function spawnLaneAgent(room){

    kind:'lanewalker', street:true,

  if (R() < 0.3){
    const xw = R() < 0.5 ? XS_WALK_W : XS_WALK_E;
    if (R() < 0.5){       // down from the north, onto the lane, off to an edge

 * marketOpen(), the band and eastOpen() all close on the sun too — so for the ~45% of

 * arch in the final else. Two of every five viewers met the lane as a transit corridor

 * and the allotments are shut for good reasons; reopening them would only make the

 * ---- why it is HERE, which is budget and not scenery ---------------------------

 * they would still be outside at 03.00 whatever hour the door shut. The custom comes

const TAP_IN = [32.5, 62.5], TAP_MOUTH = [32.5, 64.9];   // inside the arch, and its mouth

 * in the morning, in every season. The asymmetry is the point: the market's midwinter
 * day is its shortest and the door's is its LONGEST — ten and a half hours against
 * midsummer's eight and a half — so the year reads backwards here, which is the only
 * way this town gets a winter evening.

 * 03.00 is a single contiguous window on hourEve() and nothing `day`-derived changes
 * underneath it; the shut is at 27.0 and the day rolls at 30.0, well clear of the seam.
 *
 * TAP_LAST is #32's law paid up front. A visit is a walk of 1.9 sim-hours, a drink of
 * up to 3.5 more, and the walk back — so the door stops SENDING people 5.5 hours before

function tapF(){

function tapCount(){ return agents.filter(a => a.tap).length; }

/* ---- the carter (#82) ----

const CART_SPEED = 6.5, CART_TROT = 1.5, CART_IN = 0.2, CART_LAST = 1.6;    // cells/s, ×trot on the way out; hours off sunUp it may set out
const CART_BERTH = 1.7, CART_SHOVE = 3.6, CART_LEN = 2.9;                 // the axle-to-nose segment walkers keep off

 * and past the far-bank gatehouse as well as west, and until now nothing on wheels had ever
 * used that end. A per-day hash, like cartToday(): no R() draw, so the seeded world is the

function stepCart(dt){

  // shrinks along the old axis and normalises straight back to it — so it is kicked
  // sideways and comes round through the perpendicular, a horse turning in the road.

const FAM_CAP = 3, FAM_RATE = 0.5, FAM_H0 = 9.5, FAM_H1 = 17, FAM_SUN = 0.35, FAM_MIN_DWELL = 1.5, FAM_WALK_MARGIN = 1.15;

const FAM_LEAD = [[99.8, ALLEY_Y + 0.4]];
function famSun(){ return daylight > FAM_SUN; }
function famOpen(){ return day >= 1 && !raining && famSun() && hour >= FAM_H0 && hour < FAM_H1; }
function famCount(){ return agents.filter(a => a.fam && !a.famKid && !(a.stopped && a.state === 'walk')).length; }   // on the way in or stopped; a family walking out has given its place up
function spawnFamilyAgent(){

    kind:'family', street:true, fam:true,
    x:0, y:0, wp:[], i:0, speed:1.4 + R() * 0.6, state:'walk', timer:0,
    shirt:pick(SHIRT), pants:pick(PANTS), skin:pick(SKIN), phase:R() * 9, wary:R(),

/* where a child runs next: a hopping pigeon within the leash of the parent, else an arc
 * of the roundel on the parent's side. Waypoints, like every route in the town. */
function kidBird(k){                         // the nearest pigeon down, or coming down, within the leash of the parent
  const P = k.with; let best = null, bd = FAM_LEASH;
  for (const b of birds) if (b.plaza && (b.state === 'hop' || b.state === 'land')){
    const d = Math.hypot(b.x - P.x, b.y - P.y);
    if (d < bd){ bd = d; best = b; }
  }
  return best;
}
function kidRun(k){
  const P = k.with, pts = [], best = kidBird(k);
  if (best){ pts.push([best.x, best.y]); k.chased++; k.chasing = true; }
  else {
    k.chasing = false;
    const th0 = Math.atan2(P.y - FOUNTAIN.y, P.x - FOUNTAIN.x), dir = R() < 0.5 ? 1 : -1;
    const r = FAM_RUN_R0 + R() * (FAM_RUN_R1 - FAM_RUN_R0), n = 3;
    for (let j = 0; j <= n; j++){
      const th = th0 + dir * (-FAM_ARC + 2 * FAM_ARC * j / n);
      pts.push([FOUNTAIN.x + Math.cos(th) * r, FOUNTAIN.y + Math.sin(th) * r]);
    }
  }
  return pts;
}
function startKidRun(k){
  k.run = kidRun(k); k.wp = k.run; k.i = 0;
  k.walkSpeed = k.speed; k.speed = k.runSpeed;
  k.state = 'walk'; k.cup = false;
}
function endKidRun(k){
  if (!k.run) return;
  k.run = null; k.chasing = false;              // the run speed is kept for the way back — kidSettle() restores it at the parent's side
  k.rest = FAM_REST0 + R() * (FAM_REST1 - FAM_REST0);

function kidSettle(k){ if (k.walkSpeed){ k.speed = k.walkSpeed; k.walkSpeed = 0; } }
/* a pigeon comes down on the roundel's paved rings: on the side where a family is

 * the child's leash), else any angle; off the basin by construction (the rings start
 * outside it — asserted against PAVING.plaza.keep), and never within the scare radius
 * of anyone already there, or it would be up again in the same frame. Returns null when
 * the spot is taken; the two draws are spent either way. */
const PLAZA_BIRD_SIDE = 1.2;      // half-angle of the arc round a seated family

/* ============ the evening's own arrivals (#79) ============ *
 * The town had an evening door (spawnTapAgent), homers (spawnHomeAgent) and a night on
 * the water that ONE person watched (a.nightRail). A warm dry evening now has its own
 * source: its own cap, never a share of laneCap or eastCap (a rare thing needs its
 * own source), open from sunDown − EVE_LEAD to sunDown + EVE_SPAN when it is warm,
 * dry underfoot and not blowing — closed in winter by the warmth term alone.
 * The window is 5.5 h ≈ 12.6 s of sim time, so the source is sized by the PLACES a walk
 * reaches before the window's END (#53), not by a rate: every spot is priced with
 * pathHours() — the ARRIVAL, plus EVE_STAND of standing, must land before the end;
 * the stay itself is ended by the window closing (the retire rule below), so nobody
 * is priced on a dwell — and the roll is spent only on the ones that fit. Priced at
 * the brief's −0.5 h lead and the lane's 0.75·speed NOTHING fit: the nearest post is
 * 13–15 cells from either gate, 4–5 h of walking, and at a 1.5 h lead one a night
 * stopped. Hence the 2.5 h lead (the tap's own model: tapUp is sunDown − 3) — they
 * walk in through the last of the light — and the deck posts reached by the alley,
 * not the length of the quay. Open ground, priced at a.speed (probe-evening.mjs
 * measured actual/predicted 1.13). The spots are posts along the quay rail south of the night
 * stander's stretch (5..11), the deck's OWN lean posts on its upstream rail, the near

 * each `taken` so two never render as one shape (the 0.9-cell law). */

 *   - the walk home itself. EVE_GONE is the hour the evening's people are off the
 *     frame; a spot is now chosen only if the ROUND TRIP fits it (eveFits), and

 *     only the hold is refused.

 *     refuses it, as #89's law says a priced walker must.

 * hurry) from EAST_GATE_A and their source releases nobody before sunDown-4, so their

const EVE_SPOTS = [

for (const s of EVE_SPOTS){ s.taken = 0; if (s.bench){ s.x = s.bench.x + 0.5; s.y = s.bench.y + 1.0; } }

function eveWeather(){ return warmth >= EVE_WARM && !raining && wetF() < EVE_WET && windF() < EVE_WIND; }

function stayCount(){ return agents.filter(a => a.stay).length; }               // the far side's own, under the two posts
function eveGate(s){ return s.g === 'Q' ? EAST_GATE_Q : s.g === 'A' ? EAST_GATE_A : EAST_GATE_P; }

function eveRelease(a){ if (a.eveSpot && !a.with){ a.eveSpot.taken = 0; } a.eveSpot = null; }

 * midnight, the halo warm and the window behind it slate. Per-frame, reset with LIT.
 * The church's rose window is NOT here: the cache holds only its unlit glass and
 * applyLight draws the lit disc live (roseLit), so one ramp off nightF sets the glass
 * and its glow together — the cached copy used to step at cache time while the glow
 * ramped, a two-sided dusk seam (#63, #81). */

 * the midwinter one changes every shadow in the frame from one place. */

/* ---- how hard the sun's edge is ------------------------------------------------
 * `cloudCover()` veiled the disc and muted the sky, and nothing on the ground was
 * ever told: under a grey lid the lane still had crisp midday shadows. But cover
 * does not merely dim a shadow, it dissolves it — the source stops being a point
 * and becomes the whole hemisphere, so the penumbra grows until the shadow is all
 * penumbra and the darkening collapses into contact under the object.
 *
 * ONE hardness scalar, and the three things it does are derivations of it rather
 * than three tunings: what fades also WIDENS and PULLS IN. There are eight cast
 * shadows in this town and tuning them individually is how they drift apart within
 * two iterations. Every one is written `x * f()` or `x - k*(1 - f())`, so below
 * SH_KNEE the multipliers are exactly 1 and a fair day is the old frame, byte for
 * byte — the neutrality is an identity, not a tolerance. Deliberately NOT applied

 * sky colours (drawRoofRow's `cc`), and veiling both is how you get a flat grey
 * world instead of an overcast one. */

const XLO = -12, XHI = GW + 12;                    // draw past the frame so the town never ends in black

/* ============ the weathervanes (#83) ============

/* Hit-tested in SCREEN space, a box round the plate; named with the wind it stands in. */
function vaneAt(p){

    const c = project(v.x, v.y, v.z), w = (v.len + 6) * viewS, L = v.len * viewS;
    if (Math.abs(p[0] - c[0]) <= w && p[1] >= c[1] - L - 2 * viewS && p[1] <= c[1] + L + 12 * viewS) return v;
  }

/* Where the vane points at a wind of strength w: 0 east .. PI west, into the wind (vaneAngle) */
function vaneHeading(w){
  const k = Math.round(Math.PI * (windSign + 1) * 0.5 * w / (Math.PI / 4));   // 0 east .. 4 west
  return ['east', 'north-east', 'north', 'north-west', 'west'][clamp(k, 0, 4)];

function vaneName(v){
  const w = windF();

const ARCHES = [

  {x:32.5,      yF:65, yB:61, hw:1.95, floor:'#b3a17e', samp:[32, 59]},

function drawSouthBand(){

function groundCol(x, y, t, hv, m){

  // #61: a dusted lawn whitens faster than its cover — 0.36 of cover mixed linearly is a
  // pale green in any daylight (c83); the curve is exact at 0 and 1, so no pop as the
  // first flakes settle and nothing changes under a full cover. Grass only: the beds,
  // paths and road keep reading dark through it as before
  const k = t === GRASS ? 1 - Math.pow(1 - sn, 1.8) : sn;

  const cl = lt ? mix(c, '#8a5a2c', 0.10 + 0.32 * (lt / LITTER_BUCKET | 0) / 7) : c;   // #66: leaf litter warms the ground it lies on
  return sn > 0 ? mix(cl, SNOW_COL, k) : cl;
