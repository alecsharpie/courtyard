  }
}
function drawBackdrop(g, hz, low){
  const starF = nightF * (1 - cloudCover());         // cover puts the stars out
  if (starF > 0.1){
    for (let k = 0; k < 120; k++){
      const sx = hash(k, 3) * W, sy = hash(k, 11) * hz * 0.95;
      g.fillStyle = 'rgba(234,240,255,' + (starF * (0.2 + 0.65 * hash(k, 19))) + ')';
      g.fillRect(sx, sy, 1.3, 1.3);
    }
  }
  // hills, hazed
  g.fillStyle = mix(low, nightF > 0.5 ? '#151d33' : '#93a7b2', 0.5);
  g.beginPath(); g.moveTo(-10, hz + 4 * cellH);
  for (let sx = -10; sx <= W + 30; sx += 24)
    g.lineTo(sx, hz - cellH * (0.6 + 2.0 * Math.sin(sx * 0.0031) + 1.0 * Math.sin(sx * 0.0093 + 1.7)));
  g.lineTo(W + 30, hz + 4 * cellH); g.closePath(); g.fill();
  // the rest of the town, further off than ours
  g.fillStyle = mix(low, nightF > 0.5 ? '#0d1424' : '#6f7c86', 0.7);
  const base = hz + 3.2 * cellH;
  let sx2 = -18;
  while (sx2 < W + 18){
    const key = Math.round(sx2);
    const w2 = cellW * (2.0 + hash(key, 5) * 3.2);
    const hgt = cellH * (1.4 + hash(key, 9) * 3.0);
    g.beginPath();
    if (hash(key, 13) > 0.9){                       // a distant spire
      g.moveTo(sx2, base); g.lineTo(sx2, base - hgt - cellH * 2.4);
      g.lineTo(sx2 + w2 * 0.5, base - hgt - cellH * 7.2);
      g.lineTo(sx2 + w2, base - hgt - cellH * 2.4); g.lineTo(sx2 + w2, base);
    } else {
      g.moveTo(sx2, base); g.lineTo(sx2, base - hgt);
      g.lineTo(sx2 + w2 * 0.5, base - hgt - cellH * 0.9);
      g.lineTo(sx2 + w2, base - hgt); g.lineTo(sx2 + w2, base);
    }
    g.closePath(); g.fill();
    sx2 += w2;
  }
  if (nightF > 0.3){
    g.fillStyle = 'rgba(255,205,130,' + (0.45 * nightF) + ')';
    for (let k = 0; k < 80; k++){
      if (hash(k, 23) > 0.45) continue;
      g.fillRect(hash(k, 29) * W, hz + cellH * (0.5 + hash(k, 31) * 2.2), 1.7, 1.7);
    }
  }
}

/* ============ buildings: hipped roofs grown off the footprint ============ */
const XLO = -12, XHI = GW + 12;                    // draw past the frame so the town never ends in black
function roofShade(x, y){
  const z00 = roofZ(x, y), z10 = roofZ(x + 1, y), z11 = roofZ(x + 1, y + 1), z01 = roofZ(x, y + 1);
  const gx = ((z10 + z11) - (z00 + z01)) / 2, gy = ((z01 + z11) - (z00 + z10)) / 2;
  const nl = Math.hypot(gx, gy, 1);
  return [clamp((-gx * SUN[0] - gy * SUN[1] + SUN[2]) / nl, 0, 1), z00, z10, z11, z01];
}
let HAZE = '#c6dcec';
function drawRoofRow(g, y){
  const cc = cloudCover();                                       // cover flattens the key light
  // the key weakens with the sun's height as well as with cover: a winter noon is as
  // long-shadowed and as flat as a summer evening. (0.84..1.16 about warmth 0.5 = 1)
  const amb = 0.26 + 0.20 * daylight + 0.07 * cc * daylight,
        key = (0.22 + 0.78 * daylight) * (1 - 0.5 * cc) * (0.84 + 0.32 * warmth);
  for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    if (!solidM[y * GW + gx]) continue;
    const out = x !== gx;                                        // beyond the frame: the town, hazed
    const r = roofShade(x, y), lam = r[0];
    const hv = hash(gx, y);
    const sy = solidC(x, y + 1) ? y + 1 : y + 1.3;               // eaves overhang the wall below
    const dz = solidC(x, y + 1) ? 0 : SLOPE * 0.3;
    const t = clamp(amb + 0.8 * lam * key + hv * 0.08 - 0.04, 0, 1);
    let col = mix('#6f4a39', '#cd9268', t);
    if (out) col = mix(col, HAZE, 0.55);
    g.fillStyle = col;
    const a = project(x, y, r[1]), b = project(x + 1, y, r[2]);
    const c = project(x + 1, sy, r[3] - dz), d = project(x, sy, r[4] - dz);
    poly(g, [a, b, c, d]); g.fill();
    if (out) continue;
    g.strokeStyle = 'rgba(48,29,21,' + (0.13 + 0.14 * lam) + ')'; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    g.moveTo(a[0], a[1]); g.lineTo(d[0], d[1]); g.stroke();
    if (dz){                                                     // shadow the wall under the eaves
      g.fillStyle = 'rgba(30,22,16,.32)';
      const e1 = project(x, y + 1, r[4]), e2 = project(x + 1, y + 1, r[3]);
      poly(g, [e1, e2, c, d]); g.fill();
    }
    if (hash(gx * 5, y * 3) > 0.965 && Math.min(roofD(x, y), roofD(x + 1, y + 1)) > 0.95){
      drawChimney(g, x, y);
      if (x === gx && !CHIMNEYS.some(c => c[0] === x && c[1] === y)) CHIMNEYS.push([x, y]);
    }
  }
}
function drawCrests(g, y){
  g.strokeStyle = 'rgba(244,208,178,.45)'; g.lineWidth = Math.max(1, cellW * 0.11);
  g.beginPath();
  for (let x = XLO; x < XHI; x++){
    const d0 = roofD(x, y), d1 = roofD(x + 1, y);
    if (d0 >= 0.9 && d1 >= 0.9 && roofD(x, y - 1) < d0 - 0.05 && roofD(x, y + 1) < d0 - 0.05 &&
        roofD(x + 1, y - 1) < d1 - 0.05 && roofD(x + 1, y + 1) < d1 - 0.05){
      const a = project(x, y, roofZ(x, y)), b = project(x + 1, y, roofZ(x + 1, y));
      g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    }
    const e0 = roofD(x, y), e1 = roofD(x, y + 1);
    if (e0 >= 0.9 && e1 >= 0.9 && roofD(x - 1, y) < e0 - 0.05 && roofD(x + 1, y) < e0 - 0.05 &&
        roofD(x - 1, y + 1) < e1 - 0.05 && roofD(x + 1, y + 1) < e1 - 0.05){
      const a = project(x, y, roofZ(x, y)), b = project(x, y + 1, roofZ(x, y + 1));
      g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    }
  }
  g.stroke();
}
function drawChimney(g, x, y){
  const z = (roofZ(x, y) + roofZ(x + 1, y) + roofZ(x + 1, y + 1) + roofZ(x, y + 1)) / 4;
  const h = 1.4 + hash(x, y * 3) * 1.0, w = 0.40, cy = y + 0.72;
  const bl = project(x + 0.5 - w, cy, z - 0.5), br = project(x + 0.5 + w, cy, z - 0.5);
  const tl = project(x + 0.5 - w, cy, z + h), tr = project(x + 0.5 + w, cy, z + h);
  const gr = g.createLinearGradient(tl[0], 0, tr[0], 0);
  gr.addColorStop(0, SUN[0] > 0 ? '#6b5a4a' : '#9a8770');
  gr.addColorStop(1, SUN[0] > 0 ? '#9a8770' : '#6b5a4a');
  g.fillStyle = gr; poly(g, [tl, tr, br, bl]); g.fill();
  const cl = project(x + 0.5 - w - 0.1, cy, z + h), cr = project(x + 0.5 + w + 0.1, cy, z + h);
  const ul = project(x + 0.5 - w - 0.1, cy - 0.22, z + h + 0.2), ur = project(x + 0.5 + w + 0.1, cy - 0.22, z + h + 0.2);
  g.fillStyle = '#b3a48c'; poly(g, [ul, ur, cr, cl]); g.fill();
  g.strokeStyle = '#a35e3c'; g.lineWidth = Math.max(1.5, cellW * 0.13);
  for (const px of [-0.17, 0.17]){
    const p1 = project(x + 0.5 + px, cy - 0.1, z + h + 0.18), p2 = project(x + 0.5 + px, cy - 0.1, z + h + 0.66);
    g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke();
  }
}
function drawWindow(g, wx, wy, zTop, hgt, sa, sb){
  const w = 0.32;
  const a = project(wx - w, wy, zTop), b = project(wx + w, wy, zTop);
  const c = project(wx + w, wy, zTop - hgt), d = project(wx - w, wy, zTop - hgt);
  g.fillStyle = 'rgba(240,233,216,.85)'; poly(g, [a, b, c, d]); g.fill();
  const p = 0.76;
  const iA = project(wx - w * p, wy, zTop - hgt * 0.11), iB = project(wx + w * p, wy, zTop - hgt * 0.11);
  const iC = project(wx + w * p, wy, zTop - hgt * 0.9), iD = project(wx - w * p, wy, zTop - hgt * 0.9);
  const lit = nightF > 0.3 && hash(sa * 3, sb * 7 + day) > 0.42;
  g.fillStyle = lit ? 'rgba(255,208,140,.95)' : mix('#242a33', '#7d94a6', 0.18 + 0.5 * daylight);
  poly(g, [iA, iB, iC, iD]); g.fill();
  if (lit) LIT.push([(iA[0] + iC[0]) / 2, (iA[1] + iC[1]) / 2]);
  g.strokeStyle = 'rgba(244,238,224,.7)'; g.lineWidth = 1;
  const m1 = project(wx, wy, zTop - hgt * 0.11), m2 = project(wx, wy, zTop - hgt * 0.9);
  const h1 = project(wx - w * p, wy, zTop - hgt * 0.5), h2 = project(wx + w * p, wy, zTop - hgt * 0.5);
  g.beginPath(); g.moveTo(m1[0], m1[1]); g.lineTo(m2[0], m2[1]);
  g.moveTo(h1[0], h1[1]); g.lineTo(h2[0], h2[1]); g.stroke();
  const s1 = project(wx - w * 1.2, wy, zTop - hgt), s2 = project(wx + w * 1.2, wy, zTop - hgt);
  const s3 = project(wx + w * 1.2, wy, zTop - hgt - 0.14), s4 = project(wx - w * 1.2, wy, zTop - hgt - 0.14);
  g.fillStyle = 'rgba(232,224,206,.9)'; poly(g, [s1, s2, s3, s4]); g.fill();
}
const PLASTER = ['#cabda2', '#c8b596', '#c1bda8', '#d0c1a4', '#bcb49c', '#c9b9a4', '#c4b291'];
function drawFaceRow(g, y){
  const wt = 0.22 + 0.6 * daylight;
  for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    if (!solidM[y * GW + gx] || solidC(x, y + 1)) continue;
    const out = x !== gx;
    const house = Math.floor((gx + 1) / 3.5);                 // the terrace is separate houses
    const zL = roofZ(x, y + 1), zR = roofZ(x + 1, y + 1);
    const a = project(x, y + 1, 0), b = project(x + 1, y + 1, 0);
    const c = project(x + 1, y + 1, zR), d = project(x, y + 1, zL);
    const pl = PLASTER[(hash(house, y * 3) * PLASTER.length) | 0];
    const gr = g.createLinearGradient(0, d[1], 0, a[1]);
    let hi = mix('#3f3a33', pl, clamp(wt + 0.16, 0, 1));
    let lo = mix('#302b25', mix(pl, '#6f6552', 0.4), clamp(wt + 0.06, 0, 1));
    if (out){ hi = mix(hi, HAZE, 0.55); lo = mix(lo, HAZE, 0.55); }
    gr.addColorStop(0, hi); gr.addColorStop(1, lo);
    g.fillStyle = gr; poly(g, [d, c, b, a]); g.fill();
    if (out) continue;
    if (hash(house, y * 5) > 0.72){                           // some fronts are brick
      g.strokeStyle = 'rgba(120,96,74,.16)'; g.lineWidth = 0.7;
      for (let z = 0.35; z < Math.min(zL, zR); z += 0.42){
        const q1 = project(x, y + 1, z), q2 = project(x + 1, y + 1, z);
        g.beginPath(); g.moveTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.stroke();
      }
    }
    g.strokeStyle = 'rgba(40,32,24,.18)'; g.lineWidth = 1;    // party wall between houses
    if (Math.floor((gx + 2) / 3.5) !== house){
      g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.stroke();
    }
    g.fillStyle = 'rgba(24,18,12,.16)';                       // ground line, so walls sit rather than float
    const gl1 = project(x, y + 1, 0.16), gl2 = project(x + 1, y + 1, 0.16);
    poly(g, [gl1, gl2, b, a]); g.fill();
    const e = Math.min(zL, zR);
    if (churchAt(gx, y) || e < 2.4) continue;
    const slot = ((gx % 7) + 7) % 7;
    if ((slot === 1 || slot === 4) && hash(gx, y * 7) > 0.12){
      drawWindow(g, x + 0.5, y + 1, e * 0.86, e * 0.30, gx, y);
      if (e > 4.2 && hash(gx, y * 9) > 0.2) drawWindow(g, x + 0.5, y + 1, e * 0.48, e * 0.28, gx, y + 40);
    } else if (slot === 6 && hash(gx, y * 13) > 0.45){
      const dw = 0.34, dh = e * 0.34;                          // a front door
      const p1 = project(x + 0.5 - dw, y + 1, dh), p2 = project(x + 0.5 + dw, y + 1, dh);
      const p3 = project(x + 0.5 + dw, y + 1, 0), p4 = project(x + 0.5 - dw, y + 1, 0);
      g.fillStyle = 'rgba(238,231,214,.75)'; poly(g, [p1, p2, p3, p4]); g.fill();
      const q1 = project(x + 0.5 - dw * 0.72, y + 1, dh * 0.92), q2 = project(x + 0.5 + dw * 0.72, y + 1, dh * 0.92);
      const q3 = project(x + 0.5 + dw * 0.72, y + 1, 0), q4 = project(x + 0.5 - dw * 0.72, y + 1, 0);
      g.fillStyle = ['#4a5f5a', '#6b3f38', '#3d4a63', '#5a4a34'][(hash(gx, 17) * 4) | 0];
      poly(g, [q1, q2, q3, q4]); g.fill();
      g.fillStyle = '#d8c98a';
      g.beginPath(); g.arc(q2[0] - 2, (q2[1] + q3[1]) / 2, 1.2, 0, 7); g.fill();
    }
  }
}
function drawBlocks(g, y0, y1){
  for (let y = y0; y < y1; y++){
    drawFaceRow(g, y);
    drawRoofRow(g, y);
    drawCrests(g, y);
    if (y === 2) drawClockTower(g);
    if (y === CHURCH.ty1 - 1) drawChurchTower(g);
    if (y === CHURCH.ny1 - 1) drawChurchFront(g);
  }
}

/* ============ the clock tower, standing on the sliver's roofline ============ */
const CT = {x0:63.8, x1:66.2, yF:3, yB:1.1, base:5.4, top:13.0};
function towerFace(g, x0, x1, y, z0, z1, c0, c1){
  const a = project(x0, y, z1), b = project(x1, y, z1), c = project(x1, y, z0), d = project(x0, y, z0);
  const gr = g.createLinearGradient(a[0], 0, b[0], 0);
  gr.addColorStop(0, SUN[0] > 0 ? c0 : c1); gr.addColorStop(1, SUN[0] > 0 ? c1 : c0);
  g.fillStyle = gr; poly(g, [a, b, c, d]); g.fill();
}
function towerTop(g, x0, x1, yF, yB, z, col){    // a horizontal ledge, which is what sells the depth
  const a = project(x0, yB, z), b = project(x1, yB, z), c = project(x1, yF, z), d = project(x0, yF, z);
  g.fillStyle = col; poly(g, [a, b, c, d]); g.fill();
}
function drawClockTower(g){
  const {x0, x1, yF, yB, base, top} = CT;
  // lead flashing where the roof runs into the tower
  towerTop(g, x0 - 0.28, x1 + 0.28, yF + 0.15, yB - 0.15, base + 0.5, 'rgba(64,58,48,.9)');
  towerFace(g, x0, x1, yF, base, top, '#8d8067', '#b6a88d');
  g.strokeStyle = 'rgba(58,50,38,.45)'; g.lineWidth = 1;
  poly(g, [project(x0, yF, top), project(x1, yF, top), project(x1, yF, base), project(x0, yF, base)]); g.stroke();
  // string courses, each with a visible top ledge
  for (const z of [base + 1.6, base + 4.4]){
    towerFace(g, x0 - 0.1, x1 + 0.1, yF + 0.1, z, z + 0.24, '#8a7d64', '#c0b295');
    towerTop(g, x0 - 0.1, x1 + 0.1, yF + 0.1, yB, z + 0.24, 'rgba(206,194,168,.85)');
  }
  // clock face
  const [ccx, ccy] = project((x0 + x1) / 2, yF, 10.2);
  const rr = cellW * 0.92;
  g.fillStyle = '#7d715c'; g.beginPath(); g.arc(ccx, ccy, rr * 1.16, 0, 7); g.fill();
  g.fillStyle = '#efe7d2'; g.beginPath(); g.arc(ccx, ccy, rr, 0, 7); g.fill();
  g.strokeStyle = '#4a4034'; g.lineWidth = 1.4; g.beginPath(); g.arc(ccx, ccy, rr, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(74,64,52,.8)'; g.lineWidth = 1;
  for (let k = 0; k < 12; k++){
    const th = k / 12 * Math.PI * 2;
    g.beginPath();
    g.moveTo(ccx + Math.cos(th) * rr * 0.84, ccy + Math.sin(th) * rr * 0.84);
    g.lineTo(ccx + Math.cos(th) * rr * 0.96, ccy + Math.sin(th) * rr * 0.96); g.stroke();
  }
  // belfry: a louvred opening under the cornice
  const bl = project(x0 + 0.55, yF, 12.5), br = project(x1 - 0.55, yF, 12.5);
  const bb = project(x0 + 0.55, yF, 11.2), bb2 = project(x1 - 0.55, yF, 11.2);
  g.fillStyle = '#2a251d'; poly(g, [bl, br, bb2, bb]); g.fill();
  g.strokeStyle = 'rgba(150,138,116,.7)'; g.lineWidth = 1;
  for (let k = 1; k < 6; k++){
    const z = 11.2 + k * 0.22;
    const s1 = project(x0 + 0.55, yF, z), s2 = project(x1 - 0.55, yF, z);
    g.beginPath(); g.moveTo(s1[0], s1[1]); g.lineTo(s2[0], s2[1]); g.stroke();
  }
  // cornice, then the pyramid cap
  towerFace(g, x0 - 0.28, x1 + 0.28, yF + 0.2, top - 0.35, top, '#9c8f75', '#cabb9c');
  towerTop(g, x0 - 0.28, x1 + 0.28, yF + 0.2, yB - 0.2, top, 'rgba(214,202,175,.9)');
  const apex = project((x0 + x1) / 2, (yF + yB) / 2, top + 3.4);
  const c1 = project(x0 - 0.2, yF + 0.2, top), c2 = project(x1 + 0.2, yF + 0.2, top);
  const c3 = project(x1 + 0.2, yB - 0.2, top), c4 = project(x0 - 0.2, yB - 0.2, top);
  g.fillStyle = mix('#3c4148', '#6d747c', 0.3 + 0.5 * daylight);
  poly(g, [c1, c2, apex]); g.fill();
  g.fillStyle = mix('#2e333a', '#565d66', 0.3 + 0.5 * daylight);
  poly(g, [c2, c3, apex]); g.fill();
  g.fillStyle = mix('#343940', '#616872', 0.3 + 0.5 * daylight);
  poly(g, [c4, c1, apex]); g.fill();
  g.strokeStyle = 'rgba(210,214,220,.35)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(c1[0], c1[1]); g.lineTo(apex[0], apex[1]);
  g.moveTo(c2[0], c2[1]); g.lineTo(apex[0], apex[1]); g.stroke();
  const vane = project((x0 + x1) / 2, (yF + yB) / 2, top + 4.8);
  g.strokeStyle = '#2f2b26'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(apex[0], apex[1]); g.lineTo(vane[0], vane[1]); g.stroke();
  g.fillStyle = '#4a4238';
  poly(g, [[vane[0] - 5, vane[1] + 1], [vane[0] + 5, vane[1] + 3], [vane[0] - 5, vane[1] + 5]]); g.fill();
}

/* ============ the church across the river ============ */
function drawChurchTower(g){
  const x0 = CHURCH.tx0 + 0.15, x1 = CHURCH.tx1 - 0.15, yF = CHURCH.ty1, yB = CHURCH.ty0 + 0.2;
  const base = 6.0, top = 13.6;
  towerFace(g, x0, x1, yF, base, top, '#8a8270', '#b5ad97');
  for (const z of [base + 2.2, base + 5.2]){
    towerFace(g, x0 - 0.12, x1 + 0.12, yF + 0.12, z, z + 0.22, '#867e6c', '#bdb59d');
    towerTop(g, x0 - 0.12, x1 + 0.12, yF + 0.12, yB, z + 0.22, 'rgba(202,194,172,.85)');
  }
  // a tall louvred belfry opening
  const oT = 12.4, oB = 9.6, ox = 0.55;
  const a = project(x0 + ox, yF, oT - 0.1), b = project(x1 - ox, yF, oT - 0.1);
  const c = project(x1 - ox, yF, oB), d = project(x0 + ox, yF, oB);
  const crown = project((x0 + x1) / 2, yF, oT + 0.7);
  g.fillStyle = '#241f19';

  g.quadraticCurveTo(a[0], crown[1], crown[0], crown[1]);

/* ============ archways: real openings you can watch people walk through ============ */
// `samp` is the cell you would actually be standing on once through, so the light at
// the far end of a passage is the real ground of wherever it leads
const ARCHES = [
  {x:32.5,      yF:3,  yB:0,  hw:1.95, floor:'#b3a17e', beyond:'#cabd97'},
  {x:32.5,      yF:65, yB:61, hw:1.95, floor:'#b3a17e', samp:[32, 59]},
  {x:ALT_GATE,  yF:65, yB:61, hw:1.7,  floor:'#a89878', samp:[86, 59]},
  {x:PARK_GATE, yF:65, yB:61, hw:1.7,  floor:'#a89878', samp:[134, 59]},

function farCol(A){
  if (!A.samp) return A.beyond;
  const [sx, sy] = A.samp;

for (const A of ARCHES) A.top = eaveFor(Math.round(A.x), A.yF === 3 ? 1 : 62) - 0.7;
function archShape(g, A, grow){
  const e = grow || 0, hw = A.hw + e, top = A.top + e * 0.85, sp = top * 0.5;
  const bl = project(A.x - hw, A.yF, 0), br = project(A.x + hw, A.yF, 0);
  const sl = project(A.x - hw, A.yF, sp), sr = project(A.x + hw, A.yF, sp);
  const cr = project(A.x, A.yF, top);

  g.quadraticCurveTo(sl[0], cr[1], cr[0], cr[1]);
  g.quadraticCurveTo(sr[0], cr[1], sr[0], sr[1]);
  g.lineTo(br[0], br[1]); g.closePath();
}
function tunnelFolk(g, A){
  const lo = Math.min(A.yF, A.yB) - 1.0, hi = Math.max(A.yF, A.yB) + 1.0;
  for (const a of agents){
    if (a.x < A.x - A.hw || a.x > A.x + A.hw || a.y < lo || a.y > hi) continue;
    g.globalAlpha = 0.82;

function archAtY(g, x, yy, top, hw){
  const sp = top * 0.5;
  const bl = project(x - hw, yy, 0), br = project(x + hw, yy, 0);
  const sl = project(x - hw, yy, sp), sr = project(x + hw, yy, sp);
  const cr = project(x, yy, top);
  g.beginPath();
  g.moveTo(bl[0], bl[1]); g.lineTo(sl[0], sl[1]);
  g.quadraticCurveTo(sl[0], cr[1], cr[0], cr[1]);
  g.quadraticCurveTo(sr[0], cr[1], sr[0], sr[1]);
  g.lineTo(br[0], br[1]); g.closePath();
}
function drawPassage(g, A){

  const far = farCol(A);
  const DEEP = '#191309';
  // a passage is lit from both ends and darkest in its middle
  const vaultAt = u => mix(DEEP, far, clamp(Math.max(Math.pow(u, 2.2), Math.pow(1 - u, 2.6) * 0.55), 0, 1) * 0.85);
  g.save();
  archShape(g, A); g.clip();
  archShape(g, A, 0.6); g.fillStyle = vaultAt(0); g.fill();
  // vault rings, drawn near to far so the far mouth ends up innermost
  for (let k = 1; k <= 6; k++){
    const u = k / 6, s = 1 - k * 0.014;
    archAtY(g, A.x, A.yF + (A.yB - A.yF) * u, top * s, hw * s);
    g.fillStyle = k === 6 ? far : vaultAt(u);
    g.fill();

  const fa = project(A.x - hw, A.yB, 0), fb = project(A.x + hw, A.yB, 0);
  const n1 = project(A.x - hw, A.yF, 0), n2 = project(A.x + hw, A.yF, 0);

  fl.addColorStop(1, mix(A.floor, '#3b3126', 0.40));
  g.fillStyle = fl; poly(g, [fa, fb, n2, n1]); g.fill();
  // daylight spilling in from whatever lies beyond
  const gl = g.createLinearGradient(0, fa[1] - cellH * 2.4, 0, fa[1] + cellH * 1.4);
  gl.addColorStop(0, 'rgba(255,246,220,' + (0.10 + 0.24 * daylight) + ')');
  gl.addColorStop(1, 'rgba(255,246,220,0)');
  g.fillStyle = gl; poly(g, [project(A.x - hw, A.yB, top), project(A.x + hw, A.yB, top), fb, fa]); g.fill();

  archShape(g, A, 0.1); g.stroke();
  g.strokeStyle = 'rgba(226,216,192,.45)'; g.lineWidth = Math.max(1, cellW * 0.1);
  archShape(g, A, 0.2); g.stroke();
  const [kx, ky] = project(A.x, A.yF, A.top + 0.1);
  g.fillStyle = 'rgba(230,220,198,.7)';

function drawArch(it){ drawPassage(ctx, it.A); }
function drawSouthBand(){
  for (let y = 61; y <= 64; y++){
    drawFaceRow(ctx, y); drawRoofRow(ctx, y); drawCrests(ctx, y);
  }
  if (richness() > 0.2){                               // ivy climbing the gatehouse
    // the same warmth again, not a private one. Which vines EXIST stays on richness():
    // an established vine thins back over winter, it does not blink out of the wall and
    // return — so the season moves the reach and the colour, and nothing pops.
    const iv = lerp(0.60, 1.40, warmth);
    ctx.fillStyle = 'rgba(' + (lerp(90,58,warmth)|0) + ',' + (lerp(90,120,warmth)|0) + ',' + (lerp(55,53,warmth)|0) + ',.7)';
    for (const vx of [10, 24, 51, 92]){
      if (hash(vx, 3) > richness() * 1.4) continue;
      // ...and it stops at the eaves. The gatehouse eave measures 5.6, and an unclamped
      // summer reach is 6.44 — ivy climbing off the roofline into the sky.
      for (let z = 0; z < Math.min(5.2, 4.6 * Math.min(1, richness() * 1.6) * iv); z += 0.42){
        const p = project(vx + Math.sin(z * 2.2) * 0.5, 65, z);

function groundCol(x, y, t, hv, m){
  if (t === PATH) return mix('#c3b18c', '#cfbd98', hv);
  if (t === SLOT) return mix('#9d8f73', '#ab9d80', hv);
  if (t === GRASS){
    // the lawn reads the SAME warmth the beds do rather than deriving its own idea of
    // the season — so it cannot green up while the beds are turning over
    const health = clamp(0.35 + m * 0.75 * lerp(0.62, 1.38, warmth) - hv * 0.18, 0, 1);
    const g1 = x >= FAR_X0 ? mix('#93a86a', '#6f9a4a', health * (0.75 + 0.25 * hash(x >> 1, y >> 1)))
             : x >= XS_E1 ? mix('#a8ad74', '#82a556', health * (0.7 + 0.3 * hash(x >> 1, y >> 1)))
             : mix('#9aa96b', '#74a04c', health);
    return mix(g1, '#a4906a', Math.pow(wear[y * GW + x], 0.7));
  }
  if (t === BED || t === CBED) return mix('#5c4832', '#6b563c', hv);
  if (t === SIDE) return mix('#b3a88f', '#bfb49b', hv);
  if (t === ROAD) return mix('#87806f', '#8d8675', hv * 0.5);
  if (t === WATER){
    if (x >= RIVER_X0 - 1 && x <= RIVER_X1){
      // the deep channel is WIDER when the river runs high — the same gradient, pushed
      // out toward both banks in winter and drawn back to a thread in August
      const mid = 1 - Math.abs((x + 0.5 - (RIVER_X0 + RIVER_X1) / 2) / ((RIVER_X1 - RIVER_X0) / 2));
      return riverCol(mix(mix('#5d7a84', '#546f7c', hv * 0.6), '#3f5a68',
                          clamp(mid * riverRun(), 0, 1)));
    }
    if (x >= PLAZA_X0 && x < PLAZA_X1) return mix('#527a86', '#4a6f7c', hv * 0.5);
    const depth = 1 - Math.hypot((x + .5 - POND.x) / POND.rx, (y + .5 - POND.y) / POND.ry);
    return mix('#7a948e', '#4f7580', clamp(depth * 1.8, 0, 1));
  }
  return '#6b4f39';
}
function drawShadows(g){
  if (daylight < 0.05) return;
  const hard = shadowF(), off = shOffset();
  g.fillStyle = 'rgba(26,28,22,' + (0.10 + 0.16 * daylight) * hard + ')';
  g.beginPath();
  for (let y = 0; y < WH; y++) for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    if (!solidM[y * GW + gx]) continue;
    const h = (eaveM[y * GW + gx] + 0.4) * off;
    const tx = x - SUN[0] / SUN[2] * h, ty = y - SUN[1] / SUN[2] * h;
    if (ty < -1 || ty >= WH) continue;
    if (solidC(Math.floor(tx), Math.floor(ty))) continue;
    const a = project(tx, ty, 0), b = project(tx + 1, ty, 0);
    const c = project(tx + 1, ty + 1, 0), d = project(tx, ty + 1, 0);
    g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.closePath();
  }
  /* This is the one shadow that can be softened for real rather than swelled: it is
   * a grid of quads (no radius to grow) and it lives on the CACHED ground layer,
   * whose rebuild bucket already rides cover — so the blur costs nothing per frame.
   * `filter` is absent on older Safari; there it degrades to fade-and-retract. */
  const blur = CAN_BLUR ? (1 - hard) * cellW * 0.6 : 0;
  if (blur > 0.3){ g.save(); g.filter = 'blur(' + blur.toFixed(2) + 'px)'; g.fill(); g.restore(); }
  else g.fill();
}
function drawGround(){
  gcv.width = W * DPR; gcv.height = H * DPR;
  gtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SUN = sunVec(); LIT.length = 0; HAZE = skyCols()[1];
  const m = maturity();
  // the sky is *not* baked in here — it is painted fresh every frame underneath this
  // layer, so the sun crosses smoothly instead of hopping when the layer is rebuilt
  // ground, drawn well past the frame so the town never stops in mid-air
  for (let y = 0; y < WH; y++) for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    const i = y * GW + gx, t = grid[i], hv = hash(gx, y);
    if (t === WALL || t === VOID) continue;
    if (t === TUNNEL){                                   // floor of a roofed passage

    }

      let nearWater = false;

      if (nearWater){
        const rs = cellW / 13;

        for (let k = 0; k < 3; k++){

function drawQuayWalls(g){

function drawBridge(g){
  const x0 = RIVER_X0 - 0.6, x1 = RIVER_X1 + 0.6, yS = LN_WALK_S, yN = LN_WALK_N;
  // the downstream face, which is the side we look at

  const c = project(x1, yS, 2.5), d = project(x0, yS, 2.5);

  gr.addColorStop(1, mix('#332f28', '#7d7663', 0.3 + 0.55 * daylight));

    const hw = 2.1, top = 1.55, sp = 0.35;

    const sl = project(ax - hw, yS, sp), sr = project(ax + hw, yS, sp);
    const cr = project(ax, yS, top);

  const k3 = project(x1, yS - 0.32, 2.72), k4 = project(x0, yS - 0.32, 2.72);
  poly(g, [k4, k3, k2, k1]); g.fill();
  g.strokeStyle = 'rgba(150,142,124,.85)'; g.lineWidth = Math.max(1.2, cellW * 0.13);

    const p1 = project(px, yS, 2.5), p2 = project(px, yS, 3.15);

  }
  g.fillStyle = 'rgba(214,205,183,.95)';
  const r1 = project(x0, yS, 3.15), r2 = project(x1, yS, 3.15);
  const r3 = project(x1, yS - 0.3, 3.42), r4 = project(x0, yS - 0.3, 3.42);
  poly(g, [r4, r3, r2, r1]); g.fill();

  const u1 = project(x0, yN, 0), u2 = project(x1, yN, 0);
  const u3 = project(x1, yN, PARAPET_Z), u4 = project(x0, yN, PARAPET_Z);
  g.fillStyle = mix('#3f3b33', '#9a927c', 0.25 + 0.5 * daylight);
  poly(g, [u4, u3, u2, u1]); g.fill();
  g.fillStyle = 'rgba(206,197,175,.85)';
  const v1 = project(x0, yN, PARAPET_Z), v2 = project(x1, yN, PARAPET_Z);
  const v3 = project(x1, yN - 0.3, PARAPET_Z + 0.22), v4 = project(x0, yN - 0.3, PARAPET_Z + 0.22);

function drawOurSide(g){

  for (const [px0, px1] of [[0, cut0], [cut1, W]]){
    g.fillStyle = gr; g.fillRect(px0, e1[1], px1 - px0, H - e1[1]);
    const sh = g.createLinearGradient(0, e1[1] - 24, 0, e1[1]);
    sh.addColorStop(0, 'rgba(10,8,5,0)'); sh.addColorStop(1, 'rgba(10,8,5,.4)');
    g.fillStyle = sh; g.fillRect(px0, e1[1] - 24, px1 - px0, 24);

  for (const [ax0, ax1, c1] of [[5, 15, '#8a4a3c'], [22, 30, '#4a6b52'], [40, 54, '#4a5f8a'],
      [64, 76, '#8a6b3c'], [82, 93, '#5f4a6e'], [131, 137, '#6b4a3c']]){

    g.save();

    g.fillStyle = '#d8cbb2';

function drawSill(g){
  // our own windowsill, in the near dark at the bottom of the view
  const sy = H - Math.max(26, H * 0.075), u = Math.max(5, cellW * 0.7);
  const warm = 0.10 + 0.55 * daylight;
  g.fillStyle = '#0a0806'; g.fillRect(0, sy, W, H - sy);
  g.fillStyle = 'rgba(196,168,124,' + (0.10 + 0.22 * warm) + ')';
  g.fillRect(0, sy, W, 2.2);                                   // the lit front edge of the sill
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, sy + 2.2, W, 3);
  const silh = 'rgba(9,8,6,1)', rim = 'rgba(190,164,120,' + (0.06 + 0.18 * warm) + ')';
  // two pots of geraniums and, between them, a forgotten cup
  for (const [px, s] of [[W * 0.055, 1], [W * 0.945, 0.85]]){
    const pw = u * 1.5 * s, ph = u * 1.25 * s;
    g.fillStyle = silh;
    g.beginPath();
    g.moveTo(px - pw, sy - ph); g.lineTo(px + pw, sy - ph);
    g.lineTo(px + pw * 0.72, sy + 3); g.lineTo(px - pw * 0.72, sy + 3);
    g.closePath(); g.fill();
    g.fillStyle = rim; g.fillRect(px - pw, sy - ph, pw * 2, 2);
    g.fillStyle = silh;
    for (let k = 0; k < 9; k++){
      const a2 = -Math.PI / 2 + (k / 8 - 0.5) * 2.5;
      const r2 = u * (1.4 + hash(k, px | 0) * 1.5) * s;
      const lx = px + Math.cos(a2) * r2, ly = sy - ph + Math.sin(a2) * r2 * 0.85;
      g.beginPath(); g.ellipse(lx, ly, u * 0.42 * s, u * 0.3 * s, a2, 0, 7); g.fill();
    }
  }
  const cx2 = W * 0.5, cw = u * 0.62;
  g.fillStyle = silh;
  g.beginPath();
  g.moveTo(cx2 - cw, sy - u * 0.72); g.lineTo(cx2 + cw, sy - u * 0.72);
  g.lineTo(cx2 + cw * 0.7, sy + 2); g.lineTo(cx2 - cw * 0.7, sy + 2);
  g.closePath(); g.fill();
  g.strokeStyle = silh; g.lineWidth = Math.max(1.6, u * 0.16);
  g.beginPath(); g.arc(cx2 + cw * 1.3, sy - u * 0.4, u * 0.36, -1.4, 1.4); g.stroke();
  g.fillStyle = rim; g.fillRect(cx2 - cw, sy - u * 0.72, cw * 2, 1.6);
}

let windT = 0;

                    [101, 33.5], [110, 26.5], [112.7, 34],                  // plaza and quay
                    [RIVER_X0 - 0.4, 65.4], [RIVER_X1 + 0.4, 65.4],         // bridge ends
                    [128.4, 65.6], [135, 65.6], [128.9, 20], [128.9, 46],   // far bank

    ctx.fillStyle = 'rgba(190,210,228,' + al * 3 + ')';

      ctx.strokeStyle = 'rgba(220,232,235,' + (0.35 * (1 - ph2) * rainFall) + ')'; ctx.lineWidth = 1;

      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.quadraticCurveTo(midx, midy, p2[0], p2[1]); ctx.stroke();
      for (let k = 0; k < 5; k++){
        // Each garment's own moment to be unpegged, in a fixed per-day order, plus a
        // ~1.6 s fade so the last of it goes soft rather than blinking out.
        // Both ends of the 0.16..0.82 band are load-bearing:
        //   TOP — rain can start once cover passes 0.66, which is weatherComing() 0.91,
        //   and the predicate then steps to a flat 1. Anything still pegged up in
        //   0.82..1 would come down in that one frame, the exact all-at-once vanish this
        //   is here to remove. The line is always empty before the first drop can land.
        //   BOTTOM — must be >= the 0.14 fade width, or the lowest-hashed garment starts
        //   its fade before takenIn even leaves 0 and hangs at 71% alpha in perfect
        //   weather. It did, for four gate runs, until a probe printed 9.49 of 10.
        const gone = clamp((0.16 + hash(k + seed, day + 7) * 0.66 - takenIn) / 0.14, 0, 1);
        if (gone <= 0) continue;
        const tt = 0.14 + k * 0.18;
        const gx2 = lerp(lerp(p1[0], midx, tt), lerp(midx, p2[0], tt), tt);
        const gy2 = lerp(lerp(p1[1], midy, tt), lerp(midy, p2[1], tt), tt);
        const swg = Math.sin(windT * 2.2 + k * 1.7 + seed) * (isWindy() ? 5 : 1.8);
        const hv2 = hash(k + seed, day);
        const w2 = cellW * (0.5 + hv2 * 0.45), h2 = cellH * (1.5 + hv2 * 1.6);
        ctx.save();
        ctx.globalAlpha = gone;
        ctx.translate(gx2, gy2);
        ctx.rotate(swg * 0.045);
        ctx.fillStyle = 'rgba(60,52,44,.7)';                      // the peg
        ctx.fillRect(-1, -2, 2, 3.5);
        ctx.fillStyle = wcols[(hv2 * wcols.length) | 0];
        if (hv2 > 0.55){                                          // a shirt, sleeves and all
          ctx.beginPath();
          ctx.moveTo(-w2 * 0.34, 0); ctx.lineTo(w2 * 0.34, 0);
          ctx.lineTo(w2 * 0.5, h2 * 0.3); ctx.lineTo(w2 * 0.3, h2 * 0.34);
          ctx.lineTo(w2 * 0.3, h2); ctx.lineTo(-w2 * 0.3, h2);
          ctx.lineTo(-w2 * 0.3, h2 * 0.34); ctx.lineTo(-w2 * 0.5, h2 * 0.3);
          ctx.closePath(); ctx.fill();

          ctx.lineTo(w2 * 0.46, h2 * 1.1);
          ctx.quadraticCurveTo(0, h2 * 0.9, -w2 * 0.46, h2 * 1.1);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.14)';
        ctx.fillRect(-w2 * 0.3, 0, w2 * 0.22, h2 * 0.9);
        ctx.restore();

    }
  }

  // live clock hands
  {
    const [ccx, ccy] = project((CT.x0 + CT.x1) / 2, CT.yF, 10.2);
    const rr = cellW * 0.92;
    const hA = (hour % 12) / 12 * Math.PI * 2 - Math.PI / 2;
    const mA = (hour % 1) * Math.PI * 2 - Math.PI / 2;
    ctx.strokeStyle = '#3a3227'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(hA) * rr * 0.5, ccy + Math.sin(hA) * rr * 0.5); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(mA) * rr * 0.78, ccy + Math.sin(mA) * rr * 0.78); ctx.stroke();
  }

  drawSmoke(t);
  applyLight(t);
  drawBalloon(t);                 // the balloon rides above every ground light

    ctx.strokeStyle='rgba(200,215,235,.45)'; ctx.lineWidth=1;
    ctx.beginPath();
    for (const r of raindrops){ ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-2.4,r.y+11); }
    ctx.stroke();
  }
}
function drawSmoke(t){
  // fires get lit on chilly mornings, damp afternoons and after dark
  const cold = clamp(1 - Math.abs(hour - 7) / 3.5, 0, 1) + rainFall * 0.7 +
               clamp((hour - 18.5) / 2, 0, 1) * 0.8;
  if (cold <= 0.05 || RM) return;
  const drift = isWindy() ? 2.6 : 1;
  for (let k = 0; k < CHIMNEYS.length; k++){
    const [cx, cy] = CHIMNEYS[k];
    if (hash(cx, cy + day * 7) > clamp(cold, 0, 1) * 0.75) continue;
    const z0 = (roofZ(cx, cy) + roofZ(cx + 1, cy + 1)) / 2 + 2.4;
    for (let p = 0; p < 6; p++){
      const ph = ((t * 0.28 + p * 0.166 + hash(cx, p) * 0.4) % 1);
      const rise = ph * 5.2, spread = 0.25 + ph * 1.5;
      const wob = Math.sin(t * 0.9 + p + cx) * 0.35 * ph;
      const [sx, sy] = project(cx + 0.5 + wob + ph * 1.4 * drift, cy + 0.72 - ph * 0.5, z0 + rise);
      ctx.fillStyle = 'rgba(226,224,218,' + (0.30 * (1 - ph) * clamp(cold, 0, 1)) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, cellW * spread * 0.45, 0, 7); ctx.fill();
    }
  }
}
function drawPlant(it, t){
  const i = it.i, s = SPECIES[bSp[i]-1], st = bSt[i];
  const hv = hash(it.x*3, it.gy*7);
  const px = it.x + 0.25 + hv*0.5, py = it.gy + 0.3 + hash(it.x,it.gy*3)*0.4;
  const hgt = s.h * (st/3) * (0.8 + hv*0.4);
  const swx = RM ? 0 : Math.sin(windT*1.8 + px*0.7) * 0.1 * hgt;
  const [bx, by] = project(px, py, 0);
  const [tx2, ty2] = project(px + swx, py, hgt);
  ctx.strokeStyle = st===1 ? '#7da065' : '#4c7440';
  ctx.lineWidth = st===1 ? 1 : 1.6;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx2, ty2); ctx.stroke();
  if (st >= 2){
    ctx.fillStyle = '#4c7440';
    ctx.beginPath(); ctx.ellipse(bx, by - cellH*hgt*0.35, cellW*0.28*(st/3), cellH*0.3*(st/3), 0, 0, 7); ctx.fill();
  }
  if (st === 3){
    if (s.style === 'dot'){
      ctx.fillStyle = hv > 0.5 ? s.col : s.col2;
      ctx.beginPath(); ctx.arc(tx2, ty2, cellW*0.17, 0, 7); ctx.fill();
      if (hv > 0.6){ ctx.beginPath(); ctx.arc(tx2 + cellW*0.24, ty2 + 2, cellW*0.12, 0, 7); ctx.fill(); }
    } else if (s.style === 'spike'){

      ctx.beginPath(); ctx.moveTo(tx2, ty2 + cellH*0.5); ctx.lineTo(tx2, ty2 - cellH*0.4); ctx.stroke();
      ctx.fillStyle = s.col2; ctx.beginPath(); ctx.arc(tx2, ty2 - cellH*0.35, 1.6, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.ellipse(tx2, ty2, cellW*0.3, cellH*0.42, 0, 0, 7); ctx.fill();
      ctx.fillStyle = s.col2;
      ctx.beginPath(); ctx.arc(tx2 - cellW*0.12, ty2 - 2, 1.8, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx2 + cellW*0.14, ty2 + 1, 1.5, 0, 7); ctx.fill();

/* A bare tree has to read as a CROWN, not as an asterisk. The first cut drew each bough
 * as one uniform stroke from a single point and the winter linden looked like a spider.
 * So: a tapered quad with a slight curve, forking two twigs at 62% of its length, which
 * gives the silhouette a thick-to-thin gradient and a ragged edge. Deterministic — no
 * R() — so a bare tree is the same bare tree on every frame. Caller sets fill/stroke. */
function drawBoughs(x0, y0, tips, w){
  for (const [x1, y1] of tips){
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L * w, ny = dx / L * w;
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    ctx.beginPath();
    ctx.moveTo(x0 + nx, y0 + ny);
    ctx.quadraticCurveTo(mx + nx * 0.45, my + ny * 0.45, x1, y1);
    ctx.quadraticCurveTo(mx - nx * 0.45, my - ny * 0.45, x0 - nx, y0 - ny);
    ctx.closePath(); ctx.fill();
    const fx = x0 + dx * 0.62, fy = y0 + dy * 0.62;
    ctx.lineWidth = Math.max(0.7, w * 0.62); ctx.lineCap = 'round';
    for (const a of [0.6, -0.6]){
      const c = Math.cos(a), s = Math.sin(a);
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.lineTo(fx + (dx * c - dy * s) * 0.36, fy + (dx * s + dy * c) * 0.36);
      ctx.stroke();
    }
  }
}
function drawTree(it, t){
  const [bx, by] = project(CX, CY + 0.5, 0);
  const {sway, treeR, treeH} = it;
  const tw = cellW * (0.5 + maturity()*0.35);
  const [tx2, ty2] = project(CX + sway*0.5, CY + 0.5, treeH*0.55);
  ctx.fillStyle = '#5d4433';
  ctx.beginPath();
  ctx.moveTo(bx - tw, by); ctx.quadraticCurveTo(bx - tw*0.5, (by+ty2)/2, tx2 - tw*0.55, ty2);
  ctx.lineTo(tx2 + tw*0.55, ty2); ctx.quadraticCurveTo(bx + tw*0.5, (by+ty2)/2, bx + tw, by);

  const cols = [[76,122,62],[92,138,74],[84,127,66],[103,149,82],[92,138,74],[69,111,56]];
  // The crown the naming points at: the blobs' own centre, swayed with them, and roughly
  // the extent they reach at full leaf (|ox| 0.55 + the widest blob's own radius ≈ 0.95).
  // Deliberately the FULL-LEAF envelope and not the shrinking blob — a bare winter linden
  // is still a linden you can point at — and deliberately a little inside it, because
  // aiming at a tree should hit the tree while the beds a hand's width below it stay
  // nameable. One ellipse, not six: the mass is what a pointer is aimed at.
  const [kx, ky] = project(CX + sway, CY + 0.5, treeH);
  crowns.push({x:kx, y:ky, rx:treeR*cellW*0.88, ry:treeR*cellH*0.88, name:it.tname});
  // The canopy is six clamps on ONE 0..1 progress, exactly as the market stalls are:
  // the mass comes in first and the outermost blobs last, and running leafOut backwards
  // through autumn sheds them in reverse for free. Each blob's radius grows from zero
  // at its own threshold, so nothing ever appears at a size.
  const out = leafOut(), LTH = [0, 0.20, 0.26, 0.52, 0.58, 0.38];
  // The boughs. Under a full crown they are covered, so they are faded out entirely at
  // leafOut 1 and the summer tree is untouched; in winter they ARE the linden.
  if (out < 0.92){
    ctx.save();
    ctx.globalAlpha = clamp((0.92 - out) / 0.55, 0, 1);
    ctx.fillStyle = '#584030'; ctx.strokeStyle = '#584030';
    const tips = [];
    for (let k=1;k<blobs.length;k++){
      const [ox, oy] = blobs[k];
      tips.push(project(CX + ox*treeR*0.78 + sway*(1+oy), CY + 0.5 + ox*0.2, treeH + oy*treeR*0.8));
    }
    drawBoughs(tx2, ty2, tips, Math.max(1.2, cellW*0.075));
    ctx.restore();
  }
  for (let k=0;k<blobs.length;k++){
    const pk = clamp((out - LTH[k]) / (1 - LTH[k]), 0, 1);
    if (pk <= 0) continue;
    const [ox, oy, s] = blobs[k];
    const [cx2, cy2] = project(CX + ox*treeR + sway*(1+oy), CY + 0.5 + ox*0.2, treeH + oy*treeR*0.9);
    const rr = treeR * s * cellW * 0.55 * pk;
    ctx.fillStyle = leafCol(cols[k], k);
    ctx.beginPath(); ctx.ellipse(cx2, cy2, rr, rr*0.78, 0, 0, 7); ctx.fill();
  }
  if (daylight > 0.2 && out > 0){
    ctx.fillStyle = 'rgba(190,220,140,' + 0.18*daylight*out + ')';
    const [hx, hy] = project(CX - treeR*0.3 + sway, CY, treeH + treeR*0.5);
    ctx.beginPath(); ctx.ellipse(hx, hy, treeR*cellW*0.34*out, treeR*cellH*0.4*out, 0, 0, 7); ctx.fill();

}
function drawLaneTree(it){

    // a proper stone tree pit, so the plaza trees stand in the paving instead of on it

    ctx.strokeStyle = 'rgba(150,142,124,.9)'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
    ctx.beginPath(); ctx.ellipse(bx, by, cellW * 0.95, cellH * 0.95, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(40,34,26,.35)'; ctx.lineWidth = 1;

  ctx.beginPath();

  const cols = it.fruit ? [[95,138,72], [110,154,82], [84,127,66]] : [[84,128,74], [97,143,82], [74,116,64]];
  const blobs = [[0, 0, 1], [-0.5, -0.3, 0.7], [0.5, -0.25, 0.72], [0, 0.45, 0.62]];
  const LTH = [0, 0.24, 0.30, 0.50];

   * as dots at cellW*0.10 it measured 68 px across all four trees — invisible. So it

    if (pk <= 0) continue;
    const [ox, oz, s] = blobs[k];
    const [cx2, cy2] = project(px + ox * r + swx, py, h + oz * r * 0.8);
    ctx.fillStyle = leafCol(cols[k % 3], it.fruit ? k + 2 : k);
    ctx.beginPath(); ctx.ellipse(cx2, cy2, r * s * cellW * 0.5 * pk, r * s * cellW * 0.4 * pk, 0, 0, 7); ctx.fill();
    if (bl > 0.02){                                     // the flower over the twig
      ctx.fillStyle = 'rgba(247,235,239,' + (0.86 * bl) + ')';
      ctx.beginPath(); ctx.ellipse(cx2, cy2 - cellH * 0.12, r * s * cellW * 0.46 * pk, r * s * cellW * 0.34 * pk, 0, 0, 7); ctx.fill();
    }
  }
  if (daylight > 0.2 && out > 0){                       // a sunlit crown
    const [hx, hy] = project(px - r * 0.35 + swx, py, h + r * 0.45);
    ctx.fillStyle = 'rgba(198,224,150,' + 0.2 * daylight * out + ')';
    ctx.beginPath(); ctx.ellipse(hx, hy, r * cellW * 0.3 * out, r * cellH * 0.34 * out, 0, 0, 7); ctx.fill();
  }
  if (it.fruit){
    // The orchard's year, hung on the flag that was already there. Blossom comes out
    // AHEAD of the leaves — phase 0.13..0.25, while leafOut is still climbing — which
    // is why four bare-ish trees in white read as spring and not as a rendering fault.

      ctx.fillStyle = 'rgba(252,244,246,' + (0.55 + 0.40 * bl) + ')';

      for (let k = 0; k < 5; k++){

 * now the only part of the river with no name to reach for. Four things read
 * riverRun(): how fast a streak drifts, how many there are, how long each one is
 * drawn, and how far its colour leans from the anchor. Winter is a lot of long fast
 * cold-blue streaks; August is a few short slow green ones. Every one of them is
 * exactly the constant it replaced at riverRun() 1, and none of it consumes an R()
 * draw — this is hash() and the clock, so the seeded world is untouched by it. */

  // so at greyF() 0 these round back to 190,210,235 and 225,238,240 exactly

        cg = Math.round((cold ? 210 : 238) - 6 * gr),

/* ============ the boat is watched ============ *

 * has ever looked at it — the written-but-unread shape `bellUntil` had before #2.
 * The answer is `a.listen`'s shape with one difference: a watch NEVER holds
 * anybody. It is only where the head is pointing, so a crosser keeps crossing
 * with their head turned, which is what looking at a boat actually looks like,
 * and no route can be stalled by it.

 * Only people who can see the water are offered it: the quay and its rail, the
 * bridge deck, the towpath. Everyone else has a building or the width of the town
 * in the way. One glance per person per boat (`a.sawBoat` vs `boat.id`) — the boat

function boatWatch(){

function drawMarketStall(it){
  const s = it.s, p = it.p;

   * to its full board, the frame rises, the canvas rolls out from the left pole,
   * and only then do the goods come out. Every term is a clamp on the same p, so
   * running p backwards packs the stall down in the reverse order. */
  const arrive = clamp(p / 0.10, 0, 1);

     board is laid out one pitch at a time on the same p, as before, so it still
     packs away in reverse. */

function drawPerson(it, t){
  const a = it.a;
  const scale = a.small ? 0.72 : 1;
  const chatting = a.greet > 0;
  const walking = a.state === 'walk' && !chatting;   // stood talking, not frozen mid-stride
  const bob = walking ? Math.abs(Math.sin(a.phase)) * 1.6 : 0;
  const [x, y] = project(a.x, a.y, 0);
  const hgt = (a.state==='sit'? 8 : a.state==='kneel'? 7 : a.state==='lie'? 3 : 12) * scale * (cellH/8);
  /* A person's patch is thrown nowhere — it is the contact under the feet, which is
   * occlusion rather than sun, so it takes only part of the lid: fade it the whole
   * way and everybody floats on a grey day. It still spreads, like the rest. */
  const pHard = 1 - 0.45 * (1 - shadowF()), pSp = shSpread();
  ctx.fillStyle = 'rgba(20,25,15,' + 0.28 * pHard + ')';
  ctx.beginPath(); ctx.ellipse(x, y, (4.5*scale + (a.state==='lie'?4:0)) * pSp, 2*scale*pSp, 0, 0, 7); ctx.fill();
  ctx.save();
  ctx.translate(x, y - bob);
  if (a.state === 'lie'){ ctx.rotate(-1.35); ctx.translate(0, -3); }
  const bw = 4.6 * scale * (cellW/13);
  if (a.cycle){
    // wheels + lowered rider
    ctx.strokeStyle = '#2e2a26'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(-bw, 0, 4.2*scale, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(bw, 0, 4.2*scale, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#6b5b45';
    ctx.beginPath(); ctx.moveTo(-bw, 0); ctx.lineTo(0, -hgt*0.4); ctx.lineTo(bw, 0); ctx.stroke();
  }
  ctx.fillStyle = a.pants;
  if (walking && !a.cycle){
    const k = Math.sin(a.phase) * 2.6 * scale;
    ctx.fillRect(-bw*0.7 - k*0.4, -hgt*0.45, bw*0.62, hgt*0.48);
    ctx.fillRect(bw*0.08 + k*0.4, -hgt*0.45, bw*0.62, hgt*0.48);
  } else {
    ctx.fillRect(-bw*0.7, -hgt*0.42, bw*1.4, hgt*0.44);
  }

  ctx.beginPath();
  ctx.moveTo(-bw, -hgt*0.4);
  ctx.quadraticCurveTo(-bw, -hgt*0.95, 0, -hgt*0.97);
  ctx.quadraticCurveTo(bw, -hgt*0.95, bw, -hgt*0.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = a.skin;
  const up = a.listen > 0 ? 1 : 0;               // listening to the bell: head tipped back
  // mid-conversation: head turned toward the other one, and nodding along
  const nod = chatting ? Math.sin(a.greet * 4.4) : 0;
  const turn = chatting ? (a.faceL ? -1 : 1) * (1.5 + nod * 0.5) : 0;
  // following the boat: the head tracks it across, and tips down over the water.
  // Read off the live boat rather than a stored angle so the turn actually FOLLOWS;
  // the last 0.33 s eases the head back so it never snaps straight.
  const wch = (a.watch > 0 && boat) ? Math.min(1, a.watch * 3) : 0;
  const wTurn = wch * Math.max(-1, Math.min(1, (boat ? boat.x - a.x : 0) / 5)) * 2.2;
  ctx.beginPath(); ctx.arc(up * (a.faceL ? 1.2 : -1.2) + turn + wTurn,
    -hgt*1.05 - 2.2*scale - up*1.2 + Math.abs(nod) * 0.7 + wch * 1.2, 2.9*scale*(cellW/13), 0, 7); ctx.fill();
  if (a.broom){
    ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(bw, -hgt*0.7); ctx.lineTo(bw + 7, 1); ctx.stroke();
    ctx.strokeStyle = '#b0a488'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bw + 6, 0); ctx.lineTo(bw + 9, 3); ctx.stroke();
  }
  if (a.kind === 'busker' && a.state === 'stand'){
    ctx.fillStyle = '#8a6a42';
    ctx.beginPath(); ctx.ellipse(bw*0.7, -hgt*0.6, 3.4*scale, 2.4*scale, 0.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(bw*0.7, -hgt*0.66); ctx.lineTo(bw*1.6, -hgt*0.95); ctx.stroke();
  }
  if (a.cup && a.state === 'sit'){
    ctx.fillStyle = '#efe9dc';
    ctx.fillRect(bw * 0.7, -hgt * 0.72, 2.6 * scale, 2.2 * scale);
  }

    const c = SPECIES[a.crop - 1], bx = bw * 0.55, by = -hgt * 0.44;
    ctx.fillStyle = c.col2;
    ctx.beginPath(); ctx.ellipse(bx + 2.4*scale, by - 1.4*scale, 2.5*scale, 1.5*scale, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#8a6a42';
    ctx.beginPath();
    ctx.moveTo(bx, by - 1.6*scale); ctx.lineTo(bx + 4.9*scale, by - 1.6*scale);
    ctx.lineTo(bx + 4.1*scale, by + 2.2*scale); ctx.lineTo(bx + 0.8*scale, by + 2.2*scale);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b5b45'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx + 2.4*scale, by - 1.6*scale); ctx.lineTo(bw * 0.7, -hgt*0.78); ctx.stroke();
  }

    ctx.fillStyle = a.shirt;
    ctx.beginPath(); ctx.arc(0, -hgt*1.3 - 4, 7*scale, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#443'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -hgt*1.3 - 4); ctx.lineTo(0, -hgt*0.6); ctx.stroke();
  }
  ctx.restore();
}
