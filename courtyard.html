    if (t === BED && turned[i]){                         // dug over: two furrows and a lit ridge across the cell
      gtx.lineWidth = 0.8;
      for (const [fy, col] of [[0.3, 'rgba(14,9,5,.42)'], [0.7, 'rgba(14,9,5,.42)'], [0.5, 'rgba(150,118,80,.22)']]){
        const p1 = project(x + 0.06, y + fy, 0), p2 = project(x + 0.94, y + fy, 0);
        gtx.strokeStyle = col; gtx.beginPath(); gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]); gtx.stroke();
      }
    }
    if ((t === PATH || t === SLOT) && hv > 0.4){
      gtx.strokeStyle = 'rgba(90,75,50,.25)'; gtx.lineWidth = 0.7;
      quad(gtx, x, y, -0.06); gtx.stroke();
    }
    if (t === SIDE && hv > 0.55){                        // paving joints
      gtx.strokeStyle = 'rgba(96,88,70,.16)'; gtx.lineWidth = 0.7;
      quad(gtx, x, y, -0.04); gtx.stroke();
    }
    // after the SIDE joints, so the green sits IN the seam it grows in. PATH never takes
    // that branch, so the plaza's draw order is HEAD's.
    if ((t === PATH || t === SIDE) && moss[i] > 0) drawMoss(gtx, x, y, moss[i]);
    if (t === ROAD){                                     // cobbled setts, laid in courses
      gtx.strokeStyle = 'rgba(66,60,50,.14)'; gtx.lineWidth = 0.7;
      const off = (y % 2) * 0.5;
      gtx.beginPath();
      for (let k = 0; k < 3; k++){
        const p1 = project(x + off + k / 3, y, 0), p2 = project(x + off + k / 3, y + 1, 0);
        gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]);
      }
      const q1 = project(x, y, 0), q2 = project(x + 1, y, 0);
      gtx.moveTo(q1[0], q1[1]); gtx.lineTo(q2[0], q2[1]);
      gtx.stroke();
      if (hv > 0.9){
        gtx.fillStyle = 'rgba(70,63,52,.12)';
        const [sx, sy] = project(x + 0.3, y + 0.3, 0);
        gtx.beginPath(); gtx.ellipse(sx, sy, cellW * 0.3, cellH * 0.26, 0, 0, 7); gtx.fill();
      }
    }
    if (t === GRASS && x >= ALT_X0){                     // reeds where bank meets water (the eyot's are drawn with the island below)
      let nearWater = false;
      for (const d of [-1, 1, -GW, GW]) if (grid[i + d] === WATER) nearWater = true;
      if (nearWater){
        const rs = cellW / 13;
        gtx.strokeStyle = '#5d7a42'; gtx.lineWidth = Math.max(0.8, rs);
        for (let k = 0; k < 3; k++){
          const [rx2, ry2] = project(x + 0.2 + hash(x + k, y) * 0.6, y + 0.2 + hash(x, y + k) * 0.6, 0);
          gtx.beginPath(); gtx.moveTo(rx2, ry2);
          gtx.lineTo(rx2 + (k - 1) * 1.5 * rs, ry2 - (5 + hash(k, x) * 3) * rs); gtx.stroke();
        }
      }
    }
    if (t === GRASS && daisy[i]){
      for (let k = 0; k < daisy[i] + 1; k++){
        const [sx, sy] = project(x + 0.2 + hash(x + k, y) * 0.6, y + 0.2 + hash(x, y + k) * 0.6, 0.02);
        gtx.fillStyle = '#eee9d8'; gtx.beginPath(); gtx.arc(sx, sy, 1.4, 0, 7); gtx.fill();
        gtx.fillStyle = '#dfc253'; gtx.beginPath(); gtx.arc(sx, sy, 0.55, 0, 7); gtx.fill();
      }
    }
  }
  // the river carries on off the bottom of the view
  {
    const bl = project(QUAY_X0, WH, 0), br = project(RIVER_X1, WH, 0);
    const rg = gtx.createLinearGradient(0, bl[1], 0, H);
    rg.addColorStop(0, '#48626f'); rg.addColorStop(1, '#2b3d47');
    gtx.fillStyle = rg;
    poly(gtx, [bl, br, [br[0] + (br[0] - project(RIVER_X1, WH - 4, 0)[0]) * 4, H],
               [bl[0] + (bl[0] - project(QUAY_X0, WH - 4, 0)[0]) * 4, H]]);
    gtx.fill();
  }
  // a paved roundel set into the plaza, radiating from the fountain
  {
    gtx.save();
    poly(gtx, [project(PLAZA_X0, 3, 0), project(PLAZA_X1, 3, 0), project(PLAZA_X1, 61, 0), project(PLAZA_X0, 61, 0)]);
    gtx.clip();
    const [fx, fy] = project(FOUNTAIN.x, FOUNTAIN.y, 0);
    for (const [rr, al] of [[3.6, 0.16], [4.6, 0.11], [6.2, 0.08]]){
      gtx.strokeStyle = 'rgba(120,104,78,' + al + ')'; gtx.lineWidth = Math.max(1.4, cellW * 0.16);
      gtx.beginPath(); gtx.ellipse(fx, fy, cellW * rr, cellH * rr, 0, 0, 7); gtx.stroke();
    }
    gtx.strokeStyle = 'rgba(120,104,78,.10)'; gtx.lineWidth = 1;
    for (let k = 0; k < 12; k++){
      const th = k / 12 * Math.PI * 2;
      gtx.beginPath();
      gtx.moveTo(fx + Math.cos(th) * cellW * 3.6, fy + Math.sin(th) * cellH * 3.6);
      gtx.lineTo(fx + Math.cos(th) * cellW * 6.2, fy + Math.sin(th) * cellH * 6.2);
      gtx.stroke();
    }
    gtx.restore();
  }
  // the river: a slow drift of ripples, and the far bank laid out on it
  {
    gtx.strokeStyle = 'rgba(226,240,244,.13)'; gtx.lineWidth = 1;
    gtx.beginPath();
    for (let ry = 2; ry < WH; ry += 1.6){
      if (ry > LN_WALK_N - 1 && ry < LN_WALK_S + 2.4) continue;
      const n = 2 + (hash(ry | 0, 5) * 3 | 0);
      for (let k = 0; k < n; k++){
        const rx = RIVER_X0 + 0.8 + hash(ry | 0, k * 7) * (RIVER_X1 - RIVER_X0 - 2.4);
        const len = 0.8 + hash(k, ry | 0) * 2.2;
        if (onEyot(rx, ry) || onEyot(rx + len, ry) || onEyot(rx + len / 2, ry)) continue;   // no ripple across the turf
        const p1 = project(rx, ry, 0), p2 = project(rx + len, ry, 0);
        gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]);
      }
    }
    gtx.stroke();
    // the bank's reflection, smeared toward us
    const rg2 = gtx.createLinearGradient(project(RIVER_X0, 3, 0)[0], 0, project(RIVER_X1, 3, 0)[0], 0);
    rg2.addColorStop(0, 'rgba(120,140,150,0)');
    rg2.addColorStop(1, 'rgba(150,132,110,.22)');
    gtx.fillStyle = rg2;
    poly(gtx, [project(RIVER_X0, 3, 0), project(RIVER_X1, 3, 0),
               project(RIVER_X1, 12, 0), project(RIVER_X0, 12, 0)]); gtx.fill();
  }
  drawEyot(gtx, m);
  drawShadows(gtx);
  // raised kerbs, so the footways sit above the roadway
  for (const [yy, col] of [[LN_ROAD0, 'rgba(150,142,124,.7)'], [LN_ROAD1, 'rgba(92,86,74,.45)']]){
    const segs = yy === LN_ROAD0 ? [[XLO, XS_R0], [XS_R1, XHI]] : [[XLO, XHI]];
    for (const [sx0, sx1] of segs){
      const a = project(sx0, yy, 0), b = project(sx1, yy, 0);
      const c = project(sx1, yy, 0.16), d = project(sx0, yy, 0.16);
      gtx.fillStyle = col; poly(gtx, [d, c, b, a]); gtx.fill();
    }
  }
  // curbs along the lane and the cross street, broken at the junction
  gtx.strokeStyle = 'rgba(70,62,50,.5)'; gtx.lineWidth = 1.2;
  for (const yy of [LN_ROAD0, LN_ROAD1]){
    const segs = yy === LN_ROAD0 ? [[XLO, XS_R0], [XS_R1, XHI]] : [[XLO, XHI]];
    for (const [sx0, sx1] of segs){
      const p1 = project(sx0, yy, 0), p2 = project(sx1, yy, 0);
      gtx.beginPath(); gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]); gtx.stroke();
    }
  }
  for (const xx of [XS_R0, XS_R1]){
    const p1 = project(xx, 0, 0), p2 = project(xx, LN_ROAD0, 0);
    gtx.beginPath(); gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]); gtx.stroke();
  }
  // allotment fence along the verge, gapped at the two gates
  gtx.strokeStyle = '#5a4732'; gtx.lineWidth = 1.6;
  for (let fy = 3; fy < 61; fy += 2){
    if (Math.abs(fy - 20) < 2 || Math.abs(fy - 45) < 2) continue;
    const b = project(ALT_X0, fy + 0.5, 0), t2 = project(ALT_X0, fy + 0.5, 0.8);
    gtx.beginPath(); gtx.moveTo(b[0], b[1]); gtx.lineTo(t2[0], t2[1]); gtx.stroke();
  }
  gtx.strokeStyle = 'rgba(90,71,50,.7)'; gtx.lineWidth = 1.1;
  let open = false;
  gtx.beginPath();
  for (let fy = 3; fy <= 61; fy++){
    const gap = Math.abs(fy - 20) < 2 || Math.abs(fy - 45) < 2;
    const p = project(ALT_X0, fy, 0.55);
    if (gap){ open = false; continue; }
    if (!open){ gtx.moveTo(p[0], p[1]); open = true; } else gtx.lineTo(p[0], p[1]);
  }
  gtx.stroke();
  drawFieldEdge(gtx);                            // #119: the world's east face, and the gate the far bank walks in through
  drawGlassBack(gtx);                            // #116: the half of the span that is behind everything
  drawQuayWalls(gtx);
  drawBlocks(gtx, 0, 61);
  drawBridge(gtx);
  drawOurSide(gtx);
}
/* The field boundary on the world's east face, and the gate the far bank's morning
 * comes through (#119). All of it is ground-cache work: nothing here is per-frame, so
 * none of it belongs in a live overlay. The only seasonal terms are the ones the cache
 * already bakes — leafOut/leafCol for the hedge, snowAt for the whitening — and every
 * per-segment draw is off hash(), never R(), so the boundary adds no draw to the seeded
 * stream and cannot reshuffle the world. */
function drawFieldEdge(g){
  const snow = snowAt(GW - 1, FIELD_GAP[1] | 0, GRASS), out = leafOut();
  // the track worn across the field to the gate: widest at the gap, where feet fan out,
  // and a thread out where it leaves the frame. It runs PAST FAR_GATE (x = GW+2), out to
  // WORLD_X1 — the same constant the camera reads as the last DRAWN thing on this face, so
  // a quarter that frames the gate frames the whole of the track that leads to it.
  if (snow < 0.55){
    const gy = FIELD_GAP[1], al = 0.55 * (1 - snow / 0.55);
    for (const [w0, w1, col] of [[0.78, 0.5, 'rgba(164,144,106,' + al.toFixed(3) + ')'],
                                 [0.42, 0.24, 'rgba(146,126,92,' + (al * 0.7).toFixed(3) + ')']]){
      const a = project(FIELD_X - 2.1, gy - w0, 0.02), b = project(WORLD_X1, gy - w1, 0.02);
      const c = project(WORLD_X1, gy + w1, 0.02), d = project(FIELD_X - 2.1, gy + w0, 0.02);
      g.fillStyle = col; poly(g, [a, b, c, d]); g.fill();
    }
  }
  // the hedge, in half-cell lengths, gapped at the gate
  const XW = FIELD_X - FIELD_D, STEP = 0.5;
  for (let fy = FIELD_Y0; fy < FIELD_Y1 - 1e-6; fy += STEP){
    if (Math.abs(fy + STEP / 2 - FIELD_GAP[1]) < FIELD_GAP_HW) continue;
    const k = Math.round(fy * 2), hv = hash(GW, k);
    const h = FIELD_H * (0.84 + 0.28 * hv) * (0.5 + 0.5 * out);      // bare hedges read lower as well as browner
    let col = mix('#6b5a44', leafCol([70, 100, 52], k), clamp(out * 1.2, 0, 1));
    col = mix(col, '#e9eef2', 0.72 * snowAt(GW - 1, fy | 0, GRASS));
    const a = project(XW, fy, 0), b = project(XW, fy + STEP, 0);
    const c = project(XW, fy + STEP, h), d = project(XW, fy, h);
    g.fillStyle = mix(col, '#2f3a26', 0.22); poly(g, [d, c, b, a]); g.fill();     // the west face, in its own shade
    const e = project(FIELD_X, fy, h), f = project(FIELD_X, fy + STEP, h);
    g.fillStyle = col; poly(g, [d, e, f, c]); g.fill();                           // the crown, seen from above
  }
  // the gate: two posts, and the leaf swung back into the field off the north post, so
  // the gap it hangs in is left clear for the walk
  const [gx0, gy0] = [FIELD_X, FIELD_GAP[1]];
  const post = mix('#4e3f2c', '#6a5740', 0.4 + 0.3 * snow), GH2 = FIELD_H * 1.35;
  g.strokeStyle = post; g.lineCap = 'round';
  for (const py of [gy0 - FIELD_GAP_HW, gy0 + FIELD_GAP_HW]){
    const p0 = project(gx0, py, 0), p1 = project(gx0, py, GH2);
    g.lineWidth = Math.max(1.6, cellW * 0.17);
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
  }
  const hy = gy0 - FIELD_GAP_HW, lx = gx0 + 1.9;      // hung on the north post, standing open
  g.lineWidth = Math.max(1.1, cellW * 0.1);
  for (const z of [GH2 * 0.28, GH2 * 0.62, GH2 * 0.94]){
    const p0 = project(gx0, hy, z), p1 = project(lx, hy - 0.12, z);
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
  }
  const br0 = project(gx0, hy, GH2 * 0.28), br1 = project(lx, hy - 0.12, GH2 * 0.94);
  const st0 = project(lx, hy - 0.12, 0), st1 = project(lx, hy - 0.12, GH2 * 0.94);
  g.beginPath(); g.moveTo(br0[0], br0[1]); g.lineTo(br1[0], br1[1]);              // the diagonal brace
  g.moveTo(st0[0], st0[1]); g.lineTo(st1[0], st1[1]); g.stroke();                 // the heel stile
  g.lineCap = 'butt';
}
function fieldEdgeName(x, y){
  if (Math.abs(y + 0.5 - FIELD_GAP[1]) < FIELD_GAP_HW + 0.6) return 'the gate onto the fields, standing open';
  return leafOut() < 0.25 ? 'the field hedge, bare and twiggy'
       : blossomF() > 0.15 ? 'the field hedge, in blossom'
       : leafTurn() > 0.3 ? 'the field hedge, turning'
       : 'the field hedge, and the fields beyond it';
}
function drawQuayWalls(g){
  // stone embankments: a real face dropping to the water on both banks
  for (const [ex, y0, y1, dir] of [[RIVER_X0, 0, LN_WALK_N, 1], [RIVER_X0, LN_WALK_S, WH, 1],
                                   [RIVER_X1, 0, LN_WALK_N, -1], [RIVER_X1, LN_WALK_S, WH, -1]]){
    const a = project(ex, y0, 0), b = project(ex, y1, 0);
    const c = project(ex, y1, 0.85), d = project(ex, y0, 0.85);
    g.fillStyle = dir === 1 ? 'rgba(96,92,80,.85)' : 'rgba(72,70,62,.85)';
    poly(g, [d, c, b, a]); g.fill();
    g.strokeStyle = 'rgba(212,204,184,.35)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(d[0], d[1]); g.lineTo(c[0], c[1]); g.stroke();
    g.strokeStyle = 'rgba(30,36,38,.5)';
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  // mooring rings and a set of steps down to the water
  g.strokeStyle = 'rgba(40,38,32,.8)'; g.lineWidth = 1.2;
  for (const [rx, ry] of [[QUAY_X0 + 1.7, 22], [QUAY_X0 + 1.7, 44], [TOW_X0 + 1.2, 30], [TOW_X0 + 1.2, 52]]){
    const p = project(rx, ry, 0.4);
    g.beginPath(); g.arc(p[0], p[1], Math.max(1.6, cellW * 0.16), 0, 7); g.stroke();
  }
}
function drawBridge(g){
  const x0 = RIVER_X0 - 0.6, x1 = RIVER_X1 + 0.6, yS = LN_WALK_S, yN = LN_WALK_N;
  // the downstream face, which is the side we look at
  const a = project(x0, yS, 0), b = project(x1, yS, 0);
  const c = project(x1, yS, 2.5), d = project(x0, yS, 2.5);
  const gr = g.createLinearGradient(0, d[1], 0, a[1]);
  gr.addColorStop(0, mix('#4a463c', '#b8ae95', 0.3 + 0.55 * daylight));
  gr.addColorStop(1, mix('#332f28', '#7d7663', 0.3 + 0.55 * daylight));
  g.fillStyle = gr; poly(g, [d, c, b, a]); g.fill();
  // three arches over the water
  for (const ax of [RIVER_X0 + 2.2, (RIVER_X0 + RIVER_X1) / 2, RIVER_X1 - 2.2]){
    const hw = 2.1, top = 1.55, sp = 0.35;
    const bl = project(ax - hw, yS, 0), br = project(ax + hw, yS, 0);
    const sl = project(ax - hw, yS, sp), sr = project(ax + hw, yS, sp);
    const cr = project(ax, yS, top);
    g.beginPath();
    g.moveTo(bl[0], bl[1]); g.lineTo(sl[0], sl[1]);
    g.quadraticCurveTo(sl[0], cr[1], cr[0], cr[1]);
    g.quadraticCurveTo(sr[0], cr[1], sr[0], sr[1]);
    g.lineTo(br[0], br[1]); g.closePath();
    g.fillStyle = 'rgba(20,26,28,.88)'; g.fill();
    g.strokeStyle = 'rgba(216,208,188,.4)'; g.lineWidth = Math.max(1.2, cellW * 0.12); g.stroke();
  }
  // coping and balustrade above it
  g.fillStyle = 'rgba(206,197,175,.9)';
  const k1 = project(x0, yS, 2.5), k2 = project(x1, yS, 2.5);
  const k3 = project(x1, yS - 0.32, 2.72), k4 = project(x0, yS - 0.32, 2.72);
  poly(g, [k4, k3, k2, k1]); g.fill();
  g.strokeStyle = 'rgba(150,142,124,.85)'; g.lineWidth = Math.max(1.2, cellW * 0.13);
  for (let px = x0 + 0.5; px < x1; px += 0.7){
    const p1 = project(px, yS, 2.5), p2 = project(px, yS, 3.15);
    g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke();
  }
  g.fillStyle = 'rgba(214,205,183,.95)';
  const r1 = project(x0, yS, 3.15), r2 = project(x1, yS, 3.15);
  const r3 = project(x1, yS - 0.3, 3.42), r4 = project(x0, yS - 0.3, 3.42);
  poly(g, [r4, r3, r2, r1]); g.fill();
  // upstream parapet, seen from behind
  const u1 = project(x0, yN, 0), u2 = project(x1, yN, 0);
  const u3 = project(x1, yN, PARAPET_Z), u4 = project(x0, yN, PARAPET_Z);
  g.fillStyle = mix('#3f3b33', '#9a927c', 0.25 + 0.5 * daylight);
  poly(g, [u4, u3, u2, u1]); g.fill();
  g.fillStyle = 'rgba(206,197,175,.85)';
  const v1 = project(x0, yN, PARAPET_Z), v2 = project(x1, yN, PARAPET_Z);
  const v3 = project(x1, yN - 0.3, PARAPET_Z + 0.22), v4 = project(x0, yN - 0.3, PARAPET_Z + 0.22);
  poly(g, [v4, v3, v2, v1]); g.fill();
  /* the bridge lays a shadow on the water downstream — but water under a deck is
   * dark because the SKY is occluded, not the sun, so the lid only takes the half
   * of it that the sun was casting, and the band retracts toward the span */
  const bHard = shadowF();
  g.fillStyle = 'rgba(18,24,26,' + (0.32 - 0.16 * (1 - bHard)) + ')';
  const bTail = 2.2 - 2.1 * (1 - shOffset());
  poly(g, [project(RIVER_X0, yS + 0.1, 0), project(RIVER_X1, yS + 0.1, 0),
           project(RIVER_X1, yS + bTail, 0), project(RIVER_X0, yS + bTail, 0)]);
  g.fill();
}
/* ============ the near block: the roof we are looking out over ============
 * Rows 79..WH used to be VOID, and drawGround skips VOID, so the bottom eighth of the
 * picture was a black gradient with six awning stripes laid on it in screen space —
 * 118 px of a desktop frame, 164 of a phone's, and none of it in the world.
 *
 * buildGrid always said what belongs there ("below the lane: our own building, with the
 * river slipping between its two halves"), and the sill says where we are standing: up,
 * looking out. So what fills the near band is that building's ROOF, seen from above.
 *
 * None of it is hand-drawn. The footprint went into the grid as WALL and buildVolumes
 * grew the volume off it like every other roof in the town — the pitches, the ridge
 * running along the lane, the hips where the river cuts the block in two and the
 * valleys round the two light wells are all the distance transform's, not mine. Three
 * things are stated rather than derived, and each is a footprint or an eave, never a
 * roof: eaveFor is 0 here (see there), solidAt runs the block off both sides of the
 * picture (see there), and WELLS punches the two holes.
 *
 * Everything the far roofs live among reaches it for free, because it goes through the
 * same drawRoofRow: snowCover whitens it, the sun/cloud/warmth key shades it, chimneys
 * are placed and pushed to CHIMNEYS[] so drawSmoke leans them downwind. What is added
 * here is what only a roof this close is big enough to show — the parapet and its lead
 * gutter at the lane edge, moss on the north pitch, dormers and rooflights that light
 * at night off windowLit, and the apron carrying the near pitch off the bottom edge. */
const NEAR_SPANS = [[XLO, QUAY_X0], [RIVER_X1, XHI]];   // the block's two halves, the river between
const PARA_Y = LN_WALK_S + 0.55, PARA_Z = 0.47;         // the top of the parapet lands at depth 79.01
const DORM_Y = 85;                                      // dormers and rooflights on the near pitch
const STACK_Y = 86;                                     // and the stacks, one pitch further down
const ROOF_LIGHTS = [];                                 // [quad, sa, sb] — glazing up here, relit live
function nearZ(x, y){ return (roofZ(x, y) + roofZ(x + 1, y) + roofZ(x + 1, y + 1) + roofZ(x, y + 1)) / 4; }
/* The party walls: the terrace's own divisions, carried up over the roof as the brick
 * upstands they are. They are what turns one orange field into a row of houses, and
 * they are where a terrace puts its stacks — so the stacks are read off the same list.
 * `bx` runs off both sides of the picture on the unclamped x, exactly as the roof does. */
function partyWalls(sx0, sx1){
  const out = [];
  for (let x = Math.ceil(sx0); x < sx1; x++) if (houseOf(x) !== houseOf(x - 1)) out.push(x);

   * was painted under the sill band and never seen. It is now one wash priced off
   * sillTop() in drawOurSide, over whatever strip of near roof the frame shows. */
  {
    /* The courses open out as they come — but only so far. The flare widens x by two per
     * cent while it stretches y to the bottom of the frame, so a course left to grow
     * unchecked ends up two and a half times taller than a slate is wide, and the apron
     * goes straight back to reading as boarding: on a 390-wide phone the last visible
     * course was 25 px deep over a 6 px slate. So the exposure is CAPPED against the
     * slate's own width, and past the cap the courses simply repeat. */
    const aDy = H - project(60, WH, 0)[1];                   // project()s y is row-only: x is free
    const aW = Math.abs(project(61, WH, 0)[0] - project(60, WH, 0)[0]);
    const hMax = Math.max(SLATE_H_PX, 0.85 * aW);
    const fs = [0];
    for (let f = 0, h = SLATE_H_PX; f < 0.999 && fs.length < 34; h = Math.min(h * APRON_GROW, hMax)){
      f = Math.min(f + h / Math.max(aDy, 1), 1); fs.push(f);
    }
    if (fs[fs.length - 1] < 1) fs.push(1);
    for (const [sx0, sx1] of NEAR_SPANS){
      for (let x = sx0; x < sx1; x++){
        const gx = clamp(x, 0, GW - 1);
        const a = project(x, WH, 0), b = project(x + 1, WH, 0);
        const a4 = project(x, WH - 4, 0), b4 = project(x + 1, WH - 4, 0);
        const aX = a[0], bX = b[0], aB = a[0] + (a[0] - a4[0]) * 4, bB = b[0] + (b[0] - b4[0]) * 4;
        const y0 = a[1], dy = H - a[1];
        // u east across the column, s the fraction of the way off the bottom of the world
        const pt = (u, s) => [lerp(lerp(aX, bX, u), lerp(aB, bB, u), s), y0 + dy * s];
        const sh = slateShade(x, WH - 1, roofShade(x, WH - 1)[0], amb, key, gx, false);
        g.fillStyle = rgbs(slateTone(sh.pal, sh.hg, sh.t0 * SLATE_JOINT_T - 0.05, snowCover * 0.5 * sh.sun));
        poly(g, [pt(0, 0), pt(1, 0), pt(1, 1), pt(0, 1)]); g.fill();
        for (let j = 0; j + 1 < fs.length; j++){
          const f0 = fs[j], f1 = fs[j + 1], fm = (f0 + f1) / 2;
          const wPx = Math.abs(lerp(bX, bB, fm) - lerp(aX, aB, fm));
          const ns = clamp(Math.round(wPx / SLATE_W_PX), 1, 5);
          const gS = Math.min(SLATE_JOINT / dy, 0.24 * (f1 - f0));
          slateRun(g, sh, x, ns, 704 + j, f0, f1 - gS, Math.min(0.5 * SLATE_JOINT / wPx, 0.16 / ns),
                   j + 2 < fs.length ? 0.55 * (f1 - f0) : 0, pt);
        }
      }
      // the last full course at the world's edge, heavier than the laps below it
      const l = project(sx0, WH, 0), r = project(sx1, WH, 0);
      g.strokeStyle = 'rgba(26,24,22,.35)'; g.lineWidth = Math.max(1, cellH * 0.16);
      g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(r[0], r[1]); g.stroke();
    }
  }
  for (let y = LN_WALK_S; y < WH; y++) drawCrests(g, y);
  /* The ridge. drawCrests finds a crest by a strict local maximum of the distance field,
   * and this block is nine rows deep — an EVEN number of vertex rows — so its top is a
   * two-row plateau (vD 4 at both 83 and 84) and no vertex is strictly higher than its
   * neighbours. Nothing was wrong with drawCrests; the ridge simply has width. Cap it. */
  {
    const ry = nearRidgeRow();
    for (const [sx0, sx1] of NEAR_SPANS){
      const a = project(sx0, ry, roofZ(sx0, ry)), b = project(sx1, ry, roofZ(sx1, ry));
      const c = project(sx1, ry + 0.62, roofZ(sx1, ry)), d = project(sx0, ry + 0.62, roofZ(sx0, ry));
      g.fillStyle = mix(mix('#30302e', '#a9aeaa', 0.22 + 0.55 * daylight), SNOW_COL, snowCover * 0.85);
      poly(g, [a, b, c, d]); g.fill();
      g.strokeStyle = 'rgba(16,18,20,.5)'; g.lineWidth = Math.max(1, cellH * 0.18);
      g.beginPath(); g.moveTo(d[0], d[1]); g.lineTo(c[0], c[1]); g.stroke();
    }
  }
  // moss and lichen on the north pitch — the damp side, in the parapet's own shade
  const mossF = roofMossF();
  if (mossF > 0.05){
    for (let y = LN_WALK_S; y < WH; y++) for (let x = XLO; x < XHI; x++){
      const gx = clamp(x, 0, GW - 1);
      if (!solidC(x, y) || roofZ(x, y + 1) - roofZ(x, y) < 0.1) continue;   // north-facing only
      for (let k = 0; k < 3; k++){
        const h1 = hash(gx * 3 + k, y * 11), h2 = hash(gx * 7, y * 13 + k);
        if (h1 < 0.62) continue;
        const p = project(x + 0.15 + h1 * 0.7, y + 0.2 + h2 * 0.6, nearZ(x, y));
        g.fillStyle = 'rgba(' + (72 + (h2 * 30 | 0)) + ',' + (86 + (h1 * 26 | 0)) + ',54,' + (0.30 * mossF).toFixed(3) + ')';
        g.beginPath(); g.ellipse(p[0], p[1], cellW * 0.26, cellH * 0.30, 0, 0, 7); g.fill();
      }
    }
  }
  for (const w of WELLS) drawWell(g, w);
  /* #123 moved the furniture north into the band the parapet and the dormers already
   * occupy on screen, and the order between the three is now load-bearing where it used
   * to be free. Back to front: the PARAPET is the roof's far edge, drawn depth 79.01 to
   * 80.17, and everything standing on the roof is nearer than it — it used to be drawn
   * last, which was harmless only while the furniture sat two rows south of its reach.
   * Then the furniture. Then the DORMERS, which stand on row 85 and whose ridges reach
   * back to depth 81.55, inside the furniture's band and nearer than all of it. */
  drawParapet(g);
  drawRoofFurn(g);
  for (let x = XLO; x < XHI; x++){
    // one per house, set just east of its party wall — and solidC is asked about the cell
    // the dormer actually stands on: at x 111 the wall is the block's last, and x + 1 is river
    if (!solidC(x + 1, DORM_Y) || houseOf(x) === houseOf(x - 1)) continue;
    const h = hash(clamp(x, 0, GW - 1) * 7, 811);
    if (h > 0.62) drawDormer(g, x + 1);
    else if (h > 0.34) drawRoofLight(g, x + 1, DORM_Y + 0.4, 0.42, 0.62);
  }
  drawPartyWalls(g);
}
/* Drawn last of the roof, over the tiling and the dormers' cheeks: the upstands run from
 * the parapet clean off the bottom of the picture, and the stacks stand on them. */
function drawPartyWalls(g){
  const lit = 0.22 + 0.5 * daylight;
  const cap = mix(mix('#3b3a36', '#b3ac9c', lit), SNOW_COL, snowCover * 0.7);
  for (const [sx0, sx1] of NEAR_SPANS){
    for (const bx of partyWalls(sx0, sx1)){
      const pts = [];
      for (let y = PARA_Y; y < WH; y += 0.5) pts.push(project(bx, y, roofZ(bx, Math.round(y)) + 0.16));
      const e = project(bx, WH, 0), e4 = project(bx, WH - 4, 0);
      pts.push(e, [e[0] + (e[0] - e4[0]) * 4, H]);
      g.strokeStyle = 'rgba(16,14,12,.40)'; g.lineWidth = Math.max(2.4, cellW * 0.26);
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts) g.lineTo(p[0], p[1]);
      g.stroke();
      g.strokeStyle = cap; g.lineWidth = Math.max(1.2, cellW * 0.13);
      g.beginPath(); g.moveTo(pts[0][0] - 1, pts[0][1]);
      for (const p of pts) g.lineTo(p[0] - 1, p[1]);
      g.stroke();
      if (nearStack(bx)) drawChimney(g, bx - 1, STACK_Y);   // drawChimney centres on x+0.5
    }
  }
  for (const bx of partyWalls(0, GW)){                  // the register drawSmoke reads
    if (!nearStack(bx) || bx >= QUAY_X0 && bx < RIVER_X1) continue;
    const cx = bx - 1;
    if (!CHIMNEYS.some(c => c[0] === cx && c[1] === STACK_Y)) CHIMNEYS.push([cx, STACK_Y]);
  }
}
/* The parapet we lean out over, and the lead gutter behind it. It is held ENTIRELY south
 * of the lane's own line: LIFT carries height northward on screen, so a parapet given
 * real height would stand in front of the south footway. PARA_Z 0.47 at row 79.55 lands
 * its coping at depth 79.006 — under the lane by six thousandths of a cell. */
function drawParapet(g){
  const lit = 0.25 + 0.5 * daylight;
  for (const [sx0, sx1] of NEAR_SPANS){
    const cop = [project(sx0, PARA_Y, PARA_Z), project(sx1, PARA_Y, PARA_Z),
                 project(sx1, PARA_Y + 0.30, PARA_Z), project(sx0, PARA_Y + 0.30, PARA_Z)];
    const face = [cop[3], cop[2], project(sx1, PARA_Y + 0.30, 0), project(sx0, PARA_Y + 0.30, 0)];
    const gut = [face[3], face[2], project(sx1, PARA_Y + 0.62, 0), project(sx0, PARA_Y + 0.62, 0)];
    // the lead: a wet channel even when the roof above it has dried
    g.fillStyle = mix(mix('#2e3336', '#6d7478', lit), '#8fa2ae', 0.45 * wetF());
    poly(g, gut); g.fill();
    g.fillStyle = mix('#3b342b', '#8d7f6a', lit);                       // the inner face, in shade
    poly(g, face); g.fill();
    g.fillStyle = mix(mix('#4a443a', '#cfc6ae', lit), SNOW_COL, snowCover * 0.85);
    poly(g, cop); g.fill();                                             // stone coping, catching the sky
    g.strokeStyle = 'rgba(22,17,12,.45)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(gut[3][0], gut[3][1]); g.lineTo(gut[2][0], gut[2][1]); g.stroke();
    // the fall of the gutter, and a hopper head every so often where it lets go
    for (let x = Math.ceil(sx0 / 9) * 9; x < sx1; x += 9){
      const p = project(x, PARA_Y + 0.46, 0);
      g.fillStyle = 'rgba(28,32,34,.85)';
      g.beginPath(); g.ellipse(p[0], p[1], cellW * 0.22, cellH * 0.30, 0, 0, 7); g.fill();
    }
  }
}
/* The furniture, drawn into the ground cache with the rest of the roof and after the
 * dormers, so a party wall's upstand still crosses in front of what stands beside it.
 * Everything here is drawn SOUTH-FACE-then-TOP: we are above this roof, so a box shows
 * us the side turned toward the window and the lid, and nothing else. */
function drawRoofFurn(g){
  const lit = 0.24 + 0.58 * daylight, out = washOut();
  for (const f of ROOF_FURN){
    if (f.kind === 'line') drawWashLine(g, f, lit, out);   // the line stays strung; the washing does not
    else if (f.kind === 'tank') drawWaterTank(g, f, lit);
    else drawPigeonLoft(g, f, lit);
  }
}
/* A line strung between two upstands, and what is pegged along it. The cloth hangs DOWN
 * in z, which carries it SOUTH on screen — so a shirt occupies the strip below the line
 * rather than standing in front of the ridge. The lean is baked off windSign·windF():
 * this is in the ground cache and may not be per-frame, and both terms move slowly
 * enough that a quarter-hour rebuild moves it by a fraction of a pixel. */
function drawWashLine(g, f, lit, out){
  const gx = clamp(Math.floor((f.x + f.x1) / 2), 0, GW - 1);
  const zr = nearZ(Math.floor((f.x + f.x1) / 2), Math.floor(f.y)), zTop = zr + WASH_H;
  const pts = [];
  for (let k = 0; k <= 8; k++){
    const u = k / 8;
    pts.push(project(f.x + (f.x1 - f.x) * u, f.y, zTop - Math.sin(u * Math.PI) * WASH_SAG));
  }
  g.strokeStyle = 'rgba(28,26,23,.55)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) g.lineTo(p[0], p[1]);
  g.stroke();
  if (!out) return;                       // a wet morning: the line is there, the washing is in
  const lean = windSign * windF() * 0.20;
  // per CELL of cord, not per line: #123 shortened the cords that share a bay with a
  // tank or a loft, and a fixed count over half the span is a rack, not a washing line
  const n = Math.max(2, Math.round((f.x1 - f.x) * (0.82 + f.h * 0.5)));
  for (let k = 0; k < n; k++){
    const u = (k + 0.5) / n, sx = f.x + (f.x1 - f.x) * u;
    const ha = hash(gx * 13 + k, 733), hb = hash(gx * 17 + k, 741), hc = hash(gx * 19 + k, 757);
    const top = zTop - Math.sin(u * Math.PI) * WASH_SAG;
    const drop = WASH_DROP + ha * WASH_DROP_R, w = 0.16 + hb * 0.20;   // a shirt, or a sheet
    const q = [project(sx - w, f.y, top), project(sx + w, f.y, top),
               project(sx + w + lean, f.y, top - drop), project(sx - w + lean, f.y, top - drop)];
    g.fillStyle = mix('#2b2822', WASH_COL[(hc * WASH_COL.length) | 0], lit);
    poly(g, q); g.fill();
    g.fillStyle = 'rgba(30,26,22,.6)';                        // the two pegs holding it up
    for (const px of [sx - w * 0.7, sx + w * 0.7]){
      const p = project(px, f.y, top + 0.06);
      g.fillRect(p[0] - 0.6, p[1] - 1.4, 1.2, 2.6);
    }
  }
}
/* The tank: boarded, on a low timber cradle, with the overflow running off south to the
 * leads. 1.3 cells tall on row 87 tops out at depth 85.6 — south of the ridge, north of
 * the shadow ramp, which is the strip this whole vector is for. */
function drawWaterTank(g, f, lit){
  const z = nearZ(Math.floor(f.x), Math.floor(f.y));
  const {w, d, legh, hgt} = FURN_BOX.tank;
  const y0 = f.y - d, y1 = f.y + d, zb = z + legh, zt = zb + hgt;
  g.strokeStyle = 'rgba(26,20,15,.75)'; g.lineWidth = Math.max(1, cellW * 0.11);
  for (const sx of [f.x - w * 0.75, f.x + w * 0.75]){
    const p0 = project(sx, y1, z), p1 = project(sx, y1, zb);
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
  }
  const face = [project(f.x - w, y1, zt), project(f.x + w, y1, zt),
                project(f.x + w, y1, zb), project(f.x - w, y1, zb)];
  g.fillStyle = mix('#292420', '#6d6150', lit); poly(g, face); g.fill();
  g.strokeStyle = 'rgba(18,14,11,.45)'; g.lineWidth = 1;
  for (const u of [0.34, 0.67]){
    const p0 = project(f.x - w + 2 * w * u, y1, zt), p1 = project(f.x - w + 2 * w * u, y1, zb);
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
  }
  const top = [project(f.x - w, y0, zt), project(f.x + w, y0, zt),
               project(f.x + w, y1, zt), project(f.x - w, y1, zt)];
  g.fillStyle = mix(mix('#37322a', '#9c9484', lit), SNOW_COL, snowCover * 0.75);
  poly(g, top); g.fill();
  g.strokeStyle = 'rgba(16,13,10,.5)'; g.lineWidth = 1; poly(g, top); g.stroke();
  const o0 = project(f.x + w * 0.72, y1, zt - 0.10), o1 = project(f.x + w * 0.72, y1 + 0.5, z);
  g.strokeStyle = 'rgba(38,42,44,.8)'; g.lineWidth = Math.max(1, cellW * 0.08);
  g.beginPath(); g.moveTo(o0[0], o0[1]); g.lineTo(o1[0], o1[1]); g.stroke();
}
/* The loft: a hutch with a pitched top, three entry holes and a landing board out over
 * the leads. The board is a PERCH — roofBirdSpot reads LOFTS — so this is the one piece
 * of furniture that is also a place, which is what stops the strip being a still life. */
function drawPigeonLoft(g, f, lit){
  const z = nearZ(Math.floor(f.x), Math.floor(f.y));
  const {w, d, base, hgt, rid: ridH} = FURN_BOX.loft;
  const zb = z + base, zt = zb + hgt, rid = zt + ridH;
  const y0 = f.y - d, y1 = f.y + d;
  const bd = [project(f.x - w, y1, zb + 0.04), project(f.x + w, y1, zb + 0.04),
              project(f.x + w, y1 + 0.62, zb + 0.04), project(f.x - w, y1 + 0.62, zb + 0.04)];
  g.fillStyle = mix('#2f2820', '#8a7c62', lit); poly(g, bd); g.fill();
  g.strokeStyle = 'rgba(18,14,11,.5)'; g.lineWidth = 1; poly(g, bd); g.stroke();
  const face = [project(f.x - w, y1, zt), project(f.x + w, y1, zt),
                project(f.x + w, y1, zb), project(f.x - w, y1, zb)];
  g.fillStyle = mix('#272320', '#7d6e56', lit); poly(g, face); g.fill();
  g.fillStyle = 'rgba(14,11,9,.88)';
  for (const u of [0.24, 0.5, 0.76]){
    const p = project(f.x - w + 2 * w * u, y1, zb + 0.44);
    g.beginPath(); g.ellipse(p[0], p[1], Math.max(1, cellW * 0.09), Math.max(1, cellH * 0.26), 0, 0, 7); g.fill();
  }
  const nSl = [project(f.x - w - 0.10, y0, zt), project(f.x + w + 0.10, y0, zt),
               project(f.x + w + 0.10, f.y, rid), project(f.x - w - 0.10, f.y, rid)];
  const sSl = [project(f.x - w - 0.10, f.y, rid), project(f.x + w + 0.10, f.y, rid),
               project(f.x + w + 0.10, y1, zt), project(f.x - w - 0.10, y1, zt)];
  g.fillStyle = mix(mix('#2c3036', '#7e8892', 0.28 + 0.5 * daylight), SNOW_COL, snowCover * 0.8);
  poly(g, nSl); g.fill();
  g.fillStyle = mix(mix('#25282c', '#69727b', 0.28 + 0.5 * daylight), SNOW_COL, snowCover * 0.7);
  poly(g, sSl); g.fill();
  g.strokeStyle = 'rgba(16,18,20,.5)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(nSl[3][0], nSl[3][1]); g.lineTo(nSl[2][0], nSl[2][1]); g.stroke();
}
/* A light well: a hole clean through the block. The roof falls away to nothing at its
 * lip because the distance transform says so, so all this draws is the shaft — and, at
 * the bottom of it, somebody's back window, on the same windowLit clock as the town's. */
function drawWell(g, w){
  const a = project(w.x0, w.y0, 0), b = project(w.x1, w.y0, 0);
  const c = project(w.x1, w.y1, 0), d = project(w.x0, w.y1, 0);
  const sh = g.createLinearGradient(0, a[1], 0, c[1]);
  sh.addColorStop(0, '#100d09'); sh.addColorStop(1, '#221c14');
  g.fillStyle = sh; poly(g, [a, b, c, d]); g.fill();
  g.strokeStyle = mix('#3a3630', '#9aa0a0', 0.2 + 0.5 * daylight); g.lineWidth = Math.max(1, cellW * 0.10);
  poly(g, [a, b, c, d]); g.stroke();                                    // lead flashing round the lip
  const q = [project(w.x0 + 0.55, w.y1 - 0.75, 0), project(w.x1 - 0.55, w.y1 - 0.75, 0),
             project(w.x1 - 0.55, w.y1 - 0.2, 0), project(w.x0 + 0.55, w.y1 - 0.2, 0)];
  g.fillStyle = mix('#1b1712', '#5f6a72', 0.10 + 0.35 * daylight);
  poly(g, q); g.fill();
  ROOF_LIGHTS.push([q, w.x0, w.y0 + 900]);
}
/* A rooflight lying in the pitch, and a dormer standing out of it. Both take their z off
 * the surface under them (nearZ) rather than a constant, so they sit on the roof the
 * distance transform actually built — including the one leaning toward a well. */
function drawRoofLight(g, x, y, hw, hh){
  const z = nearZ(x, Math.floor(y));
  const q = [project(x + 0.5 - hw, y - hh, z), project(x + 0.5 + hw, y - hh, z),
             project(x + 0.5 + hw, y + hh, z), project(x + 0.5 - hw, y + hh, z)];
  g.fillStyle = mix('#2a2c30', '#7d94a6', 0.16 + 0.48 * daylight);
  poly(g, q); g.fill();
  g.strokeStyle = mix('#4a453c', '#d6cfba', 0.2 + 0.55 * daylight); g.lineWidth = Math.max(1, cellW * 0.09);
  poly(g, q); g.stroke();
  ROOF_LIGHTS.push([q, clamp(x, 0, GW - 1), 700 + (Math.floor(y * 4) % 8)]);
}
function drawDormer(g, x){
  const gx = clamp(x, 0, GW - 1), z = nearZ(x, DORM_Y), dh = 1.35, w = 0.55;

  const cheekR = [f[1], f[2], project(x + 0.5 + w, DORM_Y + 0.8, z + 0.1), project(x + 0.5 + w, DORM_Y + 0.8, z + dh + 0.42)];
  g.fillStyle = mix('#312b24', '#6f6555', lit);
  poly(g, [cheekL[0], cheekL[3], cheekL[2], cheekL[1]]); g.fill();
  poly(g, [cheekR[0], cheekR[3], cheekR[2], cheekR[1]]); g.fill();
  g.fillStyle = mix('#3f3a33', PLASTER[(hash(gx, 37) * PLASTER.length) | 0], clamp(lit + 0.16, 0, 1));
  poly(g, f); g.fill();                                                 // the cheek-wall front, facing the lane
  const q = [project(x + 0.5 - w * 0.62, DORM_Y, z + dh * 0.86), project(x + 0.5 + w * 0.62, DORM_Y, z + dh * 0.86),
             project(x + 0.5 + w * 0.62, DORM_Y, z + dh * 0.22), project(x + 0.5 - w * 0.62, DORM_Y, z + dh * 0.22)];
  g.fillStyle = mix('#242a33', '#7d94a6', 0.18 + 0.5 * daylight);
  poly(g, q); g.fill();
  ROOF_LIGHTS.push([q, gx, 720]);

  items.push({y:WILLOW.y + 0.4, f:drawWillow, tname:'the willow on the eyot'});
  for (const b of PLAZA_BENCHES) items.push({y:b.y + 0.2, f:drawBench, b});
  for (const b of QUAY_BENCHES) items.push({y:b.y + 0.2, f:drawBench, b});
  for (const b of FAR_BENCHES) items.push({y:b.y + 0.2, f:drawBench, b});
  items.push({y:FOUNTAIN.y + 1.2, f:drawFountain});
  items.push({y:BANDSTAND.y + 1.6, f:drawBandstand});
  items.push({y:JETTY.y + 1.6, f:drawJetty});
  items.push({y:MILL_WHEEL.y - MILL_WHEEL.r - 0.2, f:drawMillShadow});
  items.push({y:MILL_WHEEL.y + 0.3, f:drawMillWheel});
  // the footbridge is two items: the span and its upstream rail sort BEFORE anyone on
  // it, the downstream rail, piers and shadow AFTER — and the boat, while it is under,
  // is drawn by the span itself so the deck lands on top of the rower
  items.push({y:DECK_Y0 - 0.1, f:drawDeckSpan});
  items.push({y:DECK_Y1 + 0.6, f:drawDeckFront});
  // the glasshouse is two halves for the same reason: the far slope, the back wall and the
  // staging are in the ground cache; the near slope, the ridge and the near wall sort AFTER
  // the crop growing under them
  items.push({y:GH.y1 + 1.7, f:drawGlassFront});
  // the cart is two items round the walkers' row: bed, far wheel and the horse's back before,
  // the near wheel, near board and near legs after (#73's rule)
  if (cart){ items.push({y:Math.min(cart.y, cart.y + cart.hy * CART_LEN) - 0.9, f:drawCartBody});
             items.push({y:Math.max(cart.y, cart.y + cart.hy * 2.3) + 0.6, f:drawCartFront}); }
  for (const s of swans) items.push({y:s.y + 0.3, f:drawSwan, s});
  if (boat && (boat.y < 64.5 || boat.y > 79) && !boatUnderDeck()) items.push({y:boat.y + 0.6, f:drawBoat});
  items.push({y:punt.y + 0.4, f:drawPuntHull, tname:'the punt'});
  if (punt.leg === 2 || punt.leg === 4) items.push({y:punt.y + 0.5, f:drawPuntCrew});
  for (const tb of CAFE_TABLES) items.push({y:tb.y + 0.45, f:drawCafeTable, tb});
  if (kioskOpen()) items.push({y:KIOSK.y + 0.8, f:drawKiosk});
  for (let i = 0; i < MARKET_STALLS.length; i++){
    const p = marketRaise(i);                    // 0 well before opening and well after close
    if (p > 0) items.push({y:MARKET_STALLS[i].y + 0.8, f:drawMarketStall, s:MARKET_STALLS[i], p, sh:mkShelfFor(i)});
  }
  const cellAt = (x, y) => grid[clamp(y|0, 0, WH-1) * GW + clamp(x|0, 0, GW-1)];
  for (const a of agents){
    if (!a.aboard && cellAt(a.x, a.y) !== TUNNEL)   // inside an archway: hidden under the roof; aboard: the punt's crew item draws them
      items.push({y:a.y + (a.state==='lie'?0.01:0.5), f:drawPerson, a});
    if (a.dog && cellAt(a.dog.x, a.dog.y) !== TUNNEL) items.push({y:a.dog.y+0.4, f:drawDog, d:a.dog});
  }
  for (const b of birds) items.push({y:b.y+0.4, f:drawBird, b});
  for (const d of ducks) items.push({y:d.y+0.3, f:drawDuck, d});
  if (bonfireAlight()) items.push({y:BONFIRE.y + 0.4, f:drawBonfireHeap});   // the flames are light: drawBonfireLight, after applyLight
  if (catA) items.push({y:catA.y+0.3, f:drawCat});
  items.push({y:65.1, f:drawSouthBand});
  // between the wall it is cut in (65.1) and the arch beside it (65.3), so the fronts
  // are under it and anyone standing on the footway is in front of it
  if (roundMarks.length) items.push({y:65.11, f:drawStepMarks});   // #98: on the step, over the fronts, under the footway
  items.push({y:65.12, f:drawTapDoor});
  for (const A of ARCHES) items.push({y: A.yF === 3 ? 3.06 : 65.3, f:drawArch, A});
  items.push({y:6.6, f:drawShed});
  items.push({y:CY+0.6, f:drawTree, sway, treeR, treeH, tname:'the linden'});
  items.push({y:SUNDIAL.y + 0.9, f:drawSundial});
  items.sort((p,q)=>p.y-q.y);
  for (const it of items) it.f(it, t);

  drawRiverFlow(t);
  drawMist(t);

  // water sparkle (warm by day, cold moon-glints by night) and rain rings on the pond
  if (rainFall < 1){
    const glow = Math.max(daylight, nightF * 0.5) * (1 - rainFall);
    for (let k = 0; k < 7; k++){
      const gx2 = POND.x + (hash(k, 7) - 0.5) * POND.rx * 1.5;
      const gy2 = POND.y + (hash(k, 13) - 0.5) * POND.ry * 1.5;
      const al = Math.max(0, Math.sin(t * (nightF > 0.5 ? 0.9 : 1.8) + k * 2.1)) * 0.4 * glow;
      if (al < 0.05) continue;
      const [sx, sy] = project(gx2, gy2, 0);
      ctx.strokeStyle = nightF > 0.5
        ? 'rgba(200,220,255,' + al + ')'
        : 'rgba(240,248,240,' + al + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx - 2.5, sy); ctx.lineTo(sx + 2.5, sy); ctx.stroke();
    }
  }
  if (rainFall > 0){
    for (let k = 0; k < 4; k++){
      const ph2 = (t * 1.1 + k * 0.31) % 1;
      const [sx, sy] = project(POND.x + (hash(k, 3) - 0.5) * POND.rx * 1.4,
                               POND.y + (hash(k, 5) - 0.5) * POND.ry * 1.4, 0);
      ctx.strokeStyle = 'rgba(220,232,235,' + (0.35 * (1 - ph2) * rainFall) + ')'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(sx, sy, ph2 * 7, ph2 * 3.2, 0, 0, 7); ctx.stroke();
    }
  }
  for (const l of leaves){
    const [sx,sy]=project(l.x,l.y,l.z);
    ctx.fillStyle=l.col; ctx.save(); ctx.translate(sx,sy); ctx.rotate(l.ph);
    ctx.fillRect(-2,-1.2,4,2.4); ctx.restore();
  }
  for (const b of butterflies){
    const [sx,sy]=project(b.x,b.y,b.z);
    const flap = Math.abs(Math.sin(b.ph));
    ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.ellipse(sx-2.2*flap, sy, 2.6*flap, 1.8, -0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx+2.2*flap, sy, 2.6*flap, 1.8, 0.4, 0, 7); ctx.fill();
  }

  // Washing lines over the lane. The rope stays strung all day; it is the GARMENTS that
  // come in, one at a time and each on its own short fade, as the front builds and again
  // at dusk — so the line empties over ~9 s instead of vanishing between two frames.
  // The dusk ramp is local arithmetic on daylight, not a rival predicate: the one
  // predicate for "about to rain" is weatherComing(), and this reads it.
  if (day >= 3 && hash(day, 55) < 0.6 && daylight > 0.06){
    const takenIn = Math.max(weatherComing(), clamp((0.34 - daylight) / 0.19, 0, 1));
    const wcols = ['#c9d5e2', '#b04a3c', '#e8dfc8', '#5d7a8a', '#c2913a', '#e8c0cc'];
    for (const [lx, seed] of [[15, 1], [87, 2]]){
      const p1 = project(lx, 64.8, 4.6), p2 = project(lx, 78.6, 3.4);
      const midx = (p1[0] + p2[0]) / 2, midy = Math.max(p1[1], p2[1]) + 14;
      ctx.strokeStyle = 'rgba(70,62,52,.75)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.quadraticCurveTo(midx, midy, p2[0], p2[1]); ctx.stroke();
      for (let k = 0; k < 5; k++){
        // Each garment's own moment to be unpegged, in a fixed per-day order, plus a
        // ~1.6 s fade so the last of it goes soft rather than blinking out.
        // Both ends of the 0.16..0.82 band are load-bearing:
        //   TOP — rain can start once cover passes 0.66, which is weatherComing() 0.91,
        //   and the predicate then steps to a flat 1. Anything still pegged up in
        //   0.82..1 would come down in that one frame, the exact all-at-once vanish this
        //   is here to remove. The line is always empty before the first drop can land.
        //   BOTTOM — must be >= the 0.14 fade width, or the lowest-hashed garment starts
        //   its fade before takenIn even leaves 0 and hangs at 71% alpha in perfect
        //   weather. It did, for four gate runs, until a probe printed 9.49 of 10.
        const gone = clamp((0.16 + hash(k + seed, day + 7) * 0.66 - takenIn) / 0.14, 0, 1);
        if (gone <= 0) continue;
        const tt = 0.14 + k * 0.18;
        const gx2 = lerp(lerp(p1[0], midx, tt), lerp(midx, p2[0], tt), tt);
        const gy2 = lerp(lerp(p1[1], midy, tt), lerp(midy, p2[1], tt), tt);
        const swg = Math.sin(windT * 2.2 + k * 1.7 + seed) * (1.8 + 3.2 * windF());
        const hv2 = hash(k + seed, day);
        const w2 = cellW * (0.5 + hv2 * 0.45), h2 = cellH * (1.5 + hv2 * 1.6);
        ctx.save();
        ctx.globalAlpha = gone;
        ctx.translate(gx2, gy2);
        ctx.rotate(swg * 0.045);
        ctx.fillStyle = 'rgba(60,52,44,.7)';                      // the peg
        ctx.fillRect(-1, -2, 2, 3.5);
        ctx.fillStyle = wcols[(hv2 * wcols.length) | 0];
        if (hv2 > 0.55){                                          // a shirt, sleeves and all
          ctx.beginPath();
          ctx.moveTo(-w2 * 0.34, 0); ctx.lineTo(w2 * 0.34, 0);
          ctx.lineTo(w2 * 0.5, h2 * 0.3); ctx.lineTo(w2 * 0.3, h2 * 0.34);
          ctx.lineTo(w2 * 0.3, h2); ctx.lineTo(-w2 * 0.3, h2);
          ctx.lineTo(-w2 * 0.3, h2 * 0.34); ctx.lineTo(-w2 * 0.5, h2 * 0.3);
          ctx.closePath(); ctx.fill();
        } else {                                                  // a sheet, sagging a little
          ctx.beginPath();
          ctx.moveTo(-w2 * 0.42, 0); ctx.lineTo(w2 * 0.42, 0);
          ctx.lineTo(w2 * 0.46, h2 * 1.1);
          ctx.quadraticCurveTo(0, h2 * 0.9, -w2 * 0.46, h2 * 1.1);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.14)';
        ctx.fillRect(-w2 * 0.3, 0, w2 * 0.22, h2 * 0.9);
        ctx.restore();
      }
    }
  }

  // live clock hands
  {
    const [ccx, ccy] = project((CT.x0 + CT.x1) / 2, CT.yF, 10.2);
    const rr = cellW * 0.92;
    const hA = (hour % 12) / 12 * Math.PI * 2 - Math.PI / 2;
    const mA = (hour % 1) * Math.PI * 2 - Math.PI / 2;
    ctx.strokeStyle = '#3a3227'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(hA) * rr * 0.5, ccy + Math.sin(hA) * rr * 0.5); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(mA) * rr * 0.78, ccy + Math.sin(mA) * rr * 0.78); ctx.stroke();
  }
  drawVanes();                    // live, like the hands: the towers are cached, the wind is not

  drawCloudShade();               // the weather passes over the town, before the night's own multiply
  drawSmoke(t);
  // the sill is in FRONT of the town — at every camera, not just the wide one — and after
  // the last thing the town draws. It is still before applyLight, because the night falls
  // on the sill as it always has; the town's weather no longer does (a cloud's shadow was
  // marching across an interior windowsill, worth 1.4 luma on a 12-luma band)
  sillOver(ctx);
  applyLight(t);
  drawBonfireLight(t);            // flame and glow are light: after the night's multiply (#93)
  drawBalloon(t);                 // the balloon rides above every ground light
  drawFollowMark(t);

  if (raining){
    const sf = snowF();
    ctx.strokeStyle='rgba(200,215,235,.45)'; ctx.lineWidth=1;
    ctx.beginPath();
    const sl = 2.4 * windDir();   // #76: the drawn streak leans the way the drop moves
    for (const r of raindrops){ if (r.f < sf) continue; ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-sl,r.y+11); }
    ctx.stroke();
    if (sf > 0){
      ctx.fillStyle='rgba(240,244,248,.85)'; ctx.beginPath();
      for (const r of raindrops){ if (r.f >= sf) continue; ctx.moveTo(r.x+1.7,r.y); ctx.arc(r.x,r.y,1.7,0,7); }
      ctx.fill();
    }
  }
}
/* ---- the hearths, on the sun and on the cold (#124) -----------------------------
 * ONE definition of how hard the chimneys burn, 0 = nothing to 1 = every stack the day
 * allows. Two consumers, both in drawSmoke: the share of CHIMNEYS lit this day, and the
 * alpha of each column.
 *
 * The morning term used to be `clamp(1 - |hour - 7|/3.5)` — a hard-coded hour, which is a
 * seasonal bug a screenshot cannot see. 7.00 is EXACTLY midwinter's sunrise here
 * (SOLAR_NOON 12.75, WINTER_HOURS 11.5), so the old fire was right in January and three
 * hours late in July, when the sun is up at 4.00: the roofline lit its morning fire long
 * after the town had been awake, all summer, every year. It keys on dawnEdge() now — the
 * ONE first-light edge nightAt(), the last lamp and the burn-through already read — and it
 * is solved at the instant it applies rather than read hours ahead, so it walks 7.24 in
 * midwinter to 4.36 at midsummer with the season's own sunrise. The half-width is
 * unchanged at HEARTH_RUN 3.5: only the CENTRE was wrong.
 *
 * The height is the cold. `warmth` and `greyF()` are one axis, not two — greyF() IS
 * 1 - 2*warmth — so scaling by both would square the year, not read it twice; the season
 * enters once, through (1 - warmth), and the second axis is the WEATHER OF THE DAY:
 * snowCover on the ground says the house is cold in a way the calendar cannot. So
 * midwinter saturates (1.10, past the clamp both consumers apply, so the winter fire holds
 * at full THROUGH the peak instead of only touching it) and a July morning gives 0.16 —
 * a wisp from a stack or two, or nothing at all.
 *
 * The other two terms are untouched: rain is not seasonal (a wet afternoon is a lit fire in
 * any month) and the EVENING half is deliberately left alone, as #112 left the evening half
 * of the light curve alone. */
const HEARTH_RUN = 3.5;        // hours either side of first light, as it always was
const HEARTH_MIN = 0.16;       // a July morning: a wisp, or nothing
const HEARTH_SWING = 0.94;     // ... against 1.10 in January, i.e. saturated across the peak
const HEARTH_SNOW = 0.25;      // snow lying is a cold house whatever the date says
function hearthF(){
  const morning = clamp(1 - Math.abs(hour - dawnEdge()) / HEARTH_RUN, 0, 1);
  const chill = HEARTH_MIN + HEARTH_SWING * (1 - warmth) + HEARTH_SNOW * snowCover;
  return morning * chill + rainFall * 0.7 + clamp((hour - 18.5) / 2, 0, 1) * 0.8;
}
function drawSmoke(t){
  const drift = (1 + 1.6 * windF()) * windDir();   // calm: exactly 1; a full east wind: -2.6
  // the bonfire's column (#93, thickened at #104): the chimneys' idiom, from the ground,
  // thicker and lower, and it does not read the hour — a fire smokes when it is lit.
  // Nine puffs on a 0.3 jitter left GAPS: at 1x the column was a row of small pale dots on
  // a green field, and the one thing on the allotments meant to be seen from across the town
  // could not be. The read is MASS, not contrast — BON_PUFFS overlapping circles with a
  // wider base make one coherent shape, and a darker plume at the heap gives the column a
  // foot to stand on before it pales into the sky. The chimneys below keep their own
  // constants: nothing here is shared with them but `drift`.
  if (!RM && (bon.fire > 0.02 || bon.ember > 0.02)){
    const thick = BON_THICK * bon.fire + BON_EMB_THICK * bon.ember;
    for (let p = 0; p < BON_PUFFS; p++){
      const ph = ((t * 0.22 + p / BON_PUFFS + hash(p, 517) * 0.14) % 1);
      const rise = 0.5 + ph * 6.8, spread = 0.9 + ph * 2.5;
      const wob = Math.sin(t * 0.8 + p * 1.7) * 0.4 * ph;
      const [sx, sy] = project(BONFIRE.x + wob + (ph * 1.4 + ph * ph * 0.8) * drift, BONFIRE.y - ph * 0.4, rise);
      const g = 150 + 56 * Math.min(1, ph * 3.2);          // sooty off the heap, pale by a third of the way up
      ctx.fillStyle = 'rgba(' + (g | 0) + ',' + (g - 6 | 0) + ',' + (g - 16 | 0) + ',' + (thick * (1 - ph * ph)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, cellW * spread * 0.45, 0, 7); ctx.fill();
    }
  }
  const cold = hearthF();
  if (cold <= 0.05 || RM) return;
  for (let k = 0; k < CHIMNEYS.length; k++){
    const [cx, cy] = CHIMNEYS[k];
    if (hash(cx, cy + day * 7) > clamp(cold, 0, 1) * 0.75) continue;
    const z0 = (roofZ(cx, cy) + roofZ(cx + 1, cy + 1)) / 2 + 2.4;
    for (let p = 0; p < 6; p++){
      const ph = ((t * 0.28 + p * 0.166 + hash(cx, p) * 0.4) % 1);
      const rise = ph * 5.2, spread = 0.25 + ph * 1.5;
      const wob = Math.sin(t * 0.9 + p + cx) * 0.35 * ph;
      const [sx, sy] = project(cx + 0.5 + wob + ph * 1.4 * drift, cy + 0.72 - ph * 0.5, z0 + rise);
      ctx.fillStyle = 'rgba(226,224,218,' + (0.30 * (1 - ph) * clamp(cold, 0, 1)) + ')';
      ctx.beginPath(); ctx.arc(sx, sy, cellW * spread * 0.45, 0, 7); ctx.fill();
    }
  }
}
/* The heap, in the sorted pass, so the holder and a passing picker stand in front of or
 * behind it: a mound of dark stuff, a few sticks out of it. It goes as it burns. */
function drawBonfireHeap(){
  const k = bon.on ? 1 : Math.max(bon.fire, bon.ember);
  const [x, y] = project(BONFIRE.x, BONFIRE.y, 0);
  const rx = cellW * (0.45 + 0.35 * k), ry = cellH * (0.22 + 0.16 * k);
  ctx.fillStyle = 'rgba(28,22,18,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y + ry * 0.3, rx * 1.15, ry * 0.9, 0, 0, 7); ctx.fill();   // the scorch under it
  ctx.fillStyle = k > 0.5 ? '#4a3a2a' : '#3a3230';
  ctx.beginPath(); ctx.ellipse(x, y - ry * 0.4, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6b5236'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++){
    const a0 = -0.4 - i * 0.75, L = rx * (0.7 + 0.5 * hash(i, 93)) * (0.6 + 0.4 * k);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a0 + 1.6) * rx * 0.3, y - ry * 0.4);
    ctx.lineTo(x + Math.cos(a0) * L, y - ry * 0.4 - Math.abs(Math.sin(a0)) * L * 0.8); ctx.stroke();
  }
}
/* Flame and glow. Drawn after applyLight: the night's multiply would turn a flame drawn
 * in the sorted pass slate by midnight, and this is the one thing on the block that is
 * its own light. The tongues flicker on the clock, no R(); the pool on the ground is a
 * screen fill like a lamp's, on the ember, so it is what is left after the flames go. */
function drawBonfireLight(t){
  if (bon.fire <= 0 && bon.ember <= 0) return;
  const [x, y] = project(BONFIRE.x, BONFIRE.y, 0);
  const prev = ctx.globalCompositeOperation;
  if (nightF > 0.02 && bon.ember > 0){
    // brighter and wider than a lamp's (0.42 / 0.20 at 2.4 / 3 cells): an open fire, not a mantle
    ctx.globalCompositeOperation = 'screen';
    const fl = RM ? 0 : 0.06 * Math.sin(t * 5.3) * bon.fire;
    const r = cellW * (3.6 + 2.2 * bon.fire), al = (0.48 + 0.34 * bon.fire + fl) * nightF * bon.ember;
    const g = ctx.createRadialGradient(x, y, 1, x, y, r);
    g.addColorStop(0, 'rgba(255,160,70,' + al.toFixed(3) + ')');
    g.addColorStop(0.4, 'rgba(255,140,50,' + (al * 0.5).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.5); ctx.translate(-x, -y);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.restore();
    const [hx, hy] = project(BONFIRE.x, BONFIRE.y, 0.9), hr = cellW * (1.6 + 1.4 * bon.fire);   // the halo in the air over it
    const gh = ctx.createRadialGradient(hx, hy, 1, hx, hy, hr);
    gh.addColorStop(0, 'rgba(255,190,90,' + ((0.3 + 0.25 * bon.fire) * nightF * bon.ember).toFixed(3) + ')');
    gh.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = gh; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  const ry = cellH * 0.3, top = y - ry * 0.7;
  if (bon.ember > 0){                                          // the red heart, breathing
    const br = 0.7 + 0.3 * Math.sin(t * 2.1);
    ctx.fillStyle = 'rgba(255,' + (70 + 60 * bon.fire | 0) + ',20,' + (0.75 * bon.ember * br).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(x, top + ry * 0.35, cellW * 0.55 * (0.5 + 0.5 * bon.ember), ry * 0.55, 0, 0, 7); ctx.fill();
  }
  if (bon.fire > 0.02){
    const fl = RM ? 0.15 : 1;
    for (let i = 0; i < 5; i++){
      const bx = (hash(i, 31) - 0.5) * cellW * 0.9 * bon.fire, w = cellW * (0.2 + 0.12 * hash(i, 32));
      const hgt = cellH * (1.3 + 0.9 * hash(i, 33)) * bon.fire * (0.75 + 0.25 * fl * Math.sin(t * 7.3 + i * 1.9) + 0.12 * fl * Math.sin(t * 13.1 + i * 3.1));
      const lean = fl * Math.sin(t * 3.7 + i) * w * 0.6 + windDir() * windF() * w * 0.8;
      ctx.fillStyle = i % 2 ? 'rgba(255,150,40,0.9)' : 'rgba(255,205,80,0.9)';
      ctx.beginPath(); ctx.moveTo(x + bx - w, top); ctx.quadraticCurveTo(x + bx - w * 0.3 + lean, top - hgt * 0.5, x + bx + lean * 1.4, top - hgt);

/* A bare tree has to read as a CROWN, not as an asterisk. The first cut drew each bough
 * as one uniform stroke from a single point and the winter linden looked like a spider.
 * So: a tapered quad with a slight curve, forking two twigs at 62% of its length, which
 * gives the silhouette a thick-to-thin gradient and a ragged edge. Deterministic — no
 * R() — so a bare tree is the same bare tree on every frame. Caller sets fill/stroke. */
function drawBoughs(x0, y0, tips, w){
  for (const [x1, y1] of tips){
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L * w, ny = dx / L * w;

    ctx.moveTo(x0 + nx, y0 + ny);
    ctx.quadraticCurveTo(mx + nx * 0.45, my + ny * 0.45, x1, y1);
    ctx.quadraticCurveTo(mx - nx * 0.45, my - ny * 0.45, x0 - nx, y0 - ny);
    ctx.closePath(); ctx.fill();
    const fx = x0 + dx * 0.62, fy = y0 + dy * 0.62;
    ctx.lineWidth = Math.max(0.7, w * 0.62); ctx.lineCap = 'round';
    for (const a of [0.6, -0.6]){

      ctx.lineTo(fx + (dx * c - dy * s) * 0.36, fy + (dx * s + dy * c) * 0.36);
      ctx.stroke();

function drawBandstand(it, t){
  const {x, y} = BANDSTAND, R0 = 2.3;
  const [bx, by] = project(x, y, 0);
  // shadow, then a stepped stone base
  const bSp = shSpread();
  ctx.fillStyle = 'rgba(24,32,18,' + 0.22 * daylight * shadowF() + ')';
  ctx.beginPath(); ctx.ellipse(bx - SUN[0] / SUN[2] * cellW * 1.4 * shOffset(), by - cellH * 0.6, cellW * R0 * 1.15 * bSp, cellH * R0 * 0.85 * bSp, 0, 0, 7); ctx.fill();
  for (const [rr, zz, col] of [[R0 * 1.16, 0.16, '#9a9184'], [R0 * 1.05, 0.34, '#aaa294'], [R0 * 0.96, 0.5, '#b6ad9d']]){
    const [px2, py2] = project(x, y, zz);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(px2, py2, cellW * rr, cellH * rr * 0.72, 0, 0, 7); ctx.fill();
  }
  // eight posts
  const posts = [];
  for (let k = 0; k < 8; k++){
    const th = k / 8 * Math.PI * 2 + 0.39;
    const wx = x + Math.cos(th) * R0 * 0.85, wy = y + Math.sin(th) * R0 * 0.62;
    posts.push([wx, wy, project(wx, wy, 0.5), project(wx, wy, 2.6)]);
  }
  posts.sort((p, q) => p[1] - q[1]);
  /* The posts are drawn in two halves with the band between them. Everything else in
     this file settles draw order by pushing an item into the sorted list, but the
     players are INSIDE this structure — pushed out to the list they would land either
     wholly in front of the near posts (standing on the grass) or wholly behind the far
     ones (standing outside the back). The stand's own centre line is the sort key. */
  const post = p => { ctx.beginPath(); ctx.moveTo(p[2][0], p[2][1]); ctx.lineTo(p[3][0], p[3][1]); ctx.stroke(); };
  ctx.strokeStyle = '#7d6a4e'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
  for (const p of posts) if (p[1] < y) post(p);
  const bf = bandF();
  if (bf > 0) drawBandPlayers(bf, t);
  ctx.strokeStyle = '#7d6a4e'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
  for (const p of posts) if (p[1] >= y) post(p);
  if (bf > 0) drawBandFlags(bf, posts);
  // ogee roof and a finial
  const [rx, ry] = project(x, y, 2.6);
  const [ax2, ay2] = project(x, y, 4.5);
  ctx.fillStyle = mix('#3f4a4e', '#6f7f84', 0.3 + 0.5 * daylight);
  ctx.beginPath();
  ctx.moveTo(rx - cellW * R0 * 1.1, ry);
  ctx.quadraticCurveTo(rx - cellW * R0 * 0.5, ay2 + cellH * 0.6, ax2, ay2);
  ctx.quadraticCurveTo(rx + cellW * R0 * 0.5, ay2 + cellH * 0.6, rx + cellW * R0 * 1.1, ry);
  ctx.quadraticCurveTo(rx, ry + cellH * R0 * 0.85, rx - cellW * R0 * 1.1, ry);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(216,224,230,.25)'; ctx.lineWidth = 1;
  for (let k = -2; k <= 2; k++){
    ctx.beginPath(); ctx.moveTo(ax2, ay2);
    ctx.quadraticCurveTo(rx + k * cellW * 0.55, (ay2 + ry) / 2, rx + k * cellW * R0 * 0.5, ry + Math.abs(k) * cellH * 0.5);
    ctx.stroke();
  }
  ctx.strokeStyle = '#c9b98a'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(ax2, ay2); ctx.lineTo(ax2, ay2 - cellH * 1.5); ctx.stroke();
  ctx.fillStyle = '#c9b98a';
  ctx.beginPath(); ctx.arc(ax2, ay2 - cellH * 1.7, Math.max(1.5, cellW * 0.14), 0, 7); ctx.fill();
  /* and the only thing that says it is MUSIC. Three marks on one phase of t, drawn
     nowhere near the PRNG — a per-frame R() here would walk the seeded stream every
     frame the machine happened to deliver, which is the trap probes keep falling into.
     Gated on the same level as the bunting, so it arrives and goes with the set. */
  if (bf > BAND_FLAGS && !RM){
    const na = clamp((bf - BAND_FLAGS) / BAND_FADE, 0, 1), r2 = Math.max(1.4, cellW * 0.13);
    ctx.save();
    for (let k = 0; k < 3; k++){
      const u = (t * 0.3 + k * 0.37) % 1;
      ctx.globalAlpha = na * Math.sin(u * Math.PI) * 0.8;
      const nx = ax2 + (k - 1) * cellW * 0.7 + Math.sin(u * 4.5 + k * 2.1) * cellW * 0.45;
      const ny = ay2 - cellH * (1.9 + u * 3.6);
      ctx.fillStyle = '#e8e0c8';
      ctx.beginPath(); ctx.ellipse(nx, ny, r2, r2 * 0.78, -0.4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(nx + r2 * 0.85, ny); ctx.lineTo(nx + r2 * 0.85, ny - r2 * 3.2); ctx.stroke();
    }
    ctx.restore();
  }
}
/* ---- the mill wheel: live geometry in the x-z plane facing the viewer, its foot in
 * the current, sorted with the walkers. Every frame: rim, MILL_SPOKES spokes and as
 * many paddles turned by millAng; a hub; a post on the towpath side and one in the
 * water; foam at the foot scaled by millSpin() so a frozen wheel stands in still water.
 * Drawn on ctx before applyLight, so it goes slate at night like every timber. */
const MILL_SPOKES = 8;
function wheelPt(th, rr){ return project(MILL_WHEEL.x + rr * Math.cos(th), MILL_WHEEL.y, MILL_WHEEL.hub + rr * Math.sin(th)); }
function drawMillShadow(){
  const {x, y, r} = MILL_WHEEL, sh = shadowF();
  if (sh <= 0.02) return;
  ctx.fillStyle = 'rgba(18,24,26,' + (0.28 * sh).toFixed(3) + ')';
  const dx = -SUN[0] * 0.9;                       // the shadow lies along the sun's lean
  poly(ctx, [project(x - r + dx, y + 0.35, 0), project(x + r + dx, y + 0.35, 0),
             project(x + r * 0.8 + dx, y + 0.35 + r * 0.9, 0), project(x - r * 0.8 + dx, y + 0.35 + r * 0.9, 0)]);
  ctx.fill();
}
function drawMillWheel(){
  const {x, y, r, hub} = MILL_WHEEL, spin = millSpin();
  // posts: one on the towpath's edge, one standing in the water
  ctx.strokeStyle = '#4e3b28'; ctx.lineWidth = Math.max(1.8, cellW * 0.16);
  for (const px of [x + r * 0.55, x - r * 0.55]){
    const p1 = project(px, y + 0.3, px > x ? 0 : -0.15), p2 = project(px, y + 0.3, hub);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
  const [ax, ay] = project(x - r * 0.55, y + 0.3, hub), [bx, by] = project(x + r * 0.55, y + 0.3, hub);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();      // the axle bearer
  // paddles, then spokes, then the rim over both
  ctx.fillStyle = '#8a6d4b'; ctx.strokeStyle = 'rgba(40,28,18,.6)'; ctx.lineWidth = 1;
  for (let k = 0; k < MILL_SPOKES; k++){
    const th = millAng + k * Math.PI * 2 / MILL_SPOKES, w = 0.18;
    const a = wheelPt(th - w, r * 0.78), b = wheelPt(th + w, r * 0.78), c = wheelPt(th + w * 0.75, r * 1.08), d = wheelPt(th - w * 0.75, r * 1.08);
    poly(ctx, [a, b, c, d]); ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle = '#5c4630'; ctx.lineWidth = Math.max(1, cellW * 0.08);
  ctx.beginPath();
  for (let k = 0; k < MILL_SPOKES; k++){
    const th = millAng + k * Math.PI * 2 / MILL_SPOKES;
    const h0 = wheelPt(th, 0), h1 = wheelPt(th, r * 0.92);
    ctx.moveTo(h0[0], h0[1]); ctx.lineTo(h1[0], h1[1]);
  }
  ctx.stroke();
  for (const rr of [r * 0.92, r * 0.72]){
    ctx.lineWidth = Math.max(1.2, cellW * (rr > r * 0.8 ? 0.12 : 0.07));
    ctx.beginPath();
    for (let k = 0; k <= 28; k++){ const p = wheelPt(k / 28 * Math.PI * 2, rr); k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    ctx.stroke();
  }
  const [hx, hy] = wheelPt(0, 0);
  ctx.fillStyle = '#3b2c1d'; ctx.beginPath(); ctx.arc(hx, hy, Math.max(1.5, cellW * 0.14), 0, 7); ctx.fill();
  // foam where the paddles break the water; still when the wheel is
  if (spin > 0.02){
    ctx.fillStyle = 'rgba(236,244,246,' + (0.45 * Math.min(1, spin) * Math.max(0.35, daylight)).toFixed(3) + ')';
    for (let k = 0; k < 5; k++){
      const fx = x - r * 0.7 + (hash(k, 91) + 0.3 * Math.sin(millAng * 3 + k)) * r * 1.4;
      const [sx, sy] = project(fx, y + 0.55 + hash(k, 93) * 0.5, 0);
      ctx.beginPath(); ctx.arc(sx, sy, 0.9 + hash(k, 95) * 1.2, 0, 7); ctx.fill();
    }
  }
}
function millWheelAt(p){
  const [cx, cy] = wheelPt(0, 0), [ex] = wheelPt(0, MILL_WHEEL.r), [, ty] = wheelPt(Math.PI / 2, MILL_WHEEL.r);
  return Math.abs(p[0] - cx) <= ex - cx + 1 && Math.abs(p[1] - cy) <= cy - ty + 1;
}
function millWheelName(){
  const skin = fountainSkin(), run = riverRun();
  return skin >= 0.98 ? 'the mill wheel, stopped in the ice' : skin > 0.25 ? 'the mill wheel, slowing as the river ices'
       : run > 1.15 ? 'the mill wheel, turning hard on the winter water'
       : run < 0.85 ? 'the mill wheel, turning slow on the summer river' : 'the mill wheel, turning';
}
function drawJetty(){
  const {x, y} = JETTY;
  ctx.fillStyle = 'rgba(18,24,26,.35)';
  const s1 = project(x - 2.6, y + 0.4, 0), s2 = project(x + 0.4, y + 0.4, 0);
  const s3 = project(x + 0.4, y + 1.5, 0), s4 = project(x - 2.6, y + 1.5, 0);
  poly(ctx, [s1, s2, s3, s4]); ctx.fill();
  const d1 = project(x - 2.6, y - 0.7, 0.5), d2 = project(x + 0.4, y - 0.7, 0.5);
  const d3 = project(x + 0.4, y + 0.7, 0.5), d4 = project(x - 2.6, y + 0.7, 0.5);
  ctx.fillStyle = '#7d6349'; poly(ctx, [d1, d2, d3, d4]); ctx.fill();
  ctx.strokeStyle = 'rgba(50,38,26,.5)'; ctx.lineWidth = 1;
  for (let k = 1; k < 6; k++){
    const p1 = project(x - 2.6 + k * 0.5, y - 0.7, 0.5), p2 = project(x - 2.6 + k * 0.5, y + 0.7, 0.5);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
  ctx.strokeStyle = '#5d4a33'; ctx.lineWidth = Math.max(1.8, cellW * 0.17);
  for (const [px, py] of [[x - 2.4, y + 0.7], [x + 0.2, y + 0.7], [x - 2.4, y - 0.7], [x + 0.2, y - 0.7]]){
    const p1 = project(px, py, 0), p2 = project(px, py, 1.0);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
}
/* ============ the footbridge ============ *
 * A light timber span on two trestles, handrails both sides, a ramp up off each bank.
 * Split in two draws so the depth sort works: drawDeckSpan (the planks, the upstream
 * rail, the boat while it is under) sorts before the walkers on it; drawDeckFront (the
 * downstream rail, the trestles, the edge, the shadow) sorts after them. */
const DECK_X0 = RIVER_X0 - DECK_RAMP, DECK_X1 = RIVER_X1 + DECK_RAMP;
const DECK_N = DECK_Y0 + 0.25, DECK_S = DECK_Y1 - 0.25;   // the planked width
function deckRail(yy, front){
  const zr = DECK_Z + 0.95, col = front ? '#4e3d2a' : '#5e4b35';
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, cellW * 0.11);
  for (let px = RIVER_X0 + 0.35; px < RIVER_X1; px += 1.15){
    const p1 = project(px, yy, DECK_Z), p2 = project(px, yy, zr);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
  ctx.lineWidth = Math.max(1.2, cellW * 0.13);
  for (const z of [zr, DECK_Z + 0.5]){
    const r1 = project(RIVER_X0 + 0.1, yy, z), r2 = project(RIVER_X1 - 0.1, yy, z);
    ctx.beginPath(); ctx.moveTo(r1[0], r1[1]); ctx.lineTo(r2[0], r2[1]); ctx.stroke();
  }
}
function drawDeckSpan(){
  if (boatUnderDeck()) drawBoat();             // the rower goes under; the planks go on top
  const hv = 0.3 + 0.55 * daylight;
  // the ramps: a plank rising from each bank to the span
  ctx.fillStyle = mix('#5a4632', '#a78a62', hv);
  for (const [xa, xb] of [[DECK_X0, RIVER_X0 + 0.5], [DECK_X1, RIVER_X1 - 0.5]]){
    poly(ctx, [project(xa, DECK_N, 0), project(xb, DECK_N, DECK_Z), project(xb, DECK_S, DECK_Z), project(xa, DECK_S, 0)]);
    ctx.fill();
  }
  // the span
  ctx.fillStyle = mix('#5e4a36', '#b3956a', hv);
  poly(ctx, [project(RIVER_X0 + 0.5, DECK_N, DECK_Z), project(RIVER_X1 - 0.5, DECK_N, DECK_Z),
             project(RIVER_X1 - 0.5, DECK_S, DECK_Z), project(RIVER_X0 + 0.5, DECK_S, DECK_Z)]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(50,38,26,.45)'; ctx.lineWidth = 1;
  for (let px = RIVER_X0 + 1; px < RIVER_X1 - 0.5; px += 0.5){
    const p1 = project(px, DECK_N, DECK_Z), p2 = project(px, DECK_S, DECK_Z);
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
  }
  deckRail(DECK_N, false);
}
function drawDeckFront(){
  // the shadow on the water downstream — sky occlusion, so it takes only the sun's half
  const hard = shadowF(), tail = 1.6 - 1.5 * (1 - shOffset());
  ctx.fillStyle = 'rgba(18,24,26,' + (0.30 - 0.15 * (1 - hard)).toFixed(3) + ')';
  poly(ctx, [project(RIVER_X0 + 0.3, DECK_S + 0.05, 0), project(RIVER_X1 - 0.3, DECK_S + 0.05, 0),
             project(RIVER_X1 - 0.3, DECK_S + tail, 0), project(RIVER_X0 + 0.3, DECK_S + tail, 0)]);
  ctx.fill();
  // two trestles standing in the river, and a post at each bank
  ctx.strokeStyle = '#3f3022'; ctx.lineWidth = Math.max(1.6, cellW * 0.16);
  for (const px of [RIVER_X0 + 0.7, RIVER_X0 + 4.6, RIVER_X1 - 4.6, RIVER_X1 - 0.7]){
    for (const yy of [DECK_N + 0.15, DECK_S - 0.15]){
      const p1 = project(px, yy, 0), p2 = project(px, yy, DECK_Z);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    }
  }
  // the downstream edge of the planking, then its rail
  ctx.fillStyle = mix('#3b2d20', '#7a6244', 0.3 + 0.5 * daylight);
  poly(ctx, [project(RIVER_X0 + 0.5, DECK_S, DECK_Z - 0.22), project(RIVER_X1 - 0.5, DECK_S, DECK_Z - 0.22),
             project(RIVER_X1 - 0.5, DECK_S, DECK_Z), project(RIVER_X0 + 0.5, DECK_S, DECK_Z)]);
  ctx.fill();
  deckRail(DECK_S, true);
}
function drawSwan(it){
  const s = it.s;
  const [x, y] = project(s.x, s.y, 0);
  const sc = cellW / 11;
  const up = s.state === 'upend' ? s.hold : 0, pr = s.state === 'preen' ? s.hold : 0;
  ctx.strokeStyle = 'rgba(232,242,240,.32)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y + 2 * sc, 6 * sc, -0.7, 0.7); ctx.stroke();
  if (up > 0.5){   // the ring an upended swan spreads
    ctx.beginPath(); ctx.ellipse(x, y + 0.5 * sc, (5 + 2 * up) * sc, (2 + up) * sc, 0, 0, 7); ctx.stroke();
  }
  const bob = Math.sin(s.ph) * 0.6 * (1 - up);
  ctx.fillStyle = '#f2f0e8';
  // upend: the body tips tail-up (rotated, lifted at the stern) and the neck is under
  ctx.beginPath(); ctx.ellipse(x - 1.2 * up * sc, y - (2 + 1.5 * up) * sc - bob, (4.6 - 1.4 * up) * sc, (2.6 + 0.8 * up) * sc, -0.9 * up, 0, 7); ctx.fill();
  if (up > 0){   // the tail, up out of the water
    ctx.beginPath();
    ctx.moveTo(x - 4.2 * sc, y - 3 * sc);
    ctx.lineTo(x - (4.8 + 1.4 * up) * sc, y - (3.6 + 4.5 * up) * sc);
    ctx.lineTo(x - 2.4 * sc, y - (3.5 + 1.8 * up) * sc);
    ctx.closePath(); ctx.fill();
  }
  if (up < 1){
    ctx.save(); ctx.globalAlpha = 1 - up;
    ctx.strokeStyle = '#f2f0e8'; ctx.lineWidth = Math.max(1.4, 1.5 * sc);
    ctx.beginPath();
    ctx.moveTo(x + 2.5 * sc, y - 3.4 * sc - bob);
    // preen: the neck folds back over the wing, the bill down on the flank
    const hx = x + (4.6 - 5.4 * pr) * sc, hy = y - (9 - 5.2 * pr) * sc - bob;
    ctx.quadraticCurveTo(x + (6 - 1.5 * pr) * sc, y - (6 + 1.5 * pr) * sc - bob, hx, hy);
    ctx.stroke();
    ctx.fillStyle = '#e8952e';
    ctx.beginPath(); ctx.arc(hx + (0.6 - 1.2 * pr) * sc, hy - (0.4 - 1.6 * pr) * sc, 1.3 * sc, 0, 7); ctx.fill();
    ctx.restore();
  }
}
function drawFountain(it, t){
  const [x, y] = project(FOUNTAIN.x, FOUNTAIN.y + 1.9, 0);
  // stone rim
  ctx.strokeStyle = '#8f887c'; ctx.lineWidth = Math.max(2, cellW * 0.28);
  const [cx2, cy2] = project(FOUNTAIN.x, FOUNTAIN.y, 0);
  ctx.beginPath(); ctx.ellipse(cx2, cy2 + cellH * 0.4, cellW * 2.15, cellH * 2.4, 0, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(60,56,50,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(cx2, cy2 + cellH * 0.4, cellW * 2.15, cellH * 2.4, 0, 0, 7); ctx.stroke();
  // centre column and bowl
  const [px2, py2] = project(FOUNTAIN.x, FOUNTAIN.y + 0.2, 1.5);
  ctx.strokeStyle = '#8f887c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx2, cy2 + 2); ctx.lineTo(px2, py2); ctx.stroke();
  ctx.fillStyle = '#9a9184';
  ctx.beginPath(); ctx.ellipse(px2, py2, cellW * 0.7, cellH * 0.5, 0, 0, 7); ctx.fill();
  // spray
  const jet = fountainJet(), play = fountainPlay() * jet;   // play is what is DRAWN: 0 once the basin has skinned
  if (jet > 0){
    // jets: each keeps its own threshold (hash k,23) against play, so the winter
    // fountain is two or three jets not five dim ones; height and reach ride play
    const rise = Math.min(play, 1.4), reach = Math.min(play, 1.2);
    /* the wind: the plume leans downwind (+x, the way the chimney smoke goes) by a
       gusting share of a cell, phased off windT like the washing, and the droplets
       carry the same way and further. lean is 0 on a calm day, so every term below
       reduces to the constant it replaced. hash() and the clock only — no R(). */
    const lean = windSign * windF() * (RM ? 0.6 : 0.65 + 0.35 * Math.sin(windT * 2.2 + 0.7)) * cellW * 0.9;
    ctx.strokeStyle = 'rgba(220,240,245,' + (0.55 * jet * Math.min(1, 0.6 + 0.4 * play)).toFixed(3) + ')'; ctx.lineWidth = 1;
    for (let k = 0; k < 5; k++){
      if (hash(k, 23) >= play) continue;
      const ang = k / 5 * Math.PI * 2 + t * 0.3;
      const sx2 = Math.cos(ang) * cellW * 1.1 * reach, sy2 = Math.sin(ang) * cellH * 1.1 * reach;
      ctx.beginPath();
      ctx.moveTo(px2, py2 - 3);
      ctx.quadraticCurveTo(px2 + sx2 * 0.7 + lean * 0.8 * rise, py2 - 10 * rise - Math.sin(t * 3 + k) * 2,
                           px2 + sx2 + lean * 1.6, cy2 + sy2 * 0.5);
      ctx.stroke();
    }
    // droplets: 4 at the anchor, 1-2 in the frost, 6-7 in July — blown downwind
    for (let k = 0; k < 4 * play; k++){
      const al = Math.max(0, Math.sin(t * 2.4 + k * 1.9)) * 0.5;
      if (al < 0.08) continue;
      ctx.fillStyle = 'rgba(230,245,248,' + al + ')';
      ctx.beginPath();
      ctx.arc(cx2 + (hash(k, 9) - 0.5) * cellW * 3 + lean * (1 + hash(k, 13)),
              cy2 + (hash(k, 11) - 0.5) * cellH * 2.6, 1.1, 0, 7);
      ctx.fill();
    }
    // the lee side: spray carried past the rim onto the paving, 6 faint dots that
    // walk downwind on windT and fade as they go. Nothing on a calm day.
    if (lean !== 0){
      const w = windF() * jet * Math.min(1, 0.6 + 0.4 * play);
      for (let k = 0; k < 6; k++){
        const ph = (windT * 0.9 + hash(k, 41)) % 1;
        const al = w * 0.42 * (1 - ph) * Math.max(0, Math.sin(t * 1.7 + k * 2.1) * 0.5 + 0.5);
        if (al < 0.04) continue;
        ctx.fillStyle = 'rgba(225,240,245,' + al.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(cx2 + windSign * cellW * (2.0 + ph * 2.4) + (hash(k, 43) - 0.5) * cellW,
                cy2 + cellH * 0.4 + (hash(k, 47) - 0.5) * cellH * 2.2 + ph * cellH * 0.3, 1 + (1 - ph) * 0.6, 0, 7);
        ctx.fill();
      }
    }
  }
}
/* ============ the river's flow ============ *
 * Drifting streaks that vanish under the bridge — the water's only motion, and until
 * now the only part of the river with no name to reach for. Four things read
 * riverRun(): how fast a streak drifts, how many there are, how long each one is
 * drawn, and how far its colour leans from the anchor. Winter is a lot of long fast
 * cold-blue streaks; August is a few short slow green ones. Every one of them is

function drawMarketStall(it){
  const s = it.s, p = it.p;

  const w = cellW * 2.5;

   * finished: the trader fades up crouched over the pitch, the trestle unfolds up
   * to its full board, the frame rises, the canvas rolls out from the left pole,
   * and only then do the goods come out. Every term is a clamp on the same p, so
   * running p backwards packs the stall down in the reverse order. */

  const pole   = clamp((p - 0.34) / 0.24, 0, 1);
  const can    = clamp((p - 0.56) / 0.24, 0, 1);
  ctx.fillStyle = 'rgba(20,20,15,' + (0.25 * clamp(p / 0.55, 0, 1)).toFixed(3) + ')';

     board is laid out one pitch at a time on the same p, as before, so it still
     packs away in reverse. */

    const g = clamp((p - 0.80 - k * 0.03) / 0.05, 0, 1);

    ctx.fillStyle = k % 2 ? sp.col2 : sp.col;
    ctx.beginPath();
    ctx.arc(x - w/2 + 3 + (k % 3) * (w/3) + hash(k, s.x) * 4, y - cellH * 1.5 - (k > 2 ? 3 : 0),

    ctx.fill();
  }

                            [project(s.x-1.25, s.y+1.7, 0), f1], [project(s.x+1.25, s.y+1.7, 0), f2]]){
      ctx.beginPath(); ctx.moveTo(gp[0], gp[1]); ctx.lineTo(cp[0], cp[1]); ctx.stroke();
    }

    ctx.save(); poly(ctx, cnv); ctx.clip();
    ctx.fillStyle = s.c2;
    for (let k = -6; k < 7; k += 2) ctx.fillRect(x + k * 7, Math.min(c1[1], f1[1]) - 4, 7, 36);
