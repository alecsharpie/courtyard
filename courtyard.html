<meta charset="utf-8">
<title>The Courtyard</title>
<style>
  :root{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  @media (prefers-color-scheme: light){
    :root{ --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
      --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
      --glass-shine:rgba(255,255,255,.10); }
  }
  :root[data-theme="dark"]{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  :root[data-theme="light"]{
    --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
    --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
    --glass-shine:rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:radial-gradient(120% 100% at 50% 0%, var(--room2), var(--room) 70%);
    color:var(--ink); font-family:system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #room{ display:flex; flex-direction:column; width:min(100vw, 1280px); height:100vh; padding:clamp(8px,2vh,22px) clamp(8px,2vw,26px); }
  #frame{
    position:relative; flex:1; min-height:0;
    border:10px solid var(--frame);
    border-top-color:var(--frame-hi);
    border-radius:6px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.55), 0 18px 50px rgba(0,0,0,.35);
    background:#0d1410; overflow:hidden;
  }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  #glass{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(115deg, transparent 44%, var(--glass-shine) 48%, transparent 52%),
      radial-gradient(140% 120% at 50% 45%, transparent 66%, rgba(0,0,0,.38) 100%);
  }
  #sill{
    flex:none; display:flex; align-items:baseline; gap:18px;
    padding:12px 6px 4px; font-size:13px; color:var(--ink-dim);
  }
  #plate{ font-family:"Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    font-size:17px; color:var(--ink); letter-spacing:.02em; white-space:nowrap; }
  #plate small{ display:block; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim); font-family:system-ui,sans-serif; margin-top:1px;}
  #daytime{ font-variant-numeric:tabular-nums; white-space:nowrap; min-width:12ch; }
  #ticker{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:"Iowan Old Style", Palatino, Georgia, serif; font-style:italic; font-size:14px;
    color:var(--ink); opacity:.9; transition:opacity .6s; }
  #ticker.fade{ opacity:.35; }
  #stats{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  #ctrl{ display:flex; gap:6px; }
  #ctrl button{
    font:inherit; font-size:12px; color:var(--ink); background:transparent;
    border:1px solid var(--ink-dim); border-radius:4px; padding:2px 9px; cursor:pointer;
  }
  #ctrl button:hover{ border-color:var(--accent); color:var(--accent); }
  #ctrl button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (max-width:640px){ #ticker,#stats{ display:none; } #plate small{display:none;} }
</style>

<div id="room">
  <div id="frame">
    <canvas id="cv" aria-label="A courtyard and the lane beside it, seen from an upstairs window"></canvas>
    <div id="glass"></div>
  </div>
  <div id="sill">
    <div id="plate">The Courtyard<small>a cellular block</small></div>
    <div id="daytime">Day 1 &middot; Dawn</div>
    <div id="ticker">The courtyard is quiet. Not much here yet.</div>
    <div id="stats">0 people &middot; 0 blooms</div>
    <div id="ctrl">
      <button id="pause" aria-label="Pause simulation">Pause</button>
      <button id="speed" aria-label="Simulation speed">1&times;</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ setup ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = 64;                  // courtyard block is the left 64 columns
const GW = 138;                // full world width: courtyard, cross street, allotments, plaza, river, far bank
const WH = 88;                 // full world height incl. the lane below
const WALL = 0, PATH = 1, GRASS = 2, BED = 3, CBED = 4, TRUNK = 5, SIDE = 6, ROAD = 7, VOID = 8, WATER = 9,
      TUNNEL = 10,             // roofed passage under a building — seen through an arch
      SLOT = 11;               // open passage cut through a block — seen from above
const POND = {x:90, y:49.5, rx:4.2, ry:3.1};
const CX = 32, CY = 32.5;
const WALL_H = 5.6;
/* the lane */
const LN_WALK_N = 65, LN_ROAD0 = 68, LN_ROAD1 = 76, LN_WALK_S = 79; // row boundaries
const LANE_N_Y = 66.4, LANE_S_Y = 77.3;   // walking lines
const KIOSK = {x:40.5, y:66.2};
/* the cross street (a T off the lane, running north along the courtyard's east side) */
const XS_W0 = 66, XS_R0 = 68, XS_R1 = 74, XS_E1 = 76;   // west footway, road, east footway
const XS_WALK_W = 67, XS_WALK_E = 74.9;                 // walking lines
/* the allotment gardens east of the cross street */
const ALT_X0 = 78, ALT_GATE = 86.5;
function inAllotment(x, y){ return x >= ALT_X0 && x < 96 && y >= 3 && y < 61; }
/* the river quarter: plaza, quay, river and the lane bridge */
const DIV_X0 = 96, PLAZA_X0 = 99, PLAZA_X1 = 112, QUAY_X0 = 112, RIVER_X0 = 114;
const FOUNTAIN = {x:105.5, y:30};
const PLAZA_PITS = [[100.5, 15], [108.5, 15], [100.5, 45], [108.5, 45]];
const PLAZA_BENCHES = [{x:102, y:34.2}, {x:107.6, y:23.8}];
const QUAY_BENCHES = [{x:112.1, y:18}, {x:112.1, y:46}];
/* the far bank across the river: towpath, church green, bandstand */
const RIVER_X1 = 127, TOW_X0 = 127, FAR_X0 = 130, PARK_GATE = 134;
const CHURCH = {tx0:131, tx1:134, ty0:4, ty1:8, nx0:131, nx1:136, ny0:8, ny1:17};
function churchAt(x, y){
  return (x >= CHURCH.nx0 && x < CHURCH.nx1 && y >= CHURCH.ny0 && y < CHURCH.ny1) ||
         (x >= CHURCH.tx0 && x < CHURCH.tx1 && y >= CHURCH.ty0 && y < CHURCH.ty1);
}
const BANDSTAND = {x:133.6, y:41};
const FAR_BENCHES = [{x:131.4, y:27}, {x:136, y:48}];
const ORCHARD = [[136.6,23],[136.8,31],[131.5,53],[136.4,55]];
const JETTY = {x:128.4, y:35};
const TOW_WALK = 128.6, FAR_WALK = 133.2;
/* the alley cut through the terrace between the allotments and the plaza */
const ALLEY_Y = 31;

let W = 0, H = 0, DPR = 1, cellW = 12, cellH = 8, topPad = 40, originX = 0;
const PINCH = 0.11;
const LIFT = 1.15;

let FOCUS = GW / 2;
function project(wx, wy, wz){
  // the pinch keys off screen depth, not world depth, so anything standing up
  // still lines up exactly with the ground beside it — no seams along walls
  const d = wy - (wz || 0) * LIFT;
  const p = 1 - PINCH * (1 - d / WH);
  return [ originX + (wx - FOCUS) * cellW * p, topPad + d * cellH ];
}
function unproject(sx, sy){
  const wy = (sy - topPad) / cellH;
  const p = 1 - PINCH * (1 - wy / WH);
  const wx = (sx - originX) / (cellW * p) + FOCUS;
  return [wx, wy];
}
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR;
  const fitW = W / GW, fitH = (H - 16) / ((WH + 10.5) * 0.70);
  if (fitH > fitW * 1.5){                         // tall, narrow window: lean in rather than shrink away
    cellW = Math.min(fitH, fitW * 2.1); FOCUS = 54;
  } else {
    cellW = Math.min(fitW, fitH); FOCUS = GW / 2;
  }
  cellH = cellW * 0.70;
  topPad = 4 + 9.6 * cellH;                       // headroom for sky, distant hills and spires
  const spare = H - (topPad + WH * cellH + 6);
  if (spare > 0) topPad += spare * (spare > 12 * cellH ? 0.5 : 0.82);
  originX = W / 2;
  groundDirty = true;
}
addEventListener('resize', resize);

/* ============ noise & utils ============ */
function hash(x, y){
  let n = (x * 374761393 + y * 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
/* Randomness. Unseeded by default, so the live diorama keeps its natural drift.
 * `?seed=N` swaps in a deterministic xorshift so the grow-courtyard census can
 * diff two builds of the town without the noise drowning the signal. Any new
 * random draw MUST go through R() (or hash(x,y) for per-cell decisions) — a bare
 * Math.random() is invisible to the seed and makes the census lie. */
let R = Math.random, SEED = null;
function makeR(seed){
  let s = ((seed | 0) >>> 0) || 1;
  return function(){ s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
{ const q = new URLSearchParams(location.search);
  if (q.has('seed')){ SEED = +q.get('seed') | 0; R = makeR(SEED); } }
/* Rewind the PRNG to its starting state. The census needs this because an unknown
 * number of animation frames run between page load and the first measurement, and
 * a draw pass may consume draws — rewinding makes the warped sim a pure function
 * of (seed, seconds) again. No-op on an unseeded (live) page. */
window.__reseed = function(n){ if (SEED === null && n === undefined) return false; R = makeR(n === undefined ? SEED : n); return true; };
function pick(a){ return a[(R() * a.length) | 0]; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function cparse(c){
  if (c[0] === '#'){ const v = parseInt(c.slice(1),16); return [v>>16, (v>>8)&255, v&255]; }
  const m = c.match(/\d+/g); return [+m[0], +m[1], +m[2]];
}
function mix(c1, c2, t){
  const a = cparse(c1), b = cparse(c2);
  return 'rgb(' + (lerp(a[0],b[0],t)|0) + ',' + (lerp(a[1],b[1],t)|0) + ',' + (lerp(a[2],b[2],t)|0) + ')';
}

/* ============ courtyard geometry (unchanged from the garden you know) ============ */
function wallR(th){ return 27.5 / Math.max(Math.abs(Math.cos(th)), Math.abs(Math.sin(th))); }
function gR(th){
  const raw = 17.2 + 2.3*Math.sin(2*th+1.3) + 1.5*Math.sin(3*th+4.1) + 0.8*Math.sin(5*th+2.2);
  return Math.min(raw, wallR(th) - 5.5);
}
function bedIn(th){ return 4.6 + 0.6*Math.sin(3*th+1.0); }
function bedOut(th){ return bedIn(th) + 2.8 + 0.4*Math.sin(2*th+2.6); }
function bedGap(th){ return Math.cos(th - 0.5) > 0.90 || Math.cos(th - (Math.PI + 1.1)) > 0.90; }

const grid = new Uint8Array(GW * WH);
const wear = new Float32Array(GW * WH);
const daisy = new Uint8Array(GW * WH);
const bSp = new Uint8Array(GW * WH), bSt = new Uint8Array(GW * WH), bAge = new Float32Array(GW * WH);

const SPECIES = [
  {name:'marigolds', col:'#e0913a', col2:'#f3b04e', h:0.55, style:'dot',   minDay:0},
  {name:'poppies',   col:'#c24a3a', col2:'#d96a52', h:0.75, style:'dot',   minDay:0},
  {name:'lavender',  col:'#8f7fd4', col2:'#a795e2', h:0.85, style:'spike', minDay:1},
  {name:'ferns',     col:'#4f7a3d', col2:'#61924b', h:0.6,  style:'bush',  minDay:0},
  {name:'daylilies', col:'#d9a13c', col2:'#e8bb5a', h:0.9,  style:'spike', minDay:2},
  {name:'roses',     col:'#cf6f96', col2:'#e18cab', h:1.15, style:'bush',  minDay:3},
  {name:'salvia',    col:'#4a5fb0', col2:'#6379c9', h:0.8,  style:'spike', minDay:2},
  /* allotment vegetables */
  {name:'carrots',   col:'#5f8a3c', col2:'#e07b28', h:0.4,  style:'spike', minDay:0, veg:1},
  {name:'cabbages',  col:'#7f9a5d', col2:'#a3b876', h:0.35, style:'bush',  minDay:0, veg:1},
  {name:'beans',     col:'#4f7a3d', col2:'#d9c04a', h:1.1,  style:'spike', minDay:1, veg:1},
  {name:'pumpkins',  col:'#6a8a44', col2:'#d9822b', h:0.4,  style:'bush',  minDay:3, veg:1},
];
function speciesFor(x, y){
  const veg = inAllotment(x, y);
  return SPECIES.filter(s => s.minDay <= day && !s.veg === !veg);
}

function nearEntrance(x, y){
  const cxr = Math.abs(x + .5 - 32.5), cyr = Math.abs(y + .5 - 32.5);
  if (cxr < 2.3 && (y < 8 || y > 56)) return true;
  if (cyr < 2.3 && (x < 8 || x > 56)) return true;
  return false;
}
const BENCH_SPOTS = [
  {x:20, y:6}, {x:45, y:6},
  {x:6,  y:44}, {x:57, y:22},
];
const LANE_BENCHES = [ {x:12, y:65.6}, {x:52, y:65.6} ];
/* café tables on the south footway, under the green awning */
const CAFE_TABLES = [
  {x:23.2, y:77.4, taken:0}, {x:26.4, y:76.9, taken:0}, {x:29.4, y:77.5, taken:0},
];
const TREE_PITS = [8, 22, 48, 58];        // street trees along the north footway
function buildGrid(){
  for (let y = 0; y < WH; y++) for (let x = 0; x < GW; x++){
    const i = y * GW + x;
    const crossRoad = x >= XS_R0 && x < XS_R1;
    const crossSide = (x >= XS_W0 && x < XS_R0) || (x >= XS_R1 && x < XS_E1);
    if (y < 64){
      if (x < 64){
        const inX = x >= 3 && x < 61, inY = y >= 3 && y < 61;
        if (!(inX && inY)){
          // north and south gateways are roofed (you look through an arch);
          // the east and west passages are open cuts, seen down into from up here
          if (Math.abs(x + .5 - 32.5) < 2.3 && !inY) grid[i] = TUNNEL;
          else if (Math.abs(y + .5 - 32.5) < 2.3 && !inX) grid[i] = SLOT;
          else grid[i] = WALL;
          continue;
        }
        const dx = x + .5 - CX, dy = y + .5 - CY;
        const r = Math.hypot(dx, dy), th = Math.atan2(dy, dx);
        if (r < 1.15){ grid[i] = TRUNK; continue; }
        if (r < gR(th)){
          if (r > bedIn(th) && r < bedOut(th) && !bedGap(th)) grid[i] = CBED;
          else grid[i] = GRASS;
          continue;
        }
        const dWall = Math.min(x - 3, 60 - x, y - 3, 60 - y);
        const depth = 1.6 + 1.4 * hash(x >> 2, y >> 2);
        if (dWall < depth && !nearEntrance(x, y)) grid[i] = BED;
        else grid[i] = PATH;
      } else if (x < XS_W0){
        // building sliver between courtyard wall and cross street; the east passage cuts through
        grid[i] = Math.abs(y + .5 - 32.5) < 2.3 ? SLOT : WALL;
      } else if (x < XS_E1){
        grid[i] = crossRoad ? ROAD : SIDE;
      } else if (x < ALT_X0){
        grid[i] = (y >= 3 && y < 61) ? GRASS : WALL;   // verge with the allotment fence
      } else if (x >= DIV_X0){
        if (x < PLAZA_X0){                             // the terrace between allotments and plaza
          grid[i] = Math.abs(y + .5 - ALLEY_Y) < 1.9 ? SLOT : WALL;   // an alley cuts through it
        }
        else if (x < PLAZA_X1){
          if (y < 3) grid[i] = WALL;
          else if (y < 61){
            grid[i] = PATH;
            const fd = Math.hypot(x + .5 - FOUNTAIN.x, (y + .5 - FOUNTAIN.y) * 1.2);
            if (fd < 1.8) grid[i] = WATER;
            if (((x >= 100 && x <= 101) || (x >= 109 && x <= 110)) &&
                ((y >= 8 && y <= 9) || (y >= 50 && y <= 51))) grid[i] = BED;
          } else {
            grid[i] = (x >= 102 && x < 108) ? SIDE : WALL;   // open mouth onto the lane
          }
        }
        else if (x < RIVER_X0){ grid[i] = SIDE; }      // the quay runs the full height
        else if (x < RIVER_X1){ grid[i] = WATER; }     // the river
        else if (x < FAR_X0){ grid[i] = y < 3 ? WALL : SIDE; }         // the towpath on the far bank
        else if (y < 3) grid[i] = WALL;                                // the church green
        else if (y >= 61) grid[i] = Math.abs(x + .5 - PARK_GATE) < 1.75 ? TUNNEL : WALL;
        else grid[i] = churchAt(x, y) ? WALL : GRASS;
      } else {
        if (y < 3 || y >= 61){
          grid[i] = (y >= 61 && Math.abs(x - ALT_GATE) < 1.8) ? TUNNEL : WALL;
        } else {
          grid[i] = GRASS;
          const pdx = (x + .5 - POND.x) / POND.rx, pdy = (y + .5 - POND.y) / POND.ry;
          if (pdx * pdx + pdy * pdy < 1){ grid[i] = WATER; continue; }
          // allotment plots in tidy rows (clear of the pond corner)
          const px = (x - 80) % 5, py2 = (y - 8) % 7;
          if (x >= 80 && x <= 93 && y >= 8 && y <= 56 && px < 3 && py2 < 2 &&
              !(x >= 84 && y >= 42)) grid[i] = BED;
        }
      }
    } else if (y === 64){
      if (crossRoad) grid[i] = ROAD;
      else if (crossSide) grid[i] = SIDE;
      else if (x >= 102 && x < 108) grid[i] = SIDE;          // plaza mouth
      else if (x >= QUAY_X0 && x < RIVER_X0) grid[i] = SIDE; // quay
      else if (x < RIVER_X0) grid[i] = (Math.abs(x + .5 - 32.5) < 2.3 || Math.abs(x - ALT_GATE) < 1.8) ? TUNNEL : WALL;
      else if (x < RIVER_X1) grid[i] = WATER;
      else if (x < FAR_X0) grid[i] = SIDE;                   // steps down to the towpath
      else grid[i] = Math.abs(x + .5 - PARK_GATE) < 1.75 ? TUNNEL : WALL;
    } else if (y < LN_ROAD0){
      grid[i] = crossRoad ? ROAD : SIDE;
      if (y === 66 && TREE_PITS.indexOf(x) >= 0) grid[i] = BED;
      if (y === 65 && ((x >= 17 && x <= 19) || (x >= 44 && x <= 46) || (x >= 84 && x <= 86))) grid[i] = BED;
    } else if (y < LN_ROAD1){
      grid[i] = ROAD;
    } else if (y < LN_WALK_S){
      grid[i] = SIDE;
      if (y === 78 && ((x >= 8 && x <= 9) || (x >= 55 && x <= 56) || (x >= 88 && x <= 89))) grid[i] = BED;
    } else {
      // below the lane: our own building, with the river slipping between its two halves
      grid[i] = (x >= QUAY_X0 && x < RIVER_X1) ? WATER : VOID;
    }
  }
  for (const b of BENCH_SPOTS){
    for (let y = b.y - 1; y <= b.y + 1; y++) for (let x = b.x - 1; x <= b.x + 1; x++)
      if (grid[y * GW + x] === BED) grid[y * GW + x] = PATH;
  }
}
buildGrid();

/* ============ building volumes ============
   Roofs are grown from the footprint itself: every roof vertex is lifted by its
   distance to the nearest edge of the block. Ridges, hips and valleys fall out of
   that for free, so corners meet properly and walls always reach their own eaves. */
const SLOPE = 0.62;                        // rise per cell of inset from the eaves
const solidM = new Uint8Array(GW * WH), eaveM = new Float32Array(GW * WH);
const VW = GW + 1, VH = WH + 1;
const vD = new Float32Array(VW * VH), vZ = new Float32Array(VW * VH);
function eaveFor(x, y){
  if (churchAt(x, y)) return 7.8;
  if (x >= DIV_X0 && x < PLAZA_X0) return 6.6;         // the tall terrace
  if (x >= 64 && x < 66) return 6.3;                   // the sliver the clock tower stands on
  if (y >= 61) return 5.6;                             // the gatehouse row between courtyard and lane
  if (y < 3) return x >= FAR_X0 ? 6.2 : 5.8;
  return 5.1;                                          // courtyard side walls
}
function solidAt(x, y){                            // strict: the world genuinely ends at its edges
  if (y < 0 || y >= WH || x < 0 || x >= GW) return 0;
  return solidM[y * GW + x];
}
function eaveAt(x, y){
  if (y < 0 || y >= WH || x < 0 || x >= GW) return 0;
  return eaveM[y * GW + x];
}
function solidC(x, y){                             // clamped: used when drawing past the frame
  if (y < 0 || y >= WH) return 0;
  return solidM[y * GW + clamp(x, 0, GW - 1)];
}
function buildVolumes(){
  for (let y = 0; y < WH; y++) for (let x = 0; x < GW; x++){
    const i = y * GW + x, t = grid[i];
    solidM[i] = (t === WALL || t === TUNNEL) ? 1 : 0;
    eaveM[i] = solidM[i] ? eaveFor(x, y) : 0;
  }
  const BIG = 1e4, C = [[-1,-1],[0,-1],[-1,0],[0,0]];
  for (let vy = 0; vy < VH; vy++) for (let vx = 0; vx < VW; vx++){
    const i = vy * VW + vx;
    let e = 0, n = 0;
    for (const [ox, oy] of C) if (solidAt(vx + ox, vy + oy)){ e += eaveAt(vx + ox, vy + oy); n++; }
    vZ[i] = n ? e / n : 0;
    vD[i] = n === 4 ? BIG : 0;
  }
  for (let vy = 0; vy < VH; vy++) for (let vx = 0; vx < VW; vx++){
    const i = vy * VW + vx; if (!vD[i]) continue;
    let d = vD[i];

/* Cloud cover — ONE slow scalar the whole sky reads, on the same footing as
 * isWindy(). Weather is a front that builds and breaks over most of a day, not a
 * coin flip in a clear blue sky: the rain roll is gated on it, so cover always
 * arrives first and there is no such thing as cloudless rain. */
let cloud = 0.16, cloudTgt = 0.16, frontLeft = 0;
function cloudCover(){ return cloud; }
function stepClouds(dt){
  frontLeft -= dt;

    const heavy = day >= 1 && R() < 0.3 + 0.24 * richness();
    cloudTgt = heavy ? 0.76 + R() * 0.24 : R() * R() * 0.5;
    frontLeft = 24 + R() * 36;                  // ~half a day to a day and a half

/* "Weather is coming" — 0 while the sky is fair, ~0.91 by the cover at which the rain
 * roll goes live (0.66), 1 just past it. ONE predicate off the same scalar, read by
 * several things at their OWN trigger points — that is the whole reason it is a ramp and
 * not a boolean: the washing comes in first, then the pavement tables empty, then
 * umbrellas go up, all of it BEFORE the first drop. Because cover is rate-capped at
 * 0.02/s rising, this ramp can never take less than ~11 s of sim time, a fifth of a day,
 * which is long enough to watch happen. Rain pins it at 1 so no reader flickers back
 * mid-shower — which is also why every reader's band must top out below 0.91, or it
 * fires on the step to 1 instead of on the approach. */
function weatherComing(){
  if (raining) return 1;
  // Damped by the light, because the rain roll below is itself gated on daylight > 0.15
  // and day >= 1: a heavy front peaking at 2am builds full cover and can never rain, so
  // an undamped predicate had the whole town walking around at midnight under umbrellas
  // waiting for weather that was not coming. Ramped, not switched — daylight moves about
  // 0.09/s through dusk, so this takes ~1.5 s and the umbrellas come down in ones.
  return clamp((daylight - 0.10) / 0.14, 0, 1) * (day >= 1 ? 1 : 0)

}

const MARKET_STALLS = [
  {x:45, y:76.3, c1:'#a83c32', c2:'#e8ddc4'},
  {x:50.5, y:76.1, c1:'#3d5a80', c2:'#e8ddc4'},

/* Market day has a beginning and an end. marketActive() still owns the hours the
 * market is OPEN — laneRate and the browser roll read it and must not move. What is
 * new is that a stall is no longer a boolean: marketRaise(i) is a 0..1 progress,
 * staggered per stall, so the three go up one at a time over the hour before eight
 * and come down over the hour after five, instead of three finished stalls landing
 * between two frames. A day is 55 s, so an hour is 2.3 s and the whole setup gets
 * ~2.2 s — about as long as a thing can last here and still read as an event.
 * Pack-down is this same function running backwards, so it undoes the raise in
 * reverse order for free: goods away, canvas rolled up, frame down, trestle folded. */
const MK_RAISE = 0.62, MK_STAGGER = 0.24;     // hours: one stall, and between stalls
function marketRaise(i){
  if (!isMarketDay()) return 0;
  const up = 8 - MK_RAISE - MK_STAGGER * (MARKET_STALLS.length - 1 - i);
  if (hour < up) return 0;
  if (hour < up + MK_RAISE) return (hour - up) / MK_RAISE;
  const dn = 17 + MK_STAGGER * i;

/* ============ CA: gardens, grass, daisies ============ */
let raining = false, rainLeft = 0;
function neighborsMature(x, y){
  let n = 0, sp = 0;

    if (!dx && !dy) continue;
    const xx = x + dx, yy = y + dy;
    if (xx < 0 || yy < 0 || xx >= GW || yy >= WH) continue;
    const j = yy * GW + xx;
    if ((grid[j] === BED || grid[j] === CBED) && bSt[j] === 3){ n++; sp = bSp[j]; }
  }
  return [n, sp];
}
/* The allotment is laid out by buildGrid as 3x2 beds on a 5x7 lattice. That plot is
   the unit a gardener picks and the unit that comes back, so the whole cycle —
   harvest, fallow, sowing — is addressed by plot rather than by cell. A row that
   empties and refills one cell at a time is a speckle; a plot reads as a row. */
function plotOrigin(x, y){ return [80 + Math.floor((x - 80) / 5) * 5, 8 + Math.floor((y - 8) / 7) * 7]; }
function plotCrop(x, y){                      // whatever this plot is already under, at any stage
  const [ox, oy] = plotOrigin(x, y);
  for (let yy = oy; yy < oy + 2; yy++) for (let xx = ox; xx < ox + 3; xx++){
    const i = yy * GW + xx;
    if (i >= 0 && i < GW * WH && bSp[i]) return bSp[i];
  }
  return 0;
}
const FALLOW = 12;     // sim seconds a picked plot lies bare, +R()*8 — a third to a half of a 55 s day,
                       // long enough that a dug-over row is something you notice from the wide view
let harvested = 0;     // cumulative cells picked: the one number that separates picked from died back
/* A gardener kneeling at a ripe plot clears it in one go and walks out with the crop.
   bAge doubles as the fallow clock on an empty bed (it is only ever read on a planted
   one), which is why dieback below now zeroes it. */
function harvestPlot(a){
  const [ox, oy] = plotOrigin(a.plot[0], a.plot[1]);
  let took = 0, sp = 0;
  for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
    const i = y * GW + x;
    if (grid[i] === BED && bSt[i] === 3){ sp = bSp[i]; took++; }
  }
  if (!took) return 0;                        // nothing ripe here — they sow it instead
  // the row is lifted whole, not cell by cell: the bed goes bare, and because it comes
  // back with no crop remembered it comes back under a different one. Picking only the
  // ripe cells leaves the plot's crop behind and the allotments settle onto two of four.
  for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
    const i = y * GW + x;
    if (grid[i] !== BED) continue;
    bSp[i] = 0; bSt[i] = 0; bAge[i] = FALLOW + R() * 8;
  }
  a.crop = sp; harvested += took; groundDirty = true;
  announce(pick(['A row of ' + SPECIES[sp-1].name + ' comes up; the basket fills.',
    'The ' + SPECIES[sp-1].name + ' are ready — the plot is cleared in one go.',
    'Someone straightens up out of the ' + SPECIES[sp-1].name + ' with an armful.']));
  return took;
}
function caTick(){

  const availV = SPECIES.filter(s => s.minDay <= day && s.veg);
  for (let y = 3; y < LN_WALK_S; y++) for (let x = 0; x < GW; x++){
    const i = y * GW + x, t = grid[i];

        if (bAge[i] > 0){ bAge[i] = Math.max(0, bAge[i] - 0.35); continue; }   // turned earth, resting
        if (inAllotment(x, y)){
          // a plot is sown, not self-seeded: the first drill goes in slowly, then the
          // other five follow it fast and under the same crop, so a row comes up as a row
          const crop = plotCrop(x, y);

            bSt[i] = 1; bAge[i] = 0;

      } else {

    }
  }

}

function ringPath(a, b, dir){
  const pts = []; let k = a;

function ringDir(a, b){ const d = (b - a + RK) % RK; return d <= RK / 2 ? 1 : -1; }

  const d = Math.hypot(mx - CX, my - CY);
  if (d < 9.2){
    const ux = (mx - CX) / (d || 1), uy = (my - CY) / (d || 1);
    pts.push([CX + ux * 9.8, CY + uy * 9.8]);

const STAYING = {gardener:1, napper:1, picnic:1, sitter:1};
function finishItinerary(a){
  const ex = a.exit;

    const last = a.wp[a.wp.length - 1];
    const t = nearestRingXY(last[0], last[1]);

  }
}
function routeToExit(a){
  const ex = a.exit;
  const pts = (a.preExit || []).map(p => p.slice());
  const from = pts.length ? pts[pts.length-1] : [a.x, a.y];
  const t = nearestRingXY(from[0], from[1]);
  pts.push(RING[t].slice(), ...ringPath(t, ex.k, ringDir(t, ex.k)), ...exitLeg(ex));
  a.wp = pts; a.i = 0; a.state = 'walk';
}
function stepAgent(a, dt){
  a.timer -= dt;
  if (a.state === 'sit' || a.state === 'kneel' || a.state === 'lie' || a.state === 'stand'){
    if (a.state === 'kneel' && !a.planted && a.timer < 4){
      a.planted = true;
      // one kneel, both halves of the cycle: if the plot in front of them is ripe they
      // take it and leave with it, and only an unripe plot gets sown by hand
      if (!(a.kind === 'allot' && a.plot && harvestPlot(a))){
        let planted = 0;
        const sp = SPECIES.indexOf(pick(speciesFor(a.x, a.y))) + 1;
        for (let dy=-3; dy<=3 && planted<4; dy++) for (let dx=-3; dx<=3 && planted<4; dx++){
          const x = Math.round(a.x+dx), y = Math.round(a.y+dy);
          if (x<0||y<0||x>=N||y>=WH) continue;
          const j = y*GW+x;
          if ((grid[j]===BED||grid[j]===CBED) && !bSp[j] && !bAge[j] && R()<0.6){ bSp[j]=sp; bSt[j]=1; bAge[j]=0; planted++; }
        }
        if (planted) announce('Fresh ' + SPECIES[sp-1].name + ' go into the bed, patted down gently.');
      }
      groundDirty = true;
    }
    // the far side goes home when the light does: a visit that outlasts the daylight
    // that authorised it is what leaves the quay occupied at midnight
    // The tables and benches empty ahead of the sky, not with it: every street sitter has
    // their own tolerance for a thickening front (a.wary), so they get up one at a time
    // across the ~11 s the cover takes to build. The band tops out at 0.88, below the
    // 0.91 at which the rain roll goes live, so the last chair is empty before the first
    // drop rather than in the same frame as it.
    if (a.timer <= 0 || (raining && a.state !== 'lie')
        || (a.street && a.state !== 'lie' && weatherComing() > 0.55 + (a.wary ?? 0.5) * 0.33)
        || (a.east && !eastOpen())){
      if (a.blanket){ a.blanket = false; }
      if (a.tableRef){ a.tableRef.taken = 0; a.tableRef = null; a.cup = false; }
      if (a.resume && a.i < a.wp.length){ a.state = 'walk'; a.resume = false; }
      else if (a.street){ a.state = 'walk'; }        // lane agents just continue their route
      else routeToExit(a);
    }
    return;
  }
  if (a.listen > 0){ a.listen -= dt; stepDog(a, a.speed, dt); return; }   // the bell: a beat of standing still, head back
  // a passing word: both hold still, facing each other, then walk on. Only ever a
  // countdown — nothing here can hold an agent, so `done` stays reachable.
  if (a.greet > 0){ a.greet = Math.max(0, a.greet - dt); stepDog(a, a.speed, dt); return; }
  const tgt = a.i < a.wp.length ? a.wp[a.i] : null;
  if (!tgt){ a.done = true; return; }
  const dx = tgt[0] - a.x, dy = tgt[1] - a.y;
  const d = Math.hypot(dx, dy);
  const sp = a.speed * (raining && !a.umbrella ? 1.5 : 1) * (a.kind === 'napper' ? 0.8 : 1)
                     * (a.east && !eastOpen() ? 1.55 : 1);   // home before dark
  if (d < 0.25){
    a.i++;
    if (a.i >= a.wp.length){
      if (a.kind === 'gardener' && !a.planted){ a.state='kneel'; a.timer=8+R()*4; return; }
      if (a.kind === 'napper' && a.napAt){ a.state='lie'; a.timer=16+R()*14; a.napAt=null;
        if (R()<0.6) announce('Asleep under the tree within minutes.'); return; }
      if (a.kind === 'picnic' && a.picnicAt){ a.state='sit'; a.timer=20+R()*14; a.blanket=a.lead; a.picnicAt=null; return; }
      if (a.kind === 'sitter' && a.benchAt){ a.state='sit'; a.timer=12+R()*16; a.onBench=true; a.benchAt=null; return; }
      if (a.kind === 'allot' && a.tendPlot){
        a.tendPlot = false; a.state = 'kneel'; a.timer = 9 + R() * 5; a.resume = true;
        a.planted = false; a.rows = (a.rows || 0) + 1;   // each kneel is its own row
        // they came a long way for one plot: most work a second or third before leaving
        if (a.rows < 3 && R() < 0.55){
          const next = pickPlot();
          a.plot = next; a.tendPlot = true;
          a.wp.push([next[0] - 0.6, next[1] + 0.5]);
          return;
        }
        const exitVia = R() < 0.5;
        if (exitVia) a.wp.push([ALT_GATE, 58], [ALT_GATE, 62], [ALT_GATE, LANE_N_Y], [laneEdge(), LANE_N_Y]);
        else { const gy = pick([20, 45]); a.wp.push([79, gy], [XS_WALK_E, gy], [XS_WALK_E, -2.5]); }
        return;
      }
      a.done = true; return;
    }
    // street agents: perform their one stop when they actually reach it
    if (a.stop && !a.stopped && Math.hypot(a.x - a.stop.x, a.y - a.stop.y) < 0.6){
      a.stopped = true;
      // and nobody new sits down under a sky that is already going. Refused at 0.42,
      // released at 0.55+ above, so the gap guarantees no one sits and stands right up.
      if (a.stop.act === 'sit' && weatherComing() > 0.42){
        if (a.table){ a.table.taken = 0; a.table = null; }
        return;                                    // walk on past the empty chair
      }
      a.state = a.stop.act; a.timer = a.stop.dur; a.resume = true;
      if (a.stop.cup){ a.cup = true; a.tableRef = a.table; a.table = null; }
      if (a.stop.say) announce(a.stop.say);
      return;
    }
    return;
  }
  const mv = Math.min(sp * dt, d);
  a.x += dx / d * mv; a.y += dy / d * mv;
  a.faceL = dx < 0;
  a.phase += mv * 2.2;
  const gx = Math.round(a.x - .5), gy = Math.round(a.y - .5);
  if (gx>=0 && gy>=0 && gx<GW && gy<WH){
    const j = gy*GW+gx;
    if (grid[j]===GRASS){
      wear[j] = Math.min(1, wear[j] + (a.small?0.05:0.09) * dt * 6);
      if (daisy[j] && wear[j]>0.25){ daisy[j]=0; }
      if (R()<dt*2) groundDirty = true;
    }
  }
  stepDog(a, sp, dt);
}
/* the dog trails its human. Called from the walk path AND from every beat the human
 * spends standing still, so a stopped owner never leaves a frozen dog beside them. */
function stepDog(a, sp, dt){
  if (!a.dog) return;
  const g = a.dog, ddx = a.x - g.x + Math.sin(a.phase*0.7)*1.2, ddy = a.y - g.y + 0.6;
  const dd = Math.hypot(ddx, ddy);
  if (dd > 1.2){ g.x += ddx/dd * Math.min(sp*1.3*dt, dd); g.y += ddy/dd * Math.min(sp*1.3*dt, dd); }
  g.phase += dt * 9;
}

/* ============ a passing word ============ */
/* Until now every agent moved as though alone in the town — no proximity test
 * existed anywhere, which is why the wide shot read as traffic rather than as
 * neighbours. This is the whole of their social life: on a coarse tick, two people
 * who happen to pass close may stop and talk for a few seconds. A pass over a short
 * list, axis-rejected before any hypot, and both parties then sit out a cooldown so
 * the same pair cannot chatter their way down the lane. */
/* GREET_MIN matters as much as GREET_R: a pair that stops at half a cell renders as
 * one blob, so they only pair at a distance you can read as two people. */
const GREET_DT = 0.5, GREET_R = 1.6, GREET_MIN = 0.9, GREET_P = 0.17;
let greetAcc = 0;
function chatty(a){
  return a.state === 'walk' && !a.small && !(a.listen > 0) && !(a.greet > 0) && !(a.chatCool > 0)
      && a.kind !== 'sweeper' && a.kind !== 'picnic';   // the sweeper is working; picnic pairs arrive together
}
function greetPass(){
  const free = [];
  for (const a of agents){
    if (a.chatCool > 0) a.chatCool = Math.max(0, a.chatCool - GREET_DT);
    if (chatty(a)) free.push(a);
  }
  for (let i = 0; i < free.length; i++){
    const a = free[i];
    if (a.greet > 0) continue;
    for (let j = i + 1; j < free.length; j++){
      const b = free[j];
      if (b.greet > 0) continue;
      const dx = b.x - a.x; if (dx > GREET_R || dx < -GREET_R) continue;    // cheap reject, no hypot
      const dy = b.y - a.y; if (dy > GREET_R || dy < -GREET_R) continue;
      const q = dx*dx + dy*dy;
      if (q > GREET_R*GREET_R || q < GREET_MIN*GREET_MIN) continue;
      if (R() > GREET_P) continue;
      const t = (2.2 + R() * 2.8) * (raining ? 0.45 : 1);   // nobody lingers in the wet
      a.greet = b.greet = t;
      a.faceL = dx < 0; b.faceL = !a.faceL;
      a.chatCool = b.chatCool = t + 16 + R() * 10;
      if (R() < 0.12) announce(pick([
        'Two neighbours stop mid-path and fall into talk.',
        'A conversation breaks out on the lane and the walk waits for it.',
        'Someone stops someone else; hands go into pockets.',
      ]));
      break;
    }
  }
}

/* ============ lane agents ============ */
function allotCount(){ return agents.filter(g => g.kind === 'allot').length; }
function pickPlot(){
  const plots = [];
  for (let py = 8; py <= 56; py++) for (let px = 80; px <= 93; px++)
    if (grid[py * GW + px] === BED && R() < 0.05) plots.push([px, py]);
  return plots.length ? pick(plots) : [84, 22];
}
/* the walk in — through the lane gate or down the cross street — and the plot they

function sendToPlot(a){
  a.kind = 'allot';

  const plot = pickPlot();
  a.x = XS_WALK_E; a.y = -2.5;
  if (R() < 0.5){ a.x = laneEdge(); a.y = LANE_N_Y; a.wp.push([ALT_GATE, LANE_N_Y], [ALT_GATE, 62], [ALT_GATE, 58]); }
  else { a.wp.push([XS_WALK_E, gateY], [79, gateY]); }
  a.wp.push([plot[0] - 0.6, plot[1] + 0.5]);
  a.tendPlot = true; a.plot = plot;         // the plot they kneel at is the plot they pick

    'The smell of turned earth drifts over the fence.']));
}
/* Plots standing ready. This is what sets the gardener arrival rate: the crop calls

function ripePlots(){
  let n = 0;

    let bed = 0, mt = 0;
    for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
      const i = y * GW + x;
      if (grid[i] !== BED) continue;
      bed++; if (bSt[i] === 3) mt++;

}
function spawnAllotAgent(){

  for (const p of lead) a.wp.push(p.slice());
  a.wp.push([a.stop.x, a.stop.y]);

function updateDucks(dt){

    ducks.push({x:POND.x + Math.cos(th) * POND.rx * 0.5, y:POND.y + Math.sin(th) * POND.ry * 0.5,
      ph:R() * 9, t:0, tx:POND.x, ty:POND.y, drake:R() < 0.5});
  }
  while (ducks.length > want) ducks.pop();
  for (const d of ducks){
    d.ph += dt * 2;
    d.t -= dt;

      d.t = 3 + R() * 5;

      if (nightF > 0.6 || R() < 0.75){   // stay on (or return to) the water
        d.tx = POND.x + Math.cos(th) * POND.rx * 0.75 * rr;
        d.ty = POND.y + Math.sin(th) * POND.ry * 0.75 * rr;
      } else {                            // waddle out onto the bank

      d.y += (d.ty - d.y) / dd * Math.min(sp, dd);

}

const stats = { people:0, blooms:0 };
function updateWildlife(dt){
  const m = maturity(), rich = richness();

      col: pick(['#e8dfc8','#e8b13a','#c9762e','#d8d0e8'])});
  }

  for (const b of butterflies){
    b.t -= dt;

      const th=R()*Math.PI*2, r=5+R()*(b.alt?7:15); b.tx=bx+Math.cos(th)*r; b.ty=by+Math.sin(th)*r; b.t=2+R()*4; }

    // 30 cells away, and a raw (tx-x)*0.5 flies it there faster than a person runs —
    // a 4-cell step in a quarter second, which sat right on the motion gate's jump
    // threshold and flipped it on any change to the random stream
    let ax = (b.tx-b.x)*0.5, ay = (b.ty-b.y)*0.5;
    const av = Math.hypot(ax, ay); if (av > 3){ ax = ax/av*3; ay = ay/av*3; }
    b.x += ax*dt + Math.sin(b.ph*0.3)*dt*2;
    b.y += ay*dt;
    b.z = 0.7 + Math.sin(b.ph*0.13)*0.35;
  }
  const wantF = (day>=3 && nightF>0.6 && !raining) ? Math.round(4+rich*8) : 0;
  while (fireflies.length < wantF){ const alt = R() < 0.35;
    const fx = alt ? 86.5 : CX, fy = alt ? 32 : CY;
    const th=R()*Math.PI*2, r=3+R()*(alt?7:13);
    fireflies.push({x:fx+Math.cos(th)*r, y:fy+Math.sin(th)*r, z:0.4+R()*1.2, ph:R()*9}); }
  while (fireflies.length > wantF) fireflies.pop();
  for (const f of fireflies){ f.ph += dt*(RM?0.8:1.6); f.x += Math.sin(f.ph*0.9)*dt*0.8; f.y += Math.cos(f.ph*0.7)*dt*0.6; }
  belfryRoost = Math.min(7, belfryRoost + dt*0.85);   // flushed pigeons drift back to the tower

    const onLane = R() < 0.4;
    const th=R()*Math.PI*2, r=6+R()*10;
    birds.push({
      x: onLane ? 8+R()*48 : CX+Math.cos(th)*r,
      y: onLane ? LN_ROAD0+1+R()*5 : CY+Math.sin(th)*r,
      z:8, state:'land', hop:0, t:0,
      col:pick(['#33302c','#5a4636','#6e6a60','#7d8089'])});
    if (R()<0.4) announce(pick(['A blackbird drops onto the lawn.', 'Pigeons strut the lane like they own the freehold.']));
  }
  for (let i=birds.length-1; i>=0; i--){
    const b = birds[i];
    if (b.state==='land'){ b.z -= dt*6; if (b.z<=0){ b.z=0; b.state='hop'; b.t=6+R()*8; } }
    else if (b.state==='hop'){
      b.t -= dt; b.hop += dt*4;
      if (Math.sin(b.hop)>0.9){ b.x += (R()-0.5)*0.8; b.y += (R()-0.5)*0.8; }
      const scare = agents.some(a => Math.hypot(a.x-b.x, a.y-b.y) < 4.5);
      if (scare || b.t<=0 || raining) b.state='fly';
    } else if (b.state==='wheel'){    // put up off the belfry by the bell: one wide turn, then away

      b.x = b.cx + Math.cos(b.ph)*b.r;
      b.y = b.cy + Math.sin(b.ph)*b.r*0.5;

  }
  const gusty = isWindy();
  if ((day>=4 || gusty) && !raining && R()<dt*(gusty?1.1:0.25*rich) && leaves.length<(gusty?40:24) && !RM){
    const src = R();
    if (src < 0.5){          // from the courtyard linden
      leaves.push({x:CX+(R()-0.5)*6, y:CY+(R()-0.5)*6, z:5.5+R()*2, vx:0.6+R()*0.8+(gusty?1.2:0), ph:R()*9,

    } else if (src < 0.75){  // from a street tree
      leaves.push({x:pick(TREE_PITS)+0.5, y:66.9, z:3.5+R(), vx:0.8+R()+(gusty?1.2:0), ph:R()*9,
        col:pick(['#8a9a44','#a8853c'])});
    } else {                 // a petal snatched off a bed
      leaves.push({x:6+R()*52, y:5+R()*3, z:1+R(), vx:1+R()+(gusty?1.4:0), ph:R()*9,
        col:pick(['#e8a0b0','#f3b04e','#c9a0e2','#e8dfc8'])});

  for (let i=leaves.length-1;i>=0;i--){ const l=leaves[i];
    l.ph+=dt*3; l.x+=l.vx*dt+Math.sin(l.ph)*dt*1.4; l.y+=dt*0.5; l.z-=dt*0.55;
    if (l.z<=0) leaves.splice(i,1); }
  if (!catA && nightF > 0.5 && day >= 2){ catA = {x:-2, y:LANE_N_Y - 0.5, dir:1}; }
  if (catA){
    catA.x += catA.dir * dt * 1.6;
    if (catA.x > 66 || nightF < 0.2) catA = null;
  }
  // umbrellas go up on the approach, not on the first drop. Each walker has their own
  // patience with the sky, and the top of the band runs past 1, so roughly a third of
  // the lane never opens one at all and gets caught out.
  {
    const cm = weatherComing();
    for (const a of agents){
      // putting it away is unconditional — a walker who sat down still has to, or they
      // stay under an umbrella at a café table on a clear afternoon
      if (a.umbrella){ if (!raining && cm < 0.42) a.umbrella = false; }

    if (rainLeft <= 0){ raining=false; raindrops.length=0; wet = 18;
      cloudTgt = 0.1 + R() * 0.28; frontLeft = 26 + R() * 26;   // and the cover breaks up behind it
      for (const a of agents) a.umbrella = false;               // down they come, all at once
      announce('The rain moves on. Everything smells green, and the lane shines.'); groundDirty=true; }
  } else if (cloudCover() > 0.66 && daylight > 0.15 && day >= 1
             && R() < dt * 0.10 * (cloudCover() - 0.66) / 0.34 * (0.6 + rich)){

  }
}

const gcv = document.createElement('canvas');
const gtx = gcv.getContext('2d');
let groundDirty = true;
function quad(g, x, y, pad, z){
  const p = pad||0, zz = z||0;
  const a = project(x-p, y-p, zz), b = project(x+1+p, y-p, zz), c = project(x+1+p, y+1+p, zz), d = project(x-p, y+1+p, zz);
  g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c[0],c[1]); g.lineTo(d[0],d[1]); g.closePath();
}
function poly(g, pts){
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
  g.closePath();
}
/* ============ sky, sun and the far horizon ============ */
let SUN = [0.5, 0.35, 0.79];
const LIT = [];                                  // lit window rectangles, for the night glow pass
function sunVec(){
  const sa = clamp((hour - 5.6) / 13.6, 0, 1);
  const lx = lerp(0.8, -0.8, sa), ly = 0.44, lz = 0.46 + 0.5 * Math.sin(Math.PI * sa);
  const n = Math.hypot(lx, ly, lz) || 1;
  return [lx / n, ly / n, lz / n];
}
function skyCols(){
  const d = daylight;
  const dusk = clamp(clamp(1 - Math.abs(hour - 19.4) / 2.3, 0, 1) + clamp(1 - Math.abs(hour - 6.3) / 2.1, 0, 1), 0, 1);
  let top = mix('#0b1226', '#5d90cb', d);
  let low = mix('#1a2340', '#c6dcec', d);
  top = mix(top, '#6b5590', dusk * 0.5);
  low = mix(low, '#e4a066', dusk * 0.75);
  // cover comes last: cloud mutes a sunset, it does not sit under one
  const c = cloudCover();
  top = mix(top, mix('#232a3a', '#7f8894', d), c * 0.82);
  low = mix(low, mix('#2c3446', '#b9bfc4', d), c * 0.74);
  return [top, low];
}
// stars, hills and the far-off skyline change slowly, so they live in their own layer
const bcv = document.createElement('canvas'), btx = bcv.getContext('2d');
let backKey = '';
function drawSky(g){
  const [top, low] = skyCols();
  const hz = topPad - 3.4 * cellH;                  // where the far horizon sits
  const gr = g.createLinearGradient(0, 0, 0, hz + 2 * cellH);
  gr.addColorStop(0, top); gr.addColorStop(1, low);
  g.fillStyle = gr; g.fillRect(0, 0, W, hz + 4 * cellH);
  drawSunMoon(g, hz, top);
  drawClouds(g, hz);                                // over the sun, under the hills
  const key = W + 'x' + H + ':' + lightBucket;
  if (key !== backKey){
    backKey = key;
    bcv.width = W * DPR; bcv.height = H * DPR;

    drawBackdrop(btx, hz, low);
  }

/* A fixed pool of banks that fade in one by one as cover thickens, so the sky
 * fills continuously instead of popping a cloud into existence. Draw path, so it
 * is hash()-and-simT deterministic — never R(). */
function drawClouds(g, hz){
  const c = cloudCover();
  if (c < 0.04) return;
  const drift = simT * (isWindy() ? 3.4 : 1.4) * (RM ? 0.12 : 1);
  const span = W + cellW * 36;
  const pale = mix('#ffffff', '#8a919d', clamp((c - 0.34) * 1.5, 0, 1));
  const dark = mix('#3b4358', '#161c2c', clamp((c - 0.4) * 1.4, 0, 1));
  const col = mix(pale, dark, nightF);
  g.fillStyle = col;
  for (let k = 0; k < 11; k++){
    const a = clamp((c - k * 0.085) * 3.2, 0, 1);
    if (a <= 0.01) continue;
    const sp = 0.5 + hash(k, 41) * 0.9;              // higher banks drift slower
    const cx = ((hash(k, 7) * span + drift * sp * cellW * 0.5) % span) - cellW * 18;
    const cy = hz * (0.06 + hash(k, 17) * 0.86);      // right down to the hills, so heavy cover reads as a lid
    const rw = cellW * (4.5 + hash(k, 23) * 6) * (0.7 + 0.45 * c);
    const rh = rw * (0.24 + hash(k, 29) * 0.16);
    g.globalAlpha = a * (0.3 + 0.5 * c) * (1 - 0.35 * nightF);
    g.beginPath();
    for (let j = 0; j < 5; j++){
      const jx = cx + (j - 2) * rw * 0.42;
      const jy = cy - Math.abs(2 - j) * rh * 0.14 + hash(k * 7 + j, 31) * rh * 0.3;
      const jr = rw * (0.30 + hash(k * 7 + j, 37) * 0.22);
      g.ellipse(jx, jy, jr, jr * (0.44 + hash(k * 7 + j, 43) * 0.3), 0, 0, 7);
    }
    g.fill();
  }
  g.globalAlpha = 1;
}
function drawSunMoon(g, hz, top){
  const sa = clamp((hour - 5.6) / 13.6, 0, 1);
  const veil = 1 - 0.82 * cloudCover();              // cover swallows the disc
  if (daylight > 0.02){                              // the sun, rising in the east (to the right)
    const sx = W * (0.9 - 0.8 * sa), sy = hz - Math.sin(Math.PI * sa) * hz * 0.74;
    const gl = g.createRadialGradient(sx, sy, 0, sx, sy, cellW * 10);
    gl.addColorStop(0, 'rgba(255,238,190,' + ((0.45 * daylight + 0.2) * veil) + ')');
    gl.addColorStop(1, 'rgba(255,220,160,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(sx, sy, cellW * 10, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,250,230,' + ((0.55 + 0.45 * daylight) * veil) + ')';
    g.beginPath(); g.arc(sx, sy, cellW * 1.4, 0, 7); g.fill();
  } else if (nightF > 0.25){                         // and the moon on the same arc
    const ma = clamp(((hour + 11) % 24 - 5.6) / 13.6, 0, 1);
    const mx = W * (0.86 - 0.72 * ma), my = hz - Math.sin(Math.PI * ma) * hz * 0.66;
    const gl = g.createRadialGradient(mx, my, 0, mx, my, cellW * 7);
    gl.addColorStop(0, 'rgba(210,225,255,' + (0.28 * nightF * veil) + ')');
    gl.addColorStop(1, 'rgba(200,220,255,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(mx, my, cellW * 7, 0, 7); g.fill();
    g.fillStyle = 'rgba(240,244,255,' + (0.85 * nightF * veil) + ')';
    g.beginPath(); g.arc(mx, my, cellW * 1.2, 0, 7); g.fill();
    g.globalAlpha = veil;                            // else the crescent's bite outlives the moon
    g.fillStyle = mix(top, '#0b1226', 0.4);

}
function drawBackdrop(g, hz, low){
  const starF = nightF * (1 - cloudCover());         // cover puts the stars out
  if (starF > 0.1){
    for (let k = 0; k < 120; k++){
      const sx = hash(k, 3) * W, sy = hash(k, 11) * hz * 0.95;
      g.fillStyle = 'rgba(234,240,255,' + (starF * (0.2 + 0.65 * hash(k, 19))) + ')';
      g.fillRect(sx, sy, 1.3, 1.3);
    }
  }
  // hills, hazed
  g.fillStyle = mix(low, nightF > 0.5 ? '#151d33' : '#93a7b2', 0.5);
  g.beginPath(); g.moveTo(-10, hz + 4 * cellH);
  for (let sx = -10; sx <= W + 30; sx += 24)
    g.lineTo(sx, hz - cellH * (0.6 + 2.0 * Math.sin(sx * 0.0031) + 1.0 * Math.sin(sx * 0.0093 + 1.7)));
  g.lineTo(W + 30, hz + 4 * cellH); g.closePath(); g.fill();
  // the rest of the town, further off than ours
  g.fillStyle = mix(low, nightF > 0.5 ? '#0d1424' : '#6f7c86', 0.7);
  const base = hz + 3.2 * cellH;
  let sx2 = -18;
  while (sx2 < W + 18){
    const key = Math.round(sx2);
    const w2 = cellW * (2.0 + hash(key, 5) * 3.2);
    const hgt = cellH * (1.4 + hash(key, 9) * 3.0);
    g.beginPath();
    if (hash(key, 13) > 0.9){                       // a distant spire
      g.moveTo(sx2, base); g.lineTo(sx2, base - hgt - cellH * 2.4);
      g.lineTo(sx2 + w2 * 0.5, base - hgt - cellH * 7.2);
      g.lineTo(sx2 + w2, base - hgt - cellH * 2.4); g.lineTo(sx2 + w2, base);
    } else {
      g.moveTo(sx2, base); g.lineTo(sx2, base - hgt);
      g.lineTo(sx2 + w2 * 0.5, base - hgt - cellH * 0.9);
      g.lineTo(sx2 + w2, base - hgt); g.lineTo(sx2 + w2, base);
    }
    g.closePath(); g.fill();
    sx2 += w2;
  }
  if (nightF > 0.3){
    g.fillStyle = 'rgba(255,205,130,' + (0.45 * nightF) + ')';
    for (let k = 0; k < 80; k++){
      if (hash(k, 23) > 0.45) continue;
      g.fillRect(hash(k, 29) * W, hz + cellH * (0.5 + hash(k, 31) * 2.2), 1.7, 1.7);
    }
  }
}

/* ============ buildings: hipped roofs grown off the footprint ============ */
const XLO = -12, XHI = GW + 12;                    // draw past the frame so the town never ends in black
function roofShade(x, y){
  const z00 = roofZ(x, y), z10 = roofZ(x + 1, y), z11 = roofZ(x + 1, y + 1), z01 = roofZ(x, y + 1);
  const gx = ((z10 + z11) - (z00 + z01)) / 2, gy = ((z01 + z11) - (z00 + z10)) / 2;
  const nl = Math.hypot(gx, gy, 1);
  return [clamp((-gx * SUN[0] - gy * SUN[1] + SUN[2]) / nl, 0, 1), z00, z10, z11, z01];
}
let HAZE = '#c6dcec';
function drawRoofRow(g, y){
  const cc = cloudCover();                                       // cover flattens the key light
  const amb = 0.26 + 0.20 * daylight + 0.07 * cc * daylight, key = (0.22 + 0.78 * daylight) * (1 - 0.5 * cc);
  for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    if (!solidM[y * GW + gx]) continue;
    const out = x !== gx;                                        // beyond the frame: the town, hazed
    const r = roofShade(x, y), lam = r[0];
    const hv = hash(gx, y);
    const sy = solidC(x, y + 1) ? y + 1 : y + 1.3;               // eaves overhang the wall below
    const dz = solidC(x, y + 1) ? 0 : SLOPE * 0.3;
    const t = clamp(amb + 0.8 * lam * key + hv * 0.08 - 0.04, 0, 1);
    let col = mix('#6f4a39', '#cd9268', t);
    if (out) col = mix(col, HAZE, 0.55);
    g.fillStyle = col;
    const a = project(x, y, r[1]), b = project(x + 1, y, r[2]);
    const c = project(x + 1, sy, r[3] - dz), d = project(x, sy, r[4] - dz);
    poly(g, [a, b, c, d]); g.fill();
    if (out) continue;
    g.strokeStyle = 'rgba(48,29,21,' + (0.13 + 0.14 * lam) + ')'; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    g.moveTo(a[0], a[1]); g.lineTo(d[0], d[1]); g.stroke();
    if (dz){                                                     // shadow the wall under the eaves
      g.fillStyle = 'rgba(30,22,16,.32)';
      const e1 = project(x, y + 1, r[4]), e2 = project(x + 1, y + 1, r[3]);
      poly(g, [e1, e2, c, d]); g.fill();
    }
    if (hash(gx * 5, y * 3) > 0.965 && Math.min(roofD(x, y), roofD(x + 1, y + 1)) > 0.95){
      drawChimney(g, x, y);
      if (x === gx && !CHIMNEYS.some(c => c[0] === x && c[1] === y)) CHIMNEYS.push([x, y]);
    }
  }
}
function drawCrests(g, y){
  g.strokeStyle = 'rgba(244,208,178,.45)'; g.lineWidth = Math.max(1, cellW * 0.11);
  g.beginPath();
  for (let x = XLO; x < XHI; x++){
    const d0 = roofD(x, y), d1 = roofD(x + 1, y);
    if (d0 >= 0.9 && d1 >= 0.9 && roofD(x, y - 1) < d0 - 0.05 && roofD(x, y + 1) < d0 - 0.05 &&
        roofD(x + 1, y - 1) < d1 - 0.05 && roofD(x + 1, y + 1) < d1 - 0.05){
      const a = project(x, y, roofZ(x, y)), b = project(x + 1, y, roofZ(x + 1, y));
      g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    }
    const e0 = roofD(x, y), e1 = roofD(x, y + 1);
    if (e0 >= 0.9 && e1 >= 0.9 && roofD(x - 1, y) < e0 - 0.05 && roofD(x + 1, y) < e0 - 0.05 &&
        roofD(x - 1, y + 1) < e1 - 0.05 && roofD(x + 1, y + 1) < e1 - 0.05){
      const a = project(x, y, roofZ(x, y)), b = project(x, y + 1, roofZ(x, y + 1));
      g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    }
  }
  g.stroke();
}
function drawChimney(g, x, y){
  const z = (roofZ(x, y) + roofZ(x + 1, y) + roofZ(x + 1, y + 1) + roofZ(x, y + 1)) / 4;
  const h = 1.4 + hash(x, y * 3) * 1.0, w = 0.40, cy = y + 0.72;
  const bl = project(x + 0.5 - w, cy, z - 0.5), br = project(x + 0.5 + w, cy, z - 0.5);
  const tl = project(x + 0.5 - w, cy, z + h), tr = project(x + 0.5 + w, cy, z + h);
  const gr = g.createLinearGradient(tl[0], 0, tr[0], 0);
  gr.addColorStop(0, SUN[0] > 0 ? '#6b5a4a' : '#9a8770');
  gr.addColorStop(1, SUN[0] > 0 ? '#9a8770' : '#6b5a4a');
  g.fillStyle = gr; poly(g, [tl, tr, br, bl]); g.fill();
  const cl = project(x + 0.5 - w - 0.1, cy, z + h), cr = project(x + 0.5 + w + 0.1, cy, z + h);
  const ul = project(x + 0.5 - w - 0.1, cy - 0.22, z + h + 0.2), ur = project(x + 0.5 + w + 0.1, cy - 0.22, z + h + 0.2);
  g.fillStyle = '#b3a48c'; poly(g, [ul, ur, cr, cl]); g.fill();
  g.strokeStyle = '#a35e3c'; g.lineWidth = Math.max(1.5, cellW * 0.13);
  for (const px of [-0.17, 0.17]){
    const p1 = project(x + 0.5 + px, cy - 0.1, z + h + 0.18), p2 = project(x + 0.5 + px, cy - 0.1, z + h + 0.66);
    g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke();
  }
}
function drawWindow(g, wx, wy, zTop, hgt, sa, sb){
  const w = 0.32;
  const a = project(wx - w, wy, zTop), b = project(wx + w, wy, zTop);
  const c = project(wx + w, wy, zTop - hgt), d = project(wx - w, wy, zTop - hgt);
  g.fillStyle = 'rgba(240,233,216,.85)'; poly(g, [a, b, c, d]); g.fill();
  const p = 0.76;

  const iC = project(wx + w * p, wy, zTop - hgt * 0.9), iD = project(wx - w * p, wy, zTop - hgt * 0.9);
  const lit = nightF > 0.3 && hash(sa * 3, sb * 7 + day) > 0.42;
  g.fillStyle = lit ? 'rgba(255,208,140,.95)' : mix('#242a33', '#7d94a6', 0.18 + 0.5 * daylight);
  poly(g, [iA, iB, iC, iD]); g.fill();
  if (lit) LIT.push([(iA[0] + iC[0]) / 2, (iA[1] + iC[1]) / 2]);
  g.strokeStyle = 'rgba(244,238,224,.7)'; g.lineWidth = 1;
  const m1 = project(wx, wy, zTop - hgt * 0.11), m2 = project(wx, wy, zTop - hgt * 0.9);
  const h1 = project(wx - w * p, wy, zTop - hgt * 0.5), h2 = project(wx + w * p, wy, zTop - hgt * 0.5);
  g.beginPath(); g.moveTo(m1[0], m1[1]); g.lineTo(m2[0], m2[1]);
  g.moveTo(h1[0], h1[1]); g.lineTo(h2[0], h2[1]); g.stroke();
  const s1 = project(wx - w * 1.2, wy, zTop - hgt), s2 = project(wx + w * 1.2, wy, zTop - hgt);
  const s3 = project(wx + w * 1.2, wy, zTop - hgt - 0.14), s4 = project(wx - w * 1.2, wy, zTop - hgt - 0.14);
  g.fillStyle = 'rgba(232,224,206,.9)'; poly(g, [s1, s2, s3, s4]); g.fill();
}
const PLASTER = ['#cabda2', '#c8b596', '#c1bda8', '#d0c1a4', '#bcb49c', '#c9b9a4', '#c4b291'];
function drawFaceRow(g, y){
  const wt = 0.22 + 0.6 * daylight;
  for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    if (!solidM[y * GW + gx] || solidC(x, y + 1)) continue;
    const out = x !== gx;
    const house = Math.floor((gx + 1) / 3.5);                 // the terrace is separate houses
    const zL = roofZ(x, y + 1), zR = roofZ(x + 1, y + 1);
    const a = project(x, y + 1, 0), b = project(x + 1, y + 1, 0);
    const c = project(x + 1, y + 1, zR), d = project(x, y + 1, zL);
    const pl = PLASTER[(hash(house, y * 3) * PLASTER.length) | 0];
    const gr = g.createLinearGradient(0, d[1], 0, a[1]);
    let hi = mix('#3f3a33', pl, clamp(wt + 0.16, 0, 1));
    let lo = mix('#302b25', mix(pl, '#6f6552', 0.4), clamp(wt + 0.06, 0, 1));
    if (out){ hi = mix(hi, HAZE, 0.55); lo = mix(lo, HAZE, 0.55); }
    gr.addColorStop(0, hi); gr.addColorStop(1, lo);
    g.fillStyle = gr; poly(g, [d, c, b, a]); g.fill();
    if (out) continue;
    if (hash(house, y * 5) > 0.72){                           // some fronts are brick
      g.strokeStyle = 'rgba(120,96,74,.16)'; g.lineWidth = 0.7;
      for (let z = 0.35; z < Math.min(zL, zR); z += 0.42){
        const q1 = project(x, y + 1, z), q2 = project(x + 1, y + 1, z);
        g.beginPath(); g.moveTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.stroke();
      }
    }
    g.strokeStyle = 'rgba(40,32,24,.18)'; g.lineWidth = 1;    // party wall between houses
    if (Math.floor((gx + 2) / 3.5) !== house){
      g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.stroke();
    }
    g.fillStyle = 'rgba(24,18,12,.16)';                       // ground line, so walls sit rather than float
    const gl1 = project(x, y + 1, 0.16), gl2 = project(x + 1, y + 1, 0.16);
    poly(g, [gl1, gl2, b, a]); g.fill();
    const e = Math.min(zL, zR);
    if (churchAt(gx, y) || e < 2.4) continue;
    const slot = ((gx % 7) + 7) % 7;
    if ((slot === 1 || slot === 4) && hash(gx, y * 7) > 0.12){
      drawWindow(g, x + 0.5, y + 1, e * 0.86, e * 0.30, gx, y);
      if (e > 4.2 && hash(gx, y * 9) > 0.2) drawWindow(g, x + 0.5, y + 1, e * 0.48, e * 0.28, gx, y + 40);
    } else if (slot === 6 && hash(gx, y * 13) > 0.45){
      const dw = 0.34, dh = e * 0.34;                          // a front door
      const p1 = project(x + 0.5 - dw, y + 1, dh), p2 = project(x + 0.5 + dw, y + 1, dh);
      const p3 = project(x + 0.5 + dw, y + 1, 0), p4 = project(x + 0.5 - dw, y + 1, 0);
      g.fillStyle = 'rgba(238,231,214,.75)'; poly(g, [p1, p2, p3, p4]); g.fill();
      const q1 = project(x + 0.5 - dw * 0.72, y + 1, dh * 0.92), q2 = project(x + 0.5 + dw * 0.72, y + 1, dh * 0.92);
      const q3 = project(x + 0.5 + dw * 0.72, y + 1, 0), q4 = project(x + 0.5 - dw * 0.72, y + 1, 0);
      g.fillStyle = ['#4a5f5a', '#6b3f38', '#3d4a63', '#5a4a34'][(hash(gx, 17) * 4) | 0];
      poly(g, [q1, q2, q3, q4]); g.fill();
      g.fillStyle = '#d8c98a';
      g.beginPath(); g.arc(q2[0] - 2, (q2[1] + q3[1]) / 2, 1.2, 0, 7); g.fill();
    }
  }
}
function drawBlocks(g, y0, y1){
  for (let y = y0; y < y1; y++){
    drawFaceRow(g, y);
    drawRoofRow(g, y);
    drawCrests(g, y);
    if (y === 2) drawClockTower(g);
    if (y === CHURCH.ty1 - 1) drawChurchTower(g);
    if (y === CHURCH.ny1 - 1) drawChurchFront(g);
  }
}

/* ============ the clock tower, standing on the sliver's roofline ============ */
const CT = {x0:63.8, x1:66.2, yF:3, yB:1.1, base:5.4, top:13.0};
function towerFace(g, x0, x1, y, z0, z1, c0, c1){
  const a = project(x0, y, z1), b = project(x1, y, z1), c = project(x1, y, z0), d = project(x0, y, z0);
  const gr = g.createLinearGradient(a[0], 0, b[0], 0);
  gr.addColorStop(0, SUN[0] > 0 ? c0 : c1); gr.addColorStop(1, SUN[0] > 0 ? c1 : c0);
  g.fillStyle = gr; poly(g, [a, b, c, d]); g.fill();
}
function towerTop(g, x0, x1, yF, yB, z, col){    // a horizontal ledge, which is what sells the depth
  const a = project(x0, yB, z), b = project(x1, yB, z), c = project(x1, yF, z), d = project(x0, yF, z);
  g.fillStyle = col; poly(g, [a, b, c, d]); g.fill();
}
function drawClockTower(g){
  const {x0, x1, yF, yB, base, top} = CT;
  // lead flashing where the roof runs into the tower
  towerTop(g, x0 - 0.28, x1 + 0.28, yF + 0.15, yB - 0.15, base + 0.5, 'rgba(64,58,48,.9)');
  towerFace(g, x0, x1, yF, base, top, '#8d8067', '#b6a88d');
  g.strokeStyle = 'rgba(58,50,38,.45)'; g.lineWidth = 1;
  poly(g, [project(x0, yF, top), project(x1, yF, top), project(x1, yF, base), project(x0, yF, base)]); g.stroke();
  // string courses, each with a visible top ledge
  for (const z of [base + 1.6, base + 4.4]){
    towerFace(g, x0 - 0.1, x1 + 0.1, yF + 0.1, z, z + 0.24, '#8a7d64', '#c0b295');
    towerTop(g, x0 - 0.1, x1 + 0.1, yF + 0.1, yB, z + 0.24, 'rgba(206,194,168,.85)');
  }
  // clock face
  const [ccx, ccy] = project((x0 + x1) / 2, yF, 10.2);
  const rr = cellW * 0.92;
  g.fillStyle = '#7d715c'; g.beginPath(); g.arc(ccx, ccy, rr * 1.16, 0, 7); g.fill();
  g.fillStyle = '#efe7d2'; g.beginPath(); g.arc(ccx, ccy, rr, 0, 7); g.fill();
  g.strokeStyle = '#4a4034'; g.lineWidth = 1.4; g.beginPath(); g.arc(ccx, ccy, rr, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(74,64,52,.8)'; g.lineWidth = 1;
  for (let k = 0; k < 12; k++){
    const th = k / 12 * Math.PI * 2;
    g.beginPath();
    g.moveTo(ccx + Math.cos(th) * rr * 0.84, ccy + Math.sin(th) * rr * 0.84);
    g.lineTo(ccx + Math.cos(th) * rr * 0.96, ccy + Math.sin(th) * rr * 0.96); g.stroke();
  }
  // belfry: a louvred opening under the cornice
  const bl = project(x0 + 0.55, yF, 12.5), br = project(x1 - 0.55, yF, 12.5);
  const bb = project(x0 + 0.55, yF, 11.2), bb2 = project(x1 - 0.55, yF, 11.2);
  g.fillStyle = '#2a251d'; poly(g, [bl, br, bb2, bb]); g.fill();
  g.strokeStyle = 'rgba(150,138,116,.7)'; g.lineWidth = 1;
  for (let k = 1; k < 6; k++){
    const z = 11.2 + k * 0.22;
    const s1 = project(x0 + 0.55, yF, z), s2 = project(x1 - 0.55, yF, z);
    g.beginPath(); g.moveTo(s1[0], s1[1]); g.lineTo(s2[0], s2[1]); g.stroke();
  }
  // cornice, then the pyramid cap
  towerFace(g, x0 - 0.28, x1 + 0.28, yF + 0.2, top - 0.35, top, '#9c8f75', '#cabb9c');
  towerTop(g, x0 - 0.28, x1 + 0.28, yF + 0.2, yB - 0.2, top, 'rgba(214,202,175,.9)');
  const apex = project((x0 + x1) / 2, (yF + yB) / 2, top + 3.4);
  const c1 = project(x0 - 0.2, yF + 0.2, top), c2 = project(x1 + 0.2, yF + 0.2, top);
  const c3 = project(x1 + 0.2, yB - 0.2, top), c4 = project(x0 - 0.2, yB - 0.2, top);
  g.fillStyle = mix('#3c4148', '#6d747c', 0.3 + 0.5 * daylight);
  poly(g, [c1, c2, apex]); g.fill();
  g.fillStyle = mix('#2e333a', '#565d66', 0.3 + 0.5 * daylight);
  poly(g, [c2, c3, apex]); g.fill();
  g.fillStyle = mix('#343940', '#616872', 0.3 + 0.5 * daylight);
  poly(g, [c4, c1, apex]); g.fill();
  g.strokeStyle = 'rgba(210,214,220,.35)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(c1[0], c1[1]); g.lineTo(apex[0], apex[1]);
  g.moveTo(c2[0], c2[1]); g.lineTo(apex[0], apex[1]); g.stroke();
  const vane = project((x0 + x1) / 2, (yF + yB) / 2, top + 4.8);
  g.strokeStyle = '#2f2b26'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(apex[0], apex[1]); g.lineTo(vane[0], vane[1]); g.stroke();
  g.fillStyle = '#4a4238';
  poly(g, [[vane[0] - 5, vane[1] + 1], [vane[0] + 5, vane[1] + 3], [vane[0] - 5, vane[1] + 5]]); g.fill();
}

/* ============ the church across the river ============ */
function drawChurchTower(g){
  const x0 = CHURCH.tx0 + 0.15, x1 = CHURCH.tx1 - 0.15, yF = CHURCH.ty1, yB = CHURCH.ty0 + 0.2;
  const base = 6.0, top = 13.6;

    towerTop(g, x0 - 0.12, x1 + 0.12, yF + 0.12, yB, z + 0.22, 'rgba(202,194,172,.85)');

  towerFace(g, x0 - 0.3, x1 + 0.3, yF + 0.2, top - 0.4, top, '#948b76', '#c6bda2');
  towerTop(g, x0 - 0.3, x1 + 0.3, yF + 0.2, yB - 0.2, top, 'rgba(208,199,176,.9)');
  const mx = (x0 + x1) / 2, my = (yF + yB) / 2;
  for (const [cx2, cy2] of [[x0 - 0.3, yF + 0.2], [x1 + 0.3, yF + 0.2]]){   // corner pinnacles
    const p0 = project(cx2, cy2, top), p1 = project(cx2, cy2, top + 1.5);
    g.strokeStyle = '#a89f88'; g.lineWidth = Math.max(2, cellW * 0.2);
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
  }
  const apex = project(mx, my, top + 9.5);
  const s1 = project(x0 + 0.25, yF + 0.05, top + 0.2), s2 = project(x1 - 0.25, yF + 0.05, top + 0.2);
  const s3 = project(x1 - 0.25, yB, top + 0.2), s4 = project(x0 + 0.25, yB, top + 0.2);
  g.fillStyle = mix('#3f444a', '#78808a', 0.28 + 0.5 * daylight); poly(g, [s1, s2, apex]); g.fill();
  g.fillStyle = mix('#2f343a', '#5b626b', 0.28 + 0.5 * daylight); poly(g, [s2, s3, apex]); g.fill();
  g.fillStyle = mix('#353a41', '#666e78', 0.28 + 0.5 * daylight); poly(g, [s4, s1, apex]); g.fill();
  g.strokeStyle = 'rgba(214,220,228,.3)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(s1[0], s1[1]); g.lineTo(apex[0], apex[1]);
  g.moveTo(s2[0], s2[1]); g.lineTo(apex[0], apex[1]); g.stroke();
  const cross = project(mx, my, top + 11.2);
  g.strokeStyle = '#d8cba0'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(apex[0], apex[1]); g.lineTo(cross[0], cross[1]);
  g.moveTo(cross[0] - 3, cross[1] + 4); g.lineTo(cross[0] + 3, cross[1] + 4); g.stroke();
}
function drawChurchFront(g){
  const yF = CHURCH.ny1, mx = (CHURCH.nx0 + CHURCH.nx1) / 2;
  const [rx, ry] = project(mx, yF, 5.4);
  g.fillStyle = '#7d735f'; g.beginPath(); g.arc(rx, ry, cellW * 0.95, 0, 7); g.fill();
  const lit = nightF > 0.3;
  g.fillStyle = lit ? 'rgba(255,206,140,.9)' : mix('#2b3038', '#8fa2b4', 0.2 + 0.5 * daylight);
  g.beginPath(); g.arc(rx, ry, cellW * 0.74, 0, 7); g.fill();
  if (lit) LIT.push([rx, ry]);
  g.strokeStyle = 'rgba(240,234,218,.7)'; g.lineWidth = 1;
  for (let k = 0; k < 6; k++){
    const th = k / 6 * Math.PI;
    g.beginPath();
    g.moveTo(rx - Math.cos(th) * cellW * 0.74, ry - Math.sin(th) * cellW * 0.74);
    g.lineTo(rx + Math.cos(th) * cellW * 0.74, ry + Math.sin(th) * cellW * 0.74); g.stroke();
  }
  // west door
  const dw = 0.5;
  const p1 = project(mx - dw, yF, 2.2), p2 = project(mx + dw, yF, 2.2);
  const p3 = project(mx + dw, yF, 0), p4 = project(mx - dw, yF, 0);
  const cr = project(mx, yF, 3.1);
  g.fillStyle = '#4a3c2c';
  g.beginPath(); g.moveTo(p4[0], p4[1]); g.lineTo(p1[0], p1[1]);
  g.quadraticCurveTo(p1[0], cr[1], cr[0], cr[1]);
  g.quadraticCurveTo(p2[0], cr[1], p2[0], p2[1]);
  g.lineTo(p3[0], p3[1]); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(222,212,190,.75)'; g.lineWidth = Math.max(1.4, cellW * 0.14); g.stroke();
}

/* ============ archways: real openings you can watch people walk through ============ */
// `samp` is the cell you would actually be standing on once through, so the light at
// the far end of a passage is the real ground of wherever it leads
const ARCHES = [
  {x:32.5,      yF:3,  yB:0,  hw:1.95, floor:'#b3a17e', beyond:'#cabd97'},
  {x:32.5,      yF:65, yB:61, hw:1.95, floor:'#b3a17e', samp:[32, 59]},
  {x:ALT_GATE,  yF:65, yB:61, hw:1.7,  floor:'#a89878', samp:[86, 59]},
  {x:PARK_GATE, yF:65, yB:61, hw:1.7,  floor:'#a89878', samp:[134, 59]},
];
function farCol(A){
  if (!A.samp) return A.beyond;
  const [sx, sy] = A.samp;
  return groundCol(sx, sy, grid[sy * GW + sx], hash(sx, sy), maturity());
}
for (const A of ARCHES) A.top = eaveFor(Math.round(A.x), A.yF === 3 ? 1 : 62) - 0.7;
function archShape(g, A, grow){
  const e = grow || 0, hw = A.hw + e, top = A.top + e * 0.85, sp = top * 0.5;
  const bl = project(A.x - hw, A.yF, 0), br = project(A.x + hw, A.yF, 0);
  const sl = project(A.x - hw, A.yF, sp), sr = project(A.x + hw, A.yF, sp);
  const cr = project(A.x, A.yF, top);
  g.beginPath();
  g.moveTo(bl[0], bl[1]); g.lineTo(sl[0], sl[1]);
  g.quadraticCurveTo(sl[0], cr[1], cr[0], cr[1]);
  g.quadraticCurveTo(sr[0], cr[1], sr[0], sr[1]);
  g.lineTo(br[0], br[1]); g.closePath();
}
function tunnelFolk(g, A){
  const lo = Math.min(A.yF, A.yB) - 1.0, hi = Math.max(A.yF, A.yB) + 1.0;
  for (const a of agents){
    if (a.x < A.x - A.hw || a.x > A.x + A.hw || a.y < lo || a.y > hi) continue;
    g.globalAlpha = 0.82;
    drawPerson({a});
    if (a.dog) drawDog({d:a.dog});
    g.globalAlpha = 1;
  }
}
function archAtY(g, x, yy, top, hw){
  const sp = top * 0.5;
  const bl = project(x - hw, yy, 0), br = project(x + hw, yy, 0);
  const sl = project(x - hw, yy, sp), sr = project(x + hw, yy, sp);
  const cr = project(x, yy, top);
  g.beginPath();
  g.moveTo(bl[0], bl[1]); g.lineTo(sl[0], sl[1]);
  g.quadraticCurveTo(sl[0], cr[1], cr[0], cr[1]);
  g.quadraticCurveTo(sr[0], cr[1], sr[0], sr[1]);
  g.lineTo(br[0], br[1]); g.closePath();
}
function drawPassage(g, A){
  const hw = A.hw * 0.94, top = A.top * 0.93;
  const far = farCol(A);
  const DEEP = '#191309';
  // a passage is lit from both ends and darkest in its middle
  const vaultAt = u => mix(DEEP, far, clamp(Math.max(Math.pow(u, 2.2), Math.pow(1 - u, 2.6) * 0.55), 0, 1) * 0.85);
  g.save();
  archShape(g, A); g.clip();
  archShape(g, A, 0.6); g.fillStyle = vaultAt(0); g.fill();
  // vault rings, drawn near to far so the far mouth ends up innermost
  for (let k = 1; k <= 6; k++){
    const u = k / 6, s = 1 - k * 0.014;
    archAtY(g, A.x, A.yF + (A.yB - A.yF) * u, top * s, hw * s);
    g.fillStyle = k === 6 ? far : vaultAt(u);
    g.fill();
  }
  // the flagged floor, sharing the same lit-dark-lit run
  const fa = project(A.x - hw, A.yB, 0), fb = project(A.x + hw, A.yB, 0);
  const n1 = project(A.x - hw, A.yF, 0), n2 = project(A.x + hw, A.yF, 0);
  const fl = g.createLinearGradient(0, fa[1], 0, n1[1]);
  fl.addColorStop(0, far);
  fl.addColorStop(0.28, mix(far, '#241d13', 0.55));
  fl.addColorStop(0.62, mix(A.floor, '#241d13', 0.72));
  fl.addColorStop(1, mix(A.floor, '#3b3126', 0.40));
  g.fillStyle = fl; poly(g, [fa, fb, n2, n1]); g.fill();
  // daylight spilling in from whatever lies beyond
  const gl = g.createLinearGradient(0, fa[1] - cellH * 2.4, 0, fa[1] + cellH * 1.4);
  gl.addColorStop(0, 'rgba(255,246,220,' + (0.10 + 0.24 * daylight) + ')');
  gl.addColorStop(1, 'rgba(255,246,220,0)');
  g.fillStyle = gl; poly(g, [project(A.x - hw, A.yB, top), project(A.x + hw, A.yB, top), fb, fa]); g.fill();
  tunnelFolk(g, A);
  // the near ring of the vault, framing the mouth
  g.strokeStyle = 'rgba(16,12,8,.75)'; g.lineWidth = Math.max(2, cellW * 0.24);
  archAtY(g, A.x, A.yF - 0.05, top, hw); g.stroke();
  g.restore();
  // the stone surround
  g.strokeStyle = 'rgba(48,40,30,.5)'; g.lineWidth = Math.max(1.6, cellW * 0.17);
  archShape(g, A, 0.1); g.stroke();
  g.strokeStyle = 'rgba(226,216,192,.45)'; g.lineWidth = Math.max(1, cellW * 0.1);
  archShape(g, A, 0.2); g.stroke();
  const [kx, ky] = project(A.x, A.yF, A.top + 0.1);
  g.fillStyle = 'rgba(230,220,198,.7)';
  g.beginPath(); g.ellipse(kx, ky, cellW * 0.19, cellH * 0.5, 0, 0, 7); g.fill();
}
function drawArch(it){ drawPassage(ctx, it.A); }
function drawSouthBand(){
  for (let y = 61; y <= 64; y++){
    drawFaceRow(ctx, y); drawRoofRow(ctx, y); drawCrests(ctx, y);
  }
  if (richness() > 0.2){                               // ivy climbing the gatehouse
    ctx.fillStyle = 'rgba(74,105,54,.7)';
    for (const vx of [10, 24, 51, 92]){
      if (hash(vx, 3) > richness() * 1.4) continue;
      for (let z = 0; z < 4.6 * Math.min(1, richness() * 1.6); z += 0.42){
        const p = project(vx + Math.sin(z * 2.2) * 0.5, 65, z);
        ctx.beginPath(); ctx.arc(p[0], p[1], cellW * (0.15 + hash(vx, z * 10 | 0) * 0.14), 0, 7); ctx.fill();
      }
    }
  }
}
function groundCol(x, y, t, hv, m){
  if (t === PATH) return mix('#c3b18c', '#cfbd98', hv);
  if (t === SLOT) return mix('#9d8f73', '#ab9d80', hv);
  if (t === GRASS){
    const health = clamp(0.35 + m * 0.75 - hv * 0.18, 0, 1);
    const g1 = x >= FAR_X0 ? mix('#93a86a', '#6f9a4a', health * (0.75 + 0.25 * hash(x >> 1, y >> 1)))
             : x >= XS_E1 ? mix('#a8ad74', '#82a556', health * (0.7 + 0.3 * hash(x >> 1, y >> 1)))
             : mix('#9aa96b', '#74a04c', health);
    return mix(g1, '#a4906a', Math.pow(wear[y * GW + x], 0.7));
  }
  if (t === BED || t === CBED) return mix('#5c4832', '#6b563c', hv);
  if (t === SIDE) return mix('#b3a88f', '#bfb49b', hv);
  if (t === ROAD) return mix('#87806f', '#8d8675', hv * 0.5);
  if (t === WATER){
    if (x >= RIVER_X0 - 1 && x <= RIVER_X1){
      const mid = 1 - Math.abs((x + 0.5 - (RIVER_X0 + RIVER_X1) / 2) / ((RIVER_X1 - RIVER_X0) / 2));
      return mix(mix('#5d7a84', '#546f7c', hv * 0.6), '#3f5a68', clamp(mid, 0, 1));
    }
    if (x >= PLAZA_X0 && x < PLAZA_X1) return mix('#527a86', '#4a6f7c', hv * 0.5);
    const depth = 1 - Math.hypot((x + .5 - POND.x) / POND.rx, (y + .5 - POND.y) / POND.ry);
    return mix('#7a948e', '#4f7580', clamp(depth * 1.8, 0, 1));
  }
  return '#6b4f39';
}
function drawShadows(g){
  if (daylight < 0.05) return;
  g.fillStyle = 'rgba(26,28,22,' + (0.10 + 0.16 * daylight) + ')';
  g.beginPath();
  for (let y = 0; y < WH; y++) for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    if (!solidM[y * GW + gx]) continue;
    const h = eaveM[y * GW + gx] + 0.4;
    const tx = x - SUN[0] / SUN[2] * h, ty = y - SUN[1] / SUN[2] * h;
    if (ty < -1 || ty >= WH) continue;
    if (solidC(Math.floor(tx), Math.floor(ty))) continue;
    const a = project(tx, ty, 0), b = project(tx + 1, ty, 0);
    const c = project(tx + 1, ty + 1, 0), d = project(tx, ty + 1, 0);
    g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.closePath();
  }
  g.fill();
}
function drawGround(){
  gcv.width = W * DPR; gcv.height = H * DPR;
  gtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SUN = sunVec(); LIT.length = 0; HAZE = skyCols()[1];
  const m = maturity();
  // the sky is *not* baked in here — it is painted fresh every frame underneath this
  // layer, so the sun crosses smoothly instead of hopping when the layer is rebuilt
  // ground, drawn well past the frame so the town never stops in mid-air
  for (let y = 0; y < WH; y++) for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    const i = y * GW + gx, t = grid[i], hv = hash(gx, y);
    if (t === WALL || t === VOID) continue;
    if (t === TUNNEL){                                   // floor of a roofed passage
      gtx.fillStyle = '#241d16'; quad(gtx, x, y, 0.03); gtx.fill(); continue;
    }
    gtx.fillStyle = groundCol(gx, y, t, hv, m);
    quad(gtx, x, y, 0.03); gtx.fill();
    if (x !== gx) continue;                              // detailing only inside the real world
    if ((t === PATH || t === SLOT) && hv > 0.4){
      gtx.strokeStyle = 'rgba(90,75,50,.25)'; gtx.lineWidth = 0.7;
      quad(gtx, x, y, -0.06); gtx.stroke();
    }
    if (t === SIDE && hv > 0.55){                        // paving joints
      gtx.strokeStyle = 'rgba(96,88,70,.16)'; gtx.lineWidth = 0.7;
      quad(gtx, x, y, -0.04); gtx.stroke();
    }
    if (t === ROAD){                                     // cobbled setts, laid in courses
      gtx.strokeStyle = 'rgba(66,60,50,.14)'; gtx.lineWidth = 0.7;
      const off = (y % 2) * 0.5;
      gtx.beginPath();
      for (let k = 0; k < 3; k++){
        const p1 = project(x + off + k / 3, y, 0), p2 = project(x + off + k / 3, y + 1, 0);
        gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]);
      }
      const q1 = project(x, y, 0), q2 = project(x + 1, y, 0);
      gtx.moveTo(q1[0], q1[1]); gtx.lineTo(q2[0], q2[1]);
      gtx.stroke();
      if (hv > 0.9){
        gtx.fillStyle = 'rgba(70,63,52,.12)';
        const [sx, sy] = project(x + 0.3, y + 0.3, 0);
        gtx.beginPath(); gtx.ellipse(sx, sy, cellW * 0.3, cellH * 0.26, 0, 0, 7); gtx.fill();
      }
    }
    if (t === GRASS && x >= ALT_X0){                     // reeds where bank meets water
      let nearWater = false;
      for (const d of [-1, 1, -GW, GW]) if (grid[i + d] === WATER) nearWater = true;
      if (nearWater){
        const rs = cellW / 13;
        gtx.strokeStyle = '#5d7a42'; gtx.lineWidth = Math.max(0.8, rs);
        for (let k = 0; k < 3; k++){
          const [rx2, ry2] = project(x + 0.2 + hash(x + k, y) * 0.6, y + 0.2 + hash(x, y + k) * 0.6, 0);
          gtx.beginPath(); gtx.moveTo(rx2, ry2);
          gtx.lineTo(rx2 + (k - 1) * 1.5 * rs, ry2 - (5 + hash(k, x) * 3) * rs); gtx.stroke();
        }
      }
    }
    if (t === GRASS && daisy[i]){
      for (let k = 0; k < daisy[i] + 1; k++){
        const [sx, sy] = project(x + 0.2 + hash(x + k, y) * 0.6, y + 0.2 + hash(x, y + k) * 0.6, 0.02);
        gtx.fillStyle = '#eee9d8'; gtx.beginPath(); gtx.arc(sx, sy, 1.4, 0, 7); gtx.fill();
        gtx.fillStyle = '#dfc253'; gtx.beginPath(); gtx.arc(sx, sy, 0.55, 0, 7); gtx.fill();
      }
    }
  }
  // the river carries on off the bottom of the view
  {
    const bl = project(QUAY_X0, WH, 0), br = project(RIVER_X1, WH, 0);
    const rg = gtx.createLinearGradient(0, bl[1], 0, H);
    rg.addColorStop(0, '#48626f'); rg.addColorStop(1, '#2b3d47');
    gtx.fillStyle = rg;
    poly(gtx, [bl, br, [br[0] + (br[0] - project(RIVER_X1, WH - 4, 0)[0]) * 4, H],
               [bl[0] + (bl[0] - project(QUAY_X0, WH - 4, 0)[0]) * 4, H]]);
    gtx.fill();
  }
  // a paved roundel set into the plaza, radiating from the fountain
  {
    gtx.save();
    poly(gtx, [project(PLAZA_X0, 3, 0), project(PLAZA_X1, 3, 0), project(PLAZA_X1, 61, 0), project(PLAZA_X0, 61, 0)]);
    gtx.clip();
    const [fx, fy] = project(FOUNTAIN.x, FOUNTAIN.y, 0);
    for (const [rr, al] of [[3.6, 0.16], [4.6, 0.11], [6.2, 0.08]]){
      gtx.strokeStyle = 'rgba(120,104,78,' + al + ')'; gtx.lineWidth = Math.max(1.4, cellW * 0.16);
      gtx.beginPath(); gtx.ellipse(fx, fy, cellW * rr, cellH * rr, 0, 0, 7); gtx.stroke();
    }
    gtx.strokeStyle = 'rgba(120,104,78,.10)'; gtx.lineWidth = 1;
    for (let k = 0; k < 12; k++){
      const th = k / 12 * Math.PI * 2;
      gtx.beginPath();
      gtx.moveTo(fx + Math.cos(th) * cellW * 3.6, fy + Math.sin(th) * cellH * 3.6);
      gtx.lineTo(fx + Math.cos(th) * cellW * 6.2, fy + Math.sin(th) * cellH * 6.2);
      gtx.stroke();
    }
    gtx.restore();
  }
  // the river: a slow drift of ripples, and the far bank laid out on it
  {
    gtx.strokeStyle = 'rgba(226,240,244,.13)'; gtx.lineWidth = 1;
    gtx.beginPath();
    for (let ry = 2; ry < WH; ry += 1.6){
      if (ry > LN_WALK_N - 1 && ry < LN_WALK_S + 2.4) continue;
      const n = 2 + (hash(ry | 0, 5) * 3 | 0);
      for (let k = 0; k < n; k++){
        const rx = RIVER_X0 + 0.8 + hash(ry | 0, k * 7) * (RIVER_X1 - RIVER_X0 - 2.4);
        const len = 0.8 + hash(k, ry | 0) * 2.2;
        const p1 = project(rx, ry, 0), p2 = project(rx + len, ry, 0);
        gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]);
      }
    }
    gtx.stroke();
    // the bank's reflection, smeared toward us
    const rg2 = gtx.createLinearGradient(project(RIVER_X0, 3, 0)[0], 0, project(RIVER_X1, 3, 0)[0], 0);
    rg2.addColorStop(0, 'rgba(120,140,150,0)');
    rg2.addColorStop(1, 'rgba(150,132,110,.22)');
    gtx.fillStyle = rg2;
    poly(gtx, [project(RIVER_X0, 3, 0), project(RIVER_X1, 3, 0),
               project(RIVER_X1, 12, 0), project(RIVER_X0, 12, 0)]); gtx.fill();
  }
  drawShadows(gtx);
  // raised kerbs, so the footways sit above the roadway
  for (const [yy, col] of [[LN_ROAD0, 'rgba(150,142,124,.7)'], [LN_ROAD1, 'rgba(92,86,74,.45)']]){
    const segs = yy === LN_ROAD0 ? [[XLO, XS_R0], [XS_R1, XHI]] : [[XLO, XHI]];
    for (const [sx0, sx1] of segs){
      const a = project(sx0, yy, 0), b = project(sx1, yy, 0);
      const c = project(sx1, yy, 0.16), d = project(sx0, yy, 0.16);
      gtx.fillStyle = col; poly(gtx, [d, c, b, a]); gtx.fill();
    }
  }
  // curbs along the lane and the cross street, broken at the junction
  gtx.strokeStyle = 'rgba(70,62,50,.5)'; gtx.lineWidth = 1.2;
  for (const yy of [LN_ROAD0, LN_ROAD1]){
    const segs = yy === LN_ROAD0 ? [[XLO, XS_R0], [XS_R1, XHI]] : [[XLO, XHI]];
    for (const [sx0, sx1] of segs){
      const p1 = project(sx0, yy, 0), p2 = project(sx1, yy, 0);
      gtx.beginPath(); gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]); gtx.stroke();
    }
  }
  for (const xx of [XS_R0, XS_R1]){
    const p1 = project(xx, 0, 0), p2 = project(xx, LN_ROAD0, 0);
    gtx.beginPath(); gtx.moveTo(p1[0], p1[1]); gtx.lineTo(p2[0], p2[1]); gtx.stroke();
  }
  // allotment fence along the verge, gapped at the two gates
  gtx.strokeStyle = '#5a4732'; gtx.lineWidth = 1.6;
  for (let fy = 3; fy < 61; fy += 2){
    if (Math.abs(fy - 20) < 2 || Math.abs(fy - 45) < 2) continue;
    const b = project(ALT_X0, fy + 0.5, 0), t2 = project(ALT_X0, fy + 0.5, 0.8);
    gtx.beginPath(); gtx.moveTo(b[0], b[1]); gtx.lineTo(t2[0], t2[1]); gtx.stroke();
  }
  gtx.strokeStyle = 'rgba(90,71,50,.7)'; gtx.lineWidth = 1.1;
  let open = false;
  gtx.beginPath();
  for (let fy = 3; fy <= 61; fy++){
    const gap = Math.abs(fy - 20) < 2 || Math.abs(fy - 45) < 2;
    const p = project(ALT_X0, fy, 0.55);
    if (gap){ open = false; continue; }
    if (!open){ gtx.moveTo(p[0], p[1]); open = true; } else gtx.lineTo(p[0], p[1]);
  }
  gtx.stroke();
  drawQuayWalls(gtx);
  drawBlocks(gtx, 0, 61);
  drawBridge(gtx);

function drawSill(g){

  const warm = 0.10 + 0.55 * daylight;

  g.fillStyle = 'rgba(196,168,124,' + (0.10 + 0.22 * warm) + ')';
  g.fillRect(0, sy, W, 2.2);                                   // the lit front edge of the sill

    const pw = u * 1.5 * s, ph = u * 1.25 * s;
    g.fillStyle = silh;
    g.beginPath();
