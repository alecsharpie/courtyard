<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Courtyard</title>
<style>
  :root{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  @media (prefers-color-scheme: light){
    :root{ --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
      --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
      --glass-shine:rgba(255,255,255,.10); }
  }
  :root[data-theme="dark"]{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  :root[data-theme="light"]{
    --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
    --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
    --glass-shine:rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:radial-gradient(120% 100% at 50% 0%, var(--room2), var(--room) 70%);
    color:var(--ink); font-family:system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #room{ display:flex; flex-direction:column; width:min(100vw, 1280px); height:100vh; padding:clamp(8px,2vh,22px) clamp(8px,2vw,26px); }
  #frame{
    position:relative; flex:1; min-height:0;
    border:10px solid var(--frame);
    border-top-color:var(--frame-hi);
    border-radius:6px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.55), 0 18px 50px rgba(0,0,0,.35);
    background:#0d1410; overflow:hidden;
  }
  /* The default cursor is the ARROW, not a crosshair: the canvas swaps it for a
     pointer over exactly the cells the click handler will answer, and a crosshair
     everywhere would spend that contrast before it is used. See answersTouch(). */
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:default; }
  #glass{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(115deg, transparent 44%, var(--glass-shine) 48%, transparent 52%),
      radial-gradient(140% 120% at 50% 45%, transparent 66%, rgba(0,0,0,.38) 100%);
  }
  #sill{
    flex:none; display:flex; align-items:baseline; gap:18px;
    padding:12px 6px 4px; font-size:13px; color:var(--ink-dim);
  }
  /* flex:none on every nowrap item. They are all white-space:nowrap, so a flex box
     that shrinks below its text does not clip or ellipsis it — it SPILLS, silently,
     over its neighbour. #ticker (flex:1, min-width:0) is the only item allowed to
     take up the slack, because it is the only one with text-overflow. */
  #plate{ font-family:"Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    flex:none; display:flex; align-items:baseline; gap:18px;
    font-size:17px; color:var(--ink); letter-spacing:.02em; white-space:nowrap; }
  #plate small{ display:block; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim); font-family:system-ui,sans-serif; margin-top:1px;}
  /* The season is prose, so it is set in the plate's serif and not the clock's sans:
     the sill reads title · season · clock · ticker · counts, coarse to fine, and the
     two serif items are the two that SPEAK (one fixed, one changing) while the two
     tabular ones are the two that COUNT. min-width holds the longest name so the
     clock beside it never slides when the year turns.
     It lives INSIDE #plate rather than beside it so the narrow breakpoint can drop it
     onto the caption line without reparenting — see the media query.
     And it is a BUTTON, because the year is 26 sim days — 24 real minutes at 1x —
     and the one thing in the sill that names the season is also the most obvious
     place to ask for another one. See beginSkip(). It carries a chevron at all
     times rather than only on hover: a phone has no hover, and this is the one
     control in the row that does not already look like a control.
     ...and it is UNDERLINED, because the chevron alone was carrying the whole
     affordance: half-opacity punctuation at the end of a serif word, in a row of
     serif words. An underline is the one mark that says "press this" inside running
     prose without turning the label into a chip and fighting the plate's
     typography. The rule stops at the WORD — ::after is an inline-block, and
     text-decoration does not propagate into one — so the chevron stays a chevron
     instead of becoming a tail on the line. The padding is the hit area (a 14px
     label is a 17px target); the equal negative margin gives every pixel of it
     back to the layout, so the sill is the same height it was. */
  #season{ flex:none; font-size:14px; font-family:inherit;
    color:var(--ink); letter-spacing:.02em; white-space:nowrap; min-width:10.5ch;
    background:transparent; border:0; padding:5px 0; margin:-5px 0; text-align:left;
    cursor:pointer; transition:color .25s;
    text-decoration:underline; text-decoration-color:var(--ink-dim);
    text-decoration-thickness:1px; text-underline-offset:3px; }
  #season::after{ content:'\2009\203A'; display:inline-block; opacity:.6; }
  #season:hover{ text-decoration-color:var(--accent); }
  #season:hover, #season:hover::after{ color:var(--accent); opacity:1; }
  #season:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  #season[disabled]{ cursor:default; opacity:.55; }
  /* WHERE the eye is. At 390px the whole town is a strip and a person is two pixels,
     so this is the one control that lets a phone look at ONE quarter: press it and the
     camera eases onto the courtyard, the street, the plaza, the far bank, then back to
     the wide view. It names the place it is showing, in the plate's serif like the
     season (a place is prose), with the same underline and chevron. See whereGo().
     It sits beside the clock in the row, and under it on a phone (see the media query). */
  #clockcol{ display:contents; }
  #where{ flex:none; font-size:14px; font-family:inherit;
    color:var(--ink); letter-spacing:.02em; white-space:nowrap; min-width:9ch;
    background:transparent; border:0; padding:5px 0; margin:-5px 0; text-align:left;
    cursor:pointer; transition:color .25s;
    text-decoration:underline; text-decoration-color:var(--ink-dim);
    text-decoration-thickness:1px; text-underline-offset:3px; }
  #where::after{ content:'\2009\203A'; display:inline-block; opacity:.6; }
  #where:hover{ text-decoration-color:var(--accent); }
  #where:hover, #where:hover::after{ color:var(--accent); opacity:1; }
  #where:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  /* The reduced-motion path's honest cut: a lapse of six sunrises in six seconds is
     precisely the thing prefers-reduced-motion is asking not to be shown, so under it
     the same advance is delivered behind this instead. It is the only thing in the
     frame allowed over the glass. */
  #veil{ position:absolute; inset:0; pointer-events:none; background:var(--room);
    opacity:0; transition:opacity .38s ease; }
  #veil.on{ opacity:1; }
  /* The clock is the season's idea one scale DOWN. The season button reaches the next
     quarter; nobody arriving at noon would find the night on their own (dusk is ~35 real
     seconds off, and the only fast-forward skipped a quarter-year), so the hour is a
     button too and reaches this evening — then the next dawn. Same underline, same
     chevron, same hit-area trick; but it keeps the clock's sans and tabular figures,
     because it is still the thing in the row that COUNTS. 13ch holds the longest label
     plus the chevron so nothing beside it slides when the hour turns. */
  #daytime{ flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:13ch;
    font:inherit; color:var(--ink); background:transparent; border:0; padding:5px 0; margin:-5px 0;
    text-align:left; cursor:pointer; transition:color .25s;
    text-decoration:underline; text-decoration-color:var(--ink-dim);
    text-decoration-thickness:1px; text-underline-offset:3px; }
  #daytime::after{ content:'\2009\203A'; display:inline-block; opacity:.6; }
  #daytime:hover{ text-decoration-color:var(--accent); }
  #daytime:hover, #daytime:hover::after{ color:var(--accent); opacity:1; }
  #daytime:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  #daytime[disabled]{ cursor:default; opacity:.55; }
  #ticker{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:"Iowan Old Style", Palatino, Georgia, serif; font-style:italic; font-size:14px;
    color:var(--ink); opacity:.9; transition:opacity .6s; }
  #ticker.fade{ opacity:.35; }
  /* The naming — what the pointer is on — borrows the TICKER's box rather than adding
     a seventh item to a row that was already tight at 641px (see #stats yielding
     below 860). Same slot, same serif, but UPRIGHT and with no full stop: the ticker
     is prose the town says, this is a label for a thing, and the sill's other two
     labels (title, season) are upright too. It never covers a line that has not been
     read — see updateNaming. */
  #naming{ display:none; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-family:"Iowan Old Style", Palatino, Georgia, serif;
    font-size:14px; color:var(--ink); letter-spacing:.01em; }
  #sill.naming #ticker{ display:none; }
  #sill.naming #naming{ display:block; }
  #stats{ flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #ctrl{ flex:none; display:flex; gap:6px; }
  #ctrl button{
    font:inherit; font-size:12px; color:var(--ink); background:transparent;
    border:1px solid var(--ink-dim); border-radius:4px; padding:2px 9px; cursor:pointer;
  }
  #ctrl button:hover{ border-color:var(--accent); color:var(--accent); }
  #ctrl button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  /* The season is a sixth item in a fixed-width row, and the row was already tight in
     the 640-860 band: on HEAD the ticker was down to 71px of box at 641px, ellipsised
     to nothing. So the COUNTS yield first. They are the most expendable thing here —
     people and blooms and ducks are all visible in the picture above, whereas which
     season it is was the one fact the sill could not tell you. Net effect in this band
     is a season gained and a ticker that reads BETTER than it did (126px at 641,
     253px at 768, against HEAD's 71 and 193). */
  @media (max-width:860px){
    #stats{ display:none; }
    /* In this band the ticker's box is down to 136 px at 641, and the label is the one
       item here that is answering a hand. So the CLOCK yields to it as well, for as long
       as the pointer is on something — the hour is legible in the picture (the sun is in
       it), and it comes back the moment the pointer leaves. */
    #sill.naming #daytime{ display:none; }
  }
  @media (max-width:640px){
    #ticker,#stats{ display:none; }
    /* The narrow row has ~32px of slack and the season wants ~80, so it comes OUT of
       the row and onto the plate's second line — the caption slot, which on a phone
       was empty anyway ("a cellular block" has always been hidden here). Costs zero
       horizontal width, and the label ends up in its truest form: a title with the
       season set under it. Which season it is outranks a subtitle on a 390px screen. */
    #plate{ display:block; }
    #title{ display:block; }
    #plate small{ display:none; }
    /* In the caption slot it was also the LEAST pressable thing in the sill: 10px
       of dim uppercase, set exactly like the subtitle it displaced. So here it takes
       the full ink (a caption is grey; a control is not), keeps the underline, and
       spreads its hit area over the whole width of the line and down into the sill's
       bottom padding — a 12px cap-line becomes a ~29px target with no cursor to help
       it. Padding and margin cancel to the +1px this line always contributed, so the
       plate is the same height and the picture above it does not resize. */
    #season{ display:block; min-width:0;
      padding:7px 0 10px; margin:-6px 0 -10px;
      font-size:10px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink); font-family:system-ui,sans-serif; text-underline-offset:4px; }
    /* The where control goes UNDER the clock, the way the season went under the title:
       the row has no width for a fourth item (plate 115 + clock 106 + controls 93 of
       374, and "Early summer" takes the plate to 166) but the clock's column is one
       line in a row that is already two lines tall. Same caption form as the season —
       title/season, clock/where — and the same padding trick, so the sill is no taller. */
    #clockcol{ display:block; flex:none; }
    #where{ display:block; min-width:0;
      padding:7px 0 10px; margin:-6px 0 -10px;
      font-size:10px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink); font-family:system-ui,sans-serif; text-underline-offset:4px; }
    /* A narrow sill has no room for the ticker, so a phone has neither a cursor
       nor a text surface — the two hints that the picture answers a touch. The
       one-time invitation therefore BORROWS the sill for its few seconds: the
       plate and the clock step aside, then come back. Nothing else is allowed
       through this door — see inviteHold. */
    #sill.inviting #ticker{ display:block; }
    #sill.inviting #plate, #sill.inviting #daytime{ display:none; }
    /* One offer points OUT of the sill, at the picture; the other points INTO it, at
       the season. The second cannot hide the thing it is naming while it speaks, so
       it keeps the plate and drops the TITLE instead — the season and the sentence
       about it, side by side, is the whole message, and the title is the one line
       here a first-time viewer has already read. */
    #sill.inviting.at-season #plate{ display:block; }
    #sill.inviting.at-season #title{ display:none; }
    /* ...and the evening offer keeps the CLOCK it is naming, the same way. */
    #sill.inviting.at-clock #daytime{ display:block; }
    /* ...and the where offer keeps the WHERE control, alone on the plate. */
    #sill.inviting #where{ display:none; }
    #sill.inviting.at-where #clockcol{ display:block; }
    #sill.inviting.at-where #where{ display:block; }
    #sill.naming #where{ display:none; }
    /* A phone has no cursor to follow, so the name arrives on the TAP that also acts
       and borrows the sill the same way, for a few real seconds. #naming is already
       display:block under .naming above — the ticker's hiding rule does not reach it —
       so all it needs here is the width.
       And here it WRAPS rather than ellipsising: 251 px is not enough for the longest
       label the beds can produce, the plate it stands in for is two lines high anyway,
       so two lines cost the sill nothing — and on a phone this is a caption, which is
       the one form that is allowed to run onto a second line. */
    #sill.naming #plate, #sill.naming #daytime{ display:none; }
    #sill.naming #naming{ white-space:normal; }
  }
</style>

<div id="room">
  <div id="frame">
    <canvas id="cv" aria-label="A courtyard and the lane beside it, seen from an upstairs window"></canvas>
    <div id="glass"></div>
    <div id="veil"></div>
  </div>
  <div id="sill">
    <div id="plate"><span id="title">The Courtyard<small>a cellular block</small></span><button id="season" type="button"
      title="Run on to the next season" aria-label="Run on to the next season">Spring</button></div>
    <div id="clockcol"><button id="daytime" type="button" title="Run on to this evening"
      aria-label="Run on to this evening">Day 1 &middot; Dawn</button><button id="where" type="button"
      title="Look closer at one quarter" aria-label="Look closer at one quarter">Wide</button></div>
    <div id="ticker">The courtyard is quiet. Not much here yet.</div>
    <div id="naming"></div>
    <div id="stats">0 people &middot; 0 blooms</div>
    <div id="ctrl">
      <button id="pause" aria-label="Pause simulation">Pause</button>
      <button id="speed" aria-label="Simulation speed">1&times;</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ setup ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
// canvas 2d `filter` is missing on older Safari; feature-detect once, degrade quietly
const CAN_BLUR = (() => { try { ctx.filter = 'blur(2px)'; const ok = ctx.filter !== 'none'; ctx.filter = 'none'; return ok; }
                          catch (e){ return false; } })();
const N = 64;                  // courtyard block is the left 64 columns
const GW = 138;                // full world width: courtyard, cross street, allotments, plaza, river, far bank
const WH = 88;                 // full world height incl. the lane below
const WALL = 0, PATH = 1, GRASS = 2, BED = 3, CBED = 4, TRUNK = 5, SIDE = 6, ROAD = 7, VOID = 8, WATER = 9,
      TUNNEL = 10,             // roofed passage under a building — seen through an arch
      SLOT = 11,               // open passage cut through a block — seen from above
      DECK = 12,               // the footbridge: river cells carried over by a timber span — water
                               // to the ground cache, paving to a walker, drawn live in two halves
      DIAL = 13,               // the sundial's plinth: one cell of the inner lawn nobody stands on —
                               // lawn to the ground cache, not ground to a companion, drawn live
      EYOT = 14;               // the island in the river (#87): turf with a shingle rim, land to
                               // the census and the swans, nobody's waypoint; a willow stands on it
/* the eyot: ONE ellipse, evaluated once in buildGrid() — everything else (the swans' third
 * bank, the ducks' nest, the streaks that part round it) reads the tile back off the grid.
 * Sited in the river's east half, clear of the boat's channel (x 116.5–121.5, hull ±0.5) by
 * half a cell, south of the jetty (y 35) and north of the lane bridge (64). */
const EYOT_AT = {x:124.3, y:46, rx:1.75, ry:5.0};
function eyotAt(x, y){ const dx = (x + .5 - EYOT_AT.x) / EYOT_AT.rx, dy = (y + .5 - EYOT_AT.y) / EYOT_AT.ry; return dx * dx + dy * dy < 1; }
function onEyot(x, y){ const gx = x | 0, gy = y | 0; return gx >= 0 && gy >= 0 && gx < GW && gy < WH && grid[gy * GW + gx] === EYOT; }
/* push a point on the water off the island, along the ray from the eyot's centre, until it
 * is `m` clear of the tile — a swan or a duck never sits on the turf by accident */
function offEyot(x, y, m){
  if (!onEyot(x, y)) return [x, y];
  let dx = x - EYOT_AT.x, dy = (y - EYOT_AT.y) * EYOT_AT.rx / EYOT_AT.ry, L = Math.hypot(dx, dy) || 0.01;
  dx /= L; dy /= L;
  for (let k = 0; k < 60 && onEyot(x, y); k++){ x += dx * 0.1; y += dy * 0.1 * EYOT_AT.ry / EYOT_AT.rx; }
  return [x + dx * m, y + dy * m * EYOT_AT.ry / EYOT_AT.rx];
}
/* the nearest point of the eyot's shore from (x, y): step toward the centre until the tile
 * is under foot; the step before that is the shore. [sx, sy, dist] */
function eyotShore(x, y){
  let dx = EYOT_AT.x - x, dy = EYOT_AT.y - y; const L = Math.hypot(dx, dy) || 0.01; dx /= L; dy /= L;
  let px = x, py = y;
  for (let k = 0; k < 120; k++){ const nx = px + dx * 0.1, ny = py + dy * 0.1; if (onEyot(nx, ny)) break; px = nx; py = ny; }
  return [px, py, Math.hypot(px - x, py - y)];
}
const WILLOW = {x:124.15, y:47.6};        // its foot on the island's south-west turf, over the channel side
const POND = {x:90, y:49.5, rx:4.2, ry:3.1};
const CX = 32, CY = 32.5;
const SUNDIAL = {x:32, y:35, h:0.85};   // the cell, and the gnomon's tip above the grass (a person is ~1.3)
const WALL_H = 5.6;
/* the lane */
const LN_WALK_N = 65, LN_ROAD0 = 68, LN_ROAD1 = 76, LN_WALK_S = 79; // row boundaries
const LANE_N_Y = 66.4, LANE_S_Y = 77.3;   // walking lines
/* the bridge's upstream parapet: its height, and the line people lean on it from.
 * It stood at 1.5 — a full head taller than anybody crossing — so a person on the
 * bridge read as standing at a wall. At 1.0 it is chest-high and a leaner's head
 * comes up level with the coping, which is the whole difference between standing
 * on a bridge and looking over one. */
const PARAPET_Z = 1.0, PARAPET_Y = LN_WALK_N + 0.45;
const KIOSK = {x:40.5, y:66.2};
/* the cross street (a T off the lane, running north along the courtyard's east side) */
const XS_W0 = 66, XS_R0 = 68, XS_R1 = 74, XS_E1 = 76;   // west footway, road, east footway
const XS_WALK_W = 67, XS_WALK_E = 74.9;                 // walking lines
/* the allotment gardens east of the cross street */
const ALT_X0 = 78, ALT_GATE = 86.5;
function inAllotment(x, y){ return x >= ALT_X0 && x < 96 && y >= 3 && y < 61; }
/* the river quarter: plaza, quay, river and the lane bridge */
const DIV_X0 = 96, PLAZA_X0 = 99, PLAZA_X1 = 112, QUAY_X0 = 112, RIVER_X0 = 114;
const FOUNTAIN = {x:105.5, y:30};
const PLAZA_PITS = [[100.5, 15], [108.5, 15], [100.5, 45], [108.5, 45]];
const PLAZA_BENCHES = [{x:102, y:34.2}, {x:107.6, y:23.8}];
const QUAY_BENCHES = [{x:112.1, y:18}, {x:112.1, y:46}];
/* the far bank across the river: towpath, church green, bandstand */
const RIVER_X1 = 127, TOW_X0 = 127, FAR_X0 = 130, PARK_GATE = 134;
const CHURCH = {tx0:131, tx1:134, ty0:4, ty1:8, nx0:131, nx1:136, ny0:8, ny1:17};
function churchAt(x, y){
  return (x >= CHURCH.nx0 && x < CHURCH.nx1 && y >= CHURCH.ny0 && y < CHURCH.ny1) ||
         (x >= CHURCH.tx0 && x < CHURCH.tx1 && y >= CHURCH.ty0 && y < CHURCH.ty1);
}
const BANDSTAND = {x:133.6, y:41};
const FAR_BENCHES = [{x:131.4, y:27}, {x:136, y:48}];
const ORCHARD = [[136.6,23],[136.8,31],[131.5,53],[136.4,55]];
const JETTY = {x:128.4, y:35};
const TOW_WALK = 128.6, FAR_WALK = 133.2;
/* the watermill (#78): a mill house on the church green's north end, between the nave and
 * the first orchard tree, where nothing walks (the park-gate routes all run rows 56-61).
 * The footprint is WALL in buildGrid(), so buildVolumes() grows its roof and drawFaceRow()
 * its south front; the wheel hangs over the water column west of the towpath, clear of
 * the boat's line (x 116.5-121.5) and outside every towpath walker's x. It turns off
 * riverRun() and stops as the basin skins over: fountainSkin() is the frost the river
 * already reads (riverCol/greyF), 0 outside it, 1 at midwinter. */
const MILL = {x0:130, x1:133, y0:19, y1:24};
function millAt(x, y){ return x >= MILL.x0 && x < MILL.x1 && y >= MILL.y0 && y < MILL.y1; }
const MILL_WHEEL = {x:126.35, y:21.3, r:1.25, hub:1.15};      // over the water, its foot in the current
const MILL_WIN = [131, MILL.y1 - 1];                          // the window whose lamp burns all night
const MILL_RPS = 0.9;                                         // radians per second at riverRun() 1
let millAng = 0;
function millSpin(){ return riverRun() * (1 - fountainSkin()); }
function updateMill(dt){ millAng += dt * MILL_RPS * millSpin() * (RM ? 0.3 : 1); }
/* the alley cut through the terrace between the allotments and the plaza */
const ALLEY_Y = 31;
/* the footbridge (#73): two rows of DECK across the river at the alley's latitude, so
 * alley → plaza → quay → deck → towpath is one straight line. DECK_Z is above the rower's
 * head, so the boat goes UNDER; DECK_RAMP is how far past each bank a walker climbs. */

/* ============ the band on the green ============ */

 * short is a different feature, so the span has a FLOOR and the close is pushed back
 * to meet it. No ceiling: high summer runs 7.10–18.50, and 11.4h of 17.5h daylight is
 * the same 60-odd percent of the day the market has always taken. ONE definition of

 * pack-away line in simStep().

    const xx = x + dx, yy = y + dy;
    if (xx < 0 || yy < 0 || xx >= GW || yy >= WH) continue;
    const j = yy * GW + xx;

  }

/* The allotment is laid out by buildGrid as 3x2 beds on a 5x7 lattice. That plot is

  // a companion never closes under PAIR_MIN on the leader (the two would draw as one):
  // when the leader turns and the place beside them is THROUGH them, step away instead
  // (the leader keeps walking, so a hold is still walked through)
  if (a.with){ const L = a.with, nx = a.x + dx / d * mv, ny = a.y + dy / d * mv;
    if (Math.hypot(nx - L.x, ny - L.y) < PAIR_MIN){
      let ax = a.x - L.x, ay = a.y - L.y, ad = Math.hypot(ax, ay);
      if (ad < 1e-6){ ax = -a.hy * a.side; ay = a.hx * a.side; ad = 1; }
      a.x += ax / ad * mv; a.y += ay / ad * mv; a.phase += mv * 2.2; stepDog(a, sp, dt); return; } }
  a.x += dx / d * mv; a.y += dy / d * mv;
  a.faceL = dx < 0;
  a.phase += mv * 2.2;
  const gx = Math.round(a.x - .5), gy = Math.round(a.y - .5);
  if (gx>=0 && gy>=0 && gx<GW && gy<WH){
    const j = gy*GW+gx;
    if (grid[j]===GRASS){
      wear[j] = Math.min(1, wear[j] + (a.small?0.05:0.09) * dt * 6);
      if (daisy[j] && wear[j]>0.25){ daisy[j]=0; }
      if (snowCover > 0) trod[j] = Math.min(1, trod[j] + (a.small?0.2:0.35) * dt * 6);   // feet cut a lying cover
      if (litter[j]) litter[j] = Math.max(0, litter[j] - Math.ceil(dt * (a.small ? 60 : 120)));   // and scuff the leaves (~2 s standing clears a cell)
      if (R()<dt*2) wearDirty = true;                        // pending: the tick throttles the repaint
    } else if (a.broom && snowCover > 0 && trod[j] < 1){
      trod[j] = 1; wearDirty = true;                          // the sweeper clears the strip he walks
    } else if (a.broom && litter[j]){
      litter[j] = 0; wearDirty = true;                        // and sweeps the leaves off the paving
    } else if (litter[j] && (grid[j] === ROAD || grid[j] === SIDE)){
      // #72: the street clears itself. A heap on the road or the footway is cut by the
      // traffic that uses it — faster than the lawn's scuff, and a wheel scatters what a
      // foot only treads (a cyclist crosses a cell in ~0.17 s and takes a whole leaf with
      // him). The courtyard's PATH is left to the broom, so its sums do not move. No R():
      // the repaint is asked for on a drawn-bucket change, the way landLeaf() asks
      const was = litter[j];
      litter[j] = Math.max(0, was - Math.ceil(dt * (a.cycle ? 480 : a.small ? 90 : 180)));
      if ((litter[j] / LITTER_BUCKET | 0) !== (was / LITTER_BUCKET | 0)) wearDirty = true;
    }
  }
  stepDog(a, sp, dt);
}
/* the dog trails its human. Called from the walk path AND from every beat the human
 * spends standing still, so a stopped owner never leaves a frozen dog beside them. */
function stepDog(a, sp, dt){
  if (!a.dog) return;
  const g = a.dog, ddx = a.x - g.x + Math.sin(a.phase*0.7)*1.2, ddy = a.y - g.y + 0.6;
  const dd = Math.hypot(ddx, ddy);
  if (dd > 1.2){ g.x += ddx/dd * Math.min(sp*1.3*dt, dd); g.y += ddy/dd * Math.min(sp*1.3*dt, dd); }
  g.phase += dt * 9;
}

/* ============ a passing word ============ */
/* Until now every agent moved as though alone in the town — no proximity test
 * existed anywhere, which is why the wide shot read as traffic rather than as
 * neighbours. This is the whole of their social life: on a coarse tick, two people
 * who happen to pass close may stop and talk for a few seconds. A pass over a short
 * list, axis-rejected before any hypot, and both parties then sit out a cooldown so
 * the same pair cannot chatter their way down the lane. */
/* GREET_MIN matters as much as GREET_R: a pair that stops at half a cell renders as
 * one blob, so they only pair at a distance you can read as two people. */
const GREET_DT = 0.5, GREET_R = 1.6, GREET_MIN = 0.9, GREET_P = 0.17;
let greetAcc = 0;
function chatty(a){
  return a.state === 'walk' && !a.small && !(a.listen > 0) && !(a.greet > 0) && !(a.chatCool > 0)
      && a.kind !== 'sweeper' && a.kind !== 'picnic' && !a.homer && !a.stay && !a.with;   // a companion is already with somebody   // the sweeper is working; picnic pairs arrive together; a homer is priced to a door (c90), a stayer to a post before the light goes (#89)
}
function greetPass(){
  const free = [];
  for (const a of agents){
    if (a.chatCool > 0) a.chatCool = Math.max(0, a.chatCool - GREET_DT);
    if (chatty(a)) free.push(a);
  }
  for (let i = 0; i < free.length; i++){
    const a = free[i];
    if (a.greet > 0) continue;
    for (let j = i + 1; j < free.length; j++){
      const b = free[j];
      if (b.greet > 0) continue;
      const dx = b.x - a.x; if (dx > GREET_R || dx < -GREET_R) continue;    // cheap reject, no hypot
      const dy = b.y - a.y; if (dy > GREET_R || dy < -GREET_R) continue;
      const q = dx*dx + dy*dy;
      if (q > GREET_R*GREET_R || q < GREET_MIN*GREET_MIN) continue;
      if (R() > GREET_P) continue;
      const t = (2.2 + R() * 2.8) * (raining ? 0.45 : 1);   // nobody lingers in the wet
      a.greet = b.greet = t;
      a.faceL = dx < 0; b.faceL = !a.faceL;
      a.chatCool = b.chatCool = t + 16 + R() * 10;
      if (R() < 0.12) announce(pick([
        'Two neighbours stop mid-path and fall into talk.',
        'A conversation breaks out on the lane and the walk waits for it.',
        'Someone stops someone else; hands go into pockets.',
      ]));
      break;
    }
  }
}

/* ============ lane agents ============ */
function allotCount(){ return agents.filter(g => g.kind === 'allot').length; }
function pickPlot(){
  const plots = [];
  for (let py = 8; py <= 56; py++) for (let px = 80; px <= 93; px++)
    if (grid[py * GW + px] === BED && R() < 0.05) plots.push([px, py]);
  return plots.length ? pick(plots) : [84, 22];
}
/* the walk in — through the lane gate or down the cross street — and the plot they
   kneel at. Shared by the passer-by who detours in and by the holder the ripe rows
   pull out of the town, so both arrive by a real gate onto a real bed cell. */
function sendToPlot(a){
  a.kind = 'allot';
  const gateY = pick([20, 45]);
  const fallow = digWeather() ? fallowPlots() : [];
  const plot = fallow.length ? pick(fallow) : pickPlot();
  a.dig = fallow.length > 0;                  // the winter job: turn it, don't pick it
  a.x = XS_WALK_E; a.y = -2.5;
  if (R() < 0.5){ a.x = laneEdge(); a.y = LANE_N_Y; a.wp.push([ALT_GATE, LANE_N_Y], [ALT_GATE, 62], [ALT_GATE, 58]); }
  else { a.wp.push([XS_WALK_E, gateY], [79, gateY]); }
  a.wp.push([plot[0] - 0.6, plot[1] + 0.5]);
  a.tendPlot = true; a.plot = plot;         // the plot they kneel at is the plot they pick
  if (R() < 0.4) announce(pick(['Someone hoes a fresh row in the allotments.',
    'The smell of turned earth drifts over the fence.']));
}
/* Plots standing ready. This is what sets the gardener arrival rate: the crop calls
   its own picker, so harvest is self-regulating — a bare block draws nobody, a ripe
   one draws two a day, and the allotments cannot drift to a static full block. */
function ripePlots(){
  let n = 0;
  for (let oy = 8; oy <= 50; oy += 7) for (let ox = 80; ox <= 90; ox += 5){
    let bed = 0, mt = 0;
    for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
      const i = y * GW + x;
      if (grid[i] !== BED) continue;
      bed++; if (bSt[i] === 3) mt++;
    }
    if (bed && mt >= bed - 1) n++;          // ready when all but one cell is up
  }
  return n;
}
/* The block's WINTER. ripePlots() is 0 for a quarter of the year, so the 0.01 floor sent
   nobody for ~six sim days and the plots sat bare under snow with nothing happening in
   them. On a mild, dry winter day a holder comes in to turn a fallow plot over instead —
   the same source, priced on the same roll, an additive term that is exactly 0 outside
   digWeather() so the summer rate is untouched. What gets turned is not a bare plot —
   measured, the winter block has NO bare plots (a picked row is re-sown within a day and
   stalls at stage 1 under the cap) — it is a plot under a non-hardy crop that cannot
   ripen: the dead row goes under, and turned[] holds the plot dark and unsown until the
   warmth comes back, so the spring sowing is the thing that clears it. */
const DIG_WARMTH = 0.28, DIG_SNOW = 0.3, DIG_RATE = 0.06;   // ~1.7 a winter day at one roll per sim second
function digWeather(){ return warmth < DIG_WARMTH && !raining && snowCover < DIG_SNOW; }
function fallowPlots(){                       // stalled or bare, not hardy, not ripe, not yet turned — by the lattice ripePlots() walks
  const out = [];
  for (let oy = 8; oy <= 50; oy += 7) for (let ox = 80; ox <= 90; ox += 5){
    let bed = 0, ok = true;
    for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
      const i = y * GW + x;
      if (grid[i] !== BED) continue;
      bed++; if (bSt[i] === 3 || (!bSp[i] && bAge[i] > 0) || turned[i]) ok = false;   // bAge is the fallow clock only on an EMPTY cell
    }
    if (bed && ok && !plotStands(ox, oy)) out.push([ox, oy]);
  }
  return out;
}
function turnPlot(a){
  const [ox, oy] = plotOrigin(a.plot[0], a.plot[1]);
  let n = 0;
  for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
    const i = y * GW + x;
    if (grid[i] === BED && bSt[i] < 3){ bSp[i] = 0; bSt[i] = 0; bAge[i] = 0; turned[i] = 1; n++; }
  }
  if (n){ groundDirty = true;
    if (R() < 0.5) announce(pick(['A fork goes into the cold ground; the plot comes up dark.',
      'Someone turns a plot over for the winter, a row at a time.'])); }
  return n;
}

/* ============ the evening ============ *
 * Every branch above that sets a `stop` opens with `sun &&`, and kioskOpen(),
 * marketOpen(), the band and eastOpen() all close on the sun too — so for the ~45% of
 * the clock that is dark this town had nothing on anywhere. Measured over 20 folded
 * days before this existed: 0.21 street people standing still between 22.00 and 04.00,
 * against 1.26 at midday, and all of the 0.21 was the three-second glance through the
 * arch in the final else. Two of every five viewers met the lane as a transit corridor
 * with lit windows over it.
 *
 * This is ONE place that keeps hours after dark, and it is deliberately one. The market
 * and the allotments are shut for good reasons; reopening them would only make the
 * night a dimmer day.
 *
 * ---- why it is HERE, which is budget and not scenery ---------------------------
 * A day is 55 s, so a sim hour is 2.3 s and the whole of a midsummer night is 22 s of
 * screen time. A drinker fetched from a lane edge is 36 cells — 20 s of walking each
 * way — and trip length is what sets standing population (the cap only sets inflow), so
 * they would still be outside at 03.00 whatever hour the door shut. The custom comes
 * out of the courtyard's own south arch instead, eight cells off: 4.4 s each way, and a
 * whole visit fits inside the shortest night of the year. That the door faces the
 * garden gate is the constraint arriving as an image rather than the other way round.
 */
const TAP_DOOR = 26;                 // the wall cell the door is cut in — slot 5, blank
const TAP_FACE = 64;                 // row 63's face plane, where drawFaceRow puts the fronts
/* Four places on the footway, either side of the door and never in it. Held further
 * apart than the ~0.9 cells at which two figures render as one shape (the tightest pair
 * is 1.23), clear of the lane lamp at x=28 and of the arch surround at 30.55. */
const TAP_SLOTS = [
  {x:24.60, y:65.20, taken:0}, {x:25.85, y:65.60, taken:0},
  {x:27.00, y:65.15, taken:0}, {x:29.30, y:65.45, taken:0},
];
const TAP_IN = [32.5, 62.5], TAP_MOUTH = [32.5, 64.9];   // inside the arch, and its mouth
/* The hours. Everything else in this town hangs off sunUp/sunDown and therefore SHUTS
 * as the light goes; this one opens as the light goes and shuts by the clock, at three
 * in the morning, in every season. The asymmetry is the point: the market's midwinter
 * day is its shortest and the door's is its LONGEST — ten and a half hours against
 * midsummer's eight and a half — so the year reads backwards here, which is the only
 * way this town gets a winter evening.
 *
 * TAP_EARLIEST is the market's MK_EARLIEST argument in the other direction: a pure
 * sunDown - 3 opens the winter door at 15.30 in a bright afternoon, so the constant
 * takes the later of the two. `hour` runs 6.00 -> 6.00 inside one `day`, so 18.30 ->
 * 03.00 is a single contiguous window on hourEve() and nothing `day`-derived changes
 * underneath it; the shut is at 27.0 and the day rolls at 30.0, well clear of the seam.
 *
 * TAP_LAST is #32's law paid up front. A visit is a walk of 1.9 sim-hours, a drink of
 * up to 3.5 more, and the walk back — so the door stops SENDING people 5.5 hours before
 * it shuts, and the last of them leaves on their own timer with the lamp still on. The
 * !tapOpen() lift below is a backstop that should essentially never fire, which is what
 * the probe measures rather than assumes. */
const TAP_SHUT = 27, TAP_EARLIEST = 16.5, TAP_LAST = 5.5, TAP_FADE = 1.1;
function hourEve(){ return hour < 6 ? hour + 24 : hour; }   // the evening's own axis, 6..30
function tapUp(){ return Math.max(sunDown - 3, TAP_EARLIEST); }
function tapOpen(){ return day >= 1 && hourEve() >= tapUp() && hourEve() < TAP_SHUT; }
function tapServing(){ return tapOpen() && hourEve() < TAP_SHUT - TAP_LAST; }
/* The flag is split: tapOpen() is the behaviour, tapF() is the 0..1 every draw site
 * multiplies by, so the lamp comes up and goes out over an hour instead of switching. */
function tapF(){
  if (!tapOpen()) return 0;
  const h = hourEve();
  return clamp(Math.min((h - tapUp()) / TAP_FADE, (TAP_SHUT - h) / TAP_FADE), 0, 1);
}
function tapCount(){ return agents.filter(a => a.tap).length; }
/* Its own arrival source, for the far side's reason (#22) and the audience's (#32):
 * laneCap at daylight 0 is THREE and laneRate 0.087/s, so an evening band inside
 * spawnLaneAgent() would be one drinker every few nights AND would come out of the
 * lane's own budget. It does NOT read scarcity(): POP_FLOOR already lifts the three
 * night rates when the town is thin, and a door whose custom rose because the rest of
 * the town was empty would be crediting itself with POP_FLOOR's people. */
function tapRate(){ return (0.14 + 0.34 * maturity()) * (raining ? 0.2 : 1); }
function spawnTapAgent(){

 * up on the turf: the pond's ducks are on the water at night, these are on the nest. */

    const th = R() * Math.PI * 2;

      ph:R() * 9, t:0, tx:POND.x, ty:POND.y, drake:R() < 0.5});
  }
  while (ducks.filter(d => d.eyot).length < wantEyot){

    ducks.push({x, y, ph:R() * 9, t:0, tx:x, ty:y, drake:R() < 0.5, eyot:1});

// The swans are a PAIR with three states the draw and the sill both read:
//   swim   — the cob (swans[0]) picks a stretch of river; the pen (swans[1]) picks a
//            spot 1.3–3 cells off the cob's target, so they hold together but never
//            render as one shape (the 0.9-cell law)
//   upend  — tail up, head under: the body tilts and the neck goes, 3–5 s, in place
//   preen  — at rest within SWAN_BANK of either bank, neck folded back, 5–8 s
// Each decision is one R() on the same half of [0,1) it always owned — swim stays
// the default, the two new states take a slice each; a swan too far out to preen swims
// to the bank instead, so 'preen' is what happens NEXT when it gets there.
const SWAN_BANK = 2.2, SWAN_UPEND = 0.22, SWAN_PREEN = 0.20;

function updateSwans(dt){
  const want = day >= 1 ? 2 : 0;
  while (swans.length < want){
    const c = swans[0];   // the pen arrives beside the cob, not somewhere else on the river
    swans.push(c ? {x:clamp(c.x + 1.5, RIVER_X0 + 1.6, RIVER_X1 - 1.6), y:c.y + 0.8, ph:R() * 9, t:0, tx:0, ty:0, state:'swim', hold:0}

      const nearBank = Math.min(s.x - x0, x1 - s.x, shore[2]) < SWAN_BANK;
      if (nightF > 0.6) r = SWAN_UPEND + 1e-3;   // after dark: rest by the bank (preen there, or swim to it)
      if (r < SWAN_UPEND){                                   // upend where it floats
        s.state = 'upend'; s.t = 3 + R() * 2; s.tx = s.x; s.ty = s.y;
      } else if (r < SWAN_UPEND + SWAN_PREEN && nearBank){   // preen: at rest by the bank
        s.state = 'preen'; s.t = 5 + R() * 3; s.tx = s.x; s.ty = s.y;
      } else {
        s.state = 'swim'; s.t = i === 0 ? 6 + R() * 8 : 2.5 + R() * 3;   // the pen re-reads the cob often
        if (r < SWAN_UPEND + SWAN_PREEN && r < 1){                     // wanted to preen: make for the near bank — west, east, or the eyot's shore
          const r1 = R(), r2 = R(), dw = s.x - x0, de = x1 - s.x;
          if (shore[2] < Math.min(dw, de) + SWAN_EYOT_PULL){   // the island's shore is the bank a swan prefers when it is anywhere near
            const [ex, ey] = offEyot(shore[0] + (EYOT_AT.x - shore[0]) * 0.05, shore[1] + (EYOT_AT.y - shore[1]) * 0.05, 0.25 + r1 * 0.5);
            s.tx = clamp(ex, x0, x1); s.ty = clamp(ey + (r2 - 0.5) * 1.5, 5, 58);
          } else {
            s.tx = dw < de ? x0 + r1 * 1.2 : x1 - r1 * 1.2;
            s.ty = clamp(s.y + (r2 - 0.5) * 6, 5, 58);
          }
        } else if (i === 0){                                  // the cob chooses the stretch
          s.tx = x0 + R() * (x1 - x0);

        } else {                                              // the pen keeps company
          const c = swans[0], th = R() * Math.PI * 2, rr = 1.3 + R() * 1.7;
          s.tx = clamp(c.tx + Math.cos(th) * rr, x0, x1);
          s.ty = clamp(c.ty + Math.sin(th) * rr, 5, 58);
        }
        if (onEyot(s.tx, s.ty)){ const o = offEyot(s.tx, s.ty, 0.4); s.tx = clamp(o[0], x0, x1); s.ty = clamp(o[1], 5, 58); }   // a target on the turf is a target at its shore
        if (R() < 0.03) announce('A pair of swans work their way up the river, unhurried.');

    s.hold = clamp(s.hold + (s.state === 'swim' ? -dt : dt) * 2.5, 0, 1);
    const d = Math.hypot(s.tx - s.x, s.ty - s.y);

      s.x += (s.tx - s.x) / d * Math.min(sp, d);
      s.y += (s.ty - s.y) / d * Math.min(sp, d);
      if (onEyot(s.x, s.y)) [s.x, s.y] = offEyot(s.x, s.y, 0.15);   // a swan swims round the island, not over it
    }
    if (i === 1){   // two shapes nearer than 0.9 cells read as one: the pen gives way
      const c = swans[0], dx = s.x - c.x, dy = s.y - c.y, dd = Math.hypot(dx, dy) || 0.01;
      if (dd < 0.9){ s.x = clamp(c.x + dx / dd * 0.9, x0, x1); s.y = clamp(c.y + dy / dd * 0.9, 5, 58);

const stats = { people:0, blooms:0 };
function updateWildlife(dt){
  const m = maturity(), rich = richness();
  const bloomsNow = stats.blooms;
  const wantB = raining||nightF>0.5 ? 0 : Math.min(8, Math.floor(bloomsNow/25) + (day>=2?1:0));
  while (butterflies.length < wantB) {
    const alt = R() < 0.35, bx = alt ? 86.5 : CX, by = alt ? 32 : CY;
    const th=R()*Math.PI*2, r=6+R()*(alt?7:14);
    butterflies.push({x:bx+Math.cos(th)*r, y:by+Math.sin(th)*r, z:0.8+R(), ph:R()*9, tx:0, ty:0, t:0, alt,
      col: pick(['#e8dfc8','#e8b13a','#c9762e','#d8d0e8'])});
  }
  while (butterflies.length > wantB) butterflies.pop();
  for (const b of butterflies){
    b.t -= dt;
    if (b.t <= 0){ const bx = b.alt ? 86.5 : CX, by = b.alt ? 32 : CY;
      const th=R()*Math.PI*2, r=5+R()*(b.alt?7:15); b.tx=bx+Math.cos(th)*r; b.ty=by+Math.sin(th)*r; b.t=2+R()*4; }
    b.ph += dt * (RM?6:14);
    // drift toward the flower, but never lunge at it: a butterfly can pick a target
    // 30 cells away, and a raw (tx-x)*0.5 flies it there faster than a person runs —
    // a 4-cell step in a quarter second, which sat right on the motion gate's jump
    // threshold and flipped it on any change to the random stream
    let ax = (b.tx-b.x)*0.5, ay = (b.ty-b.y)*0.5;
    const av = Math.hypot(ax, ay); if (av > 3){ ax = ax/av*3; ay = ay/av*3; }
    b.x += ax*dt + Math.sin(b.ph*0.3)*dt*2;
    b.y += ay*dt;
    b.z = 0.7 + Math.sin(b.ph*0.13)*0.35;
  }
  const wantF = (day>=3 && nightF>0.6 && !raining) ? Math.round(4+rich*8) : 0;
  while (fireflies.length < wantF){ const alt = R() < 0.35;
    const fx = alt ? 86.5 : CX, fy = alt ? 32 : CY;
    const th=R()*Math.PI*2, r=3+R()*(alt?7:13);
    fireflies.push({x:fx+Math.cos(th)*r, y:fy+Math.sin(th)*r, z:0.4+R()*1.2, ph:R()*9}); }
  while (fireflies.length > wantF) fireflies.pop();
  for (const f of fireflies){ f.ph += dt*(RM?0.8:1.6); f.x += Math.sin(f.ph*0.9)*dt*0.8; f.y += Math.cos(f.ph*0.7)*dt*0.6; }
  belfryRoost = Math.min(7, belfryRoost + dt*0.85);   // flushed pigeons drift back to the tower
  if (!raining && daylight>0.3 && birds.length < 3 && R() < dt*0.06*(0.5+m)){
    const onLane = R() < 0.4;
    const th=R()*Math.PI*2, r=6+R()*10;
    birds.push({
      x: onLane ? 8+R()*48 : CX+Math.cos(th)*r,
      y: onLane ? LN_ROAD0+1+R()*5 : CY+Math.sin(th)*r,
      z:8, state:'land', hop:0, t:0,
      col:pick(['#33302c','#5a4636','#6e6a60','#7d8089'])});
    if (R()<0.4) announce(pick(['A blackbird drops onto the lawn.', 'Pigeons strut the lane like they own the freehold.']));
  }
  for (let i=birds.length-1; i>=0; i--){
    const b = birds[i];
    if (b.state==='land'){ b.z -= dt*6; if (b.z<=0){ b.z=0; b.state='hop'; b.t=6+R()*8; } }
    else if (b.state==='hop'){
      b.t -= dt; b.hop += dt*4;
      if (Math.sin(b.hop)>0.9){ b.x += (R()-0.5)*0.8; b.y += (R()-0.5)*0.8; }
      const scare = agents.some(a => Math.hypot(a.x-b.x, a.y-b.y) < 4.5);
      if (scare || b.t<=0 || raining) b.state='fly';
    } else if (b.state==='wheel'){    // put up off the belfry by the bell: one wide turn, then away
      b.t -= dt; b.ph += dt*b.sp*(RM?0.45:1); b.ph2 += dt*(RM?3:7);
      b.r = Math.min(7, b.r + dt*(b.t>0 ? 4 : 2.2));
      b.x = b.cx + Math.cos(b.ph)*b.r;
      b.y = b.cy + Math.sin(b.ph)*b.r*0.5;
      b.z += dt*(b.t>0 ? 1.4 : 6);

  /* The rate and the ceiling both ride the season now, and the gust multiplies it
   * rather than overriding it — a January gale off bare branches sheds nothing.
   * Draw counts are UNCHANGED (one rate roll, one src, then six per leaf, pick()
   * included), because adding an R() here would reshuffle the whole seeded world. */
  const cap = gusty ? 40 : Math.round(24 * clamp(ff, 0.20, 1.70));
  if ((day>=4 || gusty) && !raining && R()<dt*(gusty?1.1:0.25*rich)*ff && leaves.length<cap && !RM){
    const src = R();
    // in spring what is in the air is petals off the beds, not leaves off the trees
    const petalCut = 0.75 - 0.30 * Math.max(leafFresh(), blossomF());
    if (src < petalCut*(2/3)){          // from the courtyard linden
      leaves.push({x:CX+(R()-0.5)*6, y:CY+(R()-0.5)*6, z:5.5+R()*2, vx:(0.6+R()*0.8+(gusty?1.2:0))*windDir(), ph:R()*9,
        col:leafCol(pick([[168,133,60],[138,154,68],[176,111,56]]), 0), leaf:1});
    } else if (src < petalCut){  // from a street tree
      leaves.push({x:pick(TREE_PITS)+0.5, y:66.9, z:3.5+R(), vx:(0.8+R()+(gusty?1.2:0))*windDir(), ph:R()*9,
        col:leafCol(pick([[138,154,68],[168,133,60]]), 1), leaf:1});
    } else {                 // a petal snatched off a bed
      leaves.push({x:6+R()*52, y:5+R()*3, z:1+R(), vx:(1+R()+(gusty?1.4:0))*windDir(), ph:R()*9,
        col:pick(['#e8a0b0','#f3b04e','#c9a0e2','#e8dfc8'])});
    }
  }
  /* #76 (c110): the fall's y-drift was one constant, so every street-tree leaf (6-8 s in
   * the air) landed in ONE road row. Each leaf now carries its own vy, folded out of the
   * ph it already drew (two fractions of one R() -> triangular on [0.15, 0.85], peaked at
   * the old 0.5), so the drift spreads over kerb, gutter and crown with row 70 still the
   * heaviest. No new draw, fall time and counts unchanged. (c109): a leaf blown off the
   * world (a westward gust off the pit at x 8) is culled at the edge, not left to fall. */
  for (let i=leaves.length-1;i>=0;i--){ const l=leaves[i];
    if (l.vy === undefined){ const u = (l.ph / 9) % 1, v = (l.ph * 1.7) % 1; l.vy = 0.5 + 0.35 * (u + v - 1); }
    l.ph+=dt*3; l.x+=l.vx*dt+Math.sin(l.ph)*dt*1.4; l.y+=dt*l.vy; l.z-=dt*0.55;
    if (l.z<=0 || l.x < LEAF_EDGE_W || l.x > LEAF_EDGE_E){ landLeaf(l); leaves.splice(i,1); } }

  if (catA){
    catA.x += catA.dir * dt * 1.6;
    if (catA.x > 66 || nightF < 0.2) catA = null;
  }
  // umbrellas go up on the approach, not on the first drop. Each walker has their own
  // patience with the sky, and the top of the band runs past 1, so roughly a third of
  // the lane never opens one at all and gets caught out.
  {
    const cm = weatherComing();
    for (const a of agents){
      // putting it away is unconditional — a walker who sat down still has to, or they
      // stay under an umbrella at a café table on a clear afternoon
      if (a.umbrella){ if (!raining && cm < 0.42) a.umbrella = false; }
      else if (a.state === 'walk' && cm > 0.62 + (a.wary ?? 0.5) * 0.55) a.umbrella = true;
    }
  }
  if (raining){
    rainLeft -= dt;
    /* A shower ends by running out of drops, not by being switched off. Over the last
     * RAIN_TAIL seconds the number of drops the sky *wants* falls to zero, and a drop
     * that reaches the bottom is simply not sent round again — so the last few are
     * still falling while the sheen comes up and the grey lifts off the frame. */
    rainFall = clamp(rainLeft / RAIN_TAIL, 0, 1);
    const want = Math.round((RM ? 40 : 110) * rainFall * showerHard());
    // f is the drop's slot, hashed once — a drop is a flake while f < snowF()
    while (raindrops.length < want) raindrops.push({x:R()*W, y:R()*H, v:520+R()*260, f:hash(raindrops.length, 97)});
    let k = 0;
    const sf = snowF();
    for (const r of raindrops){
      if (r.f < sf){ r.y += r.v*dt*0.11; r.x += Math.sin(simT*1.6 + r.v)*14*dt; }   // a flake drifts
      else { r.y += r.v*dt; r.x -= r.v*dt*0.12*windDir(); }   // #76 (c108): the slant carries the wind's sign
      // recycled across the windward edge: [0, 1.15W] under a west wind, [-0.15W, W] under an east one (exact at windDir 1, no new draw)
      if (r.y>H){ if (k >= want) continue; r.y=-12; r.x=R()*(W*1.15) + (windDir()-1)*0.075*W; }

      for (const a of agents) a.umbrella = false;               // down they come, all at once
      announce('The rain moves on. Everything smells green, and the lane shines.'); groundDirty=true; }

             && R() < dt * 0.10 * (cloudCover() - 0.66) / 0.34 * showerRate() * nightDamp()){

    frontSpent = true;                          // the front has broken: its wind drops (stepWind)
    cloudTgt = 0.92; frontLeft = Math.max(frontLeft, 24);
    announce(snowF() > 0.5 ? 'Snow drifts in over the rooftops, fat and slow.' : 'Rain drifts in across the rooftops.');
    // no sweep here any more: whoever was going to put one up already has, on the way in
  }
}

const gcv = document.createElement('canvas');

/* The pane and its mullions, drawn twice over: once dark into the cached ground layer
 * (drawBlocks runs inside drawGround, which only rebuilds on the quarter-hour light
 * bucket), and again LIVE by drawLitPanes() every frame the window is lit — so a
 * window can go out in the very frame its hour comes, not at the next rebuild with a
 * dozen others. WINDOWS[] is the register the live pass reads, filled by the cached
 * pass. The south band (rows 61-64) is drawn on ctx every frame and stays as it was. */
const WINDOWS = [];                              // [wx, wy, zTop, hgt, sa, sb] per cached window
/* #55: the same windows, and the front doors, as SCREEN boxes for the sill's naming —
 * one entry per pane drawn, painter's order, `live` for the south band (rows 61-64),
 * which drawSouthBand paints on ctx every frame and so re-registers every frame; the
 * cached ones are refilled with WINDOWS[] on a ground rebuild. Read by faceAt(). */
const FACES = [];                                // {x0,x1,y0,y1, sa,sb, door, live}
function pushFace(g, wx, wy, zTop, zBot, hw, sa, sb, door){
  const a = project(wx - hw, wy, zTop), c = project(wx + hw, wy, zBot);
  FACES.push({ x0: a[0], x1: c[0], y0: a[1], y1: c[1], sa, sb, door, live: g !== gtx });
}
function drawPane(g, wx, wy, zTop, hgt, lit){
  const w = 0.32, p = 0.76;
  const iA = project(wx - w * p, wy, zTop - hgt * 0.11), iB = project(wx + w * p, wy, zTop - hgt * 0.11);
  const iC = project(wx + w * p, wy, zTop - hgt * 0.9), iD = project(wx - w * p, wy, zTop - hgt * 0.9);

  if (lit){ LIT.push([(iA[0] + iC[0]) / 2, (iA[1] + iC[1]) / 2]); LIT_PANES.push([iA, iB, iC, iD]); }

  const h1 = project(wx - w * p, wy, zTop - hgt * 0.5), h2 = project(wx + w * p, wy, zTop - hgt * 0.5);
  g.beginPath(); g.moveTo(m1[0], m1[1]); g.lineTo(m2[0], m2[1]);

}
function drawLitPanes(){
  if (nightF <= 0.3) return;                     // daytime: nothing here, byte for byte
  for (const [wx, wy, zTop, hgt, sa, sb] of WINDOWS) if (windowLit(sa, sb)) drawPane(ctx, wx, wy, zTop, hgt, true);

function drawWindow(g, wx, wy, zTop, hgt, sa, sb){
  const w = 0.32;

  g.fillStyle = 'rgba(240,233,216,.85)'; poly(g, [a, b, c, d]); g.fill();

  const s3 = project(wx + w * 1.2, wy, zTop - hgt - 0.14), s4 = project(wx - w * 1.2, wy, zTop - hgt - 0.14);

const PLASTER = ['#cabda2', '#c8b596', '#c1bda8', '#d0c1a4', '#bcb49c', '#c9b9a4', '#c4b291'];
function drawFaceRow(g, y){
  const wt = 0.22 + 0.6 * daylight;
  for (let x = XLO; x < XHI; x++){
    const gx = clamp(x, 0, GW - 1);
    if (!solidM[y * GW + gx] || solidC(x, y + 1)) continue;
    const out = x !== gx;
    const house = Math.floor((gx + 1) / 3.5);                 // the terrace is separate houses
    const zL = roofZ(x, y + 1), zR = roofZ(x + 1, y + 1);
    const a = project(x, y + 1, 0), b = project(x + 1, y + 1, 0);
    const c = project(x + 1, y + 1, zR), d = project(x, y + 1, zL);
    const pl = PLASTER[(hash(house, y * 3) * PLASTER.length) | 0];
    const gr = g.createLinearGradient(0, d[1], 0, a[1]);
    let hi = mix('#3f3a33', pl, clamp(wt + 0.16, 0, 1));
    let lo = mix('#302b25', mix(pl, '#6f6552', 0.4), clamp(wt + 0.06, 0, 1));
    if (out){ hi = mix(hi, HAZE, 0.55); lo = mix(lo, HAZE, 0.55); }
    gr.addColorStop(0, hi); gr.addColorStop(1, lo);
    g.fillStyle = gr; poly(g, [d, c, b, a]); g.fill();
    if (out) continue;
    if (hash(house, y * 5) > 0.72){                           // some fronts are brick
      g.strokeStyle = 'rgba(120,96,74,.16)'; g.lineWidth = 0.7;
      for (let z = 0.35; z < Math.min(zL, zR); z += 0.42){
        const q1 = project(x, y + 1, z), q2 = project(x + 1, y + 1, z);
        g.beginPath(); g.moveTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.stroke();
      }
    }
    g.strokeStyle = 'rgba(40,32,24,.18)'; g.lineWidth = 1;    // party wall between houses
    if (Math.floor((gx + 2) / 3.5) !== house){
      g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.stroke();
    }
    g.fillStyle = 'rgba(24,18,12,.16)';                       // ground line, so walls sit rather than float
    const gl1 = project(x, y + 1, 0.16), gl2 = project(x + 1, y + 1, 0.16);
    poly(g, [gl1, gl2, b, a]); g.fill();
    const e = Math.min(zL, zR);
    if (millAt(gx, y)){
      if (gx === MILL_WIN[0]) drawWindow(g, x + 0.5, y + 1, e * 0.8, e * 0.3, MILL_WIN[0], MILL_WIN[1]);
      else if (gx === MILL.x1 - 1) drawFrontDoor(g, x, y, e * 0.36, -1, -1);
      continue;
    }
    if (churchAt(gx, y) || e < 2.4) continue;
    const slot = ((gx % 7) + 7) % 7;
    if ((slot === 1 || slot === 4) && hash(gx, y * 7) > 0.12){
      drawWindow(g, x + 0.5, y + 1, e * 0.86, e * 0.30, gx, y);
      if (e > 4.2 && hash(gx, y * 9) > 0.2) drawWindow(g, x + 0.5, y + 1, e * 0.48, e * 0.28, gx, y + 40);
      if (homeDoorAt(gx, y)) drawFrontDoor(g, x, y, e * 0.34 * 0.86, gx, y);   // the door somebody comes home to
    } else if (slot === 6 && hash(gx, y * 13) > 0.45){
      drawFrontDoor(g, x, y, e * 0.34, -1, -1);
    }
  }
}
function drawFrontDoor(g, x, y, dh, sa, sb){
  const dw = 0.34;
  pushFace(g, x + 0.5, y + 1, dh, 0, dw, sa, sb, true);
  const p1 = project(x + 0.5 - dw, y + 1, dh), p2 = project(x + 0.5 + dw, y + 1, dh);
  const p3 = project(x + 0.5 + dw, y + 1, 0), p4 = project(x + 0.5 - dw, y + 1, 0);
  g.fillStyle = 'rgba(238,231,214,.75)'; poly(g, [p1, p2, p3, p4]); g.fill();
  const q1 = project(x + 0.5 - dw * 0.72, y + 1, dh * 0.92), q2 = project(x + 0.5 + dw * 0.72, y + 1, dh * 0.92);
  const q3 = project(x + 0.5 + dw * 0.72, y + 1, 0), q4 = project(x + 0.5 - dw * 0.72, y + 1, 0);
  g.fillStyle = ['#4a5f5a', '#6b3f38', '#3d4a63', '#5a4a34'][(hash(x, 17) * 4) | 0];
  poly(g, [q1, q2, q3, q4]); g.fill();
  g.fillStyle = '#d8c98a';
  g.beginPath(); g.arc(q2[0] - 2, (q2[1] + q3[1]) / 2, 1.2, 0, 7); g.fill();
}
function drawBlocks(g, y0, y1){
  for (let y = y0; y < y1; y++){
    drawFaceRow(g, y);
    drawRoofRow(g, y);
    drawCrests(g, y);
    if (y === 2) drawClockTower(g);
    if (y === CHURCH.ty1 - 1) drawChurchTower(g);
    if (y === CHURCH.ny1 - 1) drawChurchFront(g);
  }
}

/* ============ the clock tower, standing on the sliver's roofline ============ */
const CT = {x0:63.8, x1:66.2, yF:3, yB:1.1, base:5.4, top:13.0};
function towerFace(g, x0, x1, y, z0, z1, c0, c1){
  const a = project(x0, y, z1), b = project(x1, y, z1), c = project(x1, y, z0), d = project(x0, y, z0);
  const gr = g.createLinearGradient(a[0], 0, b[0], 0);
  gr.addColorStop(0, SUN[0] > 0 ? c0 : c1); gr.addColorStop(1, SUN[0] > 0 ? c1 : c0);

}
function towerTop(g, x0, x1, yF, yB, z, col){    // a horizontal ledge, which is what sells the depth
  const a = project(x0, yB, z), b = project(x1, yB, z), c = project(x1, yF, z), d = project(x0, yF, z);

function drawClockTower(g){

  g.strokeStyle = 'rgba(58,50,38,.45)'; g.lineWidth = 1;
  poly(g, [project(x0, yF, top), project(x1, yF, top), project(x1, yF, base), project(x0, yF, base)]); g.stroke();
  // string courses, each with a visible top ledge

    towerFace(g, x0 - 0.1, x1 + 0.1, yF + 0.1, z, z + 0.24, '#8a7d64', '#c0b295');

  g.fillStyle = '#efe7d2'; g.beginPath(); g.arc(ccx, ccy, rr, 0, 7); g.fill();
  g.strokeStyle = '#4a4034'; g.lineWidth = 1.4; g.beginPath(); g.arc(ccx, ccy, rr, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(74,64,52,.8)'; g.lineWidth = 1;

    g.moveTo(ccx + Math.cos(th) * rr * 0.84, ccy + Math.sin(th) * rr * 0.84);
    g.lineTo(ccx + Math.cos(th) * rr * 0.96, ccy + Math.sin(th) * rr * 0.96); g.stroke();
  }

  const bl = project(x0 + 0.55, yF, 12.5), br = project(x1 - 0.55, yF, 12.5);

  g.fillStyle = '#2a251d'; poly(g, [bl, br, bb2, bb]); g.fill();
  g.strokeStyle = 'rgba(150,138,116,.7)'; g.lineWidth = 1;
  for (let k = 1; k < 6; k++){
    const z = 11.2 + k * 0.22;

  const apex = project((x0 + x1) / 2, (yF + yB) / 2, top + 3.4);
  const c1 = project(x0 - 0.2, yF + 0.2, top), c2 = project(x1 + 0.2, yF + 0.2, top);

/* ============ the weathervanes (#83) ============
 * Two vanes, one on each tower, the whole width of the town apart, and they agree:
 * the arrow points INTO the wind. Heading 0 is the old static arrow (east, +x on
 * screen), which is also where an east wind (windSign -1) holds it; a west wind
 * (windSign +1, the town's +x lean) swings it through north to the west, linearly in
 * windF() — the same blend windDir() is, so a sign latched from calm never steps a
 * frame and calm is exactly the old drawing. In a calm the arrow drifts a few degrees
 * on a slow sine phased by the tower's own cell hash; a full wind pins it. The
 * towers are in the ground cache, so the arrow is drawn live beside the clock
 * hands (the rose window's model, #81): projected per frame, under applyLight. */
const VANES = [
  {x:(CT.x0 + CT.x1) / 2, y:(CT.yF + CT.yB) / 2, z:CT.top + 4.8, len:5, fin:2},
  {x:(CHURCH.tx0 + CHURCH.tx1) / 2, y:(CHURCH.ty1 + CHURCH.ty0 + 0.2) / 2, z:13.6 + 10.3, len:4, fin:1.6},
];
const VANE_WOB = 0.14;                                  // ~8 degrees of calm drift
function vaneWob(v){ return RM ? 0 : Math.sin(simT * 0.6 + hash(v.x, v.y) * 6.283) * VANE_WOB * (1 - windF()); }
function vaneAngle(v){ return Math.PI * (windSign + 1) * 0.5 * windF() + vaneWob(v); }   // 0 east ... PI west, into the wind
function drawVanes(){
  for (const v of VANES){
    const th = vaneAngle(v), c = project(v.x, v.y, v.z), cy = c[1] + 3;
    const ex = project(v.x + 1, v.y, v.z), ey = project(v.x, v.y + 1, v.z);
    const sx = ex[0] - c[0];                                // screen px per world x at the vane
    // the heading in the ground plane, as seen: (cos, -sin) in world x,y -> screen
    const ux = (Math.cos(th) * sx - Math.sin(th) * (ey[0] - c[0])) / sx;
    const uy = (-Math.sin(th) * (ey[1] - c[1])) / sx;
    const tx = c[0] + v.len * ux, ty = cy + v.len * uy, bx = c[0] - v.len * ux, by = cy - v.len * uy;
    ctx.fillStyle = '#4a4238';
    poly(ctx, [[bx, by - v.fin], [tx, ty], [bx, by + v.fin]]); ctx.fill();   // a vertical plate: fins up and down
  }
}

/* ============ the church across the river ============ */
function drawChurchTower(g){
  const x0 = CHURCH.tx0 + 0.15, x1 = CHURCH.tx1 - 0.15, yF = CHURCH.ty1, yB = CHURCH.ty0 + 0.2;

  for (const z of [base + 2.2, base + 5.2]){
    towerFace(g, x0 - 0.12, x1 + 0.12, yF + 0.12, z, z + 0.22, '#867e6c', '#bdb59d');

  const s3 = project(x1 - 0.25, yB, top + 0.2), s4 = project(x0 + 0.25, yB, top + 0.2);
  g.fillStyle = mix('#3f444a', '#78808a', 0.28 + 0.5 * daylight); poly(g, [s1, s2, apex]); g.fill();
  g.fillStyle = mix('#2f343a', '#5b626b', 0.28 + 0.5 * daylight); poly(g, [s2, s3, apex]); g.fill();
  g.fillStyle = mix('#353a41', '#666e78', 0.28 + 0.5 * daylight); poly(g, [s4, s1, apex]); g.fill();
  g.strokeStyle = 'rgba(214,220,228,.3)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(s1[0], s1[1]); g.lineTo(apex[0], apex[1]);
  g.moveTo(s2[0], s2[1]); g.lineTo(apex[0], apex[1]); g.stroke();

}
function drawChurchFront(g){

function drawSill(g){

  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, sy + 2.2, W, 3);

    const pw = u * 1.5 * s, ph = u * 1.25 * s;

    g.fillStyle = silh;

      const a2 = -Math.PI / 2 + (k / 8 - 0.5) * 2.5;
      const r2 = u * (1.4 + hash(k, px | 0) * 1.5) * s;
      const lx = px + Math.cos(a2) * r2, ly = sy - ph + Math.sin(a2) * r2 * 0.85;
      g.beginPath(); g.ellipse(lx, ly, u * 0.42 * s, u * 0.3 * s, a2, 0, 7); g.fill();
    }

  g.lineTo(cx2 + cw * 0.7, sy + 2); g.lineTo(cx2 - cw * 0.7, sy + 2);
