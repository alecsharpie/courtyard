<meta charset="utf-8">
<title>The Courtyard</title>
<style>
  :root{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  @media (prefers-color-scheme: light){
    :root{ --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
      --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
      --glass-shine:rgba(255,255,255,.10); }
  }
  :root[data-theme="dark"]{
    --room:#171310; --room2:#211b15; --frame:#3a2c1e; --frame-hi:#5a4530;
    --ink:#d8cfc0; --ink-dim:#9a8f7d; --accent:#c9b894;
    --glass-shine:rgba(255,255,255,.022);
  }
  :root[data-theme="light"]{
    --room:#ece5d8; --room2:#e2d9c8; --frame:#6b5236; --frame-hi:#8a6f4e;
    --ink:#3a3126; --ink-dim:#8a7d68; --accent:#7a6647;
    --glass-shine:rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:radial-gradient(120% 100% at 50% 0%, var(--room2), var(--room) 70%);
    color:var(--ink); font-family:system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #room{ display:flex; flex-direction:column; width:min(100vw, 1280px); height:100vh; padding:clamp(8px,2vh,22px) clamp(8px,2vw,26px); }
  #frame{
    position:relative; flex:1; min-height:0;
    border:10px solid var(--frame);
    border-top-color:var(--frame-hi);
    border-radius:6px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.55), 0 18px 50px rgba(0,0,0,.35);
    background:#0d1410; overflow:hidden;
  }
  /* The default cursor is the ARROW, not a crosshair: the canvas swaps it for a
     pointer over exactly the cells the click handler will answer, and a crosshair
     everywhere would spend that contrast before it is used. See answersTouch(). */
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:default; }
  #glass{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(115deg, transparent 44%, var(--glass-shine) 48%, transparent 52%),
      radial-gradient(140% 120% at 50% 45%, transparent 66%, rgba(0,0,0,.38) 100%);
  }
  #sill{
    flex:none; display:flex; align-items:baseline; gap:18px;
    padding:12px 6px 4px; font-size:13px; color:var(--ink-dim);
  }
  /* flex:none on every nowrap item. They are all white-space:nowrap, so a flex box
     that shrinks below its text does not clip or ellipsis it — it SPILLS, silently,
     over its neighbour. #ticker (flex:1, min-width:0) is the only item allowed to
     take up the slack, because it is the only one with text-overflow. */
  #plate{ font-family:"Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    flex:none; display:flex; align-items:baseline; gap:18px;
    font-size:17px; color:var(--ink); letter-spacing:.02em; white-space:nowrap; }
  #plate small{ display:block; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim); font-family:system-ui,sans-serif; margin-top:1px;}
  /* The season is prose, so it is set in the plate's serif and not the clock's sans:
     the sill reads title · season · clock · ticker · counts, coarse to fine, and the
     two serif items are the two that SPEAK (one fixed, one changing) while the two
     tabular ones are the two that COUNT. min-width holds the longest name so the
     clock beside it never slides when the year turns.
     It lives INSIDE #plate rather than beside it so the narrow breakpoint can drop it
     onto the caption line without reparenting — see the media query.
     And it is a BUTTON, because the year is 26 sim days — 24 real minutes at 1x —
     and the one thing in the sill that names the season is also the most obvious
     place to ask for another one. See beginSkip(). It carries a chevron at all
     times rather than only on hover: a phone has no hover, and this is the one
     control in the row that does not already look like a control.
     ...and it is UNDERLINED, because the chevron alone was carrying the whole
     affordance: half-opacity punctuation at the end of a serif word, in a row of
     serif words. An underline is the one mark that says "press this" inside running
     prose without turning the label into a chip and fighting the plate's
     typography. The rule stops at the WORD — ::after is an inline-block, and
     text-decoration does not propagate into one — so the chevron stays a chevron
     instead of becoming a tail on the line. The padding is the hit area (a 14px
     label is a 17px target); the equal negative margin gives every pixel of it
     back to the layout, so the sill is the same height it was. */
  #season{ flex:none; font-size:14px; font-family:inherit;
    color:var(--ink); letter-spacing:.02em; white-space:nowrap; min-width:10.5ch;
    background:transparent; border:0; padding:5px 0; margin:-5px 0; text-align:left;
    cursor:pointer; transition:color .25s;
    text-decoration:underline; text-decoration-color:var(--ink-dim);
    text-decoration-thickness:1px; text-underline-offset:3px; }
  #season::after{ content:'\2009\203A'; display:inline-block; opacity:.6; }
  #season:hover{ text-decoration-color:var(--accent); }
  #season:hover, #season:hover::after{ color:var(--accent); opacity:1; }
  #season:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  #season[disabled]{ cursor:default; opacity:.55; }
  /* The reduced-motion path's honest cut: a lapse of six sunrises in six seconds is
     precisely the thing prefers-reduced-motion is asking not to be shown, so under it
     the same advance is delivered behind this instead. It is the only thing in the
     frame allowed over the glass. */
  #veil{ position:absolute; inset:0; pointer-events:none; background:var(--room);
    opacity:0; transition:opacity .38s ease; }
  #veil.on{ opacity:1; }
  #daytime{ flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:12ch; }
  #ticker{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:"Iowan Old Style", Palatino, Georgia, serif; font-style:italic; font-size:14px;
    color:var(--ink); opacity:.9; transition:opacity .6s; }
  #ticker.fade{ opacity:.35; }
  /* The naming — what the pointer is on — borrows the TICKER's box rather than adding
     a seventh item to a row that was already tight at 641px (see #stats yielding
     below 860). Same slot, same serif, but UPRIGHT and with no full stop: the ticker
     is prose the town says, this is a label for a thing, and the sill's other two
     labels (title, season) are upright too. It never covers a line that has not been
     read — see updateNaming. */
  #naming{ display:none; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-family:"Iowan Old Style", Palatino, Georgia, serif;
    font-size:14px; color:var(--ink); letter-spacing:.01em; }
  #sill.naming #ticker{ display:none; }
  #sill.naming #naming{ display:block; }
  #stats{ flex:none; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #ctrl{ flex:none; display:flex; gap:6px; }
  #ctrl button{
    font:inherit; font-size:12px; color:var(--ink); background:transparent;
    border:1px solid var(--ink-dim); border-radius:4px; padding:2px 9px; cursor:pointer;
  }
  #ctrl button:hover{ border-color:var(--accent); color:var(--accent); }
  #ctrl button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  /* The season is a sixth item in a fixed-width row, and the row was already tight in
     the 640-860 band: on HEAD the ticker was down to 71px of box at 641px, ellipsised
     to nothing. So the COUNTS yield first. They are the most expendable thing here —
     people and blooms and ducks are all visible in the picture above, whereas which
     season it is was the one fact the sill could not tell you. Net effect in this band
     is a season gained and a ticker that reads BETTER than it did (126px at 641,
     253px at 768, against HEAD's 71 and 193). */
  @media (max-width:860px){
    #stats{ display:none; }
    /* In this band the ticker's box is down to 136 px at 641, and the label is the one
       item here that is answering a hand. So the CLOCK yields to it as well, for as long
       as the pointer is on something — the hour is legible in the picture (the sun is in
       it), and it comes back the moment the pointer leaves. */
    #sill.naming #daytime{ display:none; }
  }
  @media (max-width:640px){
    #ticker,#stats{ display:none; }
    /* The narrow row has ~32px of slack and the season wants ~80, so it comes OUT of
       the row and onto the plate's second line — the caption slot, which on a phone
       was empty anyway ("a cellular block" has always been hidden here). Costs zero
       horizontal width, and the label ends up in its truest form: a title with the
       season set under it. Which season it is outranks a subtitle on a 390px screen. */
    #plate{ display:block; }
    #title{ display:block; }
    #plate small{ display:none; }
    /* In the caption slot it was also the LEAST pressable thing in the sill: 10px
       of dim uppercase, set exactly like the subtitle it displaced. So here it takes
       the full ink (a caption is grey; a control is not), keeps the underline, and
       spreads its hit area over the whole width of the line and down into the sill's
       bottom padding — a 12px cap-line becomes a ~29px target with no cursor to help
       it. Padding and margin cancel to the +1px this line always contributed, so the
       plate is the same height and the picture above it does not resize. */
    #season{ display:block; min-width:0;
      padding:7px 0 10px; margin:-6px 0 -10px;
      font-size:10px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink); font-family:system-ui,sans-serif; text-underline-offset:4px; }
    /* A narrow sill has no room for the ticker, so a phone has neither a cursor
       nor a text surface — the two hints that the picture answers a touch. The
       one-time invitation therefore BORROWS the sill for its few seconds: the
       plate and the clock step aside, then come back. Nothing else is allowed
       through this door — see inviteHold. */
    #sill.inviting #ticker{ display:block; }
    #sill.inviting #plate, #sill.inviting #daytime{ display:none; }
    /* One offer points OUT of the sill, at the picture; the other points INTO it, at
       the season. The second cannot hide the thing it is naming while it speaks, so
       it keeps the plate and drops the TITLE instead — the season and the sentence
       about it, side by side, is the whole message, and the title is the one line
       here a first-time viewer has already read. */
    #sill.inviting.at-season #plate{ display:block; }
    #sill.inviting.at-season #title{ display:none; }
    /* A phone has no cursor to follow, so the name arrives on the TAP that also acts
       and borrows the sill the same way, for a few real seconds. #naming is already
       display:block under .naming above — the ticker's hiding rule does not reach it —
       so all it needs here is the width.
       And here it WRAPS rather than ellipsising: 251 px is not enough for the longest
       label the beds can produce, the plate it stands in for is two lines high anyway,
       so two lines cost the sill nothing — and on a phone this is a caption, which is
       the one form that is allowed to run onto a second line. */
    #sill.naming #plate, #sill.naming #daytime{ display:none; }
    #sill.naming #naming{ white-space:normal; }
  }
</style>

<div id="room">
  <div id="frame">
    <canvas id="cv" aria-label="A courtyard and the lane beside it, seen from an upstairs window"></canvas>
    <div id="glass"></div>
    <div id="veil"></div>
  </div>
  <div id="sill">
    <div id="plate"><span id="title">The Courtyard<small>a cellular block</small></span><button id="season" type="button"
      title="Run on to the next season" aria-label="Run on to the next season">Spring</button></div>
    <div id="daytime">Day 1 &middot; Dawn</div>
    <div id="ticker">The courtyard is quiet. Not much here yet.</div>
    <div id="naming"></div>
    <div id="stats">0 people &middot; 0 blooms</div>
    <div id="ctrl">
      <button id="pause" aria-label="Pause simulation">Pause</button>
      <button id="speed" aria-label="Simulation speed">1&times;</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ setup ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
// canvas 2d `filter` is missing on older Safari; feature-detect once, degrade quietly
const CAN_BLUR = (() => { try { ctx.filter = 'blur(2px)'; const ok = ctx.filter !== 'none'; ctx.filter = 'none'; return ok; }
                          catch (e){ return false; } })();
const N = 64;                  // courtyard block is the left 64 columns
const GW = 138;                // full world width: courtyard, cross street, allotments, plaza, river, far bank
const WH = 88;                 // full world height incl. the lane below
const WALL = 0, PATH = 1, GRASS = 2, BED = 3, CBED = 4, TRUNK = 5, SIDE = 6, ROAD = 7, VOID = 8, WATER = 9,
      TUNNEL = 10,             // roofed passage under a building — seen through an arch
      SLOT = 11;               // open passage cut through a block — seen from above
const POND = {x:90, y:49.5, rx:4.2, ry:3.1};
const CX = 32, CY = 32.5;
const WALL_H = 5.6;
/* the lane */
const LN_WALK_N = 65, LN_ROAD0 = 68, LN_ROAD1 = 76, LN_WALK_S = 79; // row boundaries
const LANE_N_Y = 66.4, LANE_S_Y = 77.3;   // walking lines
/* the bridge's upstream parapet: its height, and the line people lean on it from.
 * It stood at 1.5 — a full head taller than anybody crossing — so a person on the
 * bridge read as standing at a wall. At 1.0 it is chest-high and a leaner's head
 * comes up level with the coping, which is the whole difference between standing
 * on a bridge and looking over one. */
const PARAPET_Z = 1.0, PARAPET_Y = LN_WALK_N + 0.45;
const KIOSK = {x:40.5, y:66.2};
/* the cross street (a T off the lane, running north along the courtyard's east side) */
const XS_W0 = 66, XS_R0 = 68, XS_R1 = 74, XS_E1 = 76;   // west footway, road, east footway
const XS_WALK_W = 67, XS_WALK_E = 74.9;                 // walking lines
/* the allotment gardens east of the cross street */
const ALT_X0 = 78, ALT_GATE = 86.5;
function inAllotment(x, y){ return x >= ALT_X0 && x < 96 && y >= 3 && y < 61; }
/* the river quarter: plaza, quay, river and the lane bridge */
const DIV_X0 = 96, PLAZA_X0 = 99, PLAZA_X1 = 112, QUAY_X0 = 112, RIVER_X0 = 114;
const FOUNTAIN = {x:105.5, y:30};
const PLAZA_PITS = [[100.5, 15], [108.5, 15], [100.5, 45], [108.5, 45]];
const PLAZA_BENCHES = [{x:102, y:34.2}, {x:107.6, y:23.8}];
const QUAY_BENCHES = [{x:112.1, y:18}, {x:112.1, y:46}];
/* the far bank across the river: towpath, church green, bandstand */
const RIVER_X1 = 127, TOW_X0 = 127, FAR_X0 = 130, PARK_GATE = 134;
const CHURCH = {tx0:131, tx1:134, ty0:4, ty1:8, nx0:131, nx1:136, ny0:8, ny1:17};
function churchAt(x, y){
  return (x >= CHURCH.nx0 && x < CHURCH.nx1 && y >= CHURCH.ny0 && y < CHURCH.ny1) ||
         (x >= CHURCH.tx0 && x < CHURCH.tx1 && y >= CHURCH.ty0 && y < CHURCH.ty1);
}
const BANDSTAND = {x:133.6, y:41};
const FAR_BENCHES = [{x:131.4, y:27}, {x:136, y:48}];
const ORCHARD = [[136.6,23],[136.8,31],[131.5,53],[136.4,55]];
const JETTY = {x:128.4, y:35};
const TOW_WALK = 128.6, FAR_WALK = 133.2;
/* the alley cut through the terrace between the allotments and the plaza */
const ALLEY_Y = 31;

let W = 0, H = 0, DPR = 1, cellW = 12, cellH = 8, topPad = 40, originX = 0;
const PINCH = 0.11;
const LIFT = 1.15;

let FOCUS = GW / 2;
function project(wx, wy, wz){
  // the pinch keys off screen depth, not world depth, so anything standing up
  // still lines up exactly with the ground beside it — no seams along walls
  const d = wy - (wz || 0) * LIFT;
  const p = 1 - PINCH * (1 - d / WH);
  return [ originX + (wx - FOCUS) * cellW * p, topPad + d * cellH ];
}
function unproject(sx, sy){
  const wy = (sy - topPad) / cellH;
  const p = 1 - PINCH * (1 - wy / WH);
  const wx = (sx - originX) / (cellW * p) + FOCUS;
  return [wx, wy];
}
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR;
  const fitW = W / GW, fitH = (H - 16) / ((WH + 10.5) * 0.70);
  if (fitH > fitW * 1.5){                         // tall, narrow window: lean in rather than shrink away
    cellW = Math.min(fitH, fitW * 2.1); FOCUS = 54;
  } else {
    cellW = Math.min(fitW, fitH); FOCUS = GW / 2;
  }
  cellH = cellW * 0.70;
  topPad = 4 + 9.6 * cellH;                       // headroom for sky, distant hills and spires
  const spare = H - (topPad + WH * cellH + 6);
  if (spare > 0) topPad += spare * (spare > 12 * cellH ? 0.5 : 0.82);
  originX = W / 2;
  groundDirty = true;
}
addEventListener('resize', resize);
/* The window is not the only thing that resizes the picture. The sill grows and shrinks
 * under it — a borrowed sill is one line where the plate was two — and every one of
 * those changes moves the frame without a `resize` event. The canvas then stretches its
 * unchanged bitmap over a taller box: 16 px at 390 px wide, a 2% vertical scale, which
 * is invisible in the picture and NOT invisible to the pointer, because unproject() is
 * still working in the old geometry and lands two cells out at the bottom of the frame.
 * So the frame itself is observed. (The invitation has borrowed the sill this way since
 * #24; nothing read a screen POSITION back then, so nothing noticed.) */
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement);

/* ============ noise & utils ============ */
function hash(x, y){
  let n = (x * 374761393 + y * 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
/* Randomness. Unseeded by default, so the live diorama keeps its natural drift.
 * `?seed=N` swaps in a deterministic xorshift so the grow-courtyard census can
 * diff two builds of the town without the noise drowning the signal. Any new
 * random draw MUST go through R() (or hash(x,y) for per-cell decisions) — a bare
 * Math.random() is invisible to the seed and makes the census lie. */
let R = Math.random, SEED = null;
function makeR(seed){
  let s = ((seed | 0) >>> 0) || 1;
  return function(){ s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
{ const q = new URLSearchParams(location.search);
  if (q.has('seed')){ SEED = +q.get('seed') | 0; R = makeR(SEED); } }
/* Rewind the PRNG to its starting state. The census needs this because an unknown
 * number of animation frames run between page load and the first measurement, and
 * a draw pass may consume draws — rewinding makes the warped sim a pure function
 * of (seed, seconds) again. No-op on an unseeded (live) page. */
window.__reseed = function(n){ if (SEED === null && n === undefined) return false; R = makeR(n === undefined ? SEED : n); return true; };
function pick(a){ return a[(R() * a.length) | 0]; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function cparse(c){
  if (c[0] === '#'){ const v = parseInt(c.slice(1),16); return [v>>16, (v>>8)&255, v&255]; }
  const m = c.match(/\d+/g); return [+m[0], +m[1], +m[2]];
}
function mix(c1, c2, t){
  const a = cparse(c1), b = cparse(c2);
  return 'rgb(' + (lerp(a[0],b[0],t)|0) + ',' + (lerp(a[1],b[1],t)|0) + ',' + (lerp(a[2],b[2],t)|0) + ')';
}

/* ============ courtyard geometry (unchanged from the garden you know) ============ */
function wallR(th){ return 27.5 / Math.max(Math.abs(Math.cos(th)), Math.abs(Math.sin(th))); }
function gR(th){
  const raw = 17.2 + 2.3*Math.sin(2*th+1.3) + 1.5*Math.sin(3*th+4.1) + 0.8*Math.sin(5*th+2.2);
  return Math.min(raw, wallR(th) - 5.5);
}
function bedIn(th){ return 4.6 + 0.6*Math.sin(3*th+1.0); }
function bedOut(th){ return bedIn(th) + 2.8 + 0.4*Math.sin(2*th+2.6); }
function bedGap(th){ return Math.cos(th - 0.5) > 0.90 || Math.cos(th - (Math.PI + 1.1)) > 0.90; }

const grid = new Uint8Array(GW * WH);
const wear = new Float32Array(GW * WH);
const daisy = new Uint8Array(GW * WH);
const bSp = new Uint8Array(GW * WH), bSt = new Uint8Array(GW * WH), bAge = new Float32Array(GW * WH);

const SPECIES = [
  {name:'marigolds', col:'#e0913a', col2:'#f3b04e', h:0.55, style:'dot',   minDay:0},
  {name:'poppies',   col:'#c24a3a', col2:'#d96a52', h:0.75, style:'dot',   minDay:0},
  {name:'lavender',  col:'#8f7fd4', col2:'#a795e2', h:0.85, style:'spike', minDay:1},
  {name:'ferns',     col:'#4f7a3d', col2:'#61924b', h:0.6,  style:'bush',  minDay:0},
  {name:'daylilies', col:'#d9a13c', col2:'#e8bb5a', h:0.9,  style:'spike', minDay:2},
  {name:'roses',     col:'#cf6f96', col2:'#e18cab', h:1.15, style:'bush',  minDay:3},
  {name:'salvia',    col:'#4a5fb0', col2:'#6379c9', h:0.8,  style:'spike', minDay:2},
  /* allotment vegetables */
  {name:'carrots',   col:'#5f8a3c', col2:'#e07b28', h:0.4,  style:'spike', minDay:0, veg:1},
  // `hardy` = stands the cold: the plot keeps the full ceiling when bloomCap() drops.
  // Only the brassica. Beans and pumpkins are the first things a frost takes, and
  // carrots being hardy too would leave half the block ripening in January.
  {name:'cabbages',  col:'#7f9a5d', col2:'#a3b876', h:0.35, style:'bush',  minDay:0, veg:1, hardy:1},
  {name:'beans',     col:'#4f7a3d', col2:'#d9c04a', h:1.1,  style:'spike', minDay:1, veg:1},
  {name:'pumpkins',  col:'#6a8a44', col2:'#d9822b', h:0.4,  style:'bush',  minDay:3, veg:1},
];
function speciesFor(x, y){
  const veg = inAllotment(x, y);
  return SPECIES.filter(s => s.minDay <= day && !s.veg === !veg);
}

function nearEntrance(x, y){
  const cxr = Math.abs(x + .5 - 32.5), cyr = Math.abs(y + .5 - 32.5);
  if (cxr < 2.3 && (y < 8 || y > 56)) return true;
  if (cyr < 2.3 && (x < 8 || x > 56)) return true;
  return false;
}
const BENCH_SPOTS = [
  {x:20, y:6}, {x:45, y:6},
  {x:6,  y:44}, {x:57, y:22},
];
const LANE_BENCHES = [ {x:12, y:65.6}, {x:52, y:65.6} ];

buildGrid();

/* ============ building volumes ============

  if (x >= 64 && x < 66) return 6.3;                   // the sliver the clock tower stands on

  if (y < 3) return x >= FAR_X0 ? 6.2 : 5.8;

  for (let y = 0; y < WH; y++) for (let x = 0; x < GW; x++){

    eaveM[i] = solidM[i] ? eaveFor(x, y) : 0;

  const BIG = 1e4, C = [[-1,-1],[0,-1],[-1,0],[0,0]];

    if (vx > 0) d = Math.min(d, vD[i-1] + 1);
    if (vy > 0) d = Math.min(d, vD[i-VW] + 1);
    if (vx > 0 && vy > 0) d = Math.min(d, vD[i-VW-1] + 1.41);
    if (vx < VW-1 && vy > 0) d = Math.min(d, vD[i-VW+1] + 1.41);

    let d = vD[i];
    if (vx < VW-1) d = Math.min(d, vD[i+1] + 1);
    if (vy < VH-1) d = Math.min(d, vD[i+VW] + 1);
    if (vx < VW-1 && vy < VH-1) d = Math.min(d, vD[i+VW+1] + 1.41);

const CHIMNEYS = [];                       // filled as the roofs are drawn; smoke rises from them

/* ============ time & progression ============ */
const DAY_LEN = 55;
let simT = DAY_LEN * 0.04;
let speed = 1, paused = false;
if (location.search.indexOf('fast') >= 0) speed = 8;
{ const q = new URLSearchParams(location.search);
  if (q.has('t')) simT = +q.get('t');
  if (q.has('pause')) paused = true;   // census: freeze the clock so __warp() owns all time

let day = 0, hour = 6, daylight = 0, nightF = 0;
/* ---- the year ----
 * maturity() pins at day 8 and richness() at day 16, so every one-way growth term
 * in this town is spent by real minute 15 and there was no later act. season() is
 * the third slow world scalar, alongside cloudCover() and isWindy(), and the first
 * CYCLIC one: a 0..1 phase over SEASON_LEN days that turns and comes back. At 55 s
 * a day a full year is ~24 real minutes, so someone who stays past the growth ramps
 * still gets midsummer, autumn and deep winter arriving.
 *
 * Phase 0 is midwinter. The clock STARTS at 0.25 — spring, rising — which is also
 * the phase at which warmth is exactly 0.5, and every seasoned term below is written
 * so that warmth 0.5 reduces it to the literal constant it replaced. So day 0 is the
 * town as it was before the year existed, and the season is a departure from that in
 * both directions rather than a new baseline.
 *
 * Rate-capped by construction rather than by a chaser: the phase advances at exactly
 * 1/(SEASON_LEN*DAY_LEN) = 7.0e-4 per sim second and cannot do anything else, so no
 * sample can step. warmth is a cosine of the phase, so it is continuous THROUGH the
 * wrap at midwinter — the wrap is a phase wrap, not a discontinuity in the world. */
const SEASON_LEN = 26, SEASON_START = 0.25;
let seasonPhase = SEASON_START, warmth = 0.5;
function season(){ return seasonPhase; }
/* Reader one: the length of the day. Sunrise and sunset walk apart and back together
 * about a fixed solar noon, so a winter day is genuinely short — and because daylight
 * feeds capacity, laneCap, eastCap and all three spawn rates, the population breathes
 * with the year for nothing. The PEAK stays 1.0 on purpose: duration is the seasonal
 * lever on how many people are about, never midday brightness, so deep winter still
 * has a populated, legible noon. Winter reads dim through the light instead — a low
 * sun vector, a colder palette and a weaker key. */
const SOLAR_NOON = 12.75, WINTER_HOURS = 11.5, SUMMER_HOURS = 17.5;
let dayHours = 14.5, sunUp = 5.5, sunDown = 20, sunArc = 0;
function updateClock(){
  day = Math.floor(simT / DAY_LEN);
  const p = (simT % DAY_LEN) / DAY_LEN;
  hour = (6 + p * 24) % 24;
  seasonPhase = (SEASON_START + simT / (SEASON_LEN * DAY_LEN)) % 1;
  warmth = 0.5 - 0.5 * Math.cos(2 * Math.PI * seasonPhase);
  dayHours = lerp(WINTER_HOURS, SUMMER_HOURS, warmth);
  sunUp = SOLAR_NOON - dayHours / 2; sunDown = SOLAR_NOON + dayHours / 2;
  daylight = clamp(Math.sin(Math.PI * (hour - sunUp) / dayHours), 0, 1);
  nightF = 1 - clamp(daylight * 1.6, 0, 1);

  // their own from hard-coded hours, which is two definitions of where the sun is
  sunArc = clamp((hour - sunUp) / dayHours, 0, 1);

function maturity(){ return clamp((day + (simT % DAY_LEN) / DAY_LEN) / 8, 0.04, 1); }
function richness(){ return clamp(day / 16, 0, 1); }
/* Reader three: the planting. maturity() and richness() are ONE-WAY ramps that pin at
 * day 8 and day 16 — so the courtyard, the thing this piece is named after, fills to a
 * CA equilibrium in the first quarter hour and then holds it forever. The three terms
 * below are what set that equilibrium, and seasoning them turns the plateau into a
 * curve: how fast a bed grows, how HIGH it can grow, and how fast it dies back.
 *
 * bloomCap is the load-bearing one, because of how caTick is shaped: the bed that ages
 * and dies is the bed that is AT its ceiling. So lowering the ceiling does not merely
 * withhold the flower — it turns the whole bed over, and the beds empty of their own
 * accord instead of needing a seasonal kill term bolted on beside them. It is a step
 * on a continuous scalar and that is fine: no bed changes stage when it crosses, only
 * which branch it takes next tick, so nothing pops.
 *
 * All three read `warmth` and nothing else, as do the lawn and the gatehouse ivy below
 * — one scalar, so no two parts of the garden can disagree about the time of year.
 * At warmth 0.5 every one is exactly the constant it replaced. */
function growF(){ return lerp(0.30, 1.70, warmth); }
function dieF(){ return lerp(1.80, 0.20, warmth); }

/* Reader four: the canopy. Thirteen trees — the courtyard linden, four street trees,
 * four in the plaza and four in the orchard — were sized on maturity() and filled from
 * hard-coded summer greens, so deep winter had turned earth below, an 18.30 sunset
 * above, and full leaf between the two. These terms are the year in the crowns.
 *
 * They read seasonPhase, not warmth alone, because warmth 0.5 happens TWICE and a
 * RISING 0.5 (bud burst) and a FALLING 0.5 (the turn) are the two most different-
 * looking days of the year. Phase 0 is midwinter, 0.25 spring, 0.5 midsummer, 0.75
 * autumn; every window below is closed on both sides so each term is zero for most
 * of the year and only one or two are ever live at once.
 *
 * SIZE is deliberately not among them. maturity() sizes a tree, and a tree that grew
 * and shrank every 24 real minutes would read as a bug, not as a year. What moves is
 * how much canopy there is, what colour it is, and what is hanging in it.
 *
 * Each is written so that at SEASON_START (0.25) it is EXACTLY the constant it
 * replaced — leafOut 1, all three tint terms 0, leafFallF 1 — so day one is provably
 * the town as it was and any gate failure is about the new range, not the new algebra.

 * baseline, so the orchard is bare-branched at the anchor and that is the point. */

  return clamp(Math.min((p - 0.10) / 0.15, (0.95 - p) / 0.22), 0, 1); }

function leafDeep(){ return clamp((warmth - 0.5) / 0.5, 0, 1); }   // high summer, dark
function leafTurn(){ const p = seasonPhase;     // the colour going over
  return clamp((p - 0.66) / 0.16, 0, 1) * clamp((0.98 - p) / 0.10, 0, 1); }
function leafShed(){ const p = seasonPhase;     // how hard it is actually dropping
  return clamp((p - 0.70) / 0.10, 0, 1) * clamp((0.97 - p) / 0.10, 0, 1); }
function blossomF(){ const p = seasonPhase;     // orchard, out ahead of its own leaves

function fruitF(){ const p = seasonPhase;       // set in late summer, hangs into the turn

 * deep lull through high summer, and the shed — which is where nearly all of it is. */

/* ONE canopy colour rule for all thirteen trees, so no two can disagree about the time

 * goes patchy rather than uniformly orange, which is what keeps four trees in a row
 * reading as four trees. Bases are [r,g,b] rather than hex so this costs no parsing. */

/* Reader five: how busy the town is. daylight already fed capacity, laneCap, eastCap

 * The second is the compression. Each budget was written `k + span*(f + (1-f)*d)`,

  return pick(['Sparrows bicker somewhere in the linden.',
    'A window box gets watered from a first-floor window.',
    'The kiosk man rearranges tulips no one has bought yet.',
    'Someone hums on their way through the arch.',
    'Bees work the lavender in slow circles.',
    'The fountain keeps its own soft applause going.',
    'The river slides past, minding its own business.',
    'A barge horn sounds somewhere far downstream.']);
}

/* ============ CA: gardens, grass, daisies ============ */
/* `raining` is the boolean the town's *behaviour* reads — umbrellas up, nobody
 * lingers, spawn rates damped — and it is right for it to be a switch. `rainFall`
 * is the same shower's 0..1 intensity, and it is what everything *drawn* reads, so
 * the shower can thin out over its last seconds instead of being switched off in a
 * single frame. RAIN_TAIL is against a 55 s day: much longer and the ending stops
 * being an ending and becomes drizzle. */
const RAIN_TAIL = 2.2;
let raining = false, rainLeft = 0, rainFall = 0;
function neighborsMature(x, y){
  let n = 0, sp = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    if (!dx && !dy) continue;
    const xx = x + dx, yy = y + dy;
    if (xx < 0 || yy < 0 || xx >= GW || yy >= WH) continue;
    const j = yy * GW + xx;
    if ((grid[j] === BED || grid[j] === CBED) && bSt[j] === 3){ n++; sp = bSp[j]; }
  }
  return [n, sp];
}
/* The allotment is laid out by buildGrid as 3x2 beds on a 5x7 lattice. That plot is
   the unit a gardener picks and the unit that comes back, so the whole cycle —
   harvest, fallow, sowing — is addressed by plot rather than by cell. A row that
   empties and refills one cell at a time is a speckle; a plot reads as a row. */
function plotOrigin(x, y){ return [80 + Math.floor((x - 80) / 5) * 5, 8 + Math.floor((y - 8) / 7) * 7]; }
function plotCrop(x, y){                      // whatever this plot is already under, at any stage
  const [ox, oy] = plotOrigin(x, y);
  for (let yy = oy; yy < oy + 2; yy++) for (let xx = ox; xx < ox + 3; xx++){
    const i = yy * GW + xx;
    if (i >= 0 && i < GW * WH && bSp[i]) return bSp[i];
  }
  return 0;
}
/* Does this plot stand the winter? bloomCap() is a CEILING, and the courtyard's answer
   to a low one is per-CELL hardiness (hash(x,y+41) holds a seventh of cells at the full
   ceiling). That answer cannot lift a PLOT: ripePlots() wants five of six cells up, and
   a seventh per cell is 2e-4 per plot — measured, the allotments had exactly 0 ripe
   plots for 11 days of the 26, while the courtyard beside them still had colour in
   them. So the allotments read their winter off the CROP instead. A plot under the one
   hardy vegetable keeps the full ceiling through the cold; the rest stall at bloomCap()
   like everything else. Costs no R(): the crop is already in the ground, and because a
   lifted plot comes back under whatever is sown next, WHICH plots stand rotates by
   itself — the winter block goes quieter as its standing crops are picked, instead of
   the same seventh being hardy every year forever. */
function plotStands(x, y){ const sp = plotCrop(x, y); return !!(sp && SPECIES[sp - 1].hardy); }
/* The stage this particular cell is allowed to reach right now — bloomCap() for most of
   the town, the full 3 for whatever stands the cold, grain-matched to how the region is
   addressed (a courtyard CELL by hash, an allotment PLOT by its crop). Lifted out of
   caTick because a second reader arrived: the naming has to say whether a bed is
   flowering ABOVE its season or stalled AT it, and two evaluations of the same ceiling
   would drift the moment either is tuned. */
function bedCap(x, y){
  const cap = bloomCap();
  return cap === 3 ? 3
       : inAllotment(x, y) ? (plotStands(x, y) ? 3 : cap)
       : hash(x, y + 41) > 0.86 ? 3 : cap;
}
const FALLOW = 12;   // sim seconds a picked plot lies bare, +R()*8 — a third to a half of a 55 s day,
                       // long enough that a dug-over row is something you notice from the wide view
let harvested = 0;     // cumulative cells picked: the one number that separates picked from died back
/* A gardener kneeling at a ripe plot clears it in one go and walks out with the crop.
   bAge doubles as the fallow clock on an empty bed (it is only ever read on a planted
   one), which is why dieback below now zeroes it. */
function harvestPlot(a){
  const [ox, oy] = plotOrigin(a.plot[0], a.plot[1]);
  let took = 0, sp = 0;
  for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
    const i = y * GW + x;
    if (grid[i] === BED && bSt[i] === 3){ sp = bSp[i]; took++; }
  }
  if (!took) return 0;                        // nothing ripe here — they sow it instead
  // the row is lifted whole, not cell by cell: the bed goes bare, and because it comes
  // back with no crop remembered it comes back under a different one. Picking only the
  // ripe cells leaves the plot's crop behind and the allotments settle onto two of four.
  for (let y = oy; y < oy + 2; y++) for (let x = ox; x < ox + 3; x++){
    const i = y * GW + x;
    if (grid[i] !== BED) continue;
    bSp[i] = 0; bSt[i] = 0; bAge[i] = FALLOW + R() * 8;
  }
  // the basket now has somewhere to go: the store the lane's stalls are stocked from
  a.crop = sp; harvested += took; produce[sp - 1] += took; groundDirty = true;
  announce(pick(['A row of ' + SPECIES[sp-1].name + ' comes up; the basket fills.',
    'The ' + SPECIES[sp-1].name + ' are ready — the plot is cleared in one go.',
    'Someone straightens up out of the ' + SPECIES[sp-1].name + ' with an armful.']));
  return took;
}
function caTick(){
  const m = maturity(), boost = raining ? 3 : 1;
  const vig = growF(), die = dieF();          // the ceiling is per-cell now: bedCap(x, y)
  const availF = SPECIES.filter(s => s.minDay <= day && !s.veg);
  const availV = SPECIES.filter(s => s.minDay <= day && s.veg);
  for (let y = 3; y < LN_WALK_S; y++) for (let x = 0; x < GW; x++){
    const i = y * GW + x, t = grid[i];
    if (t === BED || t === CBED){
      if (!bSp[i]){
        if (bAge[i] > 0){ bAge[i] = Math.max(0, bAge[i] - 0.35); continue; }   // turned earth, resting
        if (inAllotment(x, y)){
          // a plot is sown, not self-seeded: the first drill goes in slowly, then the
          // other five follow it fast and under the same crop, so a row comes up as a row
          const crop = plotCrop(x, y);
          if (R() < (crop ? 0.30 : 0.055) * (0.25 + m) * boost * vig){
            bSp[i] = crop || (SPECIES.indexOf(pick(availV)) + 1);
            bSt[i] = 1; bAge[i] = 0;
          }
        } else {
          const [nm, nsp] = neighborsMature(x, y);
          if (R() < (0.004 + 0.028 * nm) * (0.25 + m) * boost * vig){
            bSp[i] = (nm && R() < 0.7) ? nsp : (SPECIES.indexOf(pick(availF)) + 1);
            bSt[i] = 1; bAge[i] = 0;
          }
        }
      } else if (bSt[i] < bedCap(x, y)){
        if (R() < 0.10 * (0.3 + m) * boost * vig) bSt[i]++;
      } else {
        // the bed AT its ceiling is the bed that ages — so a low winter ceiling turns
        // the beds over rather than freezing them half-grown. Whatever keeps the full
        // ceiling through the cold is grain-matched to what the region is ADDRESSED by:
        // a seventh of courtyard CELLS by hash (the same seventh every winter, which is
        // fine where the unit is a cell), and in the allotments a whole PLOT under a
        // hardy crop, because there the unit ripePlots() reads is the plot. Measured,
        // the cap alone took blooming to exactly 0 for 11 days of the 26, and a garden
        // with no colour in it at all reads as dead rather than as wintering.
        bAge[i] += 0.35;
        const [nm] = neighborsMature(x, y);
        const crowd = nm > 5 ? 0.03 : 0;
        if (R() < (0.0025 + crowd + bAge[i] * 0.0004) * die){ bSp[i] = 0; bSt[i] = 0; bAge[i] = 0; }
      }
    } else if (t === GRASS){
      wear[i] = Math.max(0, wear[i] - 0.0035 * boost * vig);
      if (!daisy[i] && wear[i] < 0.08 && R() < 0.00012 * (0.2 + m) * vig) daisy[i] = 1 + (R() * 3 | 0);
      if (daisy[i] && (wear[i] > 0.3 || R() < 0.004 * die)) daisy[i] = 0;
    }
  }
  groundDirty = true;
}

/* ============ agents ============ */
const agents = [];
const SHIRT = ['#b04a3c','#3d6a8a','#c2913a','#5d7a4a','#7a5a8a','#a8503f','#4a7d78','#8a6a4a','#b8776a','#456590'];
const PANTS = ['#3a3a44','#5a4a3a','#43514a','#2e3a4e','#6b5b4b'];
const SKIN = ['#e8c39a','#c9975f','#8a5f3f','#6b4a33','#f0d0ac'];
function ringPath(a, b, dir){
  const pts = []; let k = a;
  while (k !== b){ k = (k + dir + RK) % RK; pts.push(RING[k].slice()); }
  return pts;
}
function ringDir(a, b){ const d = (b - a + RK) % RK; return d <= RK / 2 ? 1 : -1; }
function crossPts(a, b){
  const A = RING[a], B = RING[b], pts = [];
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
  const d = Math.hypot(mx - CX, my - CY);
  if (d < 9.2){
    const ux = (mx - CX) / (d || 1), uy = (my - CY) / (d || 1);
    pts.push([CX + ux * 9.8, CY + uy * 9.8]);
  }
  pts.push(B.slice());
  return pts;
}
function nearestRing(th){
  let best = 0, bd = 9;
  for (let k = 0; k < RK; k++){
    let d = Math.abs(((k / RK * Math.PI * 2) - th + Math.PI*3) % (Math.PI*2) - Math.PI);
    if (d < bd){ bd = d; best = k; }
  }
  return best;
}
function nearestRingXY(x, y){
  let best = 0, bd = 1e9;
  for (let k = 0; k < RK; k++){
    const d = (RING[k][0]-x)**2 + (RING[k][1]-y)**2;
    if (d < bd){ bd = d; best = k; }
  }
  return best;
}
function pickEntrance(){
  // the lane feeds the south arch, so weight it double
  const bag = [ENTR[0], ENTR[1], ENTR[1], ENTR[2], ENTR[3]];
  return pick(bag);
}
function spawnAgent(){
  const m = maturity();
  const e = pickEntrance();
  const ex = pick(ENTR.filter(x => x !== e));
  const legs = entryLeg(e);
  const a = {
    kind:'walker', x:legs[0][0], y:legs[0][1], wp:legs.concat([RING[e.k].slice()]),
    i:0, speed:1.5 + R() * 0.7, state:'walk', timer:0,
    shirt:pick(SHIRT), pants:pick(PANTS), skin:pick(SKIN),
    // `wary` is how long this person leaves it before believing the sky. It must be a
    // STABLE per-person trait: a.phase looks like one but is the walk cycle and is
    // advanced every frame, so reading it staggered nothing — everyone reacted at the
    // bottom of the band within a frame or two.
    umbrella:false, phase:R() * 9, wary:R(), exit:ex,
  };
  const roll = R();
  const sun = daylight > 0.35;
  const canKids = day >= 1 && sun, canDog = day >= 1, canPicnic = day >= 3 && sun,
        canNap = day >= 2 && sun, canGardener = sun && !agents.some(g => g.kind === 'gardener');
  if (canGardener && roll < 0.10 && EDGE_BEDS.length){
    a.kind = 'gardener'; a.shirt = '#5d7a4a';
    const spot = pick(EDGE_BEDS);
    const t = nearestRingXY(spot.px, spot.py);
    a.wp.push(...ringPath(e.k, t, ringDir(e.k, t)));
    a.kneelAt = [spot.px, spot.py];
    a.wp.push(a.kneelAt);
    announce('A gardener arrives with a trowel and a tray of seedlings.');
  } else if (canKids && roll < 0.22){
    a.kind = 'kid'; a.speed = 2.6 + R(); a.small = true;
    let kth = R() * Math.PI * 2;
    for (let j = 0; j < 6 + (R()*5|0); j++){
      kth += (R() - 0.5) * 1.6;
      const rr = 9.4 + R() * Math.max(0.5, gR(kth) - 10.6);
      a.wp.push([CX + Math.cos(kth) * rr, CY + Math.sin(kth) * rr]);
    }
    announce(pick(['Kids tear across the grass, shrieking.', 'A game of tag spills over the lawn.']));
    if (R() < 0.7){
      const b = Object.assign({}, a, {shirt:pick(SHIRT), pants:pick(PANTS), speed:a.speed*0.94,
        wp:a.wp.map(p=>[p[0]+0.7,p[1]+0.5]), i:0, x:a.x+0.6, y:a.y, phase:R()*9});
      finishItinerary(b); agents.push(b);
    }
  } else if (canNap && roll < 0.29){
    a.kind = 'napper';
    const g = pick(GAP_ANGLES);
    const gapPt = [CX + Math.cos(g) * (bedOut(g) + 0.8), CY + Math.sin(g) * (bedOut(g) + 0.8)];
    a.wp.push(...ringPath(e.k, nearestRing(g), ringDir(e.k, nearestRing(g))));
    a.wp.push(gapPt.slice());
    a.napAt = [CX + Math.cos(g) * 2.6, CY + Math.sin(g) * 2.6];
    a.wp.push(a.napAt);
    a.preExit = [gapPt];
    announce('Someone wanders in with a book, eyeing the shade under the tree.');
  } else if (canPicnic && roll < 0.36){
    a.kind = 'picnic';
    let th = R() * Math.PI * 2, rr = 9 + R() * 3;
    a.picnicAt = [CX + Math.cos(th) * rr, CY + Math.sin(th) * rr];
    a.wp.push(...ringPath(e.k, nearestRing(th), ringDir(e.k, nearestRing(th))));
    a.wp.push(a.picnicAt);
    const b = Object.assign({}, a, {shirt:pick(SHIRT), pants:pick(PANTS),
      wp:a.wp.map(p=>[p[0]+0.9,p[1]+0.3]), i:0, x:a.x+0.7, y:a.y, phase:R()*9, lead:false});
    a.lead = true;
    finishItinerary(b); agents.push(b);
    // linked both ways AFTER the copy, so the pair can decide the sky together. The
    // line about the blanket now waits until the blanket is actually spread — a seat
    // that can be refused makes an announcement at spawn a promise the town may break.
    a.mate = b; b.mate = a;
  } else if (canDog && roll < 0.46){
    a.kind = 'dogwalker';
    a.dog = { x:a.x, y:a.y, phase:R()*9, col:pick(['#4a3a2c','#c9b18a','#2c2c2c','#a6763f']) };
    const loops = 1 + (R() * 1.5 | 0);
    a.wp.push(...ringPath(e.k, (e.k + Math.round(RK * (0.5 + loops))) % RK, 1));
    if (day >= 1 && R()<0.5) announce('A dog tows its human around the path, nose down.');
  } else if (roll < 0.62 && day >= 1){
    a.kind = 'crosser';
    a.wp.push(...crossPts(e.k, ex.k));
  } else if (roll < 0.78){
    a.kind = 'sitter';
    const b = pick(BENCH_SPOTS);
    const t = nearestRingXY(b.x, b.y);
    a.wp.push(...ringPath(e.k, t, ringDir(e.k, t)));
    a.benchAt = b; a.wp.push([b.x + 0.5, b.y + 0.6]);
  } else {
    const dir = R() < 0.5 ? 1 : -1;
    a.wp.push(...ringPath(e.k, ex.k, dir));
  }
  finishItinerary(a);
  agents.push(a);
}
const STAYING = {gardener:1, napper:1, picnic:1, sitter:1};
function finishItinerary(a){
  const ex = a.exit;
  if (!STAYING[a.kind]){
    const last = a.wp[a.wp.length - 1];
    const t = nearestRingXY(last[0], last[1]);
    a.wp.push(...ringPath(t, ex.k, ringDir(t, ex.k)), ...exitLeg(ex));
  }
}
/* Who minds a thickening sky, and by how much.
 *
 * ONE definition each, because four sites now ask. `SIT_REFUSE` is the bar for taking
 * a seat at all; `skyLifts()` is the bar for giving one up, per person off `a.wary`,
 * and the gap between the two is what guarantees nobody sits down and stands straight
 * back up. Until now both were gated on `a.street`, so the courtyard sat through the
 * front while the cafe emptied around it (c11). The gate is not `street` — it is what
 * you are DOING: on the street everyone not lying down gets up, which keeps the
 * allotment kneelers and the busker leaving as they have since #6; in the courtyard it
 * is the people SITTING, so the napper under the tree sleeps on and the gardener with
 * their hands in a bed finishes the row.
 */
const SIT_REFUSE = 0.42;
function seatRefused(){ return weatherComing() > SIT_REFUSE; }
function skyLifts(a){
  return (a.street ? a.state !== 'lie' : a.state === 'sit')
      && weatherComing() > 0.55 + (a.wary ?? 0.5) * 0.33;
}
function routeToExit(a){
  const ex = a.exit;
  const pts = (a.preExit || []).map(p => p.slice());
  const from = pts.length ? pts[pts.length-1] : [a.x, a.y];
  const t = nearestRingXY(from[0], from[1]);
  pts.push(RING[t].slice(), ...ringPath(t, ex.k, ringDir(t, ex.k)), ...exitLeg(ex));
  a.wp = pts; a.i = 0; a.state = 'walk';
}
function stepAgent(a, dt){
  a.timer -= dt;

  // pointing — so it ticks down here, above every state branch, and a sitter on
  // the quay bench runs it out the same as a walker on the bridge.
  if (a.watch > 0) a.watch -= dt;
  if (a.state === 'sit' || a.state === 'kneel' || a.state === 'lie' || a.state === 'stand'){
    if (a.state === 'kneel' && !a.planted && a.timer < 4){
      a.planted = true;
      // one kneel, both halves of the cycle: if the plot in front of them is ripe they
      // take it and leave with it, and only an unripe plot gets sown by hand
      if (!(a.kind === 'allot' && a.plot && harvestPlot(a))){
        let planted = 0;
        const sp = SPECIES.indexOf(pick(speciesFor(a.x, a.y))) + 1;
        for (let dy=-3; dy<=3 && planted<4; dy++) for (let dx=-3; dx<=3 && planted<4; dx++){
          const x = Math.round(a.x+dx), y = Math.round(a.y+dy);
          if (x<0||y<0||x>=N||y>=WH) continue;
          const j = y*GW+x;
          if ((grid[j]===BED||grid[j]===CBED) && !bSp[j] && !bAge[j] && R()<0.6){ bSp[j]=sp; bSt[j]=1; bAge[j]=0; planted++; }
        }
        if (planted) announce('Fresh ' + SPECIES[sp-1].name + ' go into the bed, patted down gently.');
      }

    }
    // the far side goes home when the light does: a visit that outlasts the daylight
    // that authorised it is what leaves the quay occupied at midnight
    // The tables, the benches and the blankets empty ahead of the sky, not with it: every
    // sitter has their own tolerance for a thickening front (a.wary), so they get up one
    // at a time across the ~11 s the cover takes to build. The band tops out at 0.88,
    // below the 0.91 at which the rain roll goes live, so the last seat is empty before
    // the first drop rather than in the same frame as it. See skyLifts().
    if (a.timer <= 0 || (raining && a.state !== 'lie')
        || skyLifts(a)
        || (a.east && !eastOpen())){
      if (a.blanket){ a.blanket = false; }
      if (a.tableRef){ a.tableRef.taken = 0; a.tableRef = null; a.cup = false; }
      if (a.resume && a.i < a.wp.length){ a.state = 'walk'; a.resume = false; }

      else routeToExit(a);
    }

  }
  if (a.listen > 0){ a.listen -= dt; stepDog(a, a.speed, dt); return; }   // the bell: a beat of standing still, head back
  // a passing word: both hold still, facing each other, then walk on. Only ever a
  // countdown — nothing here can hold an agent, so `done` stays reachable.
  if (a.greet > 0){ a.greet = Math.max(0, a.greet - dt); stepDog(a, a.speed, dt); return; }
  const tgt = a.i < a.wp.length ? a.wp[a.i] : null;
  if (!tgt){ a.done = true; return; }
  const dx = tgt[0] - a.x, dy = tgt[1] - a.y;
  const d = Math.hypot(dx, dy);
  const sp = a.speed * (raining && !a.umbrella ? 1.5 : 1) * (a.kind === 'napper' ? 0.8 : 1)
                     * (a.east && !eastOpen() ? 1.55 : 1);   // home before dark
  if (d < 0.25){
    a.i++;
    if (a.i >= a.wp.length){
      if (a.kind === 'gardener' && !a.planted){ a.state='kneel'; a.timer=8+R()*4; return; }
      if (a.kind === 'napper' && a.napAt){ a.state='lie'; a.timer=16+R()*14; a.napAt=null;
        if (R()<0.6) announce('Asleep under the tree within minutes.'); return; }
      /* A courtyard seat can be refused now, which is why c11 stayed open for 24
       * iterations: these two kinds are STAYING, so they arrive with an empty
       * waypoint list and refusing used to mean `a.done` where they stood. routeToExit()
       * gives them the walk back out that a street agent always had.
       * The duration is drawn either way — a refusal must not add or drop an R() call,
       * or a dry census cell would churn for a wet-weather feature it never sees. */
      if (a.kind === 'picnic' && a.picnicAt){
        const dur = 20 + R() * 14;
        a.picnicAt = null;
        // a pair arrives together and shares one blanket, so the sky is judged ONCE for
        // both: whoever reaches the grass first decides, and if your half is already
        // down you join them whatever the cloud is doing. (They share `a.wary` too — the
        // partner is a copy — so the release lifts them in the same frame.)
        if (seatRefused() && !(a.mate && a.mate.state === 'sit')){ routeToExit(a); return; }
        a.state='sit'; a.timer=dur; a.blanket=a.lead;
        if (a.lead) announce('A blanket unfurls on the grass — picnic hour.');
        return;
      }
      if (a.kind === 'sitter' && a.benchAt){
        const dur = 12 + R() * 16;
        a.benchAt = null;
        if (seatRefused()){ routeToExit(a); return; }
        a.state='sit'; a.timer=dur; a.onBench=true; return;
      }
      if (a.kind === 'allot' && a.tendPlot){
        a.tendPlot = false; a.state = 'kneel'; a.timer = 9 + R() * 5; a.resume = true;
        a.planted = false; a.rows = (a.rows || 0) + 1;   // each kneel is its own row
        // they came a long way for one plot: most work a second or third before leaving
        if (a.rows < 3 && R() < 0.55){
          const next = pickPlot();
          a.plot = next; a.tendPlot = true;
          a.wp.push([next[0] - 0.6, next[1] + 0.5]);
          return;
        }
        const exitVia = R() < 0.5;
        if (exitVia) a.wp.push([ALT_GATE, 58], [ALT_GATE, 62], [ALT_GATE, LANE_N_Y], [laneEdge(), LANE_N_Y]);
        else { const gy = pick([20, 45]); a.wp.push([79, gy], [XS_WALK_E, gy], [XS_WALK_E, -2.5]); }
        return;
      }
      a.done = true; return;
    }
    // street agents: perform their one stop when they actually reach it
    if (a.stop && !a.stopped && Math.hypot(a.x - a.stop.x, a.y - a.stop.y) < 0.6){
      a.stopped = true;
      // and nobody new sits down under a sky that is already going. Refused at 0.42,
      // released at 0.55+ above, so the gap guarantees no one sits and stands right up.
      if (a.stop.act === 'sit' && weatherComing() > 0.42){
        if (a.table){ a.table.taken = 0; a.table = null; }
        return;                                    // walk on past the empty chair
      }
      a.state = a.stop.act; a.timer = a.stop.dur; a.resume = true;
      if (a.stop.cup){ a.cup = true; a.tableRef = a.table; a.table = null; }
      if (a.stop.say) announce(a.stop.say);
      return;
    }
    return;
  }
  const mv = Math.min(sp * dt, d);
  a.x += dx / d * mv; a.y += dy / d * mv;
  a.faceL = dx < 0;
  a.phase += mv * 2.2;
  const gx = Math.round(a.x - .5), gy = Math.round(a.y - .5);
  if (gx>=0 && gy>=0 && gx<GW && gy<WH){
    const j = gy*GW+gx;
    if (grid[j]===GRASS){
      wear[j] = Math.min(1, wear[j] + (a.small?0.05:0.09) * dt * 6);
      if (daisy[j] && wear[j]>0.25){ daisy[j]=0; }
      if (R()<dt*2) groundDirty = true;
    }
  }
  stepDog(a, sp, dt);
}
/* the dog trails its human. Called from the walk path AND from every beat the human
 * spends standing still, so a stopped owner never leaves a frozen dog beside them. */
function stepDog(a, sp, dt){
  if (!a.dog) return;
  const g = a.dog, ddx = a.x - g.x + Math.sin(a.phase*0.7)*1.2, ddy = a.y - g.y + 0.6;
  const dd = Math.hypot(ddx, ddy);
  if (dd > 1.2){ g.x += ddx/dd * Math.min(sp*1.3*dt, dd); g.y += ddy/dd * Math.min(sp*1.3*dt, dd); }
  g.phase += dt * 9;
}

/* ============ a passing word ============ */
/* Until now every agent moved as though alone in the town — no proximity test
 * existed anywhere, which is why the wide shot read as traffic rather than as
 * neighbours. This is the whole of their social life: on a coarse tick, two people
 * who happen to pass close may stop and talk for a few seconds. A pass over a short
 * list, axis-rejected before any hypot, and both parties then sit out a cooldown so
 * the same pair cannot chatter their way down the lane. */
/* GREET_MIN matters as much as GREET_R: a pair that stops at half a cell renders as
 * one blob, so they only pair at a distance you can read as two people. */
const GREET_DT = 0.5, GREET_R = 1.6, GREET_MIN = 0.9, GREET_P = 0.17;
let greetAcc = 0;
function chatty(a){
  return a.state === 'walk' && !a.small && !(a.listen > 0) && !(a.greet > 0) && !(a.chatCool > 0)
      && a.kind !== 'sweeper' && a.kind !== 'picnic';   // the sweeper is working; picnic pairs arrive together
}
function greetPass(){
  const free = [];
  for (const a of agents){
    if (a.chatCool > 0) a.chatCool = Math.max(0, a.chatCool - GREET_DT);
    if (chatty(a)) free.push(a);
  }
  for (let i = 0; i < free.length; i++){
    const a = free[i];
    if (a.greet > 0) continue;
    for (let j = i + 1; j < free.length; j++){
      const b = free[j];
      if (b.greet > 0) continue;
      const dx = b.x - a.x; if (dx > GREET_R || dx < -GREET_R) continue;    // cheap reject, no hypot
      const dy = b.y - a.y; if (dy > GREET_R || dy < -GREET_R) continue;
      const q = dx*dx + dy*dy;
      if (q > GREET_R*GREET_R || q < GREET_MIN*GREET_MIN) continue;
      if (R() > GREET_P) continue;
      const t = (2.2 + R() * 2.8) * (raining ? 0.45 : 1);   // nobody lingers in the wet
      a.greet = b.greet = t;
      a.faceL = dx < 0; b.faceL = !a.faceL;
      a.chatCool = b.chatCool = t + 16 + R() * 10;
      if (R() < 0.12) announce(pick([
        'Two neighbours stop mid-path and fall into talk.',
        'A conversation breaks out on the lane and the walk waits for it.',
        'Someone stops someone else; hands go into pockets.',
      ]));
      break;
    }
  }
}

function pickPlot(){

    if (grid[py * GW + px] === BED && R() < 0.05) plots.push([px, py]);

function ripePlots(){
  let n = 0;

function drawBalloon(t){
  if (!balloon) return;
  const bz = 34 + Math.sin(balloon.ph) * 1.4;
  // travelling shadow — the first thing a lid takes, being thrown the furthest
  if (daylight > 0.1){
    const off = shOffset(), sp = shSpread();
    const [shx, shy] = project(balloon.x + 3 * off, balloon.y + 6 * off, 0);
    ctx.fillStyle = 'rgba(20,25,15,' + 0.10 * daylight * shadowF() + ')';
    ctx.beginPath(); ctx.ellipse(shx, shy, cellW * 2.4 * sp, cellH * 1.6 * sp, 0, 0, 7); ctx.fill();
  }
  const [bx, by] = project(balloon.x, balloon.y, bz);
  const rr = cellW * 2.1;
  ctx.fillStyle = balloon.c1;
  ctx.beginPath(); ctx.arc(bx, by, rr, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(bx - rr * 0.95, by + rr * 0.28); ctx.quadraticCurveTo(bx, by + rr * 1.15, bx + rr * 0.95, by + rr * 0.28); ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(bx, by, rr, Math.PI * 0.9, Math.PI * 2.1);
  ctx.quadraticCurveTo(bx, by + rr * 1.15, bx - rr * 0.95, by + rr * 0.28); ctx.clip();
  ctx.fillStyle = balloon.c2;
  for (let k = -3; k < 4; k += 2) ctx.fillRect(bx + k * rr * 0.28, by - rr, rr * 0.28, rr * 2.4);
  ctx.restore();
  const bskY = by + rr * 1.15;
  ctx.strokeStyle = 'rgba(60,50,40,.8)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bx - rr * 0.4, bskY - 2); ctx.lineTo(bx - 4, bskY + 8);
  ctx.moveTo(bx + rr * 0.4, bskY - 2); ctx.lineTo(bx + 4, bskY + 8);
  ctx.stroke();
  ctx.fillStyle = '#7a5b3c';
  ctx.fillRect(bx - 5, bskY + 8, 10, 7);
}
function updateDucks(dt){
  const want = day >= 2 ? 3 : 0;
  while (ducks.length < want){
    const th = R() * Math.PI * 2;
    ducks.push({x:POND.x + Math.cos(th) * POND.rx * 0.5, y:POND.y + Math.sin(th) * POND.ry * 0.5,
      ph:R() * 9, t:0, tx:POND.x, ty:POND.y, drake:R() < 0.5});
  }
  while (ducks.length > want) ducks.pop();
  for (const d of ducks){
    d.ph += dt * 2;
    d.t -= dt;
    if (d.t <= 0){
      d.t = 3 + R() * 5;
      const th = R() * Math.PI * 2, rr = R();
      if (nightF > 0.6 || R() < 0.75){   // stay on (or return to) the water
        d.tx = POND.x + Math.cos(th) * POND.rx * 0.75 * rr;
        d.ty = POND.y + Math.sin(th) * POND.ry * 0.75 * rr;
      } else {                            // waddle out onto the bank
        d.tx = POND.x + Math.cos(th) * (POND.rx + 1.6);
        d.ty = POND.y + Math.sin(th) * (POND.ry + 1.3);
      }
      if (R() < 0.02) announce('The ducks argue briefly about nothing at all.');
    }

    if (dd > 0.1){
      const sp = (nightF > 0.6 ? 0.2 : 0.7) * dt;
      d.x += (d.tx - d.x) / dd * Math.min(sp, dd);
      d.y += (d.ty - d.y) / dd * Math.min(sp, dd);

  }
}

const stats = { people:0, blooms:0 };
function updateWildlife(dt){
  const m = maturity(), rich = richness();
  const bloomsNow = stats.blooms;
  const wantB = raining||nightF>0.5 ? 0 : Math.min(8, Math.floor(bloomsNow/25) + (day>=2?1:0));
  while (butterflies.length < wantB) {
    const alt = R() < 0.35, bx = alt ? 86.5 : CX, by = alt ? 32 : CY;
    const th=R()*Math.PI*2, r=6+R()*(alt?7:14);
    butterflies.push({x:bx+Math.cos(th)*r, y:by+Math.sin(th)*r, z:0.8+R(), ph:R()*9, tx:0, ty:0, t:0, alt,
      col: pick(['#e8dfc8','#e8b13a','#c9762e','#d8d0e8'])});
  }
  while (butterflies.length > wantB) butterflies.pop();
  for (const b of butterflies){
    b.t -= dt;
    if (b.t <= 0){ const bx = b.alt ? 86.5 : CX, by = b.alt ? 32 : CY;
      const th=R()*Math.PI*2, r=5+R()*(b.alt?7:15); b.tx=bx+Math.cos(th)*r; b.ty=by+Math.sin(th)*r; b.t=2+R()*4; }

    // 30 cells away, and a raw (tx-x)*0.5 flies it there faster than a person runs —
    // a 4-cell step in a quarter second, which sat right on the motion gate's jump
    // threshold and flipped it on any change to the random stream
    let ax = (b.tx-b.x)*0.5, ay = (b.ty-b.y)*0.5;
    const av = Math.hypot(ax, ay); if (av > 3){ ax = ax/av*3; ay = ay/av*3; }
    b.x += ax*dt + Math.sin(b.ph*0.3)*dt*2;
    b.y += ay*dt;
    b.z = 0.7 + Math.sin(b.ph*0.13)*0.35;
  }
  const wantF = (day>=3 && nightF>0.6 && !raining) ? Math.round(4+rich*8) : 0;
  while (fireflies.length < wantF){ const alt = R() < 0.35;
    const fx = alt ? 86.5 : CX, fy = alt ? 32 : CY;
    const th=R()*Math.PI*2, r=3+R()*(alt?7:13);
    fireflies.push({x:fx+Math.cos(th)*r, y:fy+Math.sin(th)*r, z:0.4+R()*1.2, ph:R()*9}); }
  while (fireflies.length > wantF) fireflies.pop();
  for (const f of fireflies){ f.ph += dt*(RM?0.8:1.6); f.x += Math.sin(f.ph*0.9)*dt*0.8; f.y += Math.cos(f.ph*0.7)*dt*0.6; }

  if (!raining && daylight>0.3 && birds.length < 3 && R() < dt*0.06*(0.5+m)){
    const onLane = R() < 0.4;
    const th=R()*Math.PI*2, r=6+R()*10;
    birds.push({
      x: onLane ? 8+R()*48 : CX+Math.cos(th)*r,
      y: onLane ? LN_ROAD0+1+R()*5 : CY+Math.sin(th)*r,
      z:8, state:'land', hop:0, t:0,
      col:pick(['#33302c','#5a4636','#6e6a60','#7d8089'])});
    if (R()<0.4) announce(pick(['A blackbird drops onto the lawn.', 'Pigeons strut the lane like they own the freehold.']));
  }
  for (let i=birds.length-1; i>=0; i--){
    const b = birds[i];
    if (b.state==='land'){ b.z -= dt*6; if (b.z<=0){ b.z=0; b.state='hop'; b.t=6+R()*8; } }
    else if (b.state==='hop'){
      b.t -= dt; b.hop += dt*4;
      if (Math.sin(b.hop)>0.9){ b.x += (R()-0.5)*0.8; b.y += (R()-0.5)*0.8; }
      const scare = agents.some(a => Math.hypot(a.x-b.x, a.y-b.y) < 4.5);
      if (scare || b.t<=0 || raining) b.state='fly';
    } else if (b.state==='wheel'){    // put up off the belfry by the bell: one wide turn, then away
      b.t -= dt; b.ph += dt*b.sp*(RM?0.45:1); b.ph2 += dt*(RM?3:7);
      b.r = Math.min(7, b.r + dt*(b.t>0 ? 4 : 2.2));

      b.y = b.cy + Math.sin(b.ph)*b.r*0.5;

  }
  const gusty = isWindy(), ff = leafFallF();
  /* The rate and the ceiling both ride the season now, and the gust multiplies it
   * rather than overriding it — a January gale off bare branches sheds nothing.
   * Draw counts are UNCHANGED (one rate roll, one src, then six per leaf, pick()
   * included), because adding an R() here would reshuffle the whole seeded world. */
  const cap = gusty ? 40 : Math.round(24 * clamp(ff, 0.20, 1.70));
  if ((day>=4 || gusty) && !raining && R()<dt*(gusty?1.1:0.25*rich)*ff && leaves.length<cap && !RM){
    const src = R();
    // in spring what is in the air is petals off the beds, not leaves off the trees
    const petalCut = 0.75 - 0.30 * Math.max(leafFresh(), blossomF());
    if (src < petalCut*(2/3)){          // from the courtyard linden
      leaves.push({x:CX+(R()-0.5)*6, y:CY+(R()-0.5)*6, z:5.5+R()*2, vx:0.6+R()*0.8+(gusty?1.2:0), ph:R()*9,
        col:leafCol(pick([[168,133,60],[138,154,68],[176,111,56]]), 0)});
    } else if (src < petalCut){  // from a street tree
      leaves.push({x:pick(TREE_PITS)+0.5, y:66.9, z:3.5+R(), vx:0.8+R()+(gusty?1.2:0), ph:R()*9,
        col:leafCol(pick([[138,154,68],[168,133,60]]), 1)});
    } else {                 // a petal snatched off a bed
      leaves.push({x:6+R()*52, y:5+R()*3, z:1+R(), vx:1+R()+(gusty?1.4:0), ph:R()*9,
        col:pick(['#e8a0b0','#f3b04e','#c9a0e2','#e8dfc8'])});
    }
  }
  for (let i=leaves.length-1;i>=0;i--){ const l=leaves[i];
    l.ph+=dt*3; l.x+=l.vx*dt+Math.sin(l.ph)*dt*1.4; l.y+=dt*0.5; l.z-=dt*0.55;
    if (l.z<=0) leaves.splice(i,1); }
  if (!catA && nightF > 0.5 && day >= 2){ catA = {x:-2, y:LANE_N_Y - 0.5, dir:1}; }
  if (catA){
    catA.x += catA.dir * dt * 1.6;
    if (catA.x > 66 || nightF < 0.2) catA = null;
  }
  // umbrellas go up on the approach, not on the first drop. Each walker has their own
  // patience with the sky, and the top of the band runs past 1, so roughly a third of
  // the lane never opens one at all and gets caught out.
  {
    const cm = weatherComing();
    for (const a of agents){
      // putting it away is unconditional — a walker who sat down still has to, or they
      // stay under an umbrella at a café table on a clear afternoon
      if (a.umbrella){ if (!raining && cm < 0.42) a.umbrella = false; }
      else if (a.state === 'walk' && cm > 0.62 + (a.wary ?? 0.5) * 0.55) a.umbrella = true;
    }
  }
  if (raining){
    rainLeft -= dt;
    /* A shower ends by running out of drops, not by being switched off. Over the last
     * RAIN_TAIL seconds the number of drops the sky *wants* falls to zero, and a drop
     * that reaches the bottom is simply not sent round again — so the last few are
     * still falling while the sheen comes up and the grey lifts off the frame. */
    rainFall = clamp(rainLeft / RAIN_TAIL, 0, 1);
    const want = Math.round((RM ? 40 : 110) * rainFall * showerHard());
    while (raindrops.length < want) raindrops.push({x:R()*W, y:R()*H, v:520+R()*260});
    let k = 0;
    for (const r of raindrops){
      r.y += r.v*dt; r.x -= r.v*dt*0.12;
      if (r.y>H){ if (k >= want) continue; r.y=-12; r.x=R()*(W*1.15); }
      raindrops[k++] = r;
    }
    raindrops.length = k;
    wet = Math.max(wet, 6 * (1 - rainFall));   // the street is already shining before the last drop lands
    if (rainLeft <= 0 && !raindrops.length){ raining=false; rainFall=0; wet = 18;
      // and the cover breaks up behind it — for a July afternoon, not for long in January
      cloudTgt = 0.1 + R() * 0.28; frontLeft = spellLen(false, 26 + R() * 26);
      for (const a of agents) a.umbrella = false;               // down they come, all at once
      announce('The rain moves on. Everything smells green, and the lane shines.'); groundDirty=true; }
  } else if (cloudCover() > 0.66 && day >= 1
             && R() < dt * 0.10 * (cloudCover() - 0.66) / 0.34 * showerRate() * nightDamp()){
    raining = true; rainLeft = (10 + R() * 9) * showerLen();
    cloudTgt = 0.92; frontLeft = Math.max(frontLeft, 24);
    announce('Rain drifts in across the rooftops.');
    // no sweep here any more: whoever was going to put one up already has, on the way in
  }
}

const gcv = document.createElement('canvas');
const gtx = gcv.getContext('2d');
let groundDirty = true;
function quad(g, x, y, pad, z){

  const a = project(x-p, y-p, zz), b = project(x+1+p, y-p, zz), c = project(x+1+p, y+1+p, zz), d = project(x-p, y+1+p, zz);

function poly(g, pts){

/* ============ sky, sun and the far horizon ============ */
let SUN = [0.5, 0.35, 0.79];
const LIT = [];                                  // lit window rectangles, for the night glow pass
/* Reader two: the light. A low cold sun against a high warm one. Everything the town
 * casts is SUN[0]/SUN[2] and SUN[1]/SUN[2], so raising the midsummer arc and dropping
 * the midwinter one changes every shadow in the frame from one place. */
function sunVec(){
  const sa = sunArc;
  const lx = lerp(0.8, -0.8, sa), ly = lerp(0.58, 0.32, warmth),
        lz = (0.36 + 0.26 * warmth) + (0.34 + 0.30 * warmth) * Math.sin(Math.PI * sa);
  const n = Math.hypot(lx, ly, lz) || 1;
  return [lx / n, ly / n, lz / n];
}
/* ---- how hard the sun's edge is ------------------------------------------------
 * `cloudCover()` veiled the disc and muted the sky, and nothing on the ground was
 * ever told: under a grey lid the lane still had crisp midday shadows. But cover
 * does not merely dim a shadow, it dissolves it — the source stops being a point
 * and becomes the whole hemisphere, so the penumbra grows until the shadow is all
 * penumbra and the darkening collapses into contact under the object.
 *
 * ONE hardness scalar, and the three things it does are derivations of it rather
 * than three tunings: what fades also WIDENS and PULLS IN. There are eight cast
 * shadows in this town and tuning them individually is how they drift apart within
 * two iterations. Every one is written `x * f()` or `x - k*(1 - f())`, so below
 * SH_KNEE the multipliers are exactly 1 and a fair day is the old frame, byte for
 * byte — the neutrality is an identity, not a tolerance. Deliberately NOT applied
 * to the lit-side shading on roofs and ground: that is already veiled through the
 * sky colours (drawRoofRow's `cc`), and veiling both is how you get a flat grey
 * world instead of an overcast one. */
const SH_KNEE = 0.32;            // fair-weather cover — at or below this, nothing changes
const SH_FULL = 0.94;            // ...and by here the sun has no edge left
const SH_FLOOR = 0.20;           // a trace survives: even a lid is brighter overhead than sideways
function shadowF(){
  return 1 - (1 - SH_FLOOR) * clamp((cloudCover() - SH_KNEE) / (SH_FULL - SH_KNEE), 0, 1);
}
function shSpread(){ return 1 + 0.5 * (1 - shadowF()); }    // the penumbra eats the umbra
function shOffset(){ return 1 - 0.65 * (1 - shadowF()); }   // and the throw retracts under its object
function skyCols(){
  const d = daylight, w = warmth;
  // the dusk windows ride sunset and sunrise, or winter glows orange an hour after dark
  const dusk = clamp(clamp(1 - Math.abs(hour - (sunDown - 0.6)) / 2.3, 0, 1)
                   + clamp(1 - Math.abs(hour - (sunUp + 0.8)) / 2.1, 0, 1), 0, 1);
  // every pair below averages to the colour that was hard-coded here, so warmth 0.5
  // is the old sky exactly: winter is the cold end, midsummer the warm one
  let top = mix(mix('#0a1430', '#0c101c', w), mix('#6d92b8', '#4d8ede', w), d);
  let low = mix(mix('#16264a', '#1e2036', w), mix('#cfdce6', '#bddcf2', w), d);
  top = mix(top, mix('#5a5480', '#7c56a0', w), dusk * 0.5);
  low = mix(low, mix('#d99a86', '#efa646', w), dusk * 0.75);
  // cover comes last: cloud mutes a sunset, it does not sit under one
  const c = cloudCover();
  top = mix(top, mix('#232a3a', '#7f8894', d), c * 0.82);
  low = mix(low, mix('#2c3446', '#b9bfc4', d), c * 0.74);
  return [top, low];

// stars, hills and the far-off skyline change slowly, so they live in their own layer
const bcv = document.createElement('canvas'), btx = bcv.getContext('2d');
let backKey = '';
function drawSky(g){
  const [top, low] = skyCols();
  const hz = topPad - 3.4 * cellH;                  // where the far horizon sits
  const gr = g.createLinearGradient(0, 0, 0, hz + 2 * cellH);
  gr.addColorStop(0, top); gr.addColorStop(1, low);
  g.fillStyle = gr; g.fillRect(0, 0, W, hz + 4 * cellH);
  drawSunMoon(g, hz, top);
  drawClouds(g, hz);                                // over the sun, under the hills
  const key = W + 'x' + H + ':' + lightBucket;
  if (key !== backKey){
    backKey = key;

/* A fixed pool of banks that fade in one by one as cover thickens, so the sky
 * fills continuously instead of popping a cloud into existence. Draw path, so it
 * is hash()-and-simT deterministic — never R(). */
function drawClouds(g, hz){
  const c = cloudCover();
  if (c < 0.04) return;
  const drift = simT * (isWindy() ? 3.4 : 1.4) * (RM ? 0.12 : 1);
  const span = W + cellW * 36;
  const pale = mix('#ffffff', '#8a919d', clamp((c - 0.34) * 1.5, 0, 1));
  const dark = mix('#3b4358', '#161c2c', clamp((c - 0.4) * 1.4, 0, 1));
  const col = mix(pale, dark, nightF);
  g.fillStyle = col;
  for (let k = 0; k < 11; k++){
    const a = clamp((c - k * 0.085) * 3.2, 0, 1);
    if (a <= 0.01) continue;
    const sp = 0.5 + hash(k, 41) * 0.9;              // higher banks drift slower
    const cx = ((hash(k, 7) * span + drift * sp * cellW * 0.5) % span) - cellW * 18;
    const cy = hz * (0.06 + hash(k, 17) * 0.86);      // right down to the hills, so heavy cover reads as a lid
    const rw = cellW * (4.5 + hash(k, 23) * 6) * (0.7 + 0.45 * c);
    const rh = rw * (0.24 + hash(k, 29) * 0.16);
    g.globalAlpha = a * (0.3 + 0.5 * c) * (1 - 0.35 * nightF);
    g.beginPath();
    for (let j = 0; j < 5; j++){
      const jx = cx + (j - 2) * rw * 0.42;
      const jy = cy - Math.abs(2 - j) * rh * 0.14 + hash(k * 7 + j, 31) * rh * 0.3;
      const jr = rw * (0.30 + hash(k * 7 + j, 37) * 0.22);
      g.ellipse(jx, jy, jr, jr * (0.44 + hash(k * 7 + j, 43) * 0.3), 0, 0, 7);
    }
    g.fill();
  }
  g.globalAlpha = 1;
}
function drawSunMoon(g, hz, top){
  const sa = sunArc;                                 // the same arc the shading reads
  const veil = 1 - 0.82 * cloudCover();              // cover swallows the disc
  if (daylight > 0.02){                              // the sun, rising in the east (to the right)
    // the DISC has to ride the seasonal elevation too. Shading it from sunVec alone
    // put the sun at midsummer height on a midwinter noon, with only the shadow
    // lengths dissenting — the one thing in frame a viewer looks straight at was the
    // one thing that did not know what month it was. Pale and low in winter, deep
    // gold and high in midsummer; every pair below averages to the old constant.

    const gl = g.createRadialGradient(sx, sy, 0, sx, sy, cellW * 10);
    gl.addColorStop(0, 'rgba(255,' + lerp(246, 230, warmth).toFixed(0) + ',' + lerp(214, 166, warmth).toFixed(0)
                    + ',' + ((0.45 * daylight + 0.2) * veil) + ')');
    gl.addColorStop(1, 'rgba(255,' + lerp(230, 210, warmth).toFixed(0) + ',' + lerp(190, 130, warmth).toFixed(0) + ',0)');
    g.fillStyle = gl; g.beginPath(); g.arc(sx, sy, cellW * 10, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,' + lerp(252, 248, warmth).toFixed(0) + ',' + lerp(242, 218, warmth).toFixed(0)
                + ',' + ((0.55 + 0.45 * daylight) * veil) + ')';
    g.beginPath(); g.arc(sx, sy, cellW * 1.4, 0, 7); g.fill();
  } else if (nightF > 0.25){                         // and the moon on the same arc
    // the night is what is left of the day, so the moon's arc widens as the sun's
    // narrows. It opens 1.4 h before sunset and closes 1.4 h after sunrise so it is
    // already climbing by the time daylight drops under 0.02 and the disc appears —
    // start it exactly at sunset and the moon teleports on its first drawn frame.
    const mUp = sunDown - 1.4, mSpan = 24 - dayHours + 2.8;

    const mx = W * (0.86 - 0.72 * ma), my = hz - Math.sin(Math.PI * ma) * hz * 0.66;
    const gl = g.createRadialGradient(mx, my, 0, mx, my, cellW * 7);
    gl.addColorStop(0, 'rgba(210,225,255,' + (0.28 * nightF * veil) + ')');
    gl.addColorStop(1, 'rgba(200,220,255,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(mx, my, cellW * 7, 0, 7); g.fill();
    g.fillStyle = 'rgba(240,244,255,' + (0.85 * nightF * veil) + ')';
    g.beginPath(); g.arc(mx, my, cellW * 1.2, 0, 7); g.fill();
    g.globalAlpha = veil;                            // else the crescent's bite outlives the moon
    g.fillStyle = mix(top, '#0b1226', 0.4);
    g.beginPath(); g.arc(mx - cellW * 0.55, my - cellW * 0.3, cellW * 1.1, 0, 7); g.fill();
