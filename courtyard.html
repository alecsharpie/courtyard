/* ============ lighting ============ */
function applyLight(t){
  const dusk = clamp(1 - Math.abs(hour - 19) / 1.8, 0, 1) + clamp(1 - Math.abs(hour - 6.4) / 1.6, 0, 1);
  if (dusk > 0){
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = 'rgba(255,140,70,' + (0.55 * dusk) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (nightF > 0.02){
    ctx.globalCompositeOperation = 'multiply';
    const a = 0.8 * nightF;
    ctx.fillStyle = 'rgba(' + (44 - 16*nightF|0) + ',' + (56 - 12*nightF|0) + ',' + (112) + ',' + a + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    for (const L of LAMPS.concat(LANE_LAMPS)){
      const [x, y] = project(L[0], L[1], 2.6);
      const g = ctx.createRadialGradient(x, y, 1, x, y, cellW * 2.4);
      g.addColorStop(0, 'rgba(255,196,104,' + 0.42 * nightF + ')');
      g.addColorStop(0.45, 'rgba(255,190,100,' + 0.13 * nightF + ')');
      g.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, cellW * 2.4, 0, 7); ctx.fill();
      // and the pool it throws on the ground below
      const [px, py] = project(L[0], L[1] + 0.6, 0);
      const gp = ctx.createRadialGradient(px, py, 1, px, py, cellW * 3);
      gp.addColorStop(0, 'rgba(255,190,110,' + 0.20 * nightF + ')');
      gp.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = gp;
      ctx.save(); ctx.translate(px, py); ctx.scale(1, 0.5); ctx.translate(-px, -py);
      ctx.beginPath(); ctx.arc(px, py, cellW * 3, 0, 7); ctx.fill();
      ctx.restore();
    }
    // every lit window casts a little halo onto the night
    for (const [wx, wy] of LIT){
      const g = ctx.createRadialGradient(wx, wy, 0, wx, wy, cellW * 0.9);
      g.addColorStop(0, 'rgba(255,205,130,' + 0.26 * nightF + ')');
      g.addColorStop(1, 'rgba(255,205,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(wx, wy, cellW * 0.9, 0, 7); ctx.fill();
    }
    // the clock face stays lit
    {
      const [ccx, ccy] = project((CT.x0 + CT.x1) / 2, CT.yF, 10.2);
      const g = ctx.createRadialGradient(ccx, ccy, 1, ccx, ccy, cellW * 2.2);
      g.addColorStop(0, 'rgba(255,230,170,' + 0.5 * nightF + ')');
      g.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ccx, ccy, cellW * 2.2, 0, 7); ctx.fill();
    }
    // warm spill from our shopfronts, pooled on the footway
    for (const ax of [10, 26, 47, 70, 87, 134]){
      const [x, y] = project(ax, LN_WALK_S - 1.3, 0);
      const g = ctx.createRadialGradient(x, y, 2, x, y, cellW * 3.4);
      g.addColorStop(0, 'rgba(255,190,120,' + 0.16*nightF + ')');
      g.addColorStop(1, 'rgba(255,190,120,0)');
      ctx.fillStyle = g;
      ctx.save();
      ctx.translate(x, y); ctx.scale(1, 0.55); ctx.translate(-x, -y);
      ctx.beginPath(); ctx.arc(x, y, cellW * 3.4, 0, 7); ctx.fill();
      ctx.restore();
    }
    for (const f of fireflies){
      const glow = 0.3 + 0.7 * Math.abs(Math.sin(f.ph));
      const [x, y] = project(f.x, f.y, f.z);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 5);
      g.addColorStop(0, 'rgba(220,255,140,' + 0.9*glow*nightF + ')');
      g.addColorStop(1, 'rgba(220,255,140,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (rainFall > 0){
    ctx.fillStyle = 'rgba(90,105,125,' + (0.16 * rainFall) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============ interaction ============ */
/* Seven kinds of cell answer a touch, and for most of this town's life nothing on
 * screen said so. The two hints below are the whole of the advertisement, and both
 * are meant to be missable: the cursor, which costs no pixels and only speaks while
 * a hand is already on the picture, and ONE line on the ticker, once, ever.
 *
 * ONE predicate decides which cells answer. The cursor reads it on every mouse move
 * and the click handler guards on it, so the hint can never promise a response the
 * click does not give, or stay silent over one it does.
 *
 * PATH was the hole in it. PATH is not a lesser surface — it is the courtyard's own
 * paving and the whole of the plaza, 2,626 cells against SIDE and ROAD's 2,903 — so
 * leaving it out made the two places the eye goes to FIRST, the roundel round the
 * fountain and the court itself, the two places that would not answer. SLOT stays
 * out on purpose: it is drawn like paving but it is a cut THROUGH a building seen
 * edge-on, 52 cells of doorway, and nobody scatters crumbs in a doorway. */
function answersTouch(x, y){
  if (x < 0 || y < 0 || x >= GW || y >= WH) return false;
  const g = grid[y * GW + x];
  return g === BED || g === CBED || g === GRASS || g === WATER ||
         g === SIDE || g === ROAD || g === PATH;
}
/* SIDE, ROAD and PATH are the paving of the WHOLE town — the courtyard's flags,
 * the lane, the cross street, the plaza and its mouth, the quay, the bridge deck,
 * the towpath on the far bank — so the branch that answers a click on paving has
 * to know WHICH paving. ONE table: each place carries the line it answers with AND
 * the box its crumbs' birds may land in, so the words and the birds can never
 * disagree about where you pointed.
 *
 * The spread is per place because the shapes differ: the lane and the bridge run
 * east-west and are wide, the quay and the towpath are two- and three-cell strips
 * running north-south. The LONGER of the two is the axis the scatter staggers
 * along, and it is never under 3 cells, because three birds inside 3 cells is
 * where they stop reading as three (see crumbSpot).
 *
 * The plaza is TWO boxes and one line, not one box: the square and the mouth it
 * opens onto the lane are the same place to a visitor, but the four rows between
 * them are the terrace's end wall, and a single bounding box over both would land
 * birds on a roof. A place is one set of WORDS; a box is one piece of GROUND.
 *
 * `keep` is the fountain, the only thing standing in the MIDDLE of a place rather
 * than at its edge: the basin is the one obstacle a scatter can be centred beside
 * and still straddle, and a bird that comes down in it sorts behind the basin and
 * reads as a bird swallowed by the stonework. It moves the CENTRE clear — never
 * the individual birds, which is the clamp that collapses a stagger into a heap.
 *
 * It is a RECTANGLE, not a radius, because the thing being avoided is whole CELLS
 * of water and the shove has to clear the corners: a circle wide enough to cover
 * them on the diagonal is ~2.9 cells of shove on the axes, where the rectangle's
 * minimum-translation push is 0.5. */
const PLAZA_WORDS = 'You scatter crumbs onto the plaza. Pigeons are on them before you straighten up.';
/* The basin as the grid actually CUT it, not as the ellipse describes it. Recomputing
 * buildGrid()'s own test here gets the boundary row wrong: (28.5-30)*1.2 evaluates to
 * 1.7999999999999998, so the row that reads as the rim of the basin is water, and a
 * footprint derived a second time is a footprint that disagrees with itself. */
function waterBox(x0, x1, y0, y1){
  let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++)
    if (grid[y * GW + x] === WATER){
      a = Math.min(a, x); b = Math.max(b, x + 1); c = Math.min(c, y); d = Math.max(d, y + 1);
    }
  return {x0:a, x1:b, y0:c, y1:d};
}
/* `what` is the same place as a NOUN, for the naming: the words a click answers with and
 * the words a pointer is told it is over come out of one entry, so the two can no more
 * disagree about where you are than the words and the birds can. */
const PAVING = {
  court:   {x0:3,        x1:61,       y0:3,         y1:61,        sx:3,   sy:2,
            what:'the courtyard flags',
            line:'You scatter crumbs on the courtyard flags. Sparrows come down off the wall.'},
  lane:    {x0:0,        x1:GW,       y0:LN_WALK_N, y1:LN_WALK_S, sx:3,   sy:2,
            what:'the lane',
            line:'You scatter crumbs onto the lane. Small eyes take notice.'},
  bridge:  {x0:RIVER_X0, x1:RIVER_X1, y0:LN_WALK_N, y1:LN_WALK_S, sx:3,   sy:2,
            what:'the bridge deck',
            line:'You scatter crumbs on the bridge. Birds drop in off the parapet.'},
  cross:   {x0:XS_W0,    x1:XS_E1,    y0:0,         y1:LN_WALK_N, sx:2.2, sy:3,
            what:'the cross street',
            line:'You scatter crumbs along the cross street. Small eyes take notice from the kerb.'},
  plaza:   {x0:PLAZA_X0, x1:PLAZA_X1, y0:3,         y1:61,        sx:3,   sy:2,
            keep:waterBox(PLAZA_X0, PLAZA_X1, 3, 61),
            what:'the plaza', line:PLAZA_WORDS},
  mouth:   {x0:102,      x1:108,      y0:61,        y1:LN_WALK_N, sx:3,   sy:2,
            what:'the plaza mouth', line:PLAZA_WORDS},
  quay:    {x0:QUAY_X0,  x1:RIVER_X0, y0:0,         y1:LN_WALK_N, sx:1.2, sy:4,
            what:'the quay',
            line:'You scatter crumbs along the quay, a step from the water. Small eyes take notice.'},
  towpath: {x0:TOW_X0,   x1:FAR_X0,   y0:3,         y1:LN_WALK_N, sx:1.8, sy:4,
            what:'the towpath',
            line:'You scatter crumbs on the towpath. Birds come over the water for it.'},
};
/* The three waters, the same way round: this town has one pond, one fountain and one
 * river, and they are separated by nothing but x. The click branch used to carry these
 * three lines inline and the naming would have needed the same three-way test a second
 * time — so they are a table, first match wins, west to east. */
const WATERS = [
  {x0:RIVER_X0, what:'the river',
   line:'You drop a pebble into the river; the rings are gone in a moment.'},
  {x0:PLAZA_X0, what:'the fountain',
   line:'A coin plinks into the fountain. You make a wish.'},
  {x0:0,        what:'the pond', ducks:1,
   line:'You toss crumbs into the pond. The ducks arrive like a small navy.'},
];
function waterAt(x){ return WATERS.find(w => x >= w.x0); }
/* Called only on a cell answersTouch() has already called SIDE, ROAD or PATH; every
 * such cell falls in exactly one of these boxes. PATH is only ever the courtyard or
 * the plaza square, and the two are separated by half the world. Below that, south
 * of LN_WALK_N the paving is the lane, all the way across, except where it is
 * carried over the river. */
function pavingAt(x, y){
  if (grid[y * GW + x] === PATH) return x >= PLAZA_X0 ? PAVING.plaza : PAVING.court;
  if (y >= LN_WALK_N) return (x >= RIVER_X0 && x < RIVER_X1) ? PAVING.bridge : PAVING.lane;
  if (x >= TOW_X0)   return PAVING.towpath;
  if (x >= QUAY_X0)  return PAVING.quay;
  if (x >= PLAZA_X0) return PAVING.mouth;
  return PAVING.cross;
}
/* Where the k-th of three birds comes down on a handful of crumbs. Sampling all
 * three independently in one small box lands two of them on top of each other
 * about half the time, and under ~0.9 cells apart they draw as one shape — so
 * they are STAGGERED at fixed thirds of the long axis and only jittered within a
 * twelfth of it, which floors the gap at s/3. The scatter is fitted into the
 * place by moving its CENTRE, never by clamping each bird: clamping them one at
 * a time is exactly what collapses the stagger back into a heap at the far end
 * of a two-cell quay. */
function fitIn(c, lo, hi, span){
  const a = lo + span / 2 + 0.4, b = hi - span / 2 - 0.4;
  return a > b ? (lo + hi) / 2 : clamp(c, a, b);
}
function crumbSpot(p, x, y, k){
  const along = p.sy > p.sx;                        // a north-south strip runs down itself
  const s = along ? p.sy : p.sx, w = along ? p.sx : p.sy;
  let cx = fitIn(x + 0.5, p.x0, p.x1, along ? w : s);
  let cy = fitIn(y + 0.5, p.y0, p.y1, along ? s : w);
  if (p.keep){
    /* the forbidden GROUND, grown by the scatter's own reach — s/2 + s/12 along
     * the stagger, w/2 across it — so the whole spread clears it, not just the
     * centre. Grown from sx/sy rather than typed: widen the spread and the shove
     * widens with it. Then the shortest push out of the box that is left. */
    const rx = (along ? w / 2 : s * 7 / 12) + 0.02, ry = (along ? s * 7 / 12 : w / 2) + 0.02;
    const l = p.keep.x0 - rx, r = p.keep.x1 + rx, u = p.keep.y0 - ry, d = p.keep.y1 + ry;
    if (cx > l && cx < r && cy > u && cy < d){
      const m = Math.min(cx - l, r - cx, cy - u, d - cy);
      if (m === cx - l) cx = l; else if (m === r - cx) cx = r;
      else if (m === cy - u) cy = u; else cy = d;
    }
  }
  const u = (k - 1) * s / 2 + (R() - 0.5) * s / 6;  // -s/2, 0, +s/2, each ±s/12
  const v = (R() - 0.5) * w;
  return along ? [cx + v, cy + u] : [cx + u, cy + v];
}
/* Screen point → cell, in two halves, because the naming needs the SCREEN point too:
 * a tree's crown is nowhere near the cell its trunk stands in. One rect read per event. */
function evPx(ev){
  const r = cv.getBoundingClientRect();
  return [ev.clientX - r.left, ev.clientY - r.top];
}
function cellOf(p){
  const [wx, wy] = unproject(p[0], p[1]);
  return [Math.floor(wx), Math.floor(wy)];
}
function cellAt(ev){ return cellOf(evPx(ev)); }
/* Only the transitions touch the DOM: mousemove fires at pointer rate, and setting
 * cv.style.cursor on every one of them is a style write per event for no change. The
 * naming is the same economy one step further — the event only RECORDS the pointer, and
 * updateNaming reads it once a frame. */
let hoverLive = false, hoverPx = null;
cv.addEventListener('mousemove', ev => {
  hoverPx = evPx(ev);
  const [x, y] = cellOf(hoverPx);
  const live = answersTouch(x, y);
  if (live !== hoverLive){ hoverLive = live; cv.style.cursor = live ? 'pointer' : 'default'; }
});
cv.addEventListener('mouseleave', () => {
  hoverLive = false; hoverPx = null; cv.style.cursor = 'default';
});

cv.addEventListener('click', ev => {
  const [x, y] = cellAt(ev);
  if (!answersTouch(x, y)) return;
  touched = true;              // they found it themselves; the invitation stands down
  const j = y * GW + x;
  if (grid[j] === BED || grid[j] === CBED){
    let n = 0;
    const sp = SPECIES.indexOf(pick(speciesFor(x, y))) + 1;
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
      const k = (y+dy)*GW + (x+dx);
      if (k>=0 && k<GW*WH && (grid[k]===BED||grid[k]===CBED) && !bSp[k] && R()<0.7){ bSp[k]=sp; bSt[k]=1; bAge[k]=0; n++; }
    }
    if (n){ announce('You scatter a handful of ' + SPECIES[sp-1].name + ' seeds from the window.'); groundDirty = true; }
  } else if (grid[j] === GRASS){
    daisy[j] = 2; groundDirty = true;
    announce('You flick a daisy seed down onto the lawn.');
  } else if (grid[j] === WATER){
    const w = waterAt(x);
    announce(w.line);
    if (w.ducks) for (const d of ducks){ d.tx = x + 0.5; d.ty = y + 0.5; d.t = 4; }
  } else if (grid[j] === SIDE || grid[j] === ROAD || grid[j] === PATH){
    const p = pavingAt(x, y);
    announce(p.line);
    if (birds.length < 4 && daylight > 0.2){
      for (let k = 0; k < 3; k++){
        const [bx, by] = crumbSpot(p, x, y, k);
        birds.push({x:bx, y:by, z:9, state:'land', hop:0, t:6+R()*6,
          col:pick(['#7d8089','#6e6a60','#33302c'])});
      }
    }
  }
  /* Where there is no cursor there is no hover, so the TAP has to do the naming too:
   * it holds the label on the sill for a few real seconds. Read AFTER the action, not
   * before — the label's contract is the picture as it now stands, and on bare earth
   * the interesting answer is the thing you just sowed. */
  if (!HOVERS){ held = lookAt(evPx(ev)); heldTo = performance.now() / 1000 + NAME_HELD; }
});
/* The invitations: two things this town does that nothing says, offered ONE AT A
 * TIME, each once, and then never again in this page's life.
 *
 * The picture answers a touch, and the season in the sill is a button that runs the
 * year on. Both are invisible; both were, at different times, the answer to "the
 * viewer who will not stay". The temptation is to say both, and the failure mode of
 * saying both is saying them at once — a sill shouting two different requests is
 * worse at getting either done than a sill making one. So they are a QUEUE, not two
 * timers: the picture first (it is 64% of the frame and the thing you are looking
 * at), then the sill, after the first has been read and the surface has gone back to
 * being ordinary for INVITE_GAP. Only one can ever be on screen.
 *
 * An offer is SPENT WHEN IT COMES UP, whether or not it is spoken. That is what makes
 * "never twice" structural rather than a flag per line, and it is why finding a thing
 * yourself is silence rather than a queue jump: if the viewer has already clicked the
 * picture, its offer comes up at INVITE_AT, says nothing, and the season's follows
 * immediately instead of waiting out a line that was never shown.
 *
 * They are TIMELESS — no bell is ringing in them — so they refuse to compete for the
 * surface. Each waits for a moment when the ticker is nobody's and takes it directly
 * rather than queueing, where the drop policy (2.5 s dwell, cap 2, 6 s staleness)
 * would either lose it behind the news or, worse, hand it over long after the
 * viewer had moved on. Losing a few seconds to a bell strike costs nothing; being
 * shown late is the failure.
 *
 * Real seconds off the frame clock, not sim seconds: this is a reading speed, and
 * ?fast must not hurry it. A ?pause page is the harness driving, not somebody
 * watching — nobody is there to invite, and the gates should measure the town. */
const INVITE_AT = 8;      // real seconds of watching before the FIRST offer
const INVITE_GAP = 6;     // real seconds of ordinary sill between one offer and the
                          // next — one full staleness window, so the surface has
                          // demonstrably stopped asking before it asks again
const INVITE_DWELL = 5.5; // it asks for an action, so it outstays a remark (2.5 s)
const INVITE_HOLD = 7;    // real seconds a narrow sill lends an offer the plate's place
const INVITE_WIDE = 'Reach out of the window if you like — the beds, the pond, the lane all answer.';
const INVITE_NARROW = 'Touch the picture — it answers.';
/* The year is SEASON_LEN * DAY_LEN = 23.8 real minutes at 1x, which is the whole
 * reason the button exists — so the offer leads with the wait it saves, not with the
 * mechanism. The narrow line says "it", not "the season", and can afford to: the
 * label is standing beside the words as they are read (see #sill.inviting.at-season),
 * which is the one place in this sill where a pronoun has something to point at. It
 * has to afford to, as well — keeping the plate leaves the narrow ticker 171px, not
 * the 251px the touch offer gets, and the fuller sentence overran it by 11. */
const SEASON_WIDE = 'The year here runs twenty-four minutes — press the season to reach the next one.';
const SEASON_NARROW = 'Tap it — the year runs on.';
const sillEl = document.getElementById('sill');
const seasonEl = document.getElementById('season');
const veilEl = document.getElementById('veil');
const DRIVEN = location.search.indexOf('pause') >= 0;   // the harness, not a viewer
let touched = DRIVEN, pressed = DRIVEN;
/* In the order a first-time viewer needs them. Each carries the act that makes it
 * unnecessary: do the thing and it is never said. */
const OFFERS = [
  { id:'touch',  wide: INVITE_WIDE, narrow: INVITE_NARROW, found: () => touched },
  { id:'season', wide: SEASON_WIDE, narrow: SEASON_NARROW, found: () => pressed },
];
let offerN = 0, offerFree = INVITE_AT, inviteHold = 0, inviteTxt = '';
function offerInvite(now){
  // deferred, never spent, through a lapse: announce() is deaf and would swallow it
  if (offerN >= OFFERS.length || skipping() || now < offerFree || !tickerFree()) return;
  const o = OFFERS[offerN++];
  if (o.found()) return;                    // they got there first, so nothing is said
  inviteTxt = innerWidth > 640 ? o.wide : o.narrow;
  announce(inviteTxt, null, INVITE_DWELL);
  offerFree = now + INVITE_DWELL + INVITE_GAP;
  if (innerWidth > 640) return;
  sillEl.classList.add('inviting');
  sillEl.classList.toggle('at-season', o.id === 'season');
  inviteHold = now + INVITE_HOLD;
}
// the borrowed sill goes back the moment the hold runs out or the news moves on
function endInvite(now){
  if (now < inviteHold && tickerEl.textContent === inviteTxt) return;
  inviteHold = 0;
  sillEl.classList.remove('inviting', 'at-season');
}

/* ============ the naming ============
 * The cursor says a cell ANSWERS. It cannot say what the cell IS — and the densest thing
 * in this picture is exactly the thing nothing named: eleven species at three stages in
 * the beds, seventeen plots under four vegetables, thirteen trees each on its own
 * seasonal clock. So: ONE label for the thing under the pointer, in the state it is
 * actually in, written into the sill beside the season.
 *
 * Everything in it is READ, never inferred from position — the species out of `bSp`, the
 * stage out of `bSt` against the very ceiling `caTick` grows it to, the plot's crop out
 * of `plotCrop`, the paving out of `pavingAt`, the tree out of the crown its own draw
 * call recorded. The label can therefore not be wrong about a season: it does not know
 * what season it is, only what is in front of it.
 *
 * Three manners it keeps:
 *   · It costs one read per FRAME off the last pointer position, not one per mousemove.
 *   · A name COMMITS only once the pointer has rested (NAME_SETTLE). A bed cell is ~9 px
 *     across and a sweep over the ring crosses fifty of them; a label that changed on
 *     every boundary would be a strobe, not information. Clearing is instant.
 *   · It never covers something the town said. Where the ticker is on screen it waits for
 *     the line on it to have had its dwell — including the line the click that named this
 *     cell just announced — and it never opens while the one-time invitation holds the
 *     sill (INVITE_HOLD owns it outright). */
const namingEl = document.getElementById('naming');
const HOVERS = matchMedia('(hover: hover)').matches;   // a phone has no pointer to follow
const NAME_SETTLE = 0.12;   // real seconds the pointer rests before a name commits
const NAME_HELD = 4.5;      // real seconds a TAP's name keeps the sill, where nothing hovers
let held = '', heldTo = 0, nCand = '', nCandAt = 0, nShown = '';

/* What a plant IS, at the stage it is at, against the ceiling THIS cell is allowed.
 * Stage 3 is the one the eye can check — a flower head, a cabbage — and the case worth
 * naming is the one #14 and #25 built: a bed at 3 under a bloomCap below 3 is a plant
 * holding above its season, which is what winter colour in this town is made of. A bed
 * stalled AT a low ceiling is the commoner winter answer, and says that instead. */
function stageOf(s, st, cap){
  if (st >= 3) return cap < 3 ? (s.veg ? 'standing through the cold' : 'in flower against the cold')
                              : (s.veg ? 'ready to lift' : 'in full flower');
  if (st >= cap) return s.veg ? 'stalled in the cold' : 'too cold to flower';
  return st > 1 ? (s.veg ? 'in leaf' : 'coming into flower')
                : (s.veg ? 'newly drilled' : 'just up');
}
function bedName(x, y, j){
  if (!bSp[j]) return bAge[j] > 0 ? 'turned earth, resting' : 'bare earth, nothing sown';
  return SPECIES[bSp[j] - 1].name + ', ' + stageOf(SPECIES[bSp[j] - 1], bSt[j], bedCap(x, y));
}
/* The allotments are addressed by PLOT and not by cell, so a plot is named as a plot:
 * its crop is whatever plotCrop finds in the row, and its stage is the row's best,
 * because a 3x2 bed is drilled together, lifted whole, and reads as one row. */
function plotName(x, y){
  const sp = plotCrop(x, y);
  if (!sp) return 'a plot lately lifted, lying bare';
  const [ox, oy] = plotOrigin(x, y);
  let st = 0;
  for (let yy = oy; yy < oy + 2; yy++) for (let xx = ox; xx < ox + 3; xx++){
    const i = yy * GW + xx;
    if (i >= 0 && i < GW * WH && bSp[i]) st = Math.max(st, bSt[i]);
  }
  return 'a plot of ' + SPECIES[sp - 1].name + ', ' + stageOf(SPECIES[sp - 1], st, bedCap(x, y));
}
function nameAt(x, y){
  if (x < 0 || y < 0 || x >= GW || y >= WH) return '';
  const j = y * GW + x, g = grid[j];
  if (g === BED || g === CBED) return inAllotment(x, y) ? plotName(x, y) : bedName(x, y, j);
  if (g === GRASS) return daisy[j] ? 'the lawn, daisies in it'
                 : wear[j] > 0.45 ? 'the lawn, worn to a path' : 'the lawn';
  if (g === WATER) return waterAt(x).what;
  if (g === SIDE || g === ROAD || g === PATH) return pavingAt(x, y).what;
  return '';                       // a wall, a roof, the inside of an archway: no name
}
/* The trees, hit-tested in SCREEN space against the crowns the draw pass recorded —
 * painter's order, so where two overlap the one on top wins, exactly as the eye reads
 * them. What the tree is DOING comes off the same seasonal terms the crown is drawn
 * with, in the order a person would say them: what is hanging in it first, then what
 * the leaves are doing. */
function treeState(fruit){
  const out = leafOut();
  if (fruit && blossomF() > 0.15) return 'in blossom';
  if (fruit && fruitF() > 0.25) return 'in fruit';
  if (out < 0.06) return 'bare for the winter';
  if (leafTurn() > 0.35) return leafShed() > 0.45 ? 'dropping its leaves' : 'on the turn';
  if (leafFresh() > 0.35) return 'in new leaf';
  return out > 0.75 ? 'in full leaf' : 'coming into leaf';
}
function treeAt(p){
  for (let i = crowns.length - 1; i >= 0; i--){
    const c = crowns[i], dx = (p[0] - c.x) / c.rx, dy = (p[1] - c.y) / c.ry;
    if (dx * dx + dy * dy <= 1) return c;
  }
  return null;
}
function lookAt(p){
  const c = treeAt(p);
  if (c) return c.name + ', ' + treeState(c.fruit);
  const [x, y] = cellOf(p);
  return nameAt(x, y);
}
function updateNaming(now){
  let want = HOVERS ? (hoverPx ? lookAt(hoverPx) : '') : (heldTo > now ? held : '');
  // ...and never through a lapse: the label is read off a cell that is turning over
  // several times a second under it, which is the one way this label CAN be wrong
  if (want && (inviteHold || skipping() || (innerWidth > 640 && now - lineAt < lineDwell))) want = '';
  if (want !== nCand){ nCand = want; nCandAt = now; }
  if (nCand && now - nCandAt < NAME_SETTLE) return;
  if (nCand === nShown) return;
  nShown = nCand;
  // a label, so it opens with a capital and closes with nothing
  namingEl.textContent = nShown ? nShown.charAt(0).toUpperCase() + nShown.slice(1) : '';
  sillEl.classList.toggle('naming', !!nShown);
}

document.getElementById('pause').addEventListener('click', e => {
  paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause';
});
document.getElementById('speed').addEventListener('click', e => {
  speed = speed === 1 ? 3 : speed === 3 ? 8 : 1;
  e.target.textContent = speed + '×';
});
// the season names itself and, being the only fact in the sill you would want to
// change, offers itself as the way to change it
seasonEl.addEventListener('click', beginSkip);

/* ============ opening state ============ */
(function seed(){
  let planted = 0, guard = 0;
  while (planted < 8 && guard++ < 4000){
    const x = R() * GW | 0, y = 3 + (R() * (LN_WALK_S - 3) | 0);
    const j = y*GW+x;
    if ((grid[j]===BED || grid[j]===CBED) && !bSp[j]){
      bSp[j] = 1 + (R()*4|0); bSt[j] = 1 + (R()*2|0); planted++;
    }
  }
  for (let y = 50; y < 58; y++) for (let x = 30; x < 35; x++){
    const j = y*GW+x; if (grid[j]===GRASS) wear[j] = 0.25*R();
  }
})();

/* ============ main loop ============ */
let last = 0, caAcc = 0, spawnAcc = 0, statAcc = 0, lightBucket = -1;
let lastStruck = -1, marketAnnounced = -1, marketClosed = -1, windAnnounced = -1, bellUntil = -1, bellSeen = -1;
const HOUR_WORDS = ['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
function strikeClock(){
  const hInt = Math.floor(hour);
  if (lastStruck === -1){ lastStruck = hInt; return; }
  if (hInt !== lastStruck){
    lastStruck = hInt;
    if (hInt % 3 === 0){
      // Nine and eighteen are the two strikes the church answers — and both are
      // divisible by three, so this can only ever live INSIDE the strike, never as
      // an alternative to it. As an else-if it was unreachable and the bell was
      // never once answered. The answer rides as the strike's follow-on line, so it
      // reaches the ticker a beat later and only ever behind the strike itself.
      const answered = (hInt === 9 || hInt === 18) && day >= 2;
      announce('The clock over the lane strikes ' + HOUR_WORDS[hInt % 12] + '.',
        answered ? 'The church bell answers from across the river, half a beat behind.' : null);
      bellUntil = simT + (answered ? 2.6 : 2.2);   // one flush, held longer — not a second one
    }
  }
}
/* strikeClock() decides WHEN the bell rings and writes bellUntil; nothing else may
 * re-derive that. This reads it on the rising edge and lets the town answer for the
 * couple of seconds it is ringing: pigeons off the belfry, and a few walkers who
 * stop mid-stride with their heads back. */
function bellStartle(){
  // off the parapet and into open air in FRONT of the tower — spawned on the belfry
  // louvre itself they are grey-on-near-black and read as dust, not as pigeons
  const cx = (CHURCH.tx0 + CHURCH.tx1) / 2, cy = CHURCH.ty1 + 0.3;
  // Only what is actually roosting goes up. The clock strikes every third hour —
  // every ~7 s at this compression — so a fixed-size flock would be permanently
  // airborne and stop reading as an answer to anything. belfryRoost refills at
  // ~0.35/s in updateWildlife, so the first strike flushes the tower and the next
  // few put up the two or three that have made it back.
  const n = Math.min(Math.floor(belfryRoost), 4 + Math.round(R() * 3));
  belfryRoost -= n;
  for (let k = 0; k < n; k++){
    // dark, not pigeon-pale: the whole flight is spent against open sky, so the
    // birds read by contrast with it
    birds.push({x:cx, y:cy, z:12.6 + R()*1.4, state:'wheel', hop:0, t:0.9 + R()*0.5, sz:1.5,
      cx, cy, r:0.5 + R()*0.6, ph:R()*Math.PI*2, sp:1.9 + R()*1.3, ph2:R()*9,
      col:pick(['#3a3733','#4e4a44','#5a5650','#6e6a60'])});
  }
  for (const a of agents) if (a.state === 'walk' && R() < 0.45) a.listen = 1 + R()*1.1;
}
/* One simulation step. Split out of frame() so `__warp()` can advance the town
 * with a FIXED dt and no drawing — that is what makes a seeded run reproducible:
 * state becomes a pure function of (seed, warped seconds) instead of depending on
 * how many rAF frames the machine happened to deliver. */
function simStep(sdt, dt){
  simT += sdt;
  updateClock();
  strikeClock();
  if (bellUntil > simT && bellUntil !== bellSeen){ bellSeen = bellUntil; bellStartle(); }
  stockMarket();                                       // must precede marketUp(): it decides who trades
  if (marketUp() && marketAnnounced !== day){          // now fires on the first trestle
    marketAnnounced = day;
    announce(mkLine());                                // …and names what the plots sent
  }
  // fired at the FIRST stall coming down, not the last: it points at the pack-down
  // rather than reporting it afterwards. The hour used to be 17.00 and the line used to
  // say so; closing now moves 16.50–18.50 across the year, so the clock leaves the copy.
  if (isMarketDay() && hour >= marketClose() && marketClosed !== day){
    marketClosed = day;
    announce('Market’s end; the canvas rolls shut and the lane is left to the sparrows.');
  }
  if (isWindy() && windAnnounced !== day && hour > sunUp + 1.5 && hour < sunUp + 3.5){
    windAnnounced = day;
    announce('A brisk wind combs the block; everything that can flutter, does.');
  }
  wet = Math.max(0, wet - sdt);
  stepClouds(sdt);
  // sun moves, cover thickens: relight the static layer now and then. Cover rides
  // the same bucket rather than its own, so it costs no extra rebuilds.
  const lb = Math.floor(hour * 4) * 8 + Math.round(cloudCover() * 6);
  if (lb !== lightBucket){ lightBucket = lb; groundDirty = true; }

  caAcc += sdt;
  while (caAcc > 0.35){ caAcc -= 0.35; caTick(); }

  const courtyardCount = agents.filter(a => !a.street).length;
  const eastCount = agents.filter(a => a.east).length;
  const laneCount = agents.length - courtyardCount - eastCount;
  /* Each cap is its old expression with the multiply-out done, so the fixed share is
   * visible as a number and the year rides the daylight term alone (see yearBusy).
   * At the anchor, warmth 0.5, all three are algebraically identical to what they
   * replaced — 5..14, 3..9, 1..7 — and at daylight 0 they are identical in EVERY
   * season, which is what holds the night floor. */
  const capacity = 2 + Math.round(maturity() * (3 + 9 * daylight * yearBusy(EX_COURT)));
  const laneCap = 1 + Math.round(maturity() * (1.6 + 6.4 * daylight * yearBusy(EX_LANE)));
  // the far side arrives on its own budget, so it no longer loses to the lane. It is
  // the most exposed of the three and breathes hardest — but its ceiling does NOT
  // move: east agents retrace their inbound route, so arrivals sharing a gate walk
  // single-file and more than seven of them would queue (cue c10). Summer spends its
  // lift on reaching the ceiling EARLIER in the day, not on raising it.
  const eastCap = Math.min(7, 1 + Math.round(maturity() * 6 * daylight * yearBusy(EX_EAST)));
  /* POP_FLOOR's mechanism: a lift on the arrival RATES, never on the caps. Nobody
   * pops into being — the town refills by people walking in, just sooner after one
   * another — and the caps still decide where it settles, so a rainy January night
   * converges on the 5 + 3 the two night budgets have always allowed instead of
   * drifting below it. Exactly 1 at POP_FLOOR people and above, so a normal day
   * never sees this term at all. */
  const scarcity = 1 + 0.8 * clamp(POP_FLOOR - agents.length, 0, 6);
  const rate = (0.05 + maturity() * 0.42) * (0.12 + daylight) * (raining ? 0.25 : 1) * scarcity;
  const laneRate = (0.08 + maturity() * 0.5) * (0.15 + daylight) * (raining ? 0.3 : 1) * (marketActive() ? 1.7 : 1) * scarcity;
  const eastRate = (0.15 + maturity() * 0.6) * (0.1 + daylight) * (raining ? 0.25 : 1) * scarcity;
  // the allotments arrive on the crop's budget, not the lane's: 0.42 of the lane's
  // roll chain put one gardener in every 5-15 days against 17 plots, which is why
  // the block sat permanently full. Ripeness is the rate.
  const allotRate = (0.01 + 0.16 * ripePlots() / 17) * (raining ? 0.2 : 1);
  spawnAcc += sdt;
  if (spawnAcc > 1){ spawnAcc = 0;
    if (courtyardCount < capacity && R() < rate) spawnAgent();
    if (laneCount < laneCap && R() < laneRate) spawnLaneAgent();
    if (eastOpen() && eastCount < eastCap && R() < eastRate) spawnEastAgent();
    if (daylight > 0.3 && day >= 1 && allotCount() < 3 && R() < allotRate) spawnAllotAgent();
    if (agents.length === 0 && day === 0 && simT > 6 && !window._first){ window._first = true; spawnAgent();
      announce('The first neighbour wanders in through the archway.'); }
  }
  for (let i = agents.length - 1; i >= 0; i--){
    stepAgent(agents[i], sdt);
    if (agents[i].done){
      const a = agents[i];
      if (a.table) a.table.taken = 0;
      if (a.tableRef) a.tableRef.taken = 0;
      agents.splice(i, 1);
    }
  }
  greetAcc += sdt;
  while (greetAcc > GREET_DT){ greetAcc -= GREET_DT; greetPass(); }
  updateSweeper();
  updateWildlife(sdt);
  updateDucks(sdt);
  updateSwans(sdt);
  updateBalloon(sdt);
  updateBoat(sdt);

  statAcc += dt;
  if (statAcc > 0.5){ statAcc = 0; refreshStats(); tickTicker(); }
  ambientAcc += sdt;
  if (ambientAcc > 20 && tickerTimer < -8){
    ambientAcc = 0;
    if (R() < 0.6) announce(ambientLine());
  }
}
/* ============ reaching another season ============
 * The year is SEASON_LEN days — about 24 real minutes at 1x, and the speed button
 * tops out at 8x. Every seasonal term in this file is written for a viewer who would
 * have to sit at this window for twenty-four minutes to see it. So the season's NAME
 * in the sill is also the control: click it and the town runs on to the next quarter.
 *
 * It is a FAST-FORWARD, not a jump. Nothing here writes seasonPhase, cloud, bSt, or a
 * walker's position — it only hands simStep() more seconds per frame, sub-stepped so
 * no single step is longer than SKIP_SUB. That is the whole safety argument, and it
 * is why six hysteretic systems can be crossed at once without a pop: every rate cap
 * in this town is per SIM second (cover at 0.02/s, the CA's 0.35 s tick, the spawn
 * accumulator's 1 s roll, a boat's trip, a garment's threshold), so a sub-stepped
 * advance is indistinguishable from having waited. What is compressed is REAL time.
 * Sub-stepping is not cosmetic either: spawnAcc resets to 0 when it fires, so one
 * enormous step would silently drop six days of arrivals.
 *
 * Three consequences worth stating:
 *   · It lands on a WHOLE number of sim days, the nearest to a quarter-turn, so the
 *     hour you left at is the hour you arrive at — winter at noon, not winter at
 *     midnight. From the anchor those days are 7+6+7+6 = 26 = SEASON_LEN exactly, so
 *     four clicks return the town to the identical phase AND the identical hour.
 *   · The rate is a flat-topped trapezoid with smoothstep shoulders, advanced off the
 *     EXACT integral of that profile — so the span delivered is right whatever frame
 *     rate the machine gives, and both ends have zero slope, so the lapse eases out of
 *     the ordinary clock and back into it instead of cutting. Flat-topped rather than
 *     a cosine bump because the peak rate is how fast day and night alternate on
 *     screen, and 1/(1-s) of the mean is a great deal kinder than 2x.
 *   · Under prefers-reduced-motion a time-lapse of six sunrises is precisely the thing
 *     being asked for less of, so RM gets the honest cut: a veil, the same sub-stepped
 *     advance delivered behind it, the veil away.
 * `speed` is never touched, and no click reaches a driven page, so nothing leaks:
 * ?fast, __warp, the census and every gate see exactly the town they saw before. */
const SKIP_SUB = 0.25;      // sim seconds — the longest step the lapse is allowed to take
const SKIP_RATE = 1.0;      // sim DAYS per real second, mean across the lapse. This is
                            // also how fast day alternates with night on screen, so the
                            // peak of the profile (1/(1-s) of it) is the number that has
                            // to stay well under the 3 Hz photosensitive flash threshold.
const SKIP_SHOULDER = 0.2;  // the fraction of it spent easing in, and again easing out
const SKIP_MIN = 0.09;      // never aim at a boundary nearer than this in phase
const VEIL_MS = 420;        // the reduced-motion cut, ~one transition plus a frame
let skipSpan = 0, skipSecs = 0, skipAt = 0, skipLanded = false;
function skipping(){ return skipSpan > 0; }
/* The cumulative profile: monotone 0..1, flat-topped, zero slope at both ends.
 * smoothstep(x) = 3x^2 - 2x^3 integrates to x^3 - x^4/2, which is all this needs. */
function skipEase(u){
  const s = SKIP_SHOULDER, P = 1 / (1 - s);
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  if (u < s){ const v = u / s; return P * s * (v*v*v - v*v*v*v / 2); }
  if (u > 1 - s){ const v = (1 - u) / s; return 1 - P * s * (v*v*v - v*v*v*v / 2); }
  return P * (s * 0.5 + (u - s));
}
/* Whole sim days to the next quarter-turn of the year. The rounding is what keeps the
 * hour; SKIP_MIN stops a click made just short of a boundary from being a no-op. */
function skipDays(){
  let to = (Math.floor(seasonPhase / 0.25) + 1) * 0.25;
  if (to - seasonPhase < SKIP_MIN) to += 0.25;
  return Math.max(1, Math.round((to - seasonPhase) * SEASON_LEN));
}
/* One step of the town, split so that no piece is longer than SKIP_SUB. */
function simSub(sdt, dt){
  const n = Math.max(1, Math.ceil(sdt / SKIP_SUB));
  for (let i = 0; i < n; i++) simStep(sdt / n, dt / n);
}
function beginSkip(){
  if (skipping()) return;
  pressed = true;             // found without being told — the offer stands down unsaid
  skipSpan = skipDays() * DAY_LEN;
  skipSecs = clamp(skipSpan / DAY_LEN / SKIP_RATE, 2.4, 7.2);
  skipAt = 0;
  seasonEl.disabled = true;
  if (!RM) return;
  veilEl.classList.add('on');
  setTimeout(() => {                       // behind an opaque veil, so a hitch is nobody's
    simSub(skipSpan, VEIL_MS / 1000);
    skipSpan = 0; skipAt = 0;
    veilEl.classList.remove('on');
    land();
  }, VEIL_MS);
}
/* Real seconds in, sim seconds out — the WHOLE of this frame's advance while a lapse
 * runs, and 0 when one is not. The lapse owns the clock for its few seconds: the base
 * is 1x whatever the speed button says, and Pause does not apply, because a deliberate
 * act is not the town running on its own. That ownership is also what makes the span
 * exact — the first version left `dt * speed` riding on top of the profile and every
 * lapse overshot by its own duration, which is small (0.095 of a day) and compounds
 * into a year that no longer closes. */
function stepSkip(rdt){
  if (!skipping() || RM) return 0;
  const u0 = skipAt / skipSecs;
  skipAt += rdt;
  const u1 = Math.min(1, skipAt / skipSecs);
  // skipSecs of ordinary clock, plus a shaped bump carrying all the rest. Both terms
  // are exact integrals, so the total delivered is skipSpan to the last decimal
  // however many frames the machine happens to give us.
  const out = (u1 - u0) * skipSecs + (skipSpan - skipSecs) * (skipEase(u1) - skipEase(u0));
  if (u1 >= 1){ skipSpan = 0; skipAt = 0; skipLanded = true; }
  return out;
}
/* The town says where it has got to, once, after the last stepped frame — announce()
 * is deaf for the duration of a lapse, or six sim days of clock strikes, markets and
 * wind would arrive as a stack of stale news the moment it ended. */
function land(){
  skipLanded = false;
  seasonEl.disabled = false;
  refreshStats();
  announce('The year runs on: ' + seasonLabel().toLowerCase() + ' over the block now.');
}
function frame(ts){
  requestAnimationFrame(frame);
  const now = ts / 1000;
  let dt = Math.min(now - last, 0.1); last = now;
  const rdt = dt;              // a deliberate act outranks Pause, and runs on real time
  if (paused) dt = 0;
  const lapse = skipping();    // read BEFORE stepSkip, which clears it on the last frame
  const extra = stepSkip(rdt);
  const sdt = lapse ? extra : dt * speed;
  // the ordinary path is byte-for-byte what it was — one call, same arguments — so no
  // gate and no ?fast page can tell this feature exists. Only a lapse sub-steps.
  if (lapse) simSub(sdt, rdt); else simStep(sdt, dt);
  drawScene(now, sdt);
  if (skipLanded) land();
  if (inviteHold) endInvite(now);
  offerInvite(now);
  updateNaming(now);
}

/* ============ test hooks (grow-courtyard) ============
 * Not used by the diorama itself. These are the seam the autonomous loop measures
 * the town through — see .claude/skills/grow-courtyard/census.mjs.
 *
 *   ?seed=N        deterministic world (above)
 *   ?t=<seconds>   start the clock at a given sim time
 *   ?fast          run at 8x
 *   __warp(secs)   advance the sim synchronously, fixed dt, no drawing
 *   __census()     structured count of everything the town contains
 *
 * __census() is the loop's REGRESSION GUARD, not a score. Add a field when a new
 * system would otherwise move nothing here; do not add one per feature. */
window.__warp = function(secs, step){
  step = step || 1 / 30;
  const n = Math.max(0, Math.round(secs / step));
  for (let i = 0; i < n; i++) simStep(step, step);
  return { simT, day, hour };
};
window.__setTime = function(t){ simT = t; updateClock(); return { simT, day, hour }; };

/* Every moving thing, with a stable identity — the seam the motion gate reads.
 * A screenshot cannot see a teleport, a pop-in or a thing that flickers between
 * two positions; a position series can. Ids are stamped lazily here so the
 * simulation itself carries no extra bookkeeping. */
let __eid = 0;
window.__entities = function(){
  const out = [];
  const take = (arr, kind, extra) => { for (const e of arr){ if (e.__id === undefined) e.__id = ++__eid;
    const o = { id: kind + e.__id, kind, x: e.x, y: e.y, z: e.z === undefined ? 0 : e.z };
    if (extra) extra(o, e);
    out.push(o); } };
  // people carry what they are doing as well as where they are: `act` is the state
  // machine's own label and `watch` is set while they are following the boat, so a
  // probe can measure behaviour without a bespoke hook per feature
  take(agents.filter(a => a.kind !== 'sweeper'), 'walker',
       (o, a) => { o.act = a.state; o.role = a.kind; o.watch = a.watch > 0 ? 1 : 0; });
  take(agents.filter(a => a.kind === 'sweeper'), 'sweeper');
  take(ducks, 'duck'); take(swans, 'swan');
  take(butterflies, 'butterfly'); take(fireflies, 'firefly');
  take(birds, 'bird'); take(leaves, 'leaf');
  if (balloon) take([balloon], 'balloon');
  if (boat) take([boat], 'boat');
  /* Raindrops are the one population here in SCREEN space, not world space — x,y are
   * canvas pixels, so motion.mjs must exempt this kind from the world-bounds test or
   * every drop reads as out of bounds. Until #21 the gate could only watch the shower
   * as a count, which cannot see a drop that stops falling or drifts to NaN. Drops are
   * recycled objects, so identity survives a trip round and a recycle reads as one
   * legitimate jump — which is exactly the shape the gate already expects of rain. */
  take(raindrops, 'raindrop');
  return out;
};
window.__census = function(){
  const tiles = {}, TN = ['WALL','PATH','GRASS','BED','CBED','TRUNK','SIDE','ROAD','VOID','WATER','TUNNEL','SLOT'];
  for (let i = 0; i < GW * WH; i++){ const n = TN[grid[i]] || ('T' + grid[i]); tiles[n] = (tiles[n] || 0) + 1; }

  /* planting CA: how much of the beds is actually growing, and how far along */
  let planted = 0, blooming = 0, daisies = 0, worn = 0, matureTrees = 0;
  const bySpecies = {};
  for (let i = 0; i < GW * WH; i++){
    if (bSp[i]){ planted++;
      const nm = SPECIES[bSp[i] - 1] ? SPECIES[bSp[i] - 1].name || ('sp' + bSp[i]) : ('sp' + bSp[i]);
      bySpecies[nm] = (bySpecies[nm] || 0) + 1;
      if (bSt[i] === 3) blooming++;
    }
    if (daisy[i]) daisies++;
    if (wear[i] > 0.5) worn++;
    if (grid[i] === TRUNK) matureTrees++;
  }

  /* living things, by where they are — the growth signal for draw-only work,
   * which leaves every terrain number flat */
  const life = {
    people: agents.length,
    inCourtyard: agents.filter(a => !a.street).length,
    onStreet: agents.filter(a => a.street).length,
    // a subset of onStreet, not a new axis: the same where-are-they split, extended
    // to the half of the world that never had a counter.
    inEast: agents.filter(a => a.east).length,
    ducks: ducks.length, swans: swans.length, birds: birds.length,
    butterflies: butterflies.length, fireflies: fireflies.length,
    leaves: leaves.length, raindrops: raindrops.length,
  };
  const structure = {
    /* NB: no LIT.length here. It is a per-frame draw accumulator (reset at the top
     * of each scene), so its value depends on where in the draw pass you sample —
     * it made the census non-reproducible. Census fields must be town state, not
     * render state. */
    chimneys: CHIMNEYS.length,
    ringNodes: RING.length, edgeBeds: EDGE_BEDS.length,
    benches: BENCH_SPOTS.length + LANE_BENCHES.length + QUAY_BENCHES.length + FAR_BENCHES.length,
    cafeTables: CAFE_TABLES.length, marketStalls: MARKET_STALLS.length,
    treePits: TREE_PITS.length, orchard: ORCHARD.length, plazaPits: PLAZA_PITS.length,
  };
  return {
    world: { GW, WH, cells: GW * WH },
    clock: { simT: +simT.toFixed(3), day, hour: +hour.toFixed(3),
             marketDay: isMarketDay(), windy: isWindy(), raining: !!raining,
             cloud: +cloudCover().toFixed(3), season: +season().toFixed(4),
             maturity: +maturity().toFixed(4), richness: +richness().toFixed(4) },
    tiles, life, structure,
    /* `harvested` is the one thing bySpecies cannot show: a veg count falling is
       equally dieback, so without it nothing distinguishes a picked plot from a
       rotted one, and a regression that silently killed harvesting would read clean */
    /* `produce` is the other end of that same pipe: units standing in the store
       between one market and the next. It is town state, not render state — a pure
       function of what has been picked and what the last market carried away — and
       nothing else the census reports moves when the harvest→market link breaks. */
    planting: { planted, blooming, daisies, matureTrees, worn, harvested,
                produce: +produce.reduce((a, b) => a + b, 0).toFixed(1),
                species: SPECIES.length, bySpecies },
    /* headline aggregates — what the census gate watches for collapse */
    scalars: {
      developed: (tiles.WALL || 0) + (tiles.PATH || 0) + (tiles.ROAD || 0) + (tiles.SIDE || 0),
      green: (tiles.GRASS || 0) + (tiles.BED || 0) + (tiles.CBED || 0) + (tiles.TRUNK || 0),
      water: tiles.WATER || 0,
      passages: (tiles.TUNNEL || 0) + (tiles.SLOT || 0),
      people: agents.length, planted, blooming,
      creatures: life.ducks + life.swans + life.birds + life.butterflies + life.fireflies,
      structures: Object.values(structure).reduce((a, b) => a + b, 0),
      tileKinds: Object.keys(tiles).length,
      speciesKinds: SPECIES.length,
    },
  };
};

resize();
refreshStats();
requestAnimationFrame(frame);
</script>
